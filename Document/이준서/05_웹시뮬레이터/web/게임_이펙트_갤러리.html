<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Project L.U.N.A — Effect Gallery</title>
  <style>
    :root {
      --background: #050708;
      --surface: #0a0e10;
      --surface-raised: #101619;
      --line: rgba(195, 227, 225, 0.14);
      --line-strong: rgba(195, 227, 225, 0.28);
      --text: #eef7f5;
      --muted: #718084;
      --cyan: #76f8e6;
      --violet: #9c85ff;
      --pink: #ff4f9c;
      --lime: #ddff69;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 78% 16%, rgba(118, 248, 230, 0.055), transparent 28%),
        radial-gradient(circle at 15% 82%, rgba(156, 133, 255, 0.05), transparent 32%),
        var(--background);
      font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
    }

    button { font: inherit; }

    .effect-app {
      width: 100%;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 238px minmax(0, 1fr);
      grid-template-rows: 66px minmax(0, 1fr);
      overflow: hidden;
    }

    .app-header {
      position: relative;
      z-index: 20;
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-width: 0;
      padding: 0 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(5, 8, 10, 0.9);
      backdrop-filter: blur(14px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.18em;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 1px solid var(--cyan);
      border-radius: 50%;
      color: var(--cyan);
      box-shadow: 0 0 18px rgba(118, 248, 230, 0.17);
      font-size: 10px;
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--muted);
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
      font-size: 9px;
      letter-spacing: 0.13em;
    }

    .header-meta strong { color: var(--cyan); }

    .effect-nav {
      grid-row: 2;
      min-height: 0;
      padding: 26px 15px;
      border-right: 1px solid var(--line);
      background: rgba(7, 10, 12, 0.7);
    }

    .nav-label {
      margin: 0 10px 13px;
      color: var(--muted);
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.16em;
    }

    .effect-nav-item {
      width: 100%;
      display: grid;
      grid-template-columns: 33px 1fr;
      gap: 10px;
      align-items: center;
      padding: 13px 12px;
      border: 1px solid rgba(195, 227, 225, 0.1);
      color: #849397;
      background: rgba(255,255,255,0.012);
      text-align: left;
      cursor: pointer;
      transition: color 140ms, border-color 140ms, background 140ms;
    }

    .effect-nav-item + .effect-nav-item { margin-top: 8px; }

    .effect-nav-item:hover {
      color: var(--text);
      border-color: rgba(118, 248, 230, 0.3);
    }

    .effect-nav-item[aria-current="page"] {
      color: var(--text);
      border-color: rgba(118, 248, 230, 0.42);
      background: rgba(118, 248, 230, 0.055);
      box-shadow: inset 3px 0 0 rgba(118, 248, 230, 0.48);
    }

    .effect-number {
      color: var(--cyan);
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
    }

    .effect-name strong {
      display: block;
      margin-bottom: 3px;
      font-size: 12px;
    }

    .effect-name small {
      color: var(--muted);
      font-size: 9px;
    }

    .nav-footnote {
      margin: 18px 10px 0;
      color: #4e5a5d;
      font-size: 10px;
      line-height: 1.6;
    }

    .workspace {
      grid-column: 2;
      grid-row: 2;
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      padding: 24px;
      gap: 16px;
    }

    .effect-panel[hidden] { display: none; }

    .preview-frame {
      position: relative;
      min-height: 440px;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      background: #000;
      isolation: isolate;
    }

    .preview-frame::before {
      content: "";
      position: absolute;
      z-index: 0;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(118,248,230,0.019) 1px, transparent 1px),
        linear-gradient(90deg, rgba(118,248,230,0.019) 1px, transparent 1px),
        radial-gradient(circle at center, rgba(118,248,230,0.025), transparent 56%);
      background-size: 30px 30px, 30px 30px, auto;
    }

    .preview-frame::after {
      content: "";
      position: absolute;
      z-index: 12;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,0.012) 3px 4px),
        radial-gradient(circle at center, transparent 52%, rgba(0,0,0,0.42));
    }

    .preview-label,
    .preview-state {
      position: absolute;
      z-index: 15;
      top: 18px;
      color: var(--muted);
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.15em;
    }

    .preview-label { left: 20px; }
    .preview-state { right: 20px; }
    .preview-state strong { color: var(--lime); }

    .logo-scene {
      position: absolute;
      z-index: 2;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 66px 6% 42px;
    }

    .logo-wrap {
      position: relative;
      width: min(88%, 980px);
      aspect-ratio: 1340 / 660;
      transform: translateZ(0);
    }

    .logo-layer,
    .intro-ghost {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .logo-project {
      clip-path: inset(0 0 64% 0);
      filter: drop-shadow(0 0 5px rgba(255,255,255,0.08));
    }

    .logo-letter {
      clip-path: inset(var(--clip-top) var(--clip-right) var(--clip-bottom) var(--clip-left));
      filter:
        drop-shadow(0 0 4px rgba(255,255,255,0.12))
        drop-shadow(0 0 13px rgba(118,248,230,0.055));
      transition: opacity 80ms linear, filter 80ms linear;
    }

    .letter-l { --clip-top: 32%; --clip-right: 82%; --clip-bottom: 6%; --clip-left: 3%; }
    .letter-u { --clip-top: 32%; --clip-right: 53.5%; --clip-bottom: 6%; --clip-left: 23%; }
    .letter-n { --clip-top: 32%; --clip-right: 30.5%; --clip-bottom: 6%; --clip-left: 45.5%; }
    .letter-a { --clip-top: 32%; --clip-right: 2.5%; --clip-bottom: 6%; --clip-left: 67%; }

    .intro-ghost {
      z-index: -1;
      opacity: 0;
      mix-blend-mode: screen;
    }

    .intro-ghost.cyan { filter: sepia(1) saturate(8) hue-rotate(116deg); }
    .intro-ghost.pink { filter: sepia(1) saturate(8) hue-rotate(278deg); }

    .logo-wrap.intro-glitch { animation: glitch-reveal 1.72s steps(1, end) both; }
    .logo-wrap.intro-glitch .intro-ghost.cyan { animation: ghost-cyan 1.72s steps(1, end) both; }
    .logo-wrap.intro-glitch .intro-ghost.pink { animation: ghost-pink 1.72s steps(1, end) both; }
    .logo-wrap.intro-fade { animation: fade-reveal 1.9s cubic-bezier(0.2, 0.78, 0.24, 1) both; }

    @keyframes glitch-reveal {
      0%, 13% { opacity: 0; transform: translate3d(0, 0, 0) scale(0.995); clip-path: inset(0 0 100% 0); }
      14% { opacity: 0.36; transform: translate3d(-9px, 1px, 0); clip-path: inset(9% 0 77% 0); }
      17% { opacity: 0; clip-path: inset(48% 0 39% 0); }
      21% { opacity: 0.78; transform: translate3d(8px, 0, 0); clip-path: inset(54% 0 17% 0); }
      24% { opacity: 0.16; transform: translate3d(-4px, 0, 0); clip-path: inset(22% 0 49% 0); }
      31% { opacity: 0.88; transform: translate3d(2px, 0, 0); clip-path: inset(6% 0 14% 0); }
      36% { opacity: 0.28; transform: translate3d(12px, -2px, 0); clip-path: inset(68% 0 8% 0); }
      43% { opacity: 0.92; transform: translate3d(-2px, 0, 0); clip-path: inset(0 0 0 0); }
      47% { opacity: 0.42; transform: translate3d(5px, 0, 0); clip-path: inset(36% 0 24% 0); }
      55% { opacity: 1; transform: translate3d(0, 0, 0); clip-path: inset(0 0 0 0); }
      58% { opacity: 0.66; filter: brightness(1.8); }
      61%, 100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); clip-path: inset(0 0 0 0); filter: brightness(1); }
    }

    @keyframes ghost-cyan {
      0%, 13%, 55%, 100% { opacity: 0; transform: translateX(0); clip-path: inset(0 0 0 0); }
      14% { opacity: 0.78; transform: translateX(-15px); clip-path: inset(8% 0 73% 0); }
      21% { opacity: 0.56; transform: translateX(12px); clip-path: inset(53% 0 19% 0); }
      31% { opacity: 0.42; transform: translateX(-8px); clip-path: inset(18% 0 49% 0); }
      43% { opacity: 0.25; transform: translateX(5px); clip-path: inset(65% 0 8% 0); }
    }

    @keyframes ghost-pink {
      0%, 16%, 56%, 100% { opacity: 0; transform: translateX(0); clip-path: inset(0 0 0 0); }
      17% { opacity: 0.66; transform: translateX(16px); clip-path: inset(44% 0 40% 0); }
      24% { opacity: 0.54; transform: translateX(-11px); clip-path: inset(19% 0 52% 0); }
      36% { opacity: 0.38; transform: translateX(9px); clip-path: inset(69% 0 7% 0); }
      47% { opacity: 0.2; transform: translateX(-6px); clip-path: inset(33% 0 28% 0); }
    }

    @keyframes fade-reveal {
      0%, 12% { opacity: 0; transform: scale(0.985); filter: blur(8px) brightness(0.2); }
      58% { opacity: 0.56; filter: blur(2.5px) brightness(0.7); }
      82% { opacity: 0.92; transform: scale(1); filter: blur(0) brightness(1.32); }
      100% { opacity: 1; transform: scale(1); filter: blur(0) brightness(1); }
    }

    .logo-letter.sign-flicker {
      animation: sign-flicker 680ms steps(1, end);
    }

    @keyframes sign-flicker {
      0% { opacity: 1; filter: brightness(1); }
      7% { opacity: 0.05; filter: brightness(0); }
      14% { opacity: 0.74; filter: brightness(1.8) drop-shadow(0 0 9px rgba(255,255,255,0.42)); }
      20% { opacity: 0; filter: brightness(0); }
      33% { opacity: 0.18; filter: brightness(0.35); }
      41% { opacity: 0; filter: brightness(0); }
      57% { opacity: 1; filter: brightness(1.4) drop-shadow(0 0 13px rgba(118,248,230,0.24)); }
      64% { opacity: 0.08; filter: brightness(0); }
      77% { opacity: 0.68; filter: brightness(1.7); }
      83% { opacity: 0; filter: brightness(0); }
      100% { opacity: 1; filter: brightness(1); }
    }

    .signal-line {
      position: absolute;
      z-index: 10;
      left: 0;
      right: 0;
      top: -5%;
      height: 2px;
      opacity: 0;
      background: linear-gradient(90deg, transparent, rgba(118,248,230,0.78), transparent);
      box-shadow: 0 0 14px rgba(118,248,230,0.34);
      pointer-events: none;
    }

    .preview-frame.intro-running .signal-line { animation: scan-line 1.4s 120ms ease-out both; }

    @keyframes scan-line {
      0% { top: 4%; opacity: 0; }
      15% { opacity: 0.8; }
      82% { opacity: 0.32; }
      100% { top: 96%; opacity: 0; }
    }

    .control-panel {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(220px, 1fr) auto;
      gap: 12px;
      align-items: stretch;
    }

    .control-group {
      min-width: 0;
      padding: 13px 14px;
      border: 1px solid var(--line);
      background: rgba(12, 17, 20, 0.82);
    }

    .control-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      color: var(--muted);
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
      font-size: 8px;
      font-weight: 900;
      letter-spacing: 0.14em;
    }

    .control-heading output { color: var(--cyan); }

    .button-row {
      display: flex;
      gap: 7px;
    }

    .mode-button,
    .letter-button,
    .replay-button,
    .toggle-button {
      min-height: 37px;
      border: 1px solid var(--line-strong);
      color: #aab9ba;
      background: rgba(255,255,255,0.018);
      cursor: pointer;
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.09em;
      transition: color 120ms, border-color 120ms, background 120ms, box-shadow 120ms;
    }

    .mode-button { flex: 1; }
    .letter-button { width: 38px; }

    .mode-button:hover,
    .letter-button:hover,
    .replay-button:hover,
    .toggle-button:hover { border-color: rgba(118,248,230,0.5); color: var(--text); }

    .mode-button[aria-pressed="true"],
    .toggle-button[aria-pressed="true"] {
      border-color: rgba(118,248,230,0.52);
      color: var(--cyan);
      background: rgba(118,248,230,0.07);
      box-shadow: inset 0 -2px 0 rgba(118,248,230,0.22);
    }

    .replay-button {
      min-width: 154px;
      padding: 0 20px;
      border-color: var(--lime);
      color: #101407;
      background: var(--lime);
    }

    .replay-button:hover { color: #101407; border-color: #efffa9; background: #efffa9; }

    .toggle-button {
      min-width: 116px;
      padding: 0 12px;
    }

    .random-button {
      width: auto;
      min-width: 66px;
      padding-inline: 10px;
      color: var(--violet);
    }

    .title-preview-frame {
      min-height: 440px;
      aspect-ratio: 16 / 9;
      background-color: #071017;
      background-image: url("assets/luna-title-screen.png");
      background-position: center;
      background-size: cover;
    }

    .title-preview-frame::before {
      z-index: 1;
      background:
        linear-gradient(90deg, rgba(2,10,15,0.14), transparent 42%),
        linear-gradient(180deg, rgba(1,5,8,0.1), transparent 38%, rgba(0,3,6,0.16));
      background-size: auto;
      mask-image: none;
    }

    .title-menu-mask {
      position: absolute;
      z-index: 3;
      left: 0;
      bottom: 0;
      width: 38%;
      height: 50%;
      pointer-events: none;
      background:
        linear-gradient(rgba(61,135,159,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(61,135,159,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(3,12,17,0.98) 0%, rgba(4,15,21,0.95) 72%, rgba(4,15,21,0.72) 88%, transparent 100%);
      background-size: 22px 22px, 22px 22px, auto;
      box-shadow: inset 0 1px rgba(118,248,230,0.025);
    }

    .title-menu-mask::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,0.013) 3px 4px),
        linear-gradient(90deg, rgba(0,0,0,0.16), transparent 78%);
    }

    .title-menu {
      --title-button-height: 52px;
      --title-button-gap: 13px;
      --selected-index: 0;
      position: absolute;
      z-index: 9;
      left: 7%;
      bottom: 6.2%;
      width: 27.5%;
      display: grid;
      gap: var(--title-button-gap);
    }

    .title-menu-button {
      position: relative;
      width: 100%;
      height: var(--title-button-height);
      overflow: hidden;
      padding: 0 25px;
      border: 1px solid rgba(90,202,235,0.12);
      border-bottom-color: rgba(79,184,219,0.34);
      color: rgba(119,201,226,0.72);
      background:
        repeating-linear-gradient(0deg, rgba(58,151,181,0.034) 0 1px, transparent 1px 3px),
        rgba(3,16,23,0.66);
      cursor: pointer;
      text-align: left;
      font-size: clamp(15px, 1.35vw, 23px);
      font-weight: 800;
      letter-spacing: -0.035em;
      text-shadow: 0 0 12px rgba(62,190,232,0.12);
      transition:
        color 130ms linear,
        border-color 130ms linear,
        box-shadow 130ms linear,
        transform 180ms ease;
    }

    .title-menu-button::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      opacity: 0;
      transform: translateX(-16%) scaleX(0.72);
      transform-origin: left center;
      clip-path: polygon(0 0, 96% 0, 100% 50%, 96% 100%, 0 100%);
      background:
        linear-gradient(90deg, rgba(19,76,98,0.9), rgba(24,81,105,0.69) 65%, rgba(64,205,235,0.13)),
        repeating-linear-gradient(0deg, transparent 0 2px, rgba(147,239,255,0.05) 2px 3px);
      transition: opacity 110ms linear, transform 230ms cubic-bezier(0.16, 0.9, 0.32, 1);
    }

    .title-menu-button::after {
      content: "";
      position: absolute;
      left: -35%;
      top: 0;
      width: 28%;
      height: 100%;
      opacity: 0;
      transform: skewX(-18deg);
      background: linear-gradient(90deg, transparent, rgba(164,245,255,0.2), transparent);
      pointer-events: none;
    }

    .title-menu-button.active {
      color: #f1fbfc;
      border-color: rgba(134,233,255,0.9);
      background-color: rgba(3,24,32,0.8);
      box-shadow:
        0 0 0 1px rgba(57,183,219,0.15),
        inset 0 0 20px rgba(61,191,224,0.12),
        0 0 15px rgba(58,194,230,0.09);
      text-shadow: 0 0 8px rgba(166,241,255,0.3);
      transform: translateX(4px);
    }

    .title-menu-button.active::before {
      opacity: 1;
      transform: translateX(0) scaleX(1);
    }

    .title-menu-button.active::after {
      animation: title-button-sweep 620ms 80ms ease-out;
    }

    .title-menu-button.activate {
      animation: title-button-activate 320ms steps(2, end);
    }

    .title-menu-button span {
      position: relative;
      z-index: 2;
    }

    .title-selector {
      position: absolute;
      z-index: 12;
      left: -44px;
      top: 0;
      width: 28px;
      height: var(--title-button-height);
      transform: translateY(calc(var(--selected-index) * (var(--title-button-height) + var(--title-button-gap))));
      transition: transform 270ms cubic-bezier(0.22, 0.86, 0.28, 1.04);
      pointer-events: none;
    }

    .title-selector::before {
      content: "";
      position: absolute;
      left: 0;
      top: 3px;
      bottom: 3px;
      width: 5px;
      background: #73f4ef;
      box-shadow: 0 0 7px rgba(115,244,239,0.96), 0 0 18px rgba(60,221,228,0.62);
    }

    .title-selector::after {
      content: "";
      position: absolute;
      left: 13px;
      top: 50%;
      width: 9px;
      height: 9px;
      transform: translateY(-50%) rotate(45deg);
      border-top: 1px solid rgba(139,244,255,0.9);
      border-right: 1px solid rgba(139,244,255,0.9);
      filter: drop-shadow(0 0 4px rgba(115,244,239,0.6));
    }

    @keyframes title-button-sweep {
      0% { left: -35%; opacity: 0; }
      18% { opacity: 1; }
      100% { left: 120%; opacity: 0; }
    }

    @keyframes title-button-activate {
      0% { transform: translateX(4px); filter: brightness(1); }
      25% { transform: translateX(0); filter: brightness(2); }
      50% { transform: translateX(7px); filter: brightness(0.72); }
      75% { transform: translateX(2px); filter: brightness(1.55); }
      100% { transform: translateX(4px); filter: brightness(1); }
    }

    .title-effect-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 58px;
      padding: 12px 15px;
      border: 1px solid var(--line);
      background: rgba(12,17,20,0.82);
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
      font-size: 9px;
      letter-spacing: 0.1em;
    }

    .title-effect-controls span { color: var(--muted); }
    .title-effect-controls strong { color: var(--cyan); }

    .menu-reset-button {
      min-width: 132px;
      min-height: 34px;
      border: 1px solid rgba(118,248,230,0.38);
      color: var(--cyan);
      background: rgba(118,248,230,0.045);
      cursor: pointer;
      font-family: inherit;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.1em;
    }

    .menu-reset-button:hover { border-color: var(--cyan); background: rgba(118,248,230,0.1); }

    @media (max-width: 980px) {
      .effect-app { grid-template-columns: 1fr; grid-template-rows: 66px auto minmax(0, 1fr); }
      .effect-nav { grid-row: 2; display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-right: 0; border-bottom: 1px solid var(--line); }
      .nav-label { margin: 0; }
      .effect-nav-item { width: min(260px, 70vw); padding-block: 9px; }
      .effect-nav-item + .effect-nav-item { margin-top: 0; }
      .nav-footnote { display: none; }
      .workspace { grid-column: 1; grid-row: 3; }
      .control-panel { grid-template-columns: 1fr 1fr; }
      .replay-button { grid-column: 1 / -1; min-height: 44px; }
    }

    @media (max-width: 680px) {
      .app-header { padding-inline: 15px; }
      .header-meta span:first-child { display: none; }
      .workspace { padding: 12px; }
      .preview-frame { min-height: 390px; }
      .logo-scene { padding-inline: 2%; }
      .logo-wrap { width: 98%; }
      .control-panel { grid-template-columns: 1fr; }
      .replay-button { grid-column: auto; }
      .title-menu {
        --title-button-height: 45px;
        --title-button-gap: 9px;
        left: 8.5%;
        bottom: 5%;
        width: 34%;
      }
      .title-menu-mask { width: 48%; height: 49%; }
      .title-menu-button { padding-inline: 17px; font-size: 14px; }
      .title-selector { left: -31px; }
      .title-effect-controls { align-items: flex-start; flex-direction: column; gap: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo-wrap,
      .logo-letter,
      .intro-ghost,
      .signal-line,
      .title-menu-button,
      .title-selector { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
    }
  </style>
</head>
<body>
  <main class="effect-app">
    <header class="app-header">
      <div class="brand"><span class="brand-mark">FX</span> PROJECT L.U.N.A / EFFECT LAB</div>
      <div class="header-meta"><span>REAL-TIME PREVIEW</span><strong>02 EFFECTS</strong></div>
    </header>

    <nav class="effect-nav" aria-label="이펙트 목록">
      <div class="nav-label">EFFECT INDEX</div>
      <button class="effect-nav-item" type="button" data-effect-target="logo" aria-current="page">
        <span class="effect-number">01</span>
        <span class="effect-name"><strong>타이틀 로고</strong><small>등장 · 간판 점멸</small></span>
      </button>
      <button class="effect-nav-item" type="button" data-effect-target="title-menu">
        <span class="effect-number">02</span>
        <span class="effect-name"><strong>타이틀 메뉴</strong><small>선택 이동 · 버튼 호버</small></span>
      </button>
      <p class="nav-footnote">새로 요청하는 이펙트를 이 목록에 순서대로 추가할 수 있습니다.</p>
    </nav>

    <section class="workspace effect-panel" data-effect-panel="logo" aria-label="타이틀 로고 이펙트 미리보기">
      <div class="preview-frame" id="previewFrame">
        <span class="preview-label">TITLE LOGO / FIRST APPEARANCE</span>
        <span class="preview-state">STATUS <strong id="previewStatus">INTRO</strong></span>
        <div class="signal-line" aria-hidden="true"></div>

        <div class="logo-scene">
          <div class="logo-wrap" id="logoWrap" aria-label="Project L.U.N.A 타이틀 로고">
            <img class="intro-ghost cyan" src="assets/luna-title-logo.png" alt="">
            <img class="intro-ghost pink" src="assets/luna-title-logo.png" alt="">
            <img class="logo-layer logo-project" src="assets/luna-title-logo.png" alt="">
            <img class="logo-layer logo-letter letter-l" data-letter="L" src="assets/luna-title-logo.png" alt="L">
            <img class="logo-layer logo-letter letter-u" data-letter="U" src="assets/luna-title-logo.png" alt="U">
            <img class="logo-layer logo-letter letter-n" data-letter="N" src="assets/luna-title-logo.png" alt="N">
            <img class="logo-layer logo-letter letter-a" data-letter="A" src="assets/luna-title-logo.png" alt="A">
          </div>
        </div>
      </div>

      <div class="control-panel" aria-label="이펙트 조작">
        <section class="control-group">
          <div class="control-heading"><span>ENTRANCE TYPE</span><output id="modeOutput">GLITCH</output></div>
          <div class="button-row">
            <button class="mode-button" type="button" data-mode="glitch" aria-pressed="true">GLITCH</button>
            <button class="mode-button" type="button" data-mode="fade" aria-pressed="false">FADE IN</button>
          </div>
        </section>

        <section class="control-group">
          <div class="control-heading"><span>SIGN FLICKER TEST</span><output id="flickerOutput">AUTO 4–5s</output></div>
          <div class="button-row">
            <button class="letter-button" type="button" data-letter-test="L">L</button>
            <button class="letter-button" type="button" data-letter-test="U">U</button>
            <button class="letter-button" type="button" data-letter-test="N">N</button>
            <button class="letter-button" type="button" data-letter-test="A">A</button>
            <button class="letter-button random-button" type="button" data-letter-test="random">RANDOM</button>
            <button class="toggle-button" id="autoToggle" type="button" aria-pressed="true">AUTO ON</button>
          </div>
        </section>

        <button class="replay-button" id="replayButton" type="button">등장 연출 다시 보기</button>
      </div>
    </section>

    <section class="workspace effect-panel" data-effect-panel="title-menu" aria-label="타이틀 메뉴 버튼 이펙트 미리보기" hidden>
      <div class="preview-frame title-preview-frame" id="titlePreviewFrame">
        <span class="preview-label">TITLE SCREEN / INTERACTION HOVER</span>
        <span class="preview-state">SELECTED <strong id="titlePreviewStatus">새 게임</strong></span>
        <div class="title-menu-mask" aria-hidden="true"></div>

        <div class="title-menu" id="titleMenu" aria-label="타이틀 메뉴">
          <span class="title-selector" aria-hidden="true"></span>
          <button class="title-menu-button active" type="button" data-title-menu="새 게임" aria-current="true"><span>새 게임</span></button>
          <button class="title-menu-button" type="button" data-title-menu="이어하기"><span>이어하기</span></button>
          <button class="title-menu-button" type="button" data-title-menu="설정"><span>설정</span></button>
          <button class="title-menu-button" type="button" data-title-menu="종료"><span>종료</span></button>
        </div>
      </div>

      <div class="title-effect-controls" aria-label="타이틀 메뉴 조작 안내">
        <span>INPUT <strong>마우스 호버 · ↑ ↓ 방향키</strong></span>
        <span>CLICK / ENTER <strong>선택 확정 글리치</strong></span>
        <button class="menu-reset-button" id="menuResetButton" type="button">첫 항목으로 이동</button>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const previewFrame = document.getElementById("previewFrame");
      const logoWrap = document.getElementById("logoWrap");
      const previewStatus = document.getElementById("previewStatus");
      const modeOutput = document.getElementById("modeOutput");
      const flickerOutput = document.getElementById("flickerOutput");
      const replayButton = document.getElementById("replayButton");
      const autoToggle = document.getElementById("autoToggle");
      const modeButtons = [...document.querySelectorAll("[data-mode]")];
      const letterButtons = [...document.querySelectorAll("[data-letter-test]")];
      const letters = [...document.querySelectorAll(".logo-letter")];

      let entranceMode = "glitch";
      let autoFlicker = true;
      let entranceTimer = 0;
      let flickerTimer = 0;
      let countdownTimer = 0;
      let nextFlickerAt = 0;
      let lastLetterIndex = -1;

      function setStatus(label) {
        previewStatus.textContent = label;
      }

      function clearFlickerSchedule() {
        window.clearTimeout(flickerTimer);
        window.clearInterval(countdownTimer);
        flickerTimer = 0;
        countdownTimer = 0;
        nextFlickerAt = 0;
        if (!autoFlicker) flickerOutput.textContent = "AUTO OFF";
      }

      function pickRandomLetter() {
        if (letters.length < 2) return letters[0];
        let nextIndex = lastLetterIndex;
        while (nextIndex === lastLetterIndex) {
          nextIndex = Math.floor(Math.random() * letters.length);
        }
        lastLetterIndex = nextIndex;
        return letters[nextIndex];
      }

      function flickerLetter(letter) {
        if (!letter) return;
        letter.classList.remove("sign-flicker");
        void letter.offsetWidth;
        letter.classList.add("sign-flicker");
        setStatus(`${letter.dataset.letter} FLICKER`);
        window.setTimeout(() => {
          letter.classList.remove("sign-flicker");
          setStatus("STABLE");
        }, 700);
      }

      function updateCountdown() {
        if (!autoFlicker || !nextFlickerAt) {
          flickerOutput.textContent = "AUTO OFF";
          return;
        }
        const seconds = Math.max(0, (nextFlickerAt - performance.now()) / 1000);
        flickerOutput.textContent = `NEXT ${seconds.toFixed(1)}s`;
      }

      function scheduleFlicker() {
        clearFlickerSchedule();
        if (!autoFlicker) {
          flickerOutput.textContent = "AUTO OFF";
          return;
        }
        const delay = 4000 + Math.random() * 1000;
        nextFlickerAt = performance.now() + delay;
        updateCountdown();
        countdownTimer = window.setInterval(updateCountdown, 100);
        flickerTimer = window.setTimeout(() => {
          clearFlickerSchedule();
          flickerLetter(pickRandomLetter());
          window.setTimeout(scheduleFlicker, 760);
        }, delay);
      }

      function playEntrance() {
        window.clearTimeout(entranceTimer);
        clearFlickerSchedule();
        letters.forEach(letter => letter.classList.remove("sign-flicker"));
        logoWrap.classList.remove("intro-glitch", "intro-fade");
        previewFrame.classList.remove("intro-running");
        void logoWrap.offsetWidth;
        previewFrame.classList.add("intro-running");
        logoWrap.classList.add(`intro-${entranceMode}`);
        setStatus(entranceMode === "glitch" ? "GLITCHING" : "FADING IN");
        const duration = entranceMode === "glitch" ? 1780 : 1960;
        entranceTimer = window.setTimeout(() => {
          logoWrap.classList.remove("intro-glitch", "intro-fade");
          previewFrame.classList.remove("intro-running");
          setStatus("STABLE");
          scheduleFlicker();
        }, duration);
      }

      modeButtons.forEach(button => {
        button.addEventListener("click", () => {
          entranceMode = button.dataset.mode;
          modeOutput.textContent = entranceMode === "glitch" ? "GLITCH" : "FADE IN";
          modeButtons.forEach(item => item.setAttribute("aria-pressed", String(item === button)));
          playEntrance();
        });
      });

      letterButtons.forEach(button => {
        button.addEventListener("click", () => {
          clearFlickerSchedule();
          const requested = button.dataset.letterTest;
          const letter = requested === "random"
            ? pickRandomLetter()
            : letters.find(item => item.dataset.letter === requested);
          flickerLetter(letter);
          window.setTimeout(scheduleFlicker, 760);
        });
      });

      autoToggle.addEventListener("click", () => {
        autoFlicker = !autoFlicker;
        autoToggle.setAttribute("aria-pressed", String(autoFlicker));
        autoToggle.textContent = autoFlicker ? "AUTO ON" : "AUTO OFF";
        if (autoFlicker) scheduleFlicker();
        else clearFlickerSchedule();
      });

      replayButton.addEventListener("click", playEntrance);

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) clearFlickerSchedule();
        else if (autoFlicker) scheduleFlicker();
      });

      window.addEventListener("keydown", event => {
        if (event.code !== "Space" || event.repeat) return;
        event.preventDefault();
        playEntrance();
      });

      playEntrance();
    })();

    (() => {
      const navigationItems = [...document.querySelectorAll("[data-effect-target]")];
      const effectPanels = [...document.querySelectorAll("[data-effect-panel]")];

      function showEffect(effectName) {
        navigationItems.forEach(item => {
          if (item.dataset.effectTarget === effectName) item.setAttribute("aria-current", "page");
          else item.removeAttribute("aria-current");
        });
        effectPanels.forEach(panel => {
          panel.hidden = panel.dataset.effectPanel !== effectName;
        });
        document.documentElement.dataset.activeEffect = effectName;
      }

      navigationItems.forEach(item => {
        item.addEventListener("click", () => showEffect(item.dataset.effectTarget));
      });

      showEffect("logo");
    })();

    (() => {
      const titleMenu = document.getElementById("titleMenu");
      const titleButtons = [...document.querySelectorAll("[data-title-menu]")];
      const titlePreviewStatus = document.getElementById("titlePreviewStatus");
      const menuResetButton = document.getElementById("menuResetButton");
      let selectedIndex = 0;

      function selectTitleItem(index, moveFocus = false) {
        selectedIndex = (index + titleButtons.length) % titleButtons.length;
        titleMenu.style.setProperty("--selected-index", String(selectedIndex));
        titleButtons.forEach((button, buttonIndex) => {
          const selected = buttonIndex === selectedIndex;
          button.classList.toggle("active", selected);
          if (selected) button.setAttribute("aria-current", "true");
          else button.removeAttribute("aria-current");
        });
        titlePreviewStatus.textContent = titleButtons[selectedIndex].dataset.titleMenu;
        if (moveFocus) titleButtons[selectedIndex].focus({ preventScroll: true });
      }

      function activateTitleItem(button) {
        button.classList.remove("activate");
        void button.offsetWidth;
        button.classList.add("activate");
        window.setTimeout(() => button.classList.remove("activate"), 340);
      }

      titleButtons.forEach((button, index) => {
        button.addEventListener("mouseenter", () => selectTitleItem(index));
        button.addEventListener("focus", () => selectTitleItem(index));
        button.addEventListener("click", () => {
          selectTitleItem(index);
          activateTitleItem(button);
        });
      });

      menuResetButton.addEventListener("click", () => selectTitleItem(0));

      window.addEventListener("keydown", event => {
        if (document.documentElement.dataset.activeEffect !== "title-menu") return;
        if (event.code === "ArrowDown") {
          event.preventDefault();
          selectTitleItem(selectedIndex + 1, true);
        } else if (event.code === "ArrowUp") {
          event.preventDefault();
          selectTitleItem(selectedIndex - 1, true);
        } else if (event.code === "Enter") {
          event.preventDefault();
          activateTitleItem(titleButtons[selectedIndex]);
        }
      });

      selectTitleItem(0);
    })();
  </script>
</body>
</html>
