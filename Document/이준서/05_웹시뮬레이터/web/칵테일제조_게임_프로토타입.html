<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project L.U.N.A — 칵테일 제조</title>
<style>
  :root{
    --ink:#0a0c11; --ink2:#12151d; --ink3:#191d27; --panel:#1c212c; --panel2:#222836;
    --line:#2a313e; --line2:#384150;
    --text:#eceae3; --muted:#9aa3b0; --faint:#666e7b;
    --amber:#f0b24a; --amber-d:#b07d20; --amber-glow:rgba(240,178,74,.5);
    --teal:#3fd0bc; --teal-d:#1f8576; --teal-glow:rgba(63,208,188,.45);
    --rose:#e8556b; --green:#5fc77f; --violet:#a585ff; --blue:#5b9df0;
    --mono:"SF Mono",ui-monospace,"Cascadia Code",Consolas,monospace;
    --disp:"Pretendard","Noto Sans KR",system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
  html,body{height:100%;overflow:hidden}
  body{
    background:#000; color:var(--text); font-family:var(--disp);
    display:flex; align-items:center; justify-content:center;
  }
  /* ── 게임 무대: 고정 1280×720 (작은 화면에선 scale로 축소) ── */
  #stageWrap{
    width:1280px; height:720px; flex-shrink:0;
    transform-origin:center center;
  }
  #stage{
    position:relative; width:1280px; height:720px;
    background:linear-gradient(180deg,#0e1117,#0a0c11);
    overflow:hidden; box-shadow:0 0 80px rgba(0,0,0,.6);
  }
  /* 네온 바 분위기 배경 */
  #stage::before{
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(ellipse 60% 40% at 78% 30%, rgba(63,208,188,.10), transparent 55%),
      radial-gradient(ellipse 50% 50% at 15% 75%, rgba(240,178,74,.08), transparent 55%),
      repeating-linear-gradient(180deg, transparent 0 3px, rgba(0,0,0,.13) 3px 4px);
    pointer-events:none; z-index:1;
  }
  .screen{position:absolute; inset:0; z-index:2; display:none; flex-direction:column}
  .screen.active{display:flex}

  /* 공통 UI */
  .topbar{
    height:7%; min-height:38px; display:flex; align-items:center; gap:14px;
    padding:0 3%; border-bottom:1px solid var(--line); background:rgba(10,12,17,.6);
    backdrop-filter:blur(4px); z-index:5;
  }
  .topbar .logo{font-family:var(--mono); font-size:12px; letter-spacing:.2em; color:var(--teal); text-transform:uppercase}
  .topbar .stepname{font-size:13px; color:var(--muted); margin-left:auto; font-family:var(--mono)}
  .topbar .step-dots{display:flex; gap:6px}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--line2); transition:.3s}
  .dot.on{background:var(--amber); box-shadow:0 0 8px var(--amber-glow)}
  .dot.done{background:var(--teal)}

  .stage-body{flex:1; position:relative; display:flex; align-items:center; justify-content:center; min-height:0}

  /* 버튼 */
  .btn{
    font-family:var(--disp); font-size:15px; font-weight:700; cursor:pointer;
    padding:12px 26px; border-radius:10px; border:1px solid var(--amber);
    background:var(--amber); color:#1a1206; transition:.15s; letter-spacing:.01em;
  }
  .btn:hover{filter:brightness(1.12); transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.ghost{background:transparent; color:var(--text); border-color:var(--line2)}
  .btn.ghost:hover{border-color:var(--amber); color:var(--amber)}
  .btn.teal{background:var(--teal); border-color:var(--teal); color:#06201d}
  .btn:disabled{opacity:.35; cursor:not-allowed; transform:none; filter:none}

  /* ── 인트로 ── */
  #intro{align-items:center; justify-content:center; text-align:center}
  #intro .wrap{z-index:3; padding:0 6%}
  #intro .eyebrow{font-family:var(--mono); font-size:13px; letter-spacing:.3em; color:var(--teal); margin-bottom:22px; text-transform:uppercase; opacity:0; animation:fadeUp .7s .1s forwards}
  #intro h1{font-size:clamp(34px,6.5vw,72px); font-weight:800; letter-spacing:-.02em; line-height:1; margin-bottom:18px; opacity:0; animation:fadeUp .7s .25s forwards}
  #intro h1 .n{color:var(--amber); text-shadow:0 0 30px var(--amber-glow)}
  #intro p{color:var(--muted); font-size:clamp(14px,1.8vw,18px); max-width:520px; margin:0 auto 36px; line-height:1.6; opacity:0; animation:fadeUp .7s .4s forwards}
  #intro .start{opacity:0; animation:fadeUp .7s .55s forwards}
  #intro .hint{margin-top:20px; font-family:var(--mono); font-size:11px; color:var(--faint); opacity:0; animation:fadeUp .7s .7s forwards}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

  /* ── 손님/주문 (레시피 선택) ── */
  .customer-bar{
    position:absolute; left:0; right:0; bottom:0; height:38%;
    background:linear-gradient(180deg,transparent,rgba(10,12,17,.5));
    border-top:1px solid var(--line); display:flex; align-items:flex-end; z-index:3;
  }
  .customer{
    position:absolute; left:6%; bottom:0; width:24%; height:88%;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .cust-sprite{
    width:100%; height:100%;
    background:linear-gradient(180deg, var(--panel2), var(--panel));
    border-radius:50% 50% 8px 8px / 16% 16% 8px 8px;
    border:1px solid var(--line2); position:relative; overflow:hidden;
  }
  .cust-sprite .face{position:absolute; top:18%; left:0; right:0; text-align:center; font-size:clamp(34px,5vw,60px)}
  .cust-sprite .glow{position:absolute; inset:0; background:radial-gradient(ellipse 50% 30% at 50% 25%, var(--accent,rgba(165,133,255,.25)), transparent 60%)}

  .speech{
    position:absolute; left:34%; right:6%; bottom:14%; z-index:4;
    background:rgba(20,21,25,.92); border:1px solid var(--line2); border-radius:14px;
    padding:18px 22px; backdrop-filter:blur(6px);
  }
  .speech .nm{font-family:var(--mono); font-size:12px; color:var(--violet); margin-bottom:7px; letter-spacing:.05em}
  .speech .tx{font-size:clamp(15px,1.9vw,19px); line-height:1.55; min-height:2.6em}
  .speech .tx .cur{color:var(--amber)}

  .recipe-hint{
    position:absolute; top:11%; right:3%; width:30%; z-index:4;
    background:rgba(20,21,25,.9); border:1px solid var(--line); border-radius:12px; padding:14px 16px;
  }
  .recipe-hint h4{font-family:var(--mono); font-size:11px; color:var(--teal); letter-spacing:.08em; text-transform:uppercase; margin-bottom:10px; display:flex; align-items:center; gap:7px}
  .recipe-hint .rrow{display:flex; justify-content:space-between; padding:4px 0; font-size:13px; border-bottom:1px solid rgba(255,255,255,.04)}
  .recipe-hint .rrow:last-child{border-bottom:none}
  .recipe-hint .rk{color:var(--faint)} .recipe-hint .rv{color:var(--text); font-weight:600}
  .recipe-hint .locked{color:var(--faint); font-style:italic}

  /* 칵테일 선택 메뉴 */
  .menu-panel{
    position:absolute; left:3%; top:11%; width:27%; z-index:4;
    background:rgba(20,21,25,.92); border:1px solid var(--line); border-radius:12px; padding:14px; max-height:78%; overflow-y:auto;
  }
  .menu-panel h4{font-family:var(--mono); font-size:11px; color:var(--amber); letter-spacing:.08em; text-transform:uppercase; margin-bottom:12px}
  .menu-item{
    display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:9px;
    border:1px solid var(--line2); margin-bottom:7px; cursor:pointer; transition:.13s; background:var(--ink2);
  }
  .menu-item:hover{border-color:var(--amber-d); background:var(--ink3)}
  .menu-item.sel{border-color:var(--amber); background:rgba(240,178,74,.08)}
  .menu-item .mi-ico{width:34px; height:34px; border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:19px; background:var(--ink3); flex-shrink:0}
  .menu-item .mi-name{font-size:14px; font-weight:700}
  .menu-item .mi-desc{font-size:11px; color:var(--muted); margin-top:1px}

  /* ── 작업대 (공통) ── */
  .bench{position:absolute; inset:0; display:flex; flex-direction:column}
  .bench-main{flex:1; position:relative; display:flex; align-items:center; justify-content:center; min-height:0}
  .bench-foot{
    height:14%; min-height:64px; border-top:1px solid var(--line); background:rgba(10,12,17,.55);
    display:flex; align-items:center; padding:0 3%; gap:16px; z-index:6;
  }
  .guide{flex:1; font-size:14px; color:var(--muted)}
  .guide b{color:var(--amber)}
  .guide .key{font-family:var(--mono); font-size:12px; background:var(--ink3); border:1px solid var(--line2); padding:2px 8px; border-radius:5px; color:var(--teal)}

  /* 진행 단계 표시 (작업대 상단) */
  .mg-progress{position:absolute; top:3%; left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:6}
  .mg-pip{display:flex; align-items:center; gap:6px; padding:5px 11px; border-radius:18px; background:rgba(20,21,25,.85); border:1px solid var(--line); font-size:12px; color:var(--faint)}
  .mg-pip.on{border-color:var(--amber); color:var(--amber)}
  .mg-pip.done{border-color:var(--teal-d); color:var(--teal)}
  .mg-pip .pico{font-size:13px}

  /* 점수 토스트 */
  .score-pop{
    position:absolute; z-index:20; font-family:var(--mono); font-weight:700; font-size:22px;
    pointer-events:none; animation:scorePop 1s forwards;
  }
  @keyframes scorePop{0%{opacity:0;transform:translateY(8px) scale(.8)}20%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-30px) scale(1)}}

  /* canvas */
  canvas{display:block; touch-action:none}

  /* ── 결과 화면 ── */
  #result .res-wrap{z-index:3; width:74%; max-width:680px; text-align:center}
  #result .glass-final{margin:0 auto 8px}
  .grade-big{font-family:var(--disp); font-weight:800; font-size:clamp(44px,8vw,90px); line-height:1; letter-spacing:-.02em}
  .grade-big.perfect{color:var(--teal); text-shadow:0 0 40px var(--teal-glow)}
  .grade-big.good{color:var(--green)}
  .grade-big.normal{color:var(--amber); text-shadow:0 0 30px var(--amber-glow)}
  .grade-big.bad,.grade-big.miss{color:var(--rose)}
  .res-avg{font-family:var(--mono); font-size:13px; color:var(--faint); margin:10px 0 22px}
  .breakdown{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:26px}
  .bd{background:rgba(20,21,25,.8); border:1px solid var(--line); border-radius:9px; padding:9px 13px; min-width:78px}
  .bd .bd-k{font-family:var(--mono); font-size:10px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em}
  .bd .bd-v{font-size:16px; font-weight:700; margin-top:3px}
  .bd .bd-v.hi{color:var(--teal)} .bd .bd-v.mid{color:var(--amber)} .bd .bd-v.lo{color:var(--rose)}
  .react-box{background:rgba(20,21,25,.9); border:1px solid var(--line2); border-left:3px solid var(--violet); border-radius:12px; padding:18px 22px; margin-bottom:26px; text-align:left; display:flex; gap:16px; align-items:flex-start}
  .react-box .r-ava{width:46px;height:46px;border-radius:10px;background:linear-gradient(135deg,var(--violet),var(--teal));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex-shrink:0}
  .react-box .r-nm{font-family:var(--mono); font-size:12px; color:var(--violet); margin-bottom:5px}
  .react-box .r-line{font-size:17px; line-height:1.5}
  .react-box .r-meta{margin-top:9px; display:flex; gap:7px; flex-wrap:wrap}
  .react-box .r-chip{font-family:var(--mono); font-size:10px; padding:2px 8px; border-radius:14px; border:1px solid var(--line2); color:var(--muted)}

  .fade{animation:fadeUp .5s forwards}
  .hidden{display:none!important}

  /* 잔 SVG 공통 */
  .glassbox{filter:drop-shadow(0 8px 20px rgba(0,0,0,.4))}

  /* 토스트 알림 */
  #toast{position:absolute; top:9%; left:50%; transform:translateX(-50%); z-index:30;
    background:rgba(20,21,25,.95); border:1px solid var(--amber-d); color:var(--amber);
    padding:10px 20px; border-radius:10px; font-size:14px; font-weight:600; opacity:0; transition:.3s; pointer-events:none}
  #toast.show{opacity:1}
</style>
</head>
<body>
<div id="stageWrap">
<div id="stage">

  <!-- ============ 인트로 ============ -->
  <section class="screen active" id="intro">
    <div class="wrap">
      <div class="eyebrow">Project L.U.N.A · 제조 프로토타입</div>
      <h1>바 <span class="n">언노운</span></h1>
      <p>손님의 주문을 읽고, 재료를 담고, 직접 만들어 건네세요.<br>당신의 한 잔이 그 사람의 하루를 바꿉니다.</p>
      <div class="start"><button class="btn" onclick="Game.startShift()">영업 시작</button></div>
      <div class="hint">마우스로 조작합니다 · 사운드 없음</div>
    </div>
  </section>

  <!-- ============ 주문/레시피 선택 ============ -->
  <section class="screen" id="order">
    <div class="topbar">
      <span class="logo">UNKNOWN</span>
      <div class="step-dots" id="dots1"></div>
      <span class="stepname">주문 받기</span>
    </div>
    <div class="stage-body">
      <!-- 손님 -->
      <div class="customer">
        <div class="cust-sprite" id="custSprite">
          <div class="glow"></div>
          <div class="face" id="custFace">🧑‍🎤</div>
        </div>
      </div>
      <!-- 메뉴 -->
      <div class="menu-panel" id="menuPanel">
        <h4>메뉴 — 무엇을 만들까</h4>
        <div id="menuList"></div>
      </div>
      <!-- 주문 말풍선 -->
      <div class="speech">
        <div class="nm" id="custName">손님</div>
        <div class="tx" id="custLine"></div>
      </div>
      <!-- 레시피 힌트 -->
      <div class="recipe-hint" id="recipeHint">
        <h4>📋 선택한 레시피</h4>
        <div id="recipeRows"><div class="rrow"><span class="locked">메뉴에서 칵테일을 골라보세요</span></div></div>
        <button class="btn teal" id="confirmRecipe" style="width:100%;margin-top:12px" disabled onclick="Game.confirmRecipe()">이걸로 만들기</button>
      </div>
    </div>
  </section>

  <!-- ============ 작업대 (미니게임 호스트) ============ -->
  <section class="screen" id="bench">
    <div class="topbar">
      <span class="logo">UNKNOWN</span>
      <div class="step-dots" id="dots2"></div>
      <span class="stepname" id="benchStepName">제조</span>
    </div>
    <div class="stage-body">
      <div class="mg-progress" id="mgProgress"></div>
      <div class="bench-main" id="benchMain"></div>
    </div>
    <div class="bench-foot">
      <div class="guide" id="benchGuide"></div>
      <button class="btn ghost hidden" id="skipBtn" onclick="Game.nextMinigame(0)">건너뛰기</button>
      <button class="btn hidden" id="benchNext" onclick="Game.nextMinigame()">다음 ▸</button>
    </div>
  </section>

  <!-- ============ 결과 ============ -->
  <section class="screen" id="result">
    <div class="topbar">
      <span class="logo">UNKNOWN</span>
      <span class="stepname">제공 완료</span>
    </div>
    <div class="stage-body">
      <div class="res-wrap">
        <div class="glass-final" id="resGlass"></div>
        <div class="grade-big" id="resGrade">—</div>
        <div class="res-avg" id="resAvg"></div>
        <div class="breakdown" id="resBreakdown"></div>
        <div class="react-box">
          <div class="r-ava" id="resAva">?</div>
          <div style="flex:1">
            <div class="r-nm" id="resReactNm">손님</div>
            <div class="r-line" id="resReactLine"></div>
            <div class="r-meta" id="resReactMeta"></div>
          </div>
        </div>
        <button class="btn" onclick="Game.nextCustomer()">다음 손님 ▸</button>
      </div>
    </div>
  </section>

  <div id="toast"></div>
</div>
</div>
<script>
// 고정 1280×720 무대를 뷰포트에 맞게 스케일
(function(){
  const wrap=document.getElementById('stageWrap');
  function fit(){
    const s=Math.min(window.innerWidth/1280, window.innerHeight/720);
    wrap.style.transform='scale('+s+')';
  }
  window.addEventListener('resize',fit); fit();
})();
</script>

<script>
// =====================================================================
//  데이터 — 칵테일 레시피 / 손님 / 반응 프리셋
// =====================================================================
const COCKTAILS = {

  },

// 손님 — 주문(원하는 칵테일), 호감도, 취향(tier), 말투
const CUSTOMERS = [
  {
    id:"port", name:"포트", face:"🕵️", accent:"rgba(232,85,107,.25)", aff:45,
    want:"gin_fizz",
    order:"오늘은 좀… 목이 칼칼하군. 탄산 들어간 상큼한 걸로. 클래식한 거 알지?",

    tiers:{dry_martini:"love", gin_fizz:"ok", margarita:"good", jack_coke:"ok", kahlua_milk:"dislike", godfather:"good"},
  },
  {
    id:"aili", name:"아일리", face:"😏", accent:"rgba(165,133,255,.25)", aff:60,
    want:"kahlua_milk",
    order:"음~ 오늘은 달달하고 부드러운 거. 우유 들어간 걸로 줄래? 애기 입맛이라서.",

const ALL_GLASSES = [
  {type:"highball", name:"하이볼"},

<!-- 게임 로직은 다음 파트에서 주입 -->
<script>
// =====================================================================
//  미니게임 모음 (MG)  — 각 함수(host, done) → done(score 0..100)
// =====================================================================
const MG = (() => {
  const G = () => Game;
  function guide(html){ document.getElementById("benchGuide").innerHTML=html; }
  function el(tag, cls, html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }

  // ---------------------------------------------------------------
  // 1. 잔 선택 — 4종 중 고르기 (레시피 정답과 비교)
  // ---------------------------------------------------------------
  function glass(host, done){
    guide(`레시피에 맞는 <b>잔</b>을 고르세요.`);
    const recipe = Game._recipe();
    const wrap = el("div","",`<div style="text-align:center;width:100%">
      <div style="font-size:14px;color:var(--muted);margin-bottom:18px;font-family:var(--mono)">어떤 잔에 담을까?</div>
      <div id="glassRow" style="display:flex;gap:18px;justify-content:center;align-items:flex-end"></div>
    </div>`);
    host.appendChild(wrap);
    const row = wrap.querySelector("#glassRow");
    ALL_GLASSES.forEach(g=>{
      const card = el("div","glass-pick");
      card.style.cssText="cursor:pointer;padding:14px 10px 10px;border:1px solid var(--line2);border-radius:14px;background:var(--ink2);transition:.15s;text-align:center;width:120px";
      card.innerHTML = Game._glassSVG(g.type,{scale:0.62}) + `<div style="font-size:13px;font-weight:700;margin-top:6px">${g.name}잔</div>`;
      card.onmouseenter=()=>{ card.style.borderColor="var(--amber-d)"; card.style.background="var(--ink3)"; };
      card.onmouseleave=()=>{ if(!card._sel){card.style.borderColor="var(--line2)"; card.style.background="var(--ink2)";} };
      card.onclick=()=>{
        const correct = g.type===recipe.glassType;
        Game._setGlass(g.type);
        // 시각 피드백
        row.querySelectorAll(".glass-pick").forEach(c=>{c._sel=false;c.style.borderColor="var(--line2)";c.style.background="var(--ink2)";});
        card._sel=true; card.style.borderColor=correct?"var(--teal)":"var(--rose)"; card.style.background=correct?"rgba(63,208,188,.1)":"rgba(232,85,107,.1)";
        Game._toast(correct?"맞는 잔이에요!":"레시피와 다른 잔...");
        setTimeout(()=>done(correct?100:35), 550);
      };
      row.appendChild(card);
    });
  }

  // ---------------------------------------------------------------
  // 2. 림 — 잔 테두리를 따라 드래그해서 소금/설탕 묻히기
  // ---------------------------------------------------------------
  function rim(host, done){
    const recipe=Game._recipe();
    guide(`잔을 뒤집어 <b>${recipe.rim}</b>을 묻히세요. 테두리 호를 따라 <span class="key">드래그</span>`);
    const cv = el("canvas"); const W=560,H=300; cv.width=W; cv.height=H;
    cv.style.cssText="max-width:90%;max-height:100%;border-radius:12px";
    host.appendChild(cv);
    const ctx=cv.getContext("2d");
    // 잔 테두리 호 (위로 볼록한 반원)
    const cx=W/2, cy=H*0.62, rx=150, ry=60;
    const segs=40; const covered=new Array(segs).fill(false);
    let dragging=false;
    function angleToIdx(a){ // a in [PI, 2PI] (윗쪽 호)
      const t=(a-Math.PI)/Math.PI; return Math.max(0,Math.min(segs-1,Math.floor(t*segs)));
    }
    function draw(){
      ctx.clearRect(0,0,W,H);
      // 잔(역삼각형 - 마르가리타 느낌)
      ctx.strokeStyle="#9fb4c4"; ctx.lineWidth=3; ctx.globalAlpha=.9;
      ctx.beginPath(); ctx.moveTo(cx-rx,cy); ctx.lineTo(cx,cy+120); ctx.lineTo(cx+rx,cy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx,cy+120); ctx.lineTo(cx,cy+150); ctx.moveTo(cx-30,cy+150); ctx.lineTo(cx+30,cy+150); ctx.stroke();
      ctx.globalAlpha=1;
      // 테두리 호 가이드
      ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,Math.PI,Math.PI*2); ctx.strokeStyle="#384150"; ctx.lineWidth=8; ctx.stroke();
      // 묻은 부분
      const rimColor = recipe.rim==="소금"?"#eef2f5":"#f0e2c8";
      for(let i=0;i<segs;i++){
        if(covered[i]){
          const a0=Math.PI+(i/segs)*Math.PI, a1=Math.PI+((i+1)/segs)*Math.PI;
          ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,a0,a1); ctx.strokeStyle=rimColor; ctx.lineWidth=8; ctx.lineCap="round"; ctx.stroke();
        }
      }
      // 진행률
      const pct=Math.round(covered.filter(Boolean).length/segs*100);
      ctx.fillStyle="#9aa3b0"; ctx.font="13px monospace"; ctx.textAlign="center";
      ctx.fillText(`${pct}% 코팅`, cx, 40);
    }
    function pos(e){ const r=cv.getBoundingClientRect(); const sx=W/r.width, sy=H/r.height;
      const px=(e.touches?e.touches[0].clientX:e.clientX)-r.left, py=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
      return [px*sx, py*sy]; }
    function mark(e){
      if(!dragging) return;
      const [px,py]=pos(e);
      // 점이 호 근처인지 → 각도 계산
      const dx=px-cx, dy=py-cy;
      if(dy>20) return; // 윗 호만
      let a=Math.atan2(dy/ry, dx/rx); if(a<0)a+=Math.PI*2;
      if(a>=Math.PI && a<=Math.PI*2){ covered[angleToIdx(a)]=true; draw(); checkDone(); }
    }
    let finished=false;
    function checkDone(){
      const pct=covered.filter(Boolean).length/segs;
      if(pct>=0.85 && !finished){ finished=true;
        const score=Math.round(70+pct*30);
        Game._toast("림 완성!");
        setTimeout(()=>done(Math.min(100,score)),400);
      }
    }
    cv.onmousedown=e=>{dragging=true;mark(e);}; cv.onmousemove=mark; window.addEventListener("mouseup",()=>dragging=false);
    cv.ontouchstart=e=>{dragging=true;mark(e);e.preventDefault();}; cv.ontouchmove=e=>{mark(e);e.preventDefault();};
    draw();
  }

  // ---------------------------------------------------------------
  // 3. 따르기 — 병을 기울여(마우스 누름) 목표 용량까지. 여러 재료 순차
  // ---------------------------------------------------------------
  function pour(host, done){
    const recipe=Game._recipe();
    const pours=recipe.pours;
    let pi=0; const results=[]; const builtFill=[];
    const cv=el("canvas"); const W=620,H=340; cv.width=W;cv.height=H;
    cv.style.cssText="max-width:92%;max-height:100%;border-radius:12px";
    host.appendChild(cv);
    const ctx=cv.getContext("2d");

    let pouring=false, current=0, target=0, anim, finished=false;
    const glassX=W*0.62, glassY=H*0.55, glassW=120, glassH=170;

    function startIngredient(){
      const ing=pours[pi];
      target=ing.oz;
      current=0;
      guide(`<b>${ing.name}</b> ${ing.oz}oz 따르기 — 병을 <span class="key">길게 누르기</span>로 기울이세요. 목표선에 맞춰 멈추기!`);
      // 루프는 단 한 번만 시작 (재료가 바뀌어도 같은 루프 재사용)
    }
    let pourVel=0, tiltCur=0, streamT=0;
    function loop(){
      if(finished || pi>=pours.length){ return; }   // 가드
      // 부드러운 가감속: 누르면 서서히 빨라지고, 떼면 잦아듦
      const targetVel = pouring ? 0.009 : 0;          // 속도 대폭 하향 (기존 0.022)
      pourVel += (targetVel - pourVel) * 0.12;
      current += pourVel; if(current>4.5) current=4.5;
      // 병 기울임 이징
      const targetTilt = pouring ? 0.62 : 0;
      tiltCur += (targetTilt - tiltCur) * 0.15;
      streamT += 0.4;
      draw();
      anim=requestAnimationFrame(loop);
    }
    function draw(){
      if(pi>=pours.length) return;                  // 가드: 마지막 재료 처리 후 한 프레임 방지
      ctx.clearRect(0,0,W,H);
      const ing=pours[pi];
      // 목표 게이지 (좌측 세로 바)
      const barX=70, barY=60, barH=210, barW=46;
      const cap=4.5;
      ctx.fillStyle="#191d27"; roundRect(ctx,barX,barY,barW,barH,8); ctx.fill();
      // 목표 존 (target ±0.25 oz 그린존)
      const zoneCenter = barY+barH - (target/cap)*barH;
      const zoneH = (0.5/cap)*barH;
      ctx.fillStyle="rgba(63,208,188,.25)"; ctx.fillRect(barX,zoneCenter-zoneH/2,barW,zoneH);
      ctx.strokeStyle="var(--teal)"; ctx.strokeStyle="#3fd0bc"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(barX,zoneCenter); ctx.lineTo(barX+barW,zoneCenter); ctx.stroke();
      // 현재 채움
      const curH=(current/cap)*barH;
      ctx.fillStyle=ing.color; ctx.fillRect(barX,barY+barH-curH,barW,curH);
      ctx.fillStyle="#9aa3b0"; ctx.font="11px monospace"; ctx.textAlign="center";
      ctx.fillText("목표", barX+barW+26, zoneCenter+4);
      ctx.fillStyle="#eceae3"; ctx.font="13px monospace";
      ctx.fillText(current.toFixed(2)+" oz", barX+barW/2, barY+barH+22);

      // 병 (이징된 기울임)
      const bottleX=glassX-34, bottleY=118, tilt=tiltCur;
      const spoutX = bottleX + Math.cos(tilt)*16 + Math.sin(tilt)*44;
      const spoutY = bottleY - 50 + Math.sin(tilt)*16;
      ctx.save(); ctx.translate(bottleX,bottleY); ctx.rotate(tilt);
      // 병 몸체
      ctx.fillStyle="#2a313e"; ctx.globalAlpha=.95; roundRect(ctx,-24,-72,48,94,9); ctx.fill();
      // 병 안 남은 액체
      ctx.fillStyle=ing.color; ctx.globalAlpha=.8; roundRect(ctx,-20,-30,40,50,6); ctx.fill();
      // 병목
      ctx.fillStyle="#222836"; ctx.globalAlpha=1; ctx.fillRect(-9,-96,18,28);
      ctx.fillStyle="#384150"; ctx.fillRect(-10,-98,20,6);
      ctx.globalAlpha=1; ctx.restore();
      // 따르는 액체 줄기 (기울일 때만, 끊기는 물방울 느낌)
      const landX = glassX, landY = glassY-glassH/2+14;
      if(tiltCur>0.18 && current<4.5){
        ctx.strokeStyle=ing.color; ctx.globalAlpha=.85; ctx.lineWidth=3.5; ctx.lineCap="round";
        // 살짝 흔들리는 줄기
        ctx.beginPath();
        ctx.moveTo(spoutX, spoutY);
        const midX=(spoutX+landX)/2 + Math.sin(streamT*0.5)*2;
        ctx.quadraticCurveTo(midX, (spoutY+landY)/2, landX, landY);
        ctx.stroke();
        // 흐르는 물방울 2~3개
        ctx.fillStyle=ing.color;
        for(let d=0; d<3; d++){
          const p=((streamT*0.06)+d*0.34)%1;
          const dx=spoutX+(landX-spoutX)*p, dy=spoutY+(landY-spoutY)*p + p*p*8;
          ctx.globalAlpha=.7*(1-p*0.3);
          ctx.beginPath(); ctx.arc(dx,dy,2.2,0,7); ctx.fill();
        }
        ctx.globalAlpha=1;
        // 착지 잔물결
        const rip=(streamT*0.1)%1;
        ctx.strokeStyle=ing.color; ctx.globalAlpha=.4*(1-rip); ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.ellipse(landX, landY+2, 6+rip*10, 2+rip*3, 0,0,7); ctx.stroke();
        ctx.globalAlpha=1;
      }
      // 잔
      drawGlass(ctx,glassX,glassY,glassW,glassH,builtFill.concat([{color:ing.color,amount:current}]));
      // 안내
      ctx.fillStyle="#666e7b"; ctx.font="12px monospace"; ctx.textAlign="center";
      ctx.fillText(`재료 ${pi+1}/${pours.length}`, glassX, 40);
    }
    function judge(){
      const diff=Math.abs(current-target);
      let sc = diff<=0.25?100 : diff<=0.6?75 : diff<=1.0?50 : 25;
      results.push(sc);
      builtFill.push({color:pours[pi].color, amount:Math.max(current,0.3)});
      const lab = sc>=90?"완벽!":sc>=70?"좋아":sc>=50?"음...":"너무 차이나";
      Game._toast(`${pours[pi].name}: ${lab} (${current.toFixed(2)}oz)`);
      const isLast = (pi >= pours.length-1);
      if(isLast){
        finished=true;
        cancelAnimationFrame(anim);          // pi++ 전에 루프부터 정지
        pi++;
        Game._setFill(builtFill);
        const avg=Math.round(results.reduce((a,b)=>a+b,0)/results.length);
        setTimeout(()=>done(avg),500);
      } else {
        pi++;
        startIngredient();                   // 같은 루프가 계속 돌며 새 재료를 그림
      }
    }
    cv.onmousedown=()=>{pouring=true;};
    window.addEventListener("mouseup",()=>{ if(pouring && !finished){pouring=false; judge();} });
    cv.ontouchstart=e=>{pouring=true;e.preventDefault();};
    cv.ontouchend=e=>{ if(pouring && !finished){pouring=false;judge();} e.preventDefault();};
    startIngredient();
    loop();                                   // 루프는 여기서 단 한 번만 시작
  }

  // ---------------------------------------------------------------
  // 4. 얼음 — 큰 얼음에 가이드라인 따라 클릭해서 쪼개기
  // ---------------------------------------------------------------
  function ice(host, done){
    guide(`큰 얼음의 <b>가이드선</b>을 순서대로 <span class="key">클릭</span>해서 깎으세요.`);
    const cv=el("canvas"); const W=560,H=320; cv.width=W;cv.height=H;
    cv.style.cssText="max-width:90%;max-height:100%;border-radius:12px";
    host.appendChild(cv);
    const ctx=cv.getContext("2d");
    const cx=W/2, cy=H/2;
    const cuts=[{x:cx-70,y:cy-60},{x:cx+70,y:cy-60},{x:cx+70,y:cy+60},{x:cx-70,y:cy+60}];
    let idx=0, mistakes=0, finished=false;
    let shards=[];        // 깨진 조각 파티클
    let cracks=[];        // 생긴 금
    let chipAt=[];        // 깎여나간 모서리(시각적으로 패임)
    let shake=0;          // 타격 시 흔들림
    function spawnShards(x,y){
      for(let i=0;i<10;i++){
        const a=Math.random()*Math.PI*2, sp=2+Math.random()*4;
        shards.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.5,life:1,sz:2+Math.random()*4});
      }
      cracks.push({x,y,seed:Math.random()*10});
      chipAt.push({x,y});
      shake=6;
    }
    function draw(){
      ctx.clearRect(0,0,W,H);
      const ox=(Math.random()-0.5)*shake, oy=(Math.random()-0.5)*shake;
      shake*=0.85; if(shake<0.3)shake=0;
      ctx.save(); ctx.translate(ox,oy);
      // 얼음 덩어리 (깎인 모서리는 패이게)
      ctx.fillStyle="rgba(205,238,250,.20)"; ctx.strokeStyle="#9fd6ea"; ctx.lineWidth=2;
      ctx.beginPath();
      const bx=cx-90, by=cy-80, bw=180, bh=160, r=14;
      // 모서리별로 깎였으면 더 크게 패인 라운드
      const chip=(corner)=> chipAt.some(c=> Math.abs(c.x-cuts[corner].x)<5 && Math.abs(c.y-cuts[corner].y)<5)?30:r;
      const r0=chip(0), r1=chip(1), r2=chip(2), r3=chip(3);
      ctx.moveTo(bx+r0,by);
      ctx.lineTo(bx+bw-r1,by); ctx.arcTo(bx+bw,by,bx+bw,by+r1,r1);
      ctx.lineTo(bx+bw,by+bh-r2); ctx.arcTo(bx+bw,by+bh,bx+bw-r2,by+bh,r2);
      ctx.lineTo(bx+r3,by+bh); ctx.arcTo(bx,by+bh,bx,by+bh-r3,r3);
      ctx.lineTo(bx,by+r0); ctx.arcTo(bx,by,bx+r0,by,r0);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      // 내부 반짝임
      ctx.strokeStyle="rgba(255,255,255,.22)"; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(cx-50,cy-50); ctx.lineTo(cx-20,cy-10); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx+40,cy-30); ctx.lineTo(cx+60,cy+10); ctx.stroke();
      // 생긴 금(crack) — 지그재그
      ctx.strokeStyle="rgba(255,255,255,.5)"; ctx.lineWidth=1.5;
      cracks.forEach(cr=>{
        ctx.beginPath(); ctx.moveTo(cr.x,cr.y);
        let px=cr.x,py=cr.y;
        for(let s=0;s<4;s++){ px+=(Math.sin(cr.seed+s)*14); py+=(Math.cos(cr.seed*1.3+s)*12)-2;
          ctx.lineTo(px,py); }
        ctx.stroke();
      });
      ctx.restore();
      // 깎인 모서리 마커
      for(let i=0;i<idx;i++){ ctx.fillStyle="rgba(63,208,188,.35)";
        ctx.beginPath(); ctx.arc(cuts[i].x,cuts[i].y,13,0,7); ctx.fill(); }
      // 파티클
      shards.forEach(s=>{ s.x+=s.vx; s.y+=s.vy; s.vy+=0.35; s.life-=0.03;
        ctx.fillStyle=`rgba(220,244,255,${Math.max(0,s.life)})`;
        ctx.fillRect(s.x,s.y,s.sz,s.sz); });
      shards=shards.filter(s=>s.life>0);
      // 다음 타겟 펄스
      if(idx<cuts.length && !finished){
        const c=cuts[idx]; const t=(Date.now()%900)/900;
        ctx.strokeStyle="#f0b24a"; ctx.lineWidth=2.5; ctx.globalAlpha=1-t*0.6;
        ctx.beginPath(); ctx.arc(c.x,c.y,12+t*14,0,7); ctx.stroke(); ctx.globalAlpha=1;
        ctx.fillStyle="#f0b24a"; ctx.beginPath(); ctx.arc(c.x,c.y,6,0,7); ctx.fill();
        ctx.fillStyle="#9aa3b0"; ctx.font="12px monospace"; ctx.textAlign="center";
        ctx.fillText(`⛏ 여기 클릭 (${idx+1}/${cuts.length})`, cx, H-26);
      }
      if(mistakes>0){ ctx.fillStyle="#e8556b"; ctx.font="12px monospace"; ctx.textAlign="left"; ctx.fillText("빗나감: "+mistakes, 20, 28); }
      if(finished){ ctx.fillStyle="#3fd0bc"; ctx.font="13px monospace"; ctx.textAlign="center"; ctx.fillText("얼음 완성!", cx, H-26); }
    }
    let raf=setInterval(draw,33); draw();
    cv.onclick=(e)=>{
      if(finished) return;
      const r=cv.getBoundingClientRect(); const sx=W/r.width,sy=H/r.height;
      const px=(e.clientX-r.left)*sx, py=(e.clientY-r.top)*sy;
      if(idx>=cuts.length) return;
      const c=cuts[idx]; const d=Math.hypot(px-c.x,py-c.y);
      if(d<28){
        spawnShards(c.x,c.y);     // 깨지는 연출
        Game._toast("쩍—");
        idx++;
        if(idx>=cuts.length){ finished=true;
          const score=Math.max(40,100-mistakes*20);
          Game._setIce(true);
          setTimeout(()=>{ clearInterval(raf); done(score); }, 700);
        }
      } else { mistakes++; shake=3; }
    };
  }

  // ---------------------------------------------------------------
  // 5. 제조 — shake(리듬 노드 따라가기) / stir(원 젓기)
  // ---------------------------------------------------------------
  function craft(host, done){
    const recipe=Game._recipe();
    if(recipe.method==="shake") return shake(host,done);
    if(recipe.method==="stir") return stir(host,done);
    return done(100);
  }

  function shake(host, done){
    guide(`리듬에 맞춰 노드가 <b>중앙 링</b>에 들어올 때 <span class="key">클릭</span> (또는 스페이스)`);
    const cv=el("canvas"); const W=600,H=340; cv.width=W;cv.height=H;
    cv.style.cssText="max-width:92%;max-height:100%;border-radius:12px";
    host.appendChild(cv);
    const ctx=cv.getContext("2d");
    const cx=W/2, cy=H/2, ringR=46;
    // 노드들: 각각 다른 방향에서 중앙으로 접근
    const N=8; const nodes=[];
    for(let i=0;i<N;i++){
      const a=(i/N)*Math.PI*2;
      nodes.push({a, t:-1 - i*0.6, hit:null}); // t: -1(밖) → 0(링) → 1(지나침)
    }
    let i0=0, judged=0, scoreSum=0, done_=false;
    let shakeAmt=0, shakeAng=0, sloshPhase=0, hitFlash=0;
    function draw(){
      ctx.clearRect(0,0,W,H);
      sloshPhase+=0.15;
      // 흔들림 감쇠
      shakeAmt*=0.88; if(shakeAmt<0.2)shakeAmt=0;
      hitFlash*=0.9;
      // ── 왼쪽: 실제 흔들리는 쉐이커 ──
      const sxBase=W*0.22, syBase=cy;
      const ox=Math.sin(shakeAng)*shakeAmt, oy=Math.cos(shakeAng*1.3)*shakeAmt*0.6;
      ctx.save();
      ctx.translate(sxBase+ox, syBase+oy);
      ctx.rotate(Math.sin(shakeAng)*shakeAmt*0.012);
      // 모션 라인 (흔들릴 때)
      if(shakeAmt>2){
        ctx.strokeStyle=`rgba(165,133,255,${Math.min(.5,shakeAmt/30)})`; ctx.lineWidth=2;
        for(let m=0;m<3;m++){ const yy=-50+m*45;
          ctx.beginPath(); ctx.moveTo(-46-shakeAmt*0.4,yy); ctx.lineTo(-30,yy); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(46+shakeAmt*0.4,yy); ctx.lineTo(30,yy); ctx.stroke(); }
      }
      // 쉐이커 몸체 (보스턴 쉐이커: 아래 텀블러 + 위 캡)
      ctx.fillStyle="#cfd6df"; ctx.strokeStyle="#9fb4c4"; ctx.lineWidth=2.5;
      // 아래 통
      ctx.beginPath(); roundRect(ctx,-34,-12,68,96,10); ctx.fill(); ctx.stroke();
      // 위 캡(약간 더 좁음)
      ctx.fillStyle="#b8c2cd"; ctx.beginPath(); roundRect(ctx,-30,-78,60,72,9); ctx.fill(); ctx.stroke();
      // 캡 상단
      ctx.fillStyle="#9fb4c4"; ctx.beginPath(); roundRect(ctx,-22,-90,44,14,5); ctx.fill();
      // 금속 하이라이트
      ctx.fillStyle="rgba(255,255,255,.35)"; ctx.fillRect(-26,-8,7,86);
      ctx.fillStyle="rgba(255,255,255,.18)"; ctx.fillRect(20,-70,5,60);
      // 내부 액체 슬로싱 (반투명, 통 안에서 출렁)
      ctx.save();
      ctx.beginPath(); roundRect(ctx,-32,-10,64,92,9); ctx.clip();
      const liqY=40+Math.sin(sloshPhase)*shakeAmt*0.5;
      ctx.fillStyle="rgba(232,169,60,.4)";
      ctx.beginPath(); ctx.moveTo(-34,liqY);
      for(let xx=-34;xx<=34;xx+=8){ ctx.lineTo(xx, liqY+Math.sin(sloshPhase+xx*0.15)*shakeAmt*0.4); }
      ctx.lineTo(34,90); ctx.lineTo(-34,90); ctx.closePath(); ctx.fill();
      ctx.restore();
      // 타격 플래시
      if(hitFlash>0.05){ ctx.strokeStyle=`rgba(63,208,188,${hitFlash})`; ctx.lineWidth=4;
        ctx.beginPath(); roundRect(ctx,-36,-92,72,178,12); ctx.stroke(); }
      ctx.restore();

      // ── 오른쪽: 리듬 링 + 노드 ──
      const cx2=W*0.64;
      ctx.strokeStyle="#f0b24a"; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(cx2,cy,ringR,0,7); ctx.stroke();
      ctx.strokeStyle="rgba(240,178,74,.25)"; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(cx2,cy,ringR+10,0,7); ctx.stroke();
      nodes.forEach((n,i)=>{
        n.t += 0.012;
        if(n.t<-0.05) return;
        if(n.hit!==null){ return; }
        const dist = ringR + (-n.t)*180;
        const x=cx2+Math.cos(n.a)*dist, y=cy+Math.sin(n.a)*dist;
        const onRing = Math.abs(n.t)<0.12;
        ctx.fillStyle = onRing?"#3fd0bc":"#a585ff";
        ctx.shadowColor = onRing?"#3fd0bc":"transparent"; ctx.shadowBlur=onRing?14:0;
        ctx.beginPath(); ctx.arc(x,y,onRing?13:10,0,7); ctx.fill(); ctx.shadowBlur=0;
        if(n.t>0.35 && n.hit===null){ n.hit="miss"; judged++; scoreSum+=20; flash("MISS","#e8556b"); checkEnd(); }
      });
      ctx.fillStyle="#9aa3b0"; ctx.font="12px monospace"; ctx.textAlign="center";
      ctx.fillText(`${judged}/${N}`, cx2, 30);
      ctx.fillStyle="#666e7b"; ctx.font="11px monospace";
      ctx.fillText("타이밍 맞춰 흔들기", cx2, H-22);
      if(!done_) raf=requestAnimationFrame(draw);
    }
    let raf=requestAnimationFrame(draw);
    function flash(txt,col){ Game._toast(txt); }
    function doShake(power){ shakeAmt=Math.min(34, shakeAmt+power); shakeAng=Math.random()*Math.PI*2; hitFlash=0.9; }
    function tryHit(){
      // 가장 링에 가까운 미판정 노드
      let best=null,bd=99;
      nodes.forEach(n=>{ if(n.hit===null){ const d=Math.abs(n.t); if(d<bd){bd=d;best=n;} }});
      if(!best||bd>0.4) return;
      best.hit="hit";
      judged++;
      const sc = bd<0.08?100:bd<0.18?80:bd<0.3?55:30;
      scoreSum+=sc;
      doShake(sc>=80?30:sc>=55?22:14);   // 정확할수록 크게 흔들림
      flash(sc>=90?"PERFECT":sc>=70?"GOOD":"OK", sc>=90?"#3fd0bc":"#5fc77f");
      checkEnd();
    }
    function checkEnd(){
      if(judged>=N && !done_){ done_=true; cancelAnimationFrame(raf);
        const avg=Math.round(scoreSum/N);
        Game._toast("쉐이킹 완료!");
        setTimeout(()=>done(avg),450);
      }
    }
    cv.onclick=tryHit;
    const keyfn=(e)=>{ if(e.code==="Space"){e.preventDefault();tryHit();} };
    window.addEventListener("keydown",keyfn);
    cv._cleanup=()=>window.removeEventListener("keydown",keyfn);
  }

  function stir(host, done){
    guide(`바 스푼으로 <b>원을 그리며</b> 천천히 저으세요. 얼음이 빙글빙글 섞입니다. <span class="key">원 드래그</span>`);
    const cv=el("canvas"); const W=520,H=360; cv.width=W;cv.height=H;
    cv.style.cssText="max-width:90%;max-height:100%;border-radius:12px";
    host.appendChild(cv);
    const ctx=cv.getContext("2d");
    const cx=W/2, cy=H/2+6, R=92;
    let lastA=null, totalRot=0, dragging=false, smoothness=[], target=Math.PI*2*3;
    let spin=0, spinVel=0, swirlPhase=0, done_=false;
    // 믹싱 글라스 안 얼음들 (중심으로부터 거리/각도)
    const ice=[];
    for(let i=0;i<5;i++){ ice.push({r:30+Math.random()*46, a:Math.random()*Math.PI*2, sz:13+Math.random()*9, rot:Math.random()*Math.PI}); }
    // 떠다니는 입자(섞임 표현)
    const bits=[];
    for(let i=0;i<14;i++){ bits.push({r:15+Math.random()*70, a:Math.random()*Math.PI*2, sz:1.5+Math.random()*2}); }

    function draw(){
      ctx.clearRect(0,0,W,H);
      swirlPhase+=0.04+spinVel*0.5;
      // 관성: 저으면 가속, 안 저으면 서서히 감속
      spin += spinVel;
      spinVel *= dragging?0.96:0.92;

      // ── 믹싱 글라스 (두꺼운 유리 원통, 위에서 본 모습) ──
      // 바깥 유리
      ctx.fillStyle="rgba(159,180,196,.10)"; ctx.beginPath(); ctx.arc(cx,cy,R+26,0,7); ctx.fill();
      ctx.strokeStyle="#9fb4c4"; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(cx,cy,R+26,0,7); ctx.stroke();
      ctx.strokeStyle="rgba(255,255,255,.15)"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(cx,cy,R+20,0,7); ctx.stroke();

      // ── 액체 + 소용돌이 (클립 안에서) ──
      ctx.save();
      ctx.beginPath(); ctx.arc(cx,cy,R+16,0,7); ctx.clip();
      // 액체 베이스
      ctx.fillStyle="rgba(200,122,42,.30)"; ctx.fillRect(cx-R-26,cy-R-26,(R+26)*2,(R+26)*2);
      // 소용돌이 줄무늬 (회전)
      for(let s=0;s<5;s++){
        const baseA=spin + s*(Math.PI*2/5);
        ctx.strokeStyle=`rgba(232,169,60,${0.10+0.04*s})`; ctx.lineWidth=6;
        ctx.beginPath();
        for(let t=0;t<1;t+=0.05){
          const rr=t*(R+10); const aa=baseA+t*3.0;  // 나선
          const x=cx+Math.cos(aa)*rr, y=cy+Math.sin(aa)*rr;
          if(t===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
        }
        ctx.stroke();
      }
      // 중심 와류 (살짝 패인 느낌)
      const dip=Math.min(1,Math.abs(spinVel)*6);
      ctx.fillStyle=`rgba(20,24,31,${0.25+dip*0.4})`;
      ctx.beginPath(); ctx.arc(cx,cy,14+dip*16,0,7); ctx.fill();
      // 떠다니는 입자 (회전)
      bits.forEach(p=>{ const aa=p.a+spin*(1-p.r/120); const x=cx+Math.cos(aa)*p.r, y=cy+Math.sin(aa)*p.r;
        ctx.fillStyle="rgba(255,235,200,.5)"; ctx.beginPath(); ctx.arc(x,y,p.sz,0,7); ctx.fill(); });
      // 얼음 (회전하며 떠다님)
      ice.forEach(c=>{ const aa=c.a+spin*(1-c.r/160); const x=cx+Math.cos(aa)*c.r, y=cy+Math.sin(aa)*c.r;
        ctx.save(); ctx.translate(x,y); ctx.rotate(c.rot+spin*0.5);
        ctx.fillStyle="rgba(220,244,255,.55)"; ctx.strokeStyle="rgba(255,255,255,.6)"; ctx.lineWidth=1.5;
        roundRect(ctx,-c.sz/2,-c.sz/2,c.sz,c.sz,3); ctx.fill(); ctx.stroke();
        ctx.fillStyle="rgba(255,255,255,.4)"; ctx.fillRect(-c.sz/2+2,-c.sz/2+2,c.sz*0.3,c.sz*0.3);
        ctx.restore();
      });
      ctx.restore();

      // 가이드 원
      ctx.strokeStyle="#384150"; ctx.lineWidth=2; ctx.setLineDash([4,8]); ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.stroke(); ctx.setLineDash([]);
      // 진행 호
      const prog=Math.min(1,totalRot/target);
      ctx.strokeStyle="#3fd0bc"; ctx.lineWidth=5; ctx.beginPath(); ctx.arc(cx,cy,R+26,-Math.PI/2,-Math.PI/2+prog*Math.PI*2); ctx.stroke();
      // 바 스푼
      if(lastA!==null){
        const sx=cx+Math.cos(lastA)*R, sy=cy+Math.sin(lastA)*R;
        // 스푼 손잡이
        ctx.strokeStyle="#cdd6e0"; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(cx+Math.cos(lastA)*18,cy+Math.sin(lastA)*18); ctx.lineTo(sx,sy); ctx.stroke();
        // 나선 손잡이 디테일
        ctx.strokeStyle="#9fb4c4"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(cx+Math.cos(lastA)*30,cy+Math.sin(lastA)*30); ctx.lineTo(sx,sy); ctx.stroke();
        // 스푼 머리
        ctx.fillStyle="#e8edf2"; ctx.beginPath(); ctx.ellipse(sx,sy,8,5,lastA,0,7); ctx.fill();
        ctx.strokeStyle="#9fb4c4"; ctx.lineWidth=1.2; ctx.stroke();
      }
      // HUD
      ctx.fillStyle="#9aa3b0"; ctx.font="13px monospace"; ctx.textAlign="center";
      ctx.fillText(`${Math.round(prog*100)}%`, cx, cy-R-38);
      ctx.fillStyle="#666e7b"; ctx.font="11px monospace";
      ctx.fillText(`${(totalRot/(Math.PI*2)).toFixed(1)} / 3.0 바퀴`, cx, H-16);
      if(!done_) anim=requestAnimationFrame(draw);
    }
    let anim=requestAnimationFrame(draw);
    function pos(e){ const r=cv.getBoundingClientRect(); const sx=W/r.width,sy=H/r.height;
      const px=((e.touches?e.touches[0].clientX:e.clientX)-r.left)*sx, py=((e.touches?e.touches[0].clientY:e.clientY)-r.top)*sy; return [px,py]; }
    function move(e){
      if(!dragging||done_) return;
      const [px,py]=pos(e); const a=Math.atan2(py-cy,px-cx);
      if(lastA!==null){
        let d=a-lastA; if(d>Math.PI)d-=Math.PI*2; if(d<-Math.PI)d+=Math.PI*2;
        if(d>0){ totalRot+=d; smoothness.push(Math.abs(d)); spinVel=Math.min(0.5, spinVel+d*0.5); }
      }
      lastA=a;
      if(totalRot>=target && !done_){ done_=true;
        const avg=smoothness.reduce((a,b)=>a+b,0)/smoothness.length;
        const variance=smoothness.reduce((a,b)=>a+(b-avg)**2,0)/smoothness.length;
        const smooth = Math.max(0,1-variance*120);
        const score=Math.round(60+smooth*40);
        Game._toast("스터 완료!");
        setTimeout(()=>{ cancelAnimationFrame(anim); done(score); },500);
      }
    }
    cv.onmousedown=e=>{dragging=true; lastA=null;}; cv.onmousemove=move;
    const up=()=>dragging=false; window.addEventListener("mouseup",up);
    cv.ontouchstart=e=>{dragging=true;lastA=null;e.preventDefault();}; cv.ontouchmove=e=>{move(e);e.preventDefault();};
    cv._cleanup=()=>window.removeEventListener("mouseup",up);
  }

  // ---------------------------------------------------------------
  // 6. 가니쉬 — 도마에서 과일 자르기 (드래그로 칼질) + 잔에 얹기
  // ---------------------------------------------------------------
  function garnish(host, done){
    const recipe=Game._recipe();
    guide(`<b>${recipe.garnish}</b>을 <span class="key">가로로 드래그</span>해 슬라이스하세요. (위→아래로 여러 번)`);
    const cv=el("canvas"); const W=560,H=320; cv.width=W;cv.height=H;
    cv.style.cssText="max-width:90%;max-height:100%;border-radius:12px";
    host.appendChild(cv);
    const ctx=cv.getContext("2d");
    const fx=W/2, fy=H/2, fr=64;
    const gmap={"레몬":"#f2d23e","라임":"#a6d84a","올리브":"#6b8e23","오렌지":"#f0902a"};
    const fc=gmap[recipe.garnish]||"#f2d23e";
    let cuts=0; const target=2; let dragStart=null;
    let slabs=[];      // 잘려나간 가로 조각 {y, offset, vx}
    let slicePulse=0;
    let blade=null;    // 칼날 궤적 표시
    function drawFruit(){
      // 아직 안 잘린 본체 (잘린 만큼 위에서 깎임)
      ctx.save(); ctx.beginPath(); ctx.arc(fx,fy,fr,0,7); ctx.clip();
      ctx.fillStyle=fc; ctx.fillRect(fx-fr,fy-fr,fr*2,fr*2);
      // 과육 결 (가로 슬라이스 강조: 가로 줄무늬)
      ctx.strokeStyle="rgba(255,255,255,.25)"; ctx.lineWidth=1.5;
      for(let yy=-fr+10; yy<fr; yy+=12){ ctx.beginPath(); ctx.moveTo(fx-fr,fy+yy); ctx.lineTo(fx+fr,fy+yy); ctx.stroke(); }
      // 속껍질 테두리
      ctx.strokeStyle="rgba(255,255,255,.4)"; ctx.lineWidth=6; ctx.beginPath(); ctx.arc(fx,fy,fr-3,0,7); ctx.stroke();
      ctx.restore();
      ctx.strokeStyle="rgba(255,255,255,.55)"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(fx,fy,fr,0,7); ctx.stroke();
    }
    function draw(){
      ctx.clearRect(0,0,W,H);
      // 도마
      ctx.fillStyle="#2a2018"; roundRect(ctx,fx-200,fy-95,400,190,16); ctx.fill();
      ctx.strokeStyle="#3a2c20"; ctx.lineWidth=2; ctx.stroke();
      // 도마 결
      ctx.strokeStyle="rgba(255,255,255,.04)"; ctx.lineWidth=1;
      for(let xx=fx-190;xx<fx+190;xx+=22){ ctx.beginPath(); ctx.moveTo(xx,fy-92); ctx.lineTo(xx,fy+92); ctx.stroke(); }
      drawFruit();
      // 잘려나가 옆으로 미끄러진 슬라이스들
      slabs.forEach(s=>{ s.offset+=s.vx; s.vx*=0.92;
        ctx.save();
        ctx.beginPath(); ctx.rect(fx-fr+s.offset, s.y-6, fr*2, 12); ctx.clip();
        ctx.fillStyle=fc; ctx.beginPath(); ctx.arc(fx+s.offset,fy,fr,0,7); ctx.fill();
        ctx.strokeStyle="rgba(255,255,255,.4)"; ctx.lineWidth=2; ctx.stroke();
        ctx.restore();
      });
      // 칼날 궤적(슥 지나가는 가로 섬광)
      if(blade){ blade.life-=0.08;
        ctx.strokeStyle=`rgba(255,255,255,${Math.max(0,blade.life)})`; ctx.lineWidth=3;
        ctx.beginPath(); ctx.moveTo(fx-fr-30,blade.y); ctx.lineTo(fx+fr+30,blade.y); ctx.stroke();
        if(blade.life<=0) blade=null;
      }
      ctx.fillStyle="#9aa3b0"; ctx.font="13px monospace"; ctx.textAlign="center";
      ctx.fillText(`가로 슬라이스 ${cuts}/${target}`, fx, fy-fr-32);
      if(cuts>=target){ ctx.fillStyle="#3fd0bc"; ctx.fillText("완성! 잔에 얹는 중...", fx, fy+fr+44); }
    }
    let anim=setInterval(draw,33); draw();
    function pos(e){ const r=cv.getBoundingClientRect(); const sx=W/r.width,sy=H/r.height;
      const cxp=(e.touches&&e.touches[0])?e.touches[0].clientX:(e.changedTouches&&e.changedTouches[0])?e.changedTouches[0].clientX:e.clientX;
      const cyp=(e.touches&&e.touches[0])?e.touches[0].clientY:(e.changedTouches&&e.changedTouches[0])?e.changedTouches[0].clientY:e.clientY;
      return [(cxp-r.left)*sx, (cyp-r.top)*sy]; }
    let done_=false;
    function endStroke(end){
      if(!dragStart||done_) return;
      const dx=end[0]-dragStart[0], dy=end[1]-dragStart[1];
      const midY=(dragStart[1]+end[1])/2;
      // 가로 판정: 가로 이동이 충분히 크고, 세로 이동은 작아야 함 (세로 드래그 거부)
      const isHorizontal = Math.abs(dx) > Math.abs(dy)*2.2 && Math.abs(dx) > fr*0.9;
      const onFruit = Math.abs(midY-fy) < fr*1.1;
      if(isHorizontal && onFruit){
        cuts++;
        blade={y:midY, life:1};
        // 가로 조각이 잘려 옆으로 미끄러짐
        slabs.push({y:midY, offset:0, vx:(dx>0?1:-1)*(6+Math.random()*3)});
        Game._toast("슥—");
        if(cuts>=target && !done_){ done_=true; draw();
          Game._setGarnish(recipe.garnish);
          setTimeout(()=>{ clearInterval(anim); done(100); },800);
        }
      } else if(!isHorizontal){ Game._toast("가로로! 옆으로 그어요"); }
      else { Game._toast("과일 위를 그어요"); }
      dragStart=null;
    }
    cv.onmousedown=e=>{ dragStart=pos(e); };
    const upHandler=e=>{ if(dragStart) endStroke(pos(e)); };
    window.addEventListener("mouseup", upHandler);
    cv.ontouchstart=e=>{ dragStart=pos(e); e.preventDefault(); };
    cv.ontouchend=e=>{ if(dragStart) endStroke(pos(e)); e.preventDefault(); };
    cv._cleanup=()=>{ window.removeEventListener("mouseup", upHandler); clearInterval(anim); };
    draw();
  }

  // ---- 헬퍼 ----
  function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function drawGlass(ctx,cx,cy,w,h,layers){
    const lx=cx-w/2, rx=cx+w/2, top=cy-h/2, bot=cy+h/2;
    ctx.save();
    // clip 잔 내부
    ctx.beginPath(); ctx.moveTo(lx+6,top); ctx.lineTo(rx-6,top); ctx.lineTo(rx-10,bot-8);
    ctx.quadraticCurveTo(rx-10,bot,rx-18,bot); ctx.lineTo(lx+18,bot); ctx.quadraticCurveTo(lx+10,bot,lx+10,bot-8); ctx.closePath();
    ctx.clip();
    const cap=5; let yc=bot;
    const fullH=bot-top-10;
    layers.forEach(l=>{ const hh=Math.min(fullH,(l.amount/cap)*fullH); ctx.fillStyle=l.color; ctx.globalAlpha=.9;
      ctx.fillRect(lx,yc-hh,w,hh); yc-=hh; });
    ctx.globalAlpha=1; ctx.restore();
    // 잔 외곽
    ctx.strokeStyle="#9fb4c4"; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(lx+6,top); ctx.lineTo(rx-6,top); ctx.lineTo(rx-10,bot-8);
    ctx.quadraticCurveTo(rx-10,bot,rx-18,bot); ctx.lineTo(lx+18,bot); ctx.quadraticCurveTo(lx+10,bot,lx+10,bot-8); ctx.closePath(); ctx.stroke();
  }

  return { glass, rim, pour, ice, craft, garnish };
})();

// =====================================================================
//  Project L.U.N.A — 칵테일 제조 게임 로직
// =====================================================================
const Game = (() => {
  // ---- 상태 ----
  let custIdx = 0;
  let customer = null;
  let chosen = null;          // 선택한 칵테일 id
  let recipe = null;          // 선택한 칵테일 데이터
  let pickedGlass = null;     // 플레이어가 고른 잔 type
  let queue = [];             // 미니게임 큐 [{key,label,ico}]
  let qIdx = 0;
  let scores = {};            // 축별 점수 {glass:100, pour:80, ...}
  let fill = [];              // 잔에 채워진 액체 레이어 [{color,amount}]
  let iceInGlass = false;
  let garnishPlaced = null;

  const $ = id => document.getElementById(id);
  const screens = ["intro","order","bench","result"];
  function show(name){
    screens.forEach(s=>$(s).classList.toggle("active", s===name));
  }
  function toast(msg){
    const t=$("toast"); t.textContent=msg; t.classList.add("show");
    clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1600);
  }

  // 단계 도트
  function renderDots(elId, total, cur){
    const el=$(elId); el.innerHTML="";
    for(let i=0;i<total;i++){
      const d=document.createElement("div");
      d.className="dot"+(i<cur?" done":i===cur?" on":"");
      el.appendChild(d);
    }
  }

  // =====================================================================
  //  잔 렌더링 (SVG) — 타입별 모양 + 액체 레이어 + 얼음 + 가니쉬
  // =====================================================================
  function glassSVG(type, opts={}){
    const {layers=[], ice=false, garnish=null, rim=null, w=180, h=240, scale=1} = opts;
    // 잔 형태별 경로 (병 내부 영역을 polygon으로)
    // 좌표계: 0..100 x, 0..130 y
    const shapes = {
      highball: {body:"M30,18 L30,120 Q30,126 36,126 L64,126 Q70,126 70,120 L70,18 Z", liqTop:20, liqBot:124, lx:30, rx:70, rimY:16, rimX:[28,72]},
      martini:  {body:"M14,16 L50,74 L86,16 Z M50,74 L50,118 M36,122 L64,122", liqTop:20, liqBot:72, lx:16, rx:84, taper:true, rimY:16, rimX:[14,86]},
      coupe:    {body:"M20,22 Q20,60 50,64 Q80,60 80,22 M50,64 L50,116 M34,120 L66,120", liqTop:26, liqBot:62, lx:22, rx:78, bowl:true, rimY:22, rimX:[20,80]},
      rocks:    {body:"M26,40 L28,120 Q28,126 34,126 L66,126 Q72,126 72,120 L74,40 Z", liqTop:44, liqBot:124, lx:28, rx:72, rimY:40, rimX:[26,74]},
    };
    const s = shapes[type] || shapes.highball;
    const vbW=100, vbH=140;
    let liquidEls = "";
    // 액체 레이어 — 아래부터 쌓기
    const totalOz = layers.reduce((a,l)=>a+l.amount,0);
    const capacity = type==="martini"||type==="coupe" ? 3 : 5;
    let yCursor = s.liqBot;
    const fullH = s.liqBot - s.liqTop;
    layers.forEach((l)=>{
      const hh = Math.min(fullH, (l.amount/capacity)*fullH);
      const yTop = yCursor - hh;
      // 잔 폭 보간 (taper/bowl이면 위로 갈수록 넓음)
      function widthAt(y){
        const t = (s.liqBot - y)/fullH; // 0 bottom .. 1 top
        if(s.taper){ // martini cone: 바닥 좁고 위 넓음
          const lx = 50 - (50-s.lx)*((y-s.rimY)/(s.liqBot-s.rimY));
          const rx = 50 + (s.rx-50)*((y-s.rimY)/(s.liqBot-s.rimY));
          return [lx,rx];
        }
        if(s.bowl){
          const k = Math.sin(((y-s.rimY)/(s.liqBot-s.rimY))*Math.PI*0.5);
          return [50-(50-s.lx)*(0.5+0.5*k), 50+(s.rx-50)*(0.5+0.5*k)];
        }
        return [s.lx, s.rx];
      }
      const [blx,brx]=widthAt(yCursor), [tlx,trx]=widthAt(yTop);
      liquidEls += `<path d="M${blx},${yCursor} L${brx},${yCursor} L${trx},${yTop} L${tlx},${yTop} Z" fill="${l.color}" opacity="0.92"/>`;
      // 표면 하이라이트
      liquidEls += `<ellipse cx="50" cy="${yTop}" rx="${(trx-tlx)/2}" ry="1.6" fill="#fff" opacity="0.14"/>`;
      yCursor = yTop;
    });
    // 얼음
    let iceEls="";
    if(ice){
      const cx=50, cy=s.liqBot-fullH*0.5;
      iceEls = `<g opacity="0.5">
        <rect x="${cx-13}" y="${cy-12}" width="16" height="16" rx="3" fill="#cdeefa" opacity="0.5" transform="rotate(18 ${cx} ${cy})"/>
        <rect x="${cx-2}" y="${cy-4}" width="15" height="15" rx="3" fill="#e3f6ff" opacity="0.45" transform="rotate(-12 ${cx} ${cy})"/>
      </g>`;
    }
    // 가니쉬
    let garnishEls="";
    if(garnish){
      const gx=s.rimX[1]-6, gy=s.rimY+2;
      const gmap={"레몬":"#f2d23e","라임":"#a6d84a","올리브":"#6b8e23","오렌지":"#f0902a"};
      const gc=gmap[garnish]||"#f2d23e";
      garnishEls=`<circle cx="${gx}" cy="${gy}" r="7" fill="${gc}" stroke="#fff" stroke-width="0.8" opacity="0.95"/>
        <path d="M${gx},${gy} L${gx},${gy-7}" stroke="#fff" stroke-width="0.6" opacity="0.5"/>`;
    }
    // 림(소금/설탕)
    let rimEls="";
    if(rim){
      const rc = rim==="소금"?"#eef2f5":"#f0e2c8";
      rimEls=`<path d="M${s.rimX[0]},${s.rimY} Q50,${s.rimY-4} ${s.rimX[1]},${s.rimY}" stroke="${rc}" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.85" stroke-dasharray="1.5 1.5"/>`;
    }
    return `<svg class="glassbox" width="${w*scale}" height="${h*scale}" viewBox="0 0 ${vbW} ${vbH}" xmlns="http://www.w3.org/2000/svg">
      <defs><clipPath id="gclip_${type}"><path d="${s.body.split('M').slice(0,2).join('M')}"/></clipPath></defs>
      <g clip-path="url(#gclip_${type})">${liquidEls}${iceEls}</g>
      <path d="${s.body}" fill="none" stroke="#9fb4c4" stroke-width="2.2" stroke-linejoin="round" opacity="0.92"/>
      <path d="${s.body}" fill="url(#gg_${type})" opacity="0.06"/>
      ${rimEls}${garnishEls}
    </svg>`;
  }

  // =====================================================================
  //  흐름: 영업 시작 → 손님
  // =====================================================================
  function startShift(){ custIdx=0; nextCustomer(true); }

  function nextCustomer(first){
    if(!first) custIdx++;
    if(custIdx>=CUSTOMERS.length){ return endShift(); }
    customer = CUSTOMERS[custIdx];
    chosen=null; recipe=null; pickedGlass=null; queue=[]; qIdx=0;
    scores={}; fill=[]; iceInGlass=false; garnishPlaced=null;
    show("order");
    renderOrder();
  }

  function endShift(){
    show("intro");
    $("intro").querySelector(".wrap").innerHTML =
      `<div class="eyebrow">영업 종료</div>
       <h1 class="n" style="color:var(--teal)">수고했어요</h1>
       <p>오늘 손님 ${CUSTOMERS.length}명을 모두 응대했습니다.<br>이게 새 제조 시스템의 한 사이클이에요.</p>
       <div class="start"><button class="btn" onclick="location.reload()">다시 플레이</button></div>`;
  }

  // =====================================================================
  //  주문 화면
  // =====================================================================
  function renderOrder(){
    renderDots("dots1", 4, 0);
    $("custFace").textContent = customer.face;
    $("custSprite").style.setProperty("--accent", customer.accent);
    $("custName").textContent = customer.name;
    // 타이핑 효과
    typeLine($("custLine"), customer.order);
    // 메뉴
    const ml=$("menuList"); ml.innerHTML="";
    Object.entries(COCKTAILS).forEach(([id,c])=>{
      const it=document.createElement("div");
      it.className="menu-item"; it.dataset.id=id;
      it.innerHTML=`<div class="mi-ico">${c.ico}</div><div><div class="mi-name">${c.name}</div><div class="mi-desc">${c.desc}</div></div>`;
      it.onclick=()=>selectMenu(id);
      ml.appendChild(it);
    });
    $("recipeRows").innerHTML=`<div class="rrow"><span class="locked">메뉴에서 칵테일을 골라보세요</span></div>`;
    $("confirmRecipe").disabled=true;
  }

  function typeLine(el, text){
    el.innerHTML=""; let i=0;
    clearInterval(el._t);
    el._t=setInterval(()=>{
      if(i>=text.length){ clearInterval(el._t); return; }
      el.innerHTML = text.slice(0,i+1)+'<span class="cur">▏</span>';
      i++;
    }, 28);
  }

  function selectMenu(id){
    chosen=id; recipe=COCKTAILS[id];
    document.querySelectorAll(".menu-item").forEach(m=>m.classList.toggle("sel", m.dataset.id===id));
    // 레시피 표시
    const rows=[
      ["제조 방식", METHOD_KO[recipe.method]],
      ["정답 잔", GLASS_KO[recipe.glassType]+"잔"],
      ["재료", recipe.pours.map(p=>p.name).join(", ")],
      ...(recipe.rim?[["림", recipe.rim]]:[]),
      ...(recipe.ice?[["얼음", "있음"]]:[]),
      ...(recipe.garnish?[["가니쉬", recipe.garnish]]:[]),
    ];
    $("recipeRows").innerHTML = rows.map(([k,v])=>`<div class="rrow"><span class="rk">${k}</span><span class="rv">${v}</span></div>`).join("");
    $("confirmRecipe").disabled=false;
  }

  function confirmRecipe(){
    // 미니게임 큐 구성 — 레시피에 따라 동적
    queue=[];
    queue.push({key:"glass", label:"잔 선택", ico:"🥃"});
    if(recipe.rim) queue.push({key:"rim", label:"림 — "+recipe.rim, ico:"🧂"});
    queue.push({key:"pour", label:"따르기", ico:"🍶"});
    if(recipe.ice) queue.push({key:"ice", label:"얼음", ico:"🧊"});
    if(recipe.method!=="none") queue.push({key:"craft", label:"제조 — "+METHOD_KO[recipe.method], ico: recipe.method==="shake"?"🍸":"🥄"});
    if(recipe.garnish) queue.push({key:"garnish", label:"가니쉬 — "+recipe.garnish, ico:"🍋"});
    qIdx=0;
    show("bench");
    runMinigame();
  }

  // =====================================================================
  //  미니게임 호스트
  // =====================================================================
  function renderMgProgress(){
    const el=$("mgProgress"); el.innerHTML="";
    queue.forEach((q,i)=>{
      const p=document.createElement("div");
      p.className="mg-pip"+(i<qIdx?" done":i===qIdx?" on":"");
      p.innerHTML=`<span class="pico">${q.ico}</span><span>${q.label}</span>`;
      el.appendChild(p);
    });
  }

  function runMinigame(){
    renderDots("dots2", 4, qIdx===0?1:2);
    renderMgProgress();
    const mg=queue[qIdx];
    $("benchStepName").textContent = mg.label;
    $("benchNext").classList.add("hidden");
    $("skipBtn").classList.add("hidden");
    const host=$("benchMain"); host.innerHTML="";
    // 디스패치
    const fn = MG[mg.key];
    if(fn) fn(host, (score)=>finishMinigame(mg.key, score));
    else finishMinigame(mg.key, 100);
  }

  function finishMinigame(key, score){
    scores[key]=Math.round(score);
    // 점수 토스트
    const lab = score>=90?"PERFECT":score>=70?"GOOD":score>=50?"OK":"MISS";
    const col = score>=90?"var(--teal)":score>=70?"var(--green)":score>=50?"var(--amber)":"var(--rose)";
    spawnScore(lab, col);
    $("benchGuide").innerHTML = `<b>${queue[qIdx].label}</b> 완료 — ${Math.round(score)}점`;
    $("benchNext").classList.remove("hidden");
    $("benchNext").textContent = (qIdx>=queue.length-1) ? "제공하기 ▸" : "다음 ▸";
  }

  function spawnScore(text, color){
    const host=$("benchMain");
    const p=document.createElement("div");
    p.className="score-pop"; p.textContent=text; p.style.color=color;
    p.style.left="50%"; p.style.top="30%"; p.style.transform="translateX(-50%)";
    host.appendChild(p);
    setTimeout(()=>p.remove(),1000);
  }

  function nextMinigame(forceScore){
    if(forceScore!==undefined && forceScore===0){
      // 건너뛰기 = 해당 미니게임 0점 아님, 그냥 기본 60
      scores[queue[qIdx].key]=60;
    }
    qIdx++;
    if(qIdx>=queue.length){ return finishCraft(); }
    runMinigame();
  }

  // =====================================================================
  //  판정 종합 → 결과
  // =====================================================================
  function finishCraft(){
    // 게이트: 주문 일치
    const isMiss = chosen !== customer.want;
    // 평균 점수 (게이트 무관하게 계산은 해둠)
    const keys = Object.keys(scores);
    const avg = keys.length ? Math.round(keys.reduce((a,k)=>a+scores[k],0)/keys.length) : 0;
    let grade;
    if(isMiss) grade="miss";
    else grade = avg>=90?"perfect": avg>=70?"good": avg>=50?"normal":"bad";

    // 실패 축 (override 후보)
    const failAxes = keys.filter(k=>scores[k]<50 && REACTIONS[customer.id].axis[k]);
    const high = customer.aff>=50;
    const tone = high?"high":"low";

    let react, via;
    const rset = REACTIONS[customer.id];
    if(isMiss){ react=rset.miss; via="게이트: 주문 불일치"; }
    else if(failAxes.length===1){ react=rset.axis[failAxes[0]]; via="축 실패: "+failAxes[0]; }
    else { react=rset.grade[grade]; via="종합 등급: "+grade; }

    renderResult(grade, avg, react, tone, via, isMiss, failAxes);
  }

  function renderResult(grade, avg, react, tone, via, isMiss, failAxes){
    const high = (tone==="high");
    renderDots("dots2",4,3);
    show("result");
    // 잔 그림
    $("resGlass").innerHTML = glassSVG(pickedGlass||recipe.glassType, {
      layers: fill.length?fill:recipe.pours.map(p=>({color:p.color,amount:p.oz})),
      ice: iceInGlass||recipe.ice, garnish: garnishPlaced, rim: recipe.rim, scale:0.95
    });
    const gradeText = isMiss?"MISS":grade.toUpperCase();
    const g=$("resGrade"); g.textContent=gradeText; g.className="grade-big "+grade;
    $("resAvg").textContent = isMiss? "주문과 다른 술 — 미니게임 점수 무시됨" : `미니게임 평균 ${avg}점`;
    // breakdown
    const bd=$("resBreakdown"); bd.innerHTML="";
    Object.entries(scores).forEach(([k,v])=>{
      const cls=v>=70?"hi":v>=50?"mid":"lo";
      const km={glass:"잔",rim:"림",pour:"따르기",ice:"얼음",craft:"제조",garnish:"가니쉬"}[k]||k;
      bd.innerHTML+=`<div class="bd"><div class="bd-k">${km}</div><div class="bd-v ${cls}">${v}</div></div>`;
    });
    // 반응
    $("resAva").textContent = react.expr||customer.face;
    $("resReactNm").textContent = customer.name;
    $("resReactLine").textContent = react[tone];
    const aff = isMiss?-4:(grade==="perfect"?+4:grade==="good"?+2:grade==="bad"?-3:0);
    $("resReactMeta").innerHTML =
      `<span class="r-chip" style="border-color:var(--violet);color:var(--violet)">${via}</span>`+
      `<span class="r-chip">호감 ${aff>0?'+':''}${aff}</span>`+
      `<span class="r-chip">${high?'호감 높음 · 부드럽게':'호감 낮음 · 날카롭게'}</span>`+
      (recipe.method!=='none'?'':`<span class="r-chip">제조 없는 술</span>`);
  }

  return { startShift, confirmRecipe, nextMinigame, nextCustomer,
           _glassSVG:glassSVG, _state:()=>({recipe,pickedGlass,fill,scores,queue,qIdx}),
           _setGlass:(g)=>{pickedGlass=g}, _setFill:(f)=>{fill=f}, _setIce:(b)=>{iceInGlass=b},
           _setGarnish:(g)=>{garnishPlaced=g}, _recipe:()=>recipe, _toast:toast };
})();

</script>
