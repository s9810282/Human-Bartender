<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>랜덤 손님 파츠 조합 시뮬레이터 (남자)</title>
<style>
  :root{
    --bg:#08090d; --panel:#111319; --panel-2:#171a22; --line:#262b38;
    --gold:#f2c14e; --text:#e9ebf2; --text-dim:#8890a4;
    --good:#38d47a; --bad:#ff5c6c; --cyan:#7ff0ea; --purple:#8f86e8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    min-height:100vh; display:flex; justify-content:center;
    padding:24px 16px 60px;
  }
  .app{width:100%;max-width:1080px;}
  h1{font-size:19px;font-weight:700;margin:0 0 4px;letter-spacing:-0.01em;}
  .sub{color:var(--text-dim);font-size:13px;margin:0 0 16px;line-height:1.7;}
  .sub b{color:var(--gold);font-weight:600;}

  .layout{display:flex; gap:16px; align-items:flex-start;}

  /* ── 좌: 미리보기 ── */
  .preview{
    flex:0 0 400px; position:sticky; top:16px;
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:16px; display:flex; flex-direction:column; gap:12px;
  }
  .stageWrap{
    background:
      radial-gradient(ellipse 70% 55% at 50% 40%, #182030 0%, #10141c 75%),
      #10141c;
    border:1px solid var(--line); border-radius:10px;
    display:flex; justify-content:center; padding:10px 0 0;
    overflow:hidden;
  }
  #stage{image-rendering:pixelated; width:332px; height:388px;}
  .btnRow{display:flex; gap:8px;}
  button{
    flex:1; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:10px 0; font-size:14px; font-weight:700;
    font-family:inherit; cursor:pointer;
  }
  button:hover{border-color:var(--cyan); color:var(--cyan);}
  button.primary{background:var(--gold); border-color:var(--gold); color:#1b1405;}
  button.primary:hover{filter:brightness(1.08); color:#1b1405;}
  .combo{
    background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
    padding:10px 12px; font-size:12px; line-height:1.8; color:var(--text-dim);
  }
  .combo b{color:var(--text); font-weight:600;}
  .combo .cat{color:var(--purple); font-weight:700;}

  /* ── 우: 파츠 목록 ── */
  .parts{flex:1; display:flex; flex-direction:column; gap:12px; min-width:0;}
  .cat-card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:12px 14px 14px;
  }
  .cat-head{
    display:flex; align-items:baseline; gap:8px; margin-bottom:10px;
  }
  .cat-name{font-size:14px; font-weight:800;}
  .cat-count{font-size:11px; color:var(--text-dim);}
  .cat-layer{margin-left:auto; font-size:11px; color:var(--purple); font-weight:700;}
  .thumbs{display:flex; flex-wrap:wrap; gap:8px;}
  .thumb{
    position:relative; border:2px solid var(--line); border-radius:8px;
    background:#10141c; cursor:pointer; padding:4px 4px 18px;
    transition:border-color 120ms, box-shadow 120ms;
  }
  .thumb:hover{border-color:var(--cyan);}
  .thumb.sel{border-color:var(--gold); box-shadow:0 0 10px rgba(242,193,78,.25);}
  .thumb canvas{display:block; image-rendering:pixelated;}
  .thumb .tname{
    position:absolute; left:0; right:0; bottom:3px; text-align:center;
    font-size:10px; color:var(--text-dim); white-space:nowrap;
  }
  .thumb.sel .tname{color:var(--gold);}
  .thumb.none-item{display:flex; align-items:center; justify-content:center; min-width:72px; min-height:72px;}
  .thumb.none-item span{font-size:12px; color:var(--text-dim); font-weight:700; margin-bottom:14px;}

  @media (max-width: 860px){
    .layout{flex-direction:column;}
    .preview{position:static; flex:none; width:100%;}
  }
</style>
</head>
<body>
<div class="app">
  <h1>랜덤 손님 파츠 조합 시뮬레이터 — 남자</h1>
  <p class="sub">
    전 파츠가 같은 332×388 캔버스에 정렬돼 있어 좌표 보정 없이 레이어만 쌓는다.
    레이어 순서: <b>바디 → 의상 → 액세서리 → 눈썹 → 눈 → 입 → 헤어</b> ·
    조합 <b id="comboTotal">-</b>종 · 오른쪽 파츠를 클릭하면 바로 갈아입는다.
  </p>

  <div class="layout">
    <div class="preview">
      <div class="stageWrap"><canvas id="stage" width="332" height="388"></canvas></div>
      <div class="btnRow">
        <button class="primary" id="btnRandom">🎲 랜덤 생성</button>
        <button id="btnSave">PNG 저장</button>
      </div>
      <div class="combo" id="comboReadout"></div>
    </div>
    <div class="parts" id="partsPanel"></div>
  </div>
</div>

const CATS = [
  {key:"body",    name:"바디",     layer:1, items:["body"], fixed:true},
  {key:"shirt",   name:"의상",     layer:2, items:["Shirt_1","Shirt_1(2)","Shirt_1(3)","Shirt_1(4)","Shirt_1(5)","Shirt_2","Shirt_3","Shirt_3(2)"]},
  {key:"acc",     name:"액세서리", layer:3, items:[null,"Acc_1","Acc_2","Acc_3"],
   labels:{"Acc_1":"팔목 밴드","Acc_2":"어깨 재킷","Acc_3":"목걸이"}},
  {key:"eyebrow", name:"눈썹",     layer:4, items:["Eyebrow_1","Eyebrow_2","Eyebrow_3"]},
  {key:"eye",     name:"눈",       layer:5, items:["Eye_1","Eye_2","Eye_3"]},
  {key:"mouth",   name:"입",       layer:6, items:["mouth_1","mouth_2","mouth_3"]},
  {key:"hair",    name:"헤어",     layer:7, items:["Hair_1","Hair_2"]},
];

const $ = id => document.getElementById(id);
const stage = $("stage");
const ctx = stage.getContext("2d");
const images = {};          // name -> Image
const state = {};           // catKey -> item name | null

/* ── 이미지 로드 ── */
let loaded = 0, totalImgs = Object.keys(PARTS).length;
for (const [name, url] of Object.entries(PARTS)){
  const im = new Image();
  im.onload = () => { if (++loaded === totalImgs) init(); };
  im.src = url;
  images[name] = im;
}

/* ── 알파 바운딩박스 (썸네일 크롭용) ── */
function bboxOf(im){
  const c = document.createElement("canvas");
  c.width = im.width; c.height = im.height;
  const g = c.getContext("2d");
  g.drawImage(im, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height).data;
  let x0 = c.width, y0 = c.height, x1 = 0, y1 = 0;
  for (let y = 0; y < c.height; y++)
    for (let x = 0; x < c.width; x++)
      if (d[(y * c.width + x) * 4 + 3] > 8){
        if (x < x0) x0 = x; if (x > x1) x1 = x;
        if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
  return {x: x0, y: y0, w: Math.max(1, x1 - x0 + 1), h: Math.max(1, y1 - y0 + 1)};
}

/* ── 렌더 ── */
function draw(){
  ctx.clearRect(0, 0, stage.width, stage.height);
  ctx.imageSmoothingEnabled = false;
  CATS.forEach(cat => {
    const sel = state[cat.key];
    if (sel && images[sel]) ctx.drawImage(images[sel], 0, 0);
  });
  updateReadout();
}
function updateReadout(){
  const parts = CATS.filter(c => !c.fixed).map(c => {
    const sel = state[c.key];
    const label = sel === null ? "없음" : sel;
    return `<span class="cat">${c.name}</span> <b>${label}</b>`;
  });
  $("comboReadout").innerHTML = "현재 조합 — " + parts.join(" · ");
  document.querySelectorAll(".thumb").forEach(t => {
    t.classList.toggle("sel", String(state[t.dataset.cat]) === t.dataset.item);
  });
}

/* ── 랜덤 ── */
function randomize(){
  CATS.forEach(cat => {
    if (cat.fixed){ state[cat.key] = cat.items[0]; return; }
    state[cat.key] = cat.items[Math.floor(Math.random() * cat.items.length)];
  });
  draw();
}

/* ── UI 구성 ── */
function init(){
  const panel = $("partsPanel");
  let total = 1;
  CATS.forEach(cat => {
    if (!cat.fixed) total *= cat.items.length;
    const card = document.createElement("div");
    card.className = "cat-card";
    const head = document.createElement("div");
    head.className = "cat-head";
    head.innerHTML = `<span class="cat-name">${cat.name}</span>
      <span class="cat-count">${cat.items.length}종${cat.fixed ? " · 고정" : ""}</span>
      <span class="cat-layer">레이어 ${cat.layer}</span>`;
    card.appendChild(head);
    const thumbs = document.createElement("div");
    thumbs.className = "thumbs";
    cat.items.forEach(item => {
      const t = document.createElement("div");
      t.className = "thumb";
      t.dataset.cat = cat.key;
      t.dataset.item = String(item);
      if (item === null){
        t.classList.add("none-item");
        t.innerHTML = "<span>없음</span>";
      } else {
        const im = images[item];
        const bb = bboxOf(im);
        const tc = document.createElement("canvas");
        const scale = Math.min(64 / bb.w, 64 / bb.h, 2);
        tc.width = Math.max(24, Math.round(bb.w * scale));
        tc.height = Math.max(24, Math.round(bb.h * scale));
        const g = tc.getContext("2d");
        g.imageSmoothingEnabled = false;
        g.drawImage(im, bb.x, bb.y, bb.w, bb.h, 0, 0, tc.width, tc.height);
        t.appendChild(tc);
        const nm = document.createElement("div");
        nm.className = "tname";
        nm.textContent = (cat.labels && cat.labels[item]) ? cat.labels[item] : item;
        t.appendChild(nm);
      }
      t.addEventListener("click", () => {
        if (cat.fixed) return;
        state[cat.key] = item;
        draw();
      });
      thumbs.appendChild(t);
    });
    card.appendChild(thumbs);
    panel.appendChild(card);
  });
  $("comboTotal").textContent = total.toLocaleString();
  randomize();
}

$("btnRandom").addEventListener("click", randomize);
$("btnSave").addEventListener("click", () => {
  const a = document.createElement("a");
  a.download = "guest_" + Date.now() + ".png";
  a.href = stage.toDataURL("image/png");
  a.click();
});
window.__dbg = {state, randomize, draw, CATS};
</script>
