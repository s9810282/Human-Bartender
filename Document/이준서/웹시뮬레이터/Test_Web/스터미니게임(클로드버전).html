<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스터 기믹 — 사선 분할 + 콤보 판정</title>
<style>
  :root{
    --bg:#08090d; --panel:#111319; --panel-2:#171a22; --line:#262b38;
    --blue:#0a4bf5; --blue-soft:#3d6bff; --gold:#f2c14e;
    --text:#e9ebf2; --text-dim:#8890a4;
    --good:#38d47a; --bad:#ff5c6c; --cyan:#7ff0ea; --purple:#8f86e8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    min-height:100vh; display:flex; justify-content:center;
    padding:24px 16px 60px;
  }
  .app{width:100%;max-width:980px;}
  h1{font-size:19px;font-weight:700;margin:0 0 4px;letter-spacing:-0.01em;}
  .sub{color:var(--text-dim);font-size:13px;margin:0 0 16px;line-height:1.7;}
  .sub b{color:var(--gold);font-weight:600;}

  .stage{
    position:relative; width:100%; aspect-ratio:16/9;
    border:1px solid var(--line); border-radius:14px; overflow:hidden;
    background:#10141c; user-select:none;
  }
  .stage svg.main{position:absolute; inset:0; width:100%; height:100%;}
  .stage.wrong svg.main{animation:sceneShake 260ms ease-in-out;}
  @keyframes sceneShake{
    0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);}
    55%{transform:translateX(4px);} 80%{transform:translateX(-2px);}
  }
  .judge{
    position:absolute; left:68%; top:42%; transform:translate(-50%,-50%) scale(0.8);
    font-size:32px; font-weight:800; opacity:0; pointer-events:none; z-index:5;
    text-shadow:0 2px 14px rgba(0,0,0,.7);
  }
  .judge.pop{animation:judgePop 550ms ease-out;}
  @keyframes judgePop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(0.7);}
    18%{opacity:1;transform:translate(-50%,-50%) scale(1.1);}
    70%{opacity:1;}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1);}
  }
  .finishBtn{
    position:absolute; right:2.4%; bottom:4.5%; z-index:6;
    background:var(--panel-2); border:1px solid var(--line); color:var(--text-dim);
    border-radius:10px; padding:10px 22px; font-size:15px; font-weight:700;
    font-family:inherit; cursor:not-allowed; opacity:.45;
  }
  .finishBtn.ready{
    cursor:pointer; opacity:1; color:#1b1405; background:var(--gold);
    border-color:var(--gold); animation:btnPulse 1.1s ease-in-out infinite;
  }
  @keyframes btnPulse{
    0%,100%{box-shadow:0 0 0 0 rgba(242,193,78,.45);}
    50%{box-shadow:0 0 0 9px rgba(242,193,78,0);}
  }
  .result{
    position:absolute; inset:0; z-index:8; display:none;
    background:rgba(6,8,12,.82); backdrop-filter:blur(2px);
    flex-direction:column; align-items:center; justify-content:center; gap:8px;
  }
  .result.show{display:flex;}
  .result .grade{font-size:52px;font-weight:800;letter-spacing:.02em;}
  .result .pct{font-size:20px;color:var(--text);}
  .result .detail{font-size:14px;color:var(--text-dim);line-height:1.8;text-align:center;}
  .result button{
    margin-top:10px; background:var(--panel-2); border:1px solid var(--line);
    color:var(--text); border-radius:8px; padding:9px 20px; font-size:14px;
    font-family:inherit; cursor:pointer;
  }
  .keyhint{
    position:absolute; left:2%; bottom:3.5%; font-size:12px; color:var(--text-dim); z-index:4;
  }
  .kbd{
    display:inline-block; background:rgba(23,26,34,.85); border:1px solid var(--line);
    border-bottom-width:2px; border-radius:6px; padding:2px 7px;
    font-size:11px; font-weight:700; color:var(--text); margin:0 2px;
  }
  .panel{
    background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:14px 20px 12px; margin-top:14px;
  }
  .row{display:flex;gap:10px;align-items:center;margin-bottom:6px;}
  .slider-label{font-size:13px;color:var(--text-dim);min-width:110px;}
  input[type=range]{flex:1;accent-color:var(--blue);min-width:120px;}
  .slider-value{font-size:13px;color:var(--gold);min-width:64px;text-align:right;font-variant-numeric:tabular-nums;}
</style>
</head>
<body>
<div class="app">
  <h1>스터 기믹 — 사선 분할 + 콤보 판정</h1>
  <p class="sub">
    한 바퀴 = <b>시계 방향 4입력</b>, 바퀴마다 제한 <b id="subLimit">3.0초</b>.
    틀리지 않고 시간 안에 한 바퀴를 저으면 <b>1콤보</b> — 목표 바퀴를 다 저으면 종료 버튼이 켜지고,
    완성도(콤보 ÷ 목표 바퀴)로 등급이 정해진다.
  </p>

  <div class="stage" id="stage">
    <svg class="main" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="leftClip"><polygon points="0,0 300,0 400,540 0,540"/></clipPath>
      </defs>

      <!-- ── 좌: 캐릭터 연출 (사선 클립) ── -->
      <g clip-path="url(#leftClip)">
        <rect x="0" y="0" width="420" height="540" fill="#151a24"/>
        <line x1="0" y1="70" x2="420" y2="70" stroke="#1d2430" stroke-width="2"/>
        <g opacity="0.5">
          <rect x="20" y="26" width="14" height="44" rx="3" fill="#232d42"/>
          <rect x="46" y="16" width="12" height="54" rx="3" fill="#2a3550"/>
          <rect x="330" y="22" width="14" height="48" rx="3" fill="#2a3550"/>
          <rect x="358" y="30" width="12" height="40" rx="3" fill="#232d42"/>
        </g>

        <!-- 하관만 보이는 얼굴 -->
        <path d="M150 0 Q148 44 200 52 Q252 44 250 0 Z" fill="#e8c49a"/>
        <path d="M150 0 Q146 30 158 44 L146 0 Z" fill="#2b2320"/>
        <path d="M250 0 Q254 30 242 44 L254 0 Z" fill="#2b2320"/>
        <path d="M186 30 Q200 37 214 30" fill="none" stroke="#b98b62" stroke-width="2.4" stroke-linecap="round"/>
        <rect x="182" y="46" width="36" height="34" fill="#e8c49a"/>

        <!-- 몸통: 셔츠 + 조끼 + 보타이 -->
        <path d="M84 130 Q100 84 168 76 L232 76 Q300 84 316 130 L316 330 L84 330 Z" fill="#dfe3ea"/>
        <path d="M140 86 Q200 118 260 86 L268 330 L132 330 Z" fill="#232d42"/>
        <path d="M184 78 L200 98 L216 78 L200 74 Z" fill="#f4f6f9"/>
        <path d="M186 100 L214 100 L207 113 L193 113 Z" fill="#1b2233"/>
        <ellipse cx="200" cy="102" rx="8" ry="4.5" fill="#1b2233"/>

        <!-- 믹싱 글라스 (크게) -->
        <g id="glassSide">
          <path d="M132 268 L288 268 L278 460 L142 460 Z" fill="rgba(159,197,216,0.10)" stroke="#9fc5d8" stroke-width="2.5"/>
          <path d="M138 300 L282 300 L273 452 L147 452 Z" fill="rgba(230,235,240,0.15)"/>
          <ellipse id="swirlSide" cx="210" cy="303" rx="62" ry="8" fill="none" stroke="#cfe0ea" stroke-width="1.6" opacity="0.5"/>
          <g id="iceSide"></g>
        </g>

        <!-- 왼팔: 잔을 잡는다 -->
        <path d="M96 140 Q52 240 118 292" fill="none" stroke="#dfe3ea" stroke-width="24" stroke-linecap="round"/>
        <circle cx="126" cy="296" r="13" fill="#e8c49a"/>

        <!-- 오른팔 + 바 스푼 -->
        <path id="armR" d="M306 138 Q356 176 219 204" fill="none" stroke="#dfe3ea" stroke-width="24" stroke-linecap="round"/>
        <line id="spoonShaft" x1="210" y1="134" x2="210" y2="438" stroke="#cbd3e8" stroke-width="4.5" stroke-linecap="round"/>
        <ellipse id="spoonHead" cx="210" cy="438" rx="10" ry="6" fill="#cbd3e8"/>
        <circle id="handR" cx="210" cy="206" r="13.5" fill="#e8c49a"/>

        <rect x="0" y="460" width="420" height="80" fill="#232d42"/>
        <line x1="0" y1="460" x2="420" y2="460" stroke="#2e3a50" stroke-width="2"/>
      </g>

      <!-- ── 우: 기믹 영역 ── -->
      <polygon points="300,0 960,0 960,540 400,540" fill="#10141c"/>

      <!-- HUD 3칸 -->
      <g font-weight="700">
        <rect x="452" y="18" width="150" height="34" rx="8" fill="#171a22" stroke="#262b38"/>
        <text x="466" y="40" font-size="13" fill="#8890a4">시간</text>
        <text id="hudTime" x="588" y="40" font-size="14" fill="#f2c14e" text-anchor="end">0.0s</text>
        <rect x="616" y="18" width="150" height="34" rx="8" fill="#171a22" stroke="#262b38"/>
        <text x="630" y="40" font-size="13" fill="#8890a4">바퀴</text>
        <text id="hudLap" x="752" y="40" font-size="14" fill="#f2c14e" text-anchor="end">0 / 10</text>
        <rect x="780" y="18" width="150" height="34" rx="8" fill="#171a22" stroke="#262b38"/>
        <text x="794" y="40" font-size="13" fill="#8890a4">콤보</text>
        <text id="hudCombo" x="916" y="40" font-size="14" fill="#38d47a" text-anchor="end">0</text>
      </g>

      <!-- 탑다운 잔 + 랩 타이머 링 -->
      <g id="gimmick">
        <circle cx="660" cy="280" r="118" fill="none" stroke="#262b38" stroke-width="5"/>
        <circle id="lapRing" cx="660" cy="280" r="118" fill="none" stroke="#f2c14e" stroke-width="5"
                stroke-linecap="round" stroke-dasharray="741 741" transform="rotate(-90 660 280)"/>
        <circle cx="660" cy="280" r="100" fill="rgba(159,197,216,0.07)" stroke="#9fc5d8" stroke-width="3"/>
        <circle cx="660" cy="280" r="91" fill="rgba(230,235,240,0.09)"/>
        <path id="trail" d="" fill="none" stroke="#8f86e8" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
        <g id="iceTop"></g>
        <g id="spoonHand">
          <line x1="660" y1="280" x2="660" y2="212" stroke="#cbd3e8" stroke-width="4.5" stroke-linecap="round"/>
          <ellipse cx="660" cy="204" rx="7" ry="11" fill="#cbd3e8"/>
          <circle cx="660" cy="280" r="6" fill="#cbd3e8"/>
          <circle cx="660" cy="280" r="2.6" fill="#171a22"/>
        </g>
        <g id="badges" font-weight="800"></g>
      </g>
      <text id="nextKeyTxt" x="660" y="478" font-size="14" fill="#8890a4" text-anchor="middle">다음 키 <tspan fill="#7ff0ea" font-weight="800">D</tspan></text>

      <!-- 사선 게이지 (\ 방향, 아래에서 위로 차오름) -->
      <g id="gaugeG">
        <line x1="392" y1="512" x2="310" y2="42" stroke="#0a0c11" stroke-width="20" stroke-linecap="round"/>
        <line id="gaugeBg" x1="392" y1="512" x2="310" y2="42" stroke="#232d42" stroke-width="14" stroke-linecap="round"/>
        <g id="gaugeSegs"></g>
        <g id="gaugeTicks"></g>
      </g>
    </svg>

    <div class="judge" id="judge">COMBO</div>
    <button class="finishBtn" id="finishBtn">종료</button>
    <div class="keyhint"><span class="kbd">W</span><span class="kbd">A</span><span class="kbd">S</span><span class="kbd">D</span> 또는 화살표 · <span class="kbd">R</span> 다시</div>

    <div class="result" id="result">
      <div class="grade" id="rGrade">GOOD</div>
      <div class="pct" id="rPct">완성도 70%</div>
      <div class="detail" id="rDetail"></div>
      <button id="rRetry">다시 (R)</button>
    </div>
  </div>

  <div class="panel">
    <div class="row">
      <span class="slider-label">목표 바퀴</span>
      <input type="range" id="lapSlider" min="4" max="16" value="10" step="1">
      <span class="slider-value" id="lapSliderV">10바퀴</span>
    </div>
    <div class="row">
      <span class="slider-label">바퀴 제한시간</span>
      <input type="range" id="limitSlider" min="15" max="50" value="30" step="1">
      <span class="slider-value" id="limitSliderV">3.0s</span>
    </div>
    <div class="row">
      <span class="slider-label">스푼 회전 속도</span>
      <input type="range" id="spinSlider" min="150" max="900" value="340" step="10">
      <span class="slider-value" id="spinSliderV">340°/s</span>
    </div>
  </div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const rad = d => d * Math.PI / 180;

/* ── 설정 · 상태 ─────────────────────────────── */
const ORDER = ["W","D","S","A"];
let keyAt = ["W","D","S","A"];      // 방위(위·오른쪽·아래·왼쪽)에 배치된 키 — 고정
const KEYMAP = {
  KeyW:"W", ArrowUp:"W", KeyD:"D", ArrowRight:"D",
  KeyS:"S", ArrowDown:"S", KeyA:"A", ArrowLeft:"A",
};
const GRADES = [
  {min: 0.9, name: "PERFECT",  color: "#f2c14e"},
  {min: 0.7, name: "GOOD",     color: "#38d47a"},
  {min: 0.5, name: "DECENT",   color: "#7ff0ea"},
  {min: 0.3, name: "POOR",     color: "#8890a4"},
  {min: 0.0, name: "SEWAGE",   color: "#ff5c6c"},
];
const G = {
  total: 10, limit: 3.0, spin: 340,
  pos: 0, target: 0, angle: 0,
  started: false, stirDone: false,
  lapsDone: 0, combos: 0, steps: 0, lapTime: 3.0,
  results: [], elapsed: 0, cooldown: 0,
};
const iceVel = {v: 0};

/* ── 얼음 생성 ───────────────────────────────── */
const iceTop = [], iceSide = [];
const TOP_SIZE = [30, 26, 28, 24, 27], SIDE_W = [38, 32, 34, 28, 30], SIDE_H = [32, 28, 30, 24, 26];
for (let i = 0; i < 5; i++){
  const r = document.createElementNS(NS, "rect");
  r.setAttribute("width", TOP_SIZE[i]); r.setAttribute("height", TOP_SIZE[i]); r.setAttribute("rx", 7);
  r.setAttribute("fill", "rgba(235,244,250,0.85)");
  r.setAttribute("stroke", "#cfe0ea"); r.setAttribute("stroke-width", "1.5");
  $("iceTop").appendChild(r);
  iceTop.push({el: r, a: i * 1.26, rad: 30 + (i % 3) * 14, rot: i * 40, half: TOP_SIZE[i] / 2});

  const s = document.createElementNS(NS, "rect");
  s.setAttribute("width", SIDE_W[i]); s.setAttribute("height", SIDE_H[i]); s.setAttribute("rx", 6);
  s.setAttribute("fill", "rgba(235,244,250,0.75)");
  s.setAttribute("stroke", "#cfe0ea"); s.setAttribute("stroke-width", "1.4");
  $("iceSide").appendChild(s);
  iceSide.push({el: s, a: i * 1.26, bob: i * 1.1, rad: 26 + (i % 3) * 13, hw: SIDE_W[i] / 2});
}

/* ── 방위 키 배지 ────────────────────────────── */
const BADGE_POS = [ {x:660,y:132}, {x:808,y:280}, {x:660,y:428}, {x:512,y:280} ];
const badges = [];
ORDER.forEach((k, i) => {
  const g = document.createElementNS(NS, "g");
  const c = document.createElementNS(NS, "circle");
  c.setAttribute("cx", BADGE_POS[i].x); c.setAttribute("cy", BADGE_POS[i].y);
  c.setAttribute("r", 23);
  const t = document.createElementNS(NS, "text");
  t.setAttribute("x", BADGE_POS[i].x); t.setAttribute("y", BADGE_POS[i].y + 6);
  t.setAttribute("text-anchor", "middle"); t.setAttribute("font-size", "18");
  t.textContent = k;
  g.appendChild(c); g.appendChild(t);
  $("badges").appendChild(g);
  badges.push({circle: c, text: t, flash: 0, flashColor: null});
});

/* ── 사선 게이지: 바퀴별 세그먼트 + 얇은 구분선 ── */
const GA = {x1: 392, y1: 512, x2: 310, y2: 42};
function gaugePoint(p){
  return { x: GA.x1 + (GA.x2 - GA.x1) * p, y: GA.y1 + (GA.y2 - GA.y1) * p };
}
const gaugeSegEls = [];
function buildTicks(){
  const segs = $("gaugeSegs"), ticks = $("gaugeTicks");
  segs.innerHTML = ""; ticks.innerHTML = ""; gaugeSegEls.length = 0;

  // 진행 세그먼트 — 바퀴 하나당 한 조각 (성공 금색 / 실패 어두운 적색)
  for (let i = 0; i < G.total; i++){
    const a = gaugePoint(i / G.total), b = gaugePoint((i + 1) / G.total);
    const l = document.createElementNS(NS, "line");
    l.setAttribute("x1", a.x); l.setAttribute("y1", a.y);
    l.setAttribute("x2", b.x); l.setAttribute("y2", b.y);
    l.setAttribute("stroke-width", 14);
    l.setAttribute("opacity", 0);
    segs.appendChild(l);
    gaugeSegEls.push(l);
  }
  // 얇은 구분선 — 게이지를 가로질러 딱딱 나눈다
  const len = Math.hypot(GA.x2 - GA.x1, GA.y2 - GA.y1);
  const nx = -(GA.y2 - GA.y1) / len, ny = (GA.x2 - GA.x1) / len;   // 수직 방향
  for (let i = 1; i < G.total; i++){
    const pt = gaugePoint(i / G.total);
    const t = document.createElementNS(NS, "line");
    t.setAttribute("x1", pt.x - nx * 10); t.setAttribute("y1", pt.y - ny * 10);
    t.setAttribute("x2", pt.x + nx * 10); t.setAttribute("y2", pt.y + ny * 10);
    t.setAttribute("stroke", "#0a0c11"); t.setAttribute("stroke-width", 2.5);
    ticks.appendChild(t);
  }
}
buildTicks();

/* ── 입력 ────────────────────────────────────── */
addEventListener("keydown", e => {
  if (e.code === "KeyR"){ reset(); return; }
  const key = KEYMAP[e.code];
  if (!key || e.repeat) return;
  e.preventDefault();
  press(key);
});
function press(key){
  if (G.stirDone) return;
  const idx = keyAt.indexOf(key);          // 그 키가 지금 배치된 방위
  const expected = (G.pos + 1) % 4;
  if (!G.started){
    if (idx === expected){ G.started = true; G.lapTime = G.limit; stepOk(idx); }
    else flashBadge(idx, "#ff5c6c");
    return;
  }
  if (idx === expected) stepOk(idx);
  else {
    flashBadge(idx, "#ff5c6c");
    lapEnd(false, "MISS");
  }
}
function stepOk(idx){
  G.pos = (G.pos + 1) % 4;
  G.target += 90;
  G.steps++;
  flashBadge(idx, "#38d47a");
  if (G.steps >= 4) lapEnd(true, null);
}
function lapEnd(success, label){
  G.results.push(success);
  G.lapsDone++;
  G.steps = 0;
  G.lapTime = G.limit;
  if (success){
    G.combos++;
    popJudge("COMBO " + G.combos, "#38d47a");
  } else {
    popJudge(label || "MISS", "#ff5c6c");
    const st = $("stage");
    st.classList.remove("wrong"); void st.offsetWidth; st.classList.add("wrong");
  }
  if (G.lapsDone >= G.total){
    G.stirDone = true;
    $("finishBtn").classList.add("ready");
    popJudge("FINISH", "#f2c14e");
  }
}
function flashBadge(i, color){ badges[i].flash = 1; badges[i].flashColor = color; }
function popJudge(text, color){
  const j = $("judge");
  j.textContent = text; j.style.color = color;
  j.classList.remove("pop"); void j.offsetWidth; j.classList.add("pop");
}

/* ── 종료·결과 ───────────────────────────────── */
$("finishBtn").addEventListener("click", () => {
  if (!G.stirDone) return;
  const ratio = G.combos / G.total;
  const grade = GRADES.find(g => ratio >= g.min);
  $("rGrade").textContent = grade.name;
  $("rGrade").style.color = grade.color;
  $("rPct").textContent = "완성도 " + Math.round(ratio * 100) + "%";
  $("rDetail").innerHTML =
    `콤보 ${G.combos} / ${G.total}바퀴 · 걸린 시간 ${G.elapsed.toFixed(1)}초<br>` +
    `PERFECT 90% · GOOD 70% · DECENT 50% · POOR 30%`;
  $("result").classList.add("show");
});
$("rRetry").addEventListener("click", reset);

function reset(){
  G.pos = 0; G.target = 0; G.angle = 0;
  G.started = false; G.stirDone = false;
  G.lapsDone = 0; G.combos = 0; G.steps = 0;
  G.lapTime = G.limit; G.results = []; G.elapsed = 0; G.cooldown = 0;
  iceVel.v = 0;
  keyAt = ["W","D","S","A"];
  badges.forEach((b, i) => b.text.textContent = keyAt[i]);
  $("finishBtn").classList.remove("ready");
  $("result").classList.remove("show");
  buildTicks();
}
$("lapSlider").addEventListener("input", e => {
  G.total = +e.target.value; $("lapSliderV").textContent = G.total + "바퀴"; reset();
});
$("limitSlider").addEventListener("input", e => {
  G.limit = e.target.value / 10; $("limitSliderV").textContent = G.limit.toFixed(1) + "s";
  $("subLimit").textContent = G.limit.toFixed(1) + "초";
  if (!G.started) G.lapTime = G.limit;
});
$("spinSlider").addEventListener("input", e => {
  G.spin = +e.target.value; $("spinSliderV").textContent = G.spin + "°/s";
});

/* ── 메인 루프 ───────────────────────────────── */
let last = performance.now();
function loop(now){
  const dt = Math.min((now - last) / 1000, 0.05); last = now;

  if (G.started && !G.stirDone){
    G.elapsed += dt;
    G.lapTime = Math.max(0, G.lapTime - dt);
    if (G.lapTime === 0) lapEnd(false, "TIME");
  }

  // 스푼은 목표 각도까지 굴러간다 — 밀릴수록 빨리 따라붙는다
  const remain = G.target - G.angle;
  const moving = Math.abs(remain) > 0.5;
  if (moving){
    const step = G.spin * dt * (1 + Math.abs(remain) / 240);
    G.angle += Math.sign(remain) * Math.min(Math.abs(remain), step);
  } else G.angle = G.target;

  const spoonVel = moving ? Math.sign(remain) * G.spin * (1 + Math.abs(remain) / 240) : 0;
  iceVel.v += (spoonVel * 0.55 - iceVel.v) * Math.min(1, dt * 2.2);
  iceVel.v *= (1 - dt * 0.25);

  const th = rad(G.angle);
  const dirX = Math.sin(th), dirY = -Math.cos(th);

  /* 탑다운 — 바 스푼이 시침처럼 현재 방위를 가리킨다 */
  const cx = 660, cy = 280;
  $("spoonHand").setAttribute("transform", `rotate(${G.angle.toFixed(1)} ${cx} ${cy})`);
  const t0 = th - rad(46);
  let d = "";
  for (let i = 0; i <= 8; i++){
    const a = t0 + (th - t0) * i / 8;
    d += (i ? "L" : "M") + (cx + Math.sin(a) * 68).toFixed(1) + " " + (cy - Math.cos(a) * 68).toFixed(1) + " ";
  }
  $("trail").setAttribute("d", d);
  $("trail").setAttribute("opacity", moving ? 0.5 : 0.15);
  iceTop.forEach(ice => {
    ice.a += rad(iceVel.v) * dt * 0.85;
    ice.rot += iceVel.v * dt * 0.4;
    const x = cx + Math.sin(ice.a) * ice.rad - ice.half;
    const y = cy - Math.cos(ice.a) * ice.rad - ice.half;
    ice.el.setAttribute("x", x); ice.el.setAttribute("y", y);
    ice.el.setAttribute("transform", `rotate(${ice.rot.toFixed(1)} ${x + ice.half} ${y + ice.half})`);
  });

  /* 랩 타이머 링 */
  const ringRatio = (G.started && !G.stirDone) ? G.lapTime / G.limit : 1;
  $("lapRing").setAttribute("stroke-dasharray", `${(741 * ringRatio).toFixed(0)} 741`);
  $("lapRing").setAttribute("stroke", ringRatio < 0.34 ? "#ff5c6c" : "#f2c14e");

  /* 배지 상태 */
  const expected = (G.pos + 1) % 4;
  badges.forEach((b, i) => {
    b.flash = Math.max(0, b.flash - dt * 5);
    if (b.flash > 0){
      b.circle.setAttribute("stroke", b.flashColor);
      b.circle.setAttribute("stroke-width", "3.5");
      b.circle.setAttribute("fill", "#171a22");
      b.text.setAttribute("fill", b.flashColor);
    } else if (i === G.pos && G.started){
      b.circle.setAttribute("stroke", "#8f86e8");
      b.circle.setAttribute("stroke-width", "3");
      b.circle.setAttribute("fill", "#241f4a");
      b.text.setAttribute("fill", "#cfc9ff");
    } else if (i === expected && !G.stirDone){
      const pulse = 0.55 + 0.45 * Math.sin(now / 180);
      b.circle.setAttribute("stroke", "#7ff0ea");
      b.circle.setAttribute("stroke-width", (2 + pulse * 1.6).toFixed(1));
      b.circle.setAttribute("fill", "#12262a");
      b.text.setAttribute("fill", "#7ff0ea");
    } else {
      b.circle.setAttribute("stroke", "#262b38");
      b.circle.setAttribute("stroke-width", "2");
      b.circle.setAttribute("fill", "#171a22");
      b.text.setAttribute("fill", "#8890a4");
    }
  });

  /* 사선 게이지 — 저은 바퀴만큼 세그먼트가 차오른다 */
  gaugeSegEls.forEach((l, i) => {
    if (i < G.results.length){
      l.setAttribute("stroke", G.results[i] ? "#f2c14e" : "#7a3644");
      l.setAttribute("opacity", 1);
    } else l.setAttribute("opacity", 0);
  });

  /* 좌측 캐릭터 — 손은 거의 고정, 스푼 헤드가 잔 가장자리를 크게 돈다 (손가락 스터) */
  const hx = 210 + dirX * 2.5, hy = 206 + dirY * 1.5;          // 손: 중앙 상단 고정 + 미세 움직임
  const bx = 210 + dirX * 55, by = 432 + Math.cos(th) * 6;      // 스푼 헤드: 잔 가장자리 큰 원
  const tx = hx + (hx - bx) * 0.32, ty = hy + (hy - by) * 0.32; // 손 위로 뻗은 샤프트 윗부분
  $("spoonShaft").setAttribute("x1", tx); $("spoonShaft").setAttribute("y1", ty);
  $("spoonShaft").setAttribute("x2", bx); $("spoonShaft").setAttribute("y2", by);
  $("spoonHead").setAttribute("cx", bx); $("spoonHead").setAttribute("cy", by);
  $("handR").setAttribute("cx", hx); $("handR").setAttribute("cy", hy);
  $("armR").setAttribute("d", `M306 138 Q${356 + dirX * 2} ${176 + dirY * 1.5} ${hx + 9} ${hy - 2}`);
  $("swirlSide").setAttribute("cx", 210 + dirX * 10);
  $("swirlSide").setAttribute("opacity", moving ? 0.75 : 0.35);
  iceSide.forEach(ice => {
    ice.a += rad(iceVel.v) * dt;
    const x = 210 + Math.sin(ice.a) * ice.rad - ice.hw;
    const y = 384 + Math.cos(ice.a * 0.7 + ice.bob) * 16;
    ice.el.setAttribute("x", x); ice.el.setAttribute("y", y);
  });

  /* HUD */
  $("hudTime").textContent = G.elapsed.toFixed(1) + "s";
  $("hudLap").textContent = `${G.lapsDone} / ${G.total}`;
  $("hudCombo").textContent = G.combos;
  const nk = $("nextKeyTxt").querySelector("tspan");
  nk.textContent = G.stirDone ? "완료" : keyAt[expected];

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
