      else act.style.display = "none";
    };
    this.handle = setInterval(step, 28);
  },

  async interact(key) {
    if (key === "note") { await Dlg.runScene("d1_note"); this.render(); return; }
    if (key === "tv") {
      // 홀로그램 TV — home_tv 그룹 conditional (첫 시청=실종 뉴스, 이후 토크쇼 반복)
      const sc = Commute.resolvePointScene({ scene_or_shop: "group:home_tv", selection: "conditional" });
      if (sc) await Dlg.runScene(sc);
      return;
    }
    if (key === "exit") {
      if (S.day === 1 && !S.flags.has("d1_note_read")) { toast(S.lang === "ko" ? "…테이블 위에 뭔가 있다." : "...There's something on the table."); return; }
      this.finish(); return;
    }
    if (key === "sofa") { this.finish(); return; }
  },

  // 소파→테라스 자동 이동 (테라스 대화 연출용)
  walkTo(x) {
    return new Promise(resolve => {
      const t = setInterval(() => {
        const d = x - this.lunaX;
        const luna = $("#home-luna");
        if (Math.abs(d) < 8) { clearInterval(t); if (luna) luna.classList.remove("walking"); resolve(); return; }
        this.lunaX += Math.sign(d) * 6;
        if (luna) { luna.style.left = this.lunaX + "px"; luna.classList.add("walking"); luna.classList.toggle("flip", d < 0); }
        const view = $("#home-view");
        const target = Math.max(0, Math.min(HOME_W - view.clientWidth, this.lunaX - view.clientWidth / 2));
        $("#home-strip").style.transform = `translateX(${-target}px)`;
      }, 24);
    });
  },

  // 씬만 재생하는 진입 (day3 구출 루트 — 크리스의 목격)
  async sceneOnly() {
    showScreen("screen-home");
    $("#home-label").textContent = S.lang === "ko" ? "🏠 집 — 밤" : "🏠 Home — Night";
    this.mode = "evening"; this.lunaX = HOME_X.sofa; this.render();
    await sleep(500);
    for (const sc of scenesFor(S.day, "home", "auto")) await Dlg.runScene(sc);
    Dlg.castClear();
  },
};

// ---------- 상점 ----------
function openShop() {
  const ov = $("#ov-shop");
  const list = $("#shop-list");
  list.innerHTML = "";
  unlockedIngredients().filter(i => i.shop_price).forEach(ing => {
    const row = el("div", "shop-row");
    row.innerHTML = `<span>${T(ing.name)}</span><span>${ing.shop_price}G</span>`;
    const btn = el("button", "btn small", S.lang === "ko" ? "구매" : "Buy");
    btn.addEventListener("click", () => {
      if (S.gold < ing.shop_price) { toast(S.lang === "ko" ? "골드 부족" : "Not enough gold"); return; }
      S.gold -= ing.shop_price;
      S.inventory[ing.id] = (S.inventory[ing.id] || 0) + 1;
      toast(`🛒 ${T(ing.name)} +1`);
      updateHUD();
    });
    row.appendChild(btn);
    list.appendChild(row);
  });
  ov.classList.add("show");
}

// ---------- 입고 (stock_in — 그날 바 오픈 직전, 결정 H) ----------
async function stockIn() {
  if (S.day === 1) return; // 초기 재고
  // 신규 입고 = 오늘 일차 해금 + 퀘스트/이벤트 해금(unlock_when, 아직 입고 연출 안 본 것)
  // 입고 대상 = 소모품(재료·가니시)만. 잔·도구는 상시 비치라 입고 연출에 안 나온다 (v1.9)
  const newIngs = DATA.master.shelf_items.filter(i =>
    (i.kind === "ingredient" || i.kind === "garnish") &&
    (i.unlock_day === S.day ||
     (i.unlock_when && evalWhen(i.unlock_when) && !S.flags.has("stocked_" + i.id))));
  newIngs.forEach(i => { if (i.unlock_when) S.flags.add("stocked_" + i.id); });
  if (!newIngs.length) return;
  const newCks = DATA.master.cocktails.filter(c => c.unlock_day === S.day);
  $("#stock-body").innerHTML = `
    <h2>📦 ${UI("ui_stock_in")}</h2>
    <div class="stock-chips">${newIngs.map(i =>
      `<div class="stock-chip"><div class="ing-bottle big" style="background:linear-gradient(180deg,transparent 25%,rgba(${i.color || "150,150,150"},.8) 25%)"></div><b>${T(i.name)}</b><small>${T(i.desc)}</small></div>`).join("")}</div>
    ${newCks.length ? `<p class="stock-new">🍸 ${S.lang === "ko" ? "새로 만들 수 있는 칵테일" : "Newly available"}: <b>${newCks.map(c => T(c.name)).join(", ")}</b></p>` : ""}`;
  await overlayConfirm("#ov-stock");
}

// ---------- 정산 (2부 마감 후, 바에서 나가기 직전 — 결정 C) ----------
async function settlement() {
  $("#settle-body").innerHTML = `
    <h2>🧾 ${UI("ui_settlement")} — DAY ${S.day}</h2>
    <div class="settle-rows">
      <div class="srow"><span>${UI("ui_sales")}</span><b>${S.today.sales}G</b></div>
      <div class="srow"><span>${UI("ui_tips")}</span><b>+${S.today.tips}G</b></div>
      <div class="srow"><span>${S.lang === "ko" ? "정상 서빙" : "Served"}</span><b>${S.today.served}${S.lang === "ko" ? "명" : ""}</b></div>
      <div class="srow ${S.today.angry ? "bad" : ""}"><span>${S.lang === "ko" ? "화나서 이탈" : "Angry left"}</span><b>${S.today.angry}${S.lang === "ko" ? "명" : ""}</b></div>
      <div class="srow"><span>${UI("ui_reputation")}</span><b>${S.today.repDelta >= 0 ? "+" : ""}${S.today.repDelta}</b></div>
      <div class="srow total"><span>${S.lang === "ko" ? "보유 골드" : "Gold"}</span><b>${S.gold}G</b></div>
    </div>`;
  await overlayConfirm("#ov-settle");
}

function overlayConfirm(sel) {
  return new Promise(resolve => {
    const ov = $(sel);
    ov.classList.add("show");
    const btn = ov.querySelector(".ov-confirm");
    const h = () => { ov.classList.remove("show"); btn.removeEventListener("click", h); resolve(); };
    btn.addEventListener("click", h);
  });
}

// ---------- 집 / 꿈 ----------
// ---------- 인트로 (day1 최초 1회 — 검은 화면, 루나가 처음 눈뜨던 밤) ----------
async function introPhase() {
  showScreen("screen-dream");
  await sleep(600);
  for (const sc of scenesFor(1, "intro", "auto")) await Dlg.runScene(sc);
  S.flags.add("intro_seen");
  Dlg.hideDialog();
  await sleep(400);
}

// ---------- 집 저녁 — 소파 '하루 마치기' → 테라스 대화 → 꿈 ----------
async function homeEvening() {
  await Home.run("evening");                       // 소파에서 '하루 마치기' 클릭 시 진행
  const homeScenes = scenesFor(S.day, "home", "auto");
  if (homeScenes.length) {
    await Home.walkTo(HOME_X.terrace);             // 테라스로 이동 (결정 B — 강제 이벤트)
    $("#screen-home").classList.add("terrace");
    for (const sc of homeScenes) await Dlg.runScene(sc);
    Dlg.castClear();
    $("#screen-home").classList.remove("terrace");
  }
  const dreams = scenesFor(S.day, "dream", "auto");
  if (dreams.length) {
    showScreen("screen-dream");
    $("#screen-dream").classList.remove("glitch");
    await sleep(700);
    for (const sc of dreams) await Dlg.runScene(sc);
    $("#screen-dream").classList.remove("glitch");
  }
}

// ---------- 하루 실행 ----------
async function runDay() {
  const meta = dayMeta(S.day);
  if (!meta) return endOfPrototype();
  S.today = { sales: 0, tips: 0, served: 0, angry: 0, repDelta: 0 };
  updateHUD();
  await phaseBanner(`DAY ${S.day}`, T(meta.label));

  // 0. 인트로 (day1 최초 1회 — 검은 화면 대화)
  if (S.day === 1 && !S.flags.has("intro_seen")) await introPhase();
  // 1. 집 아침 — 소파 기상 → (day1 쪽지) → 현관으로 출근
  await Home.run("morning");
  // 2. 출근길 (day1 = 비 오는 거리, 행인 없음)
  await phaseBanner(S.lang === "ko" ? "🌃 출근길" : "🌃 Commute", CFG.commute_in_time);
  await Commute.run("commute_in");
  // 3. 입고 (day1은 초기 재고라 스킵됨)
  await stockIn();
  // 4~5. 바 (개점 → 1부 → 2부)
  showScreen("screen-bar");
  BarCam.apply(SLOT_X[1], 0.92, true);
  Dlg.castClear();
  const hasSlots = !window.DEV_SKIPPART1 && DATA.schedule.guest_slots.some(g => g.day === S.day);
  if (hasSlots) {
    await Dlg.runPhaseScenes(S.day, "bar_open");
    Dlg.castClear();
    await openSign();
    await phaseBanner(S.lang === "ko" ? "🍸 1부 — 일반 영업" : "🍸 Part 1 — Open Bar", S.lang === "ko" ? "◀▶로 슬롯 이동 · 코스터를 드래그해 주문" : "◀▶ to switch slots · drag coasters to take orders");
    await Bar.runPart1(S.day);
    await phaseBanner(S.lang === "ko" ? "🌙 새벽 1시" : "🌙 1 A.M.", S.lang === "ko" ? "2부 — 단골의 시간" : "Part 2 — Regulars");
  }
  Bar.setMode("story");
  await Dlg.runPhaseScenes(S.day, "bar");
  Dlg.castClear();
  // 6. 정산
  await settlement();
  // 7. 퇴근길 (day1 엘리베이터·day3 분기 씬은 auto로 재생)
  await phaseBanner(S.lang === "ko" ? "🌌 퇴근길" : "🌌 Heading home", CFG.commute_out_time);
  await Commute.run("commute_out");
  // 7.5 day3 데모 분기 엔딩 (PD 확정 흐름)
  if (S.day === 3 && S.flags.has("samho_death_route")) return endOfPrototype("death");
  if (S.day === 3 && S.flags.has("samho_refused_drink")) {
    await Home.sceneOnly();          // 집 — 크리스의 목격
    return endOfPrototype("rescue");
  }
  // 8~9. 집 저녁(소파 → 테라스) → 꿈
  await homeEvening();
  S.day++;
  saveGame();
  if (S.day > 3) return endOfPrototype();
  runDay();
}

function endOfPrototype(variant) {
  showScreen("screen-end");
  const headline = variant === "death"
    ? (S.lang === "ko" ? "🥀 삼호는 돌아오지 못했다" : "🥀 Samho never came back")
    : variant === "rescue"
      ? (S.lang === "ko" ? "🌅 삼호는 살아남았다" : "🌅 Samho survived")
      : (S.lang === "ko" ? "🌅 프로토타입 범위 끝 (Day 1~3)" : "🌅 End of prototype (Day 1–3)");
  const sub = variant
    ? (S.lang === "ko" ? "당신이 따라준 잔이, 이야기를 갈랐다.<br>데모는 여기까지 — 이야기는 계속됩니다." : "The glass you poured split the story.<br>The demo ends here — the story continues.")
    : "";
  $("#end-body").innerHTML = `
    <h2>${headline}</h2>
    ${sub ? `<p class="end-note">${sub}</p>` : ""}
    <div class="settle-rows">
      <div class="srow"><span>${S.lang === "ko" ? "보유 골드" : "Gold"}</span><b>${S.gold}G</b></div>
      <div class="srow"><span>${UI("ui_reputation")}</span><b>${S.rep}</b></div>
      <div class="srow"><span>${S.lang === "ko" ? "누적 서빙" : "Total served"}</span><b>${S.stats.servedTotal}</b></div>
      ${Object.entries(S.affinity).map(([k, v]) => `<div class="srow"><span>💛 ${T(charOf(k)?.name) || k}</span><b>${v}</b></div>`).join("")}
    </div>
    <p class="end-note">${S.lang === "ko" ? "day4(삼호의 밤)부터는 본편에서 —" : "Day 4 (Samho's night) continues in the full game —"}</p>`;
}

// ---------- 부팅 ----------
function boot() {
  updateHUD();
  // 단골 수첩·대화 기록 버튼 (v1.9.5)
  const hudEl = $("#hud");
  const bDsr = el("button", "btn tiny", "📒"); bDsr.title = "단골 수첩";
  const bBlg = el("button", "btn tiny", "💬"); bBlg.title = "대화 기록";
  bDsr.addEventListener("click", openDossier);
  bBlg.addEventListener("click", openBacklog);
  hudEl.insertBefore(bBlg, $("#hud-lang")); hudEl.insertBefore(bDsr, bBlg);
  $("#hud-lang").addEventListener("click", () => { S.lang = S.lang === "ko" ? "en" : "ko"; updateHUD(); toast(S.lang.toUpperCase()); });
  $("#btn-close-early").addEventListener("click", () => Bar.closeEarly());
  $("#btn-interact").addEventListener("click", () => Commute.interact($("#btn-interact").dataset.point));
  $("#shop-close").addEventListener("click", () => $("#ov-shop").classList.remove("show"));
  // 키 입력 — 출퇴근: 이동 / 바 1부: 슬롯 전환
  window.addEventListener("keydown", e => {
    const inBar = $("#screen-bar").classList.contains("active");
    if (inBar && Bar.active && Bar.mode === "part1" && !$("#ov-craft").classList.contains("show") && !Dlg.running) {
      if (e.code === "ArrowLeft") { Bar.focusSlot(Bar.focus - 1); return; }
      if (e.code === "ArrowRight") { Bar.focusSlot(Bar.focus + 1); return; }
    }
    const inHome = $("#screen-home").classList.contains("active");
    const K = inHome ? Home.keys : Commute.keys;   // 집/거리 공용 이동 키 (v1.9.6)
    if (e.code === "ArrowLeft") K.left = true;
    if (e.code === "ArrowRight") K.right = true;
    if (e.code === "ShiftLeft" || e.code === "ShiftRight") K.shift = true;   // 달리기
    if (e.code === "KeyE") {
      if (inHome && $("#btn-home-act").style.display === "block") Home.interact($("#btn-home-act").dataset.key);
      else if ($("#btn-interact").style.display === "block") Commute.interact($("#btn-interact").dataset.point);
    }
  });
  window.addEventListener("keyup", e => {
    for (const K of [Commute.keys, Home.keys]) {
      if (e.code === "ArrowLeft") K.left = false;
      if (e.code === "ArrowRight") K.right = false;
      if (e.code === "ShiftLeft" || e.code === "ShiftRight") K.shift = false;
    }
  });
  // 모바일 이동 버튼
  const bindHold = (sel, key) => {
    const b = $(sel);
    b.addEventListener("pointerdown", () => Commute.keys[key] = true);
    window.addEventListener("pointerup", () => Commute.keys[key] = false);
  };
  bindHold("#btn-left", "left"); bindHold("#btn-right", "right");
  const bindHomeHold = (sel, key) => {
    const el2 = $(sel);
    el2.addEventListener("pointerdown", () => Home.keys[key] = true);
    window.addEventListener("pointerup", () => Home.keys[key] = false);
  };
  bindHomeHold("#home-left", "left"); bindHomeHold("#home-right", "right");
  $("#btn-home-act").addEventListener("click", () => Home.interact($("#btn-home-act").dataset.key));
  // 타이틀
  $("#btn-new-game").addEventListener("click", () => { clearSave(); runDay(); });
  const contBtn = $("#btn-continue");
  if (hasSave()) {
    contBtn.style.display = "inline-block";
    contBtn.addEventListener("click", () => { loadGame(); updateHUD(); runDay(); });
  }
  // 스테이지 스케일 (1280×720)
  const fit = () => {
    const st = $("#stage");
    const sc = Math.min(1, (window.innerWidth - 8) / 1280, (window.innerHeight - 8) / 720);
    st.style.transform = `scale(${sc})`;
  };
  window.addEventListener("resize", fit); fit();

  // 개발용: ?day=N 해당 일차 바로 시작 / &skipwalk 출퇴근 걷기 생략
  //         &skippart1 1부 생략 / &autocraft 스토리 씬 제조 미니게임 생략(good 판정 합성)
  const params = new URLSearchParams(location.search);
  window.DEV_SKIPWALK = params.has("skipwalk");
  window.DEV_SKIPPART1 = params.has("skippart1");
  window.DEV_AUTOCRAFT = params.has("autocraft");
  const devDay = parseInt(params.get("day"), 10);
  if (devDay >= 1 && devDay <= 3) {
    clearSave(); S.day = devDay; showScreen("screen-bar"); runDay();
  }
}
document.addEventListener("DOMContentLoaded", boot);

</script>
<script>
// ===== L.U.N.A 애드온 — 저장 시스템 확장 (멀티슬롯 + 수동저장) =====
// core.js / main.js 등 원본 파일은 전혀 수정하지 않음. simulator.html 에
// <script src="js/addons.js"><\/script> 한 줄만 추가하면 동작 (js/main.js 다음에 로드).
//
// 원본의 자동저장(SAVE_KEY, 1슬롯 · localStorage)은 그대로 둔 채,
// 수동 저장용 슬롯 3개를 별도 key로 얹는 방식. 스냅샷 포맷은 core.js의
// saveGame()/loadGame()과 동일하게 맞춰서 서로 호환되게 함.
"use strict";

(function () {
  const ADDON_SLOTS = 3;
  const slotKey = (n) => `luna_addon_manual_slot_${n}`;

  // ---------- 스냅샷 ----------
  function buildSnapshot() {
    return {
      ...S,
      flags: [...S.flags],
      usedPoints: [...S.usedPoints],
      questRewarded: [...S.questRewarded],
      met: [...S.met],
      dialogLog: [],           // 원본 정책과 동일 — 대화 백로그는 저장 안 함
      _addonSavedAt: Date.now(),
    };
  }
  function restoreSnapshot(snap) {
    Object.assign(S, snap);
    S.flags = new Set(snap.flags || []);
    S.usedPoints = new Set(snap.usedPoints || []);
    S.questRewarded = new Set(snap.questRewarded || []);
    S.met = new Set(snap.met || []);
    S.dialogLog = [];
  }
  function readSlot(n) {
    try { const raw = localStorage.getItem(slotKey(n)); return raw ? JSON.parse(raw) : null; }
    catch (e) { return null; }
  }
  function writeSlot(n) { localStorage.setItem(slotKey(n), JSON.stringify(buildSnapshot())); }
  function deleteSlot(n) { localStorage.removeItem(slotKey(n)); }

  function fmtTime(ts) {
    if (!ts) return "";
    const d = new Date(ts), p = (x) => String(x).padStart(2, "0");
    return `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  function slotLabel(snap, isKo) {
    if (!snap) return isKo ? "비어있음" : "Empty";
    return `DAY ${snap.day} · ${snap.gold}G · ${fmtTime(snap._addonSavedAt)}`;
  }

  // ---------- 로드 실행 ----------
  // 타이틀 화면에서는 바로 복원해도 안전(진행 중인 루프가 없음).
  // 게임 진행 중 로드는 runDay()를 또 호출하면 기존 루프와 겹쳐 꼬일 수 있어서
  // "불러올 슬롯 예약 → 새로고침 → 부팅 시 자동 복원"으로 안전하게 처리.
  const PENDING_LOAD_KEY = "luna_addon_pending_load";
  function doLoad(kind) {
    if (kind === "auto") { if (!hasSave()) return false; loadGame(); }
    else { const snap = readSlot(+kind); if (!snap) return false; restoreSnapshot(snap); }
    updateHUD();
    return true;
  }
  function consumePendingLoad() {
    const kind = localStorage.getItem(PENDING_LOAD_KEY);
    if (!kind) return;
    localStorage.removeItem(PENDING_LOAD_KEY);
    if (doLoad(kind)) runDay();
  }

  // ---------- 모달 (기존 .ov-dossier/.dsr-panel 스타일 재사용 — 신규 CSS 없음) ----------
  function closeModal() { document.querySelector(".ov-addon-save")?.remove(); }

  // mode: "save" (인게임 HUD 버튼 — 슬롯1~3만) / "load" (타이틀 화면 — 자동저장 + 슬롯1~3)
  function openModal(mode) {
    closeModal();
    const isKo = S.lang === "ko";
    const ov = el("div", "ov-dossier ov-addon-save show");
    const rows = [];

    if (mode === "load") {
      let autoSnap = null;
      try { const raw = localStorage.getItem(SAVE_KEY); autoSnap = raw ? JSON.parse(raw) : null; } catch (e) {}
      rows.push(`<div class="dsr-row addon-row" data-kind="auto" style="justify-content:space-between;${autoSnap ? "" : "opacity:.45;cursor:default"}">
        <span>💾 ${isKo ? "자동저장" : "Autosave"}</span>
        <span style="font-size:12px;color:#a89ed6">${autoSnap ? slotLabel({ ...autoSnap, _addonSavedAt: null }, isKo).replace(" · ", " · ") : (isKo ? "비어있음" : "Empty")}</span>
      </div>`);
    }
    for (let i = 1; i <= ADDON_SLOTS; i++) {
      const snap = readSlot(i);
      rows.push(`<div class="dsr-row addon-row" data-kind="slot" data-slot="${i}" style="justify-content:space-between">
        <span>🗂 ${isKo ? "슬롯" : "Slot"} ${i}</span>
        <span style="font-size:12px;color:#a89ed6">${slotLabel(snap, isKo)}</span>
        ${snap ? `<button class="btn tiny addon-del" data-slot="${i}">🗑</button>` : ""}
      </div>`);
    }

    ov.innerHTML = `<div class="dsr-panel" style="width:420px">
      <div class="dsr-head"><h3>${mode === "save" ? (isKo ? "💾 저장하기" : "Save") : (isKo ? "📂 불러오기" : "Load")}</h3>
        <button class="btn tiny dsr-close">✕</button></div>
      <div class="dsr-list" style="width:100%">${rows.join("")}</div></div>`;
    document.body.appendChild(ov);
    ov.querySelector(".dsr-close").addEventListener("click", closeModal);
    ov.addEventListener("click", (e) => { if (e.target === ov) closeModal(); });

    ov.querySelectorAll(".addon-row").forEach((row) => {
      row.addEventListener("click", (e) => {
        if (e.target.classList.contains("addon-del")) return;
        if (mode === "save") {
          const n = +row.dataset.slot;
          const existing = readSlot(n);
          if (existing && !confirm(isKo ? `슬롯 ${n}에 덮어쓸까요?` : `Overwrite slot ${n}?`)) return;
          writeSlot(n);
          toast(isKo ? `💾 슬롯 ${n} 저장 완료` : `Saved to slot ${n}`);
          closeModal();
        } else {
          const kind = row.dataset.kind === "auto" ? "auto" : row.dataset.slot;
          if (kind === "auto" && !hasSave()) return;
          if (kind !== "auto" && !readSlot(+kind)) return;
          const titleActive = document.getElementById("screen-title")?.classList.contains("active");
          closeModal();
          if (titleActive) { doLoad(kind); runDay(); }
          else { localStorage.setItem(PENDING_LOAD_KEY, kind); location.reload(); }
        }
      });
    });
    ov.querySelectorAll(".addon-del").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const n = +btn.dataset.slot;
        if (confirm(isKo ? `슬롯 ${n}을 삭제할까요?` : `Delete slot ${n}?`)) { deleteSlot(n); openModal(mode); }
      });
    });
  }

  // ---------- 스킨 CSS ----------

  // 아래 HOME NET 상점 카탈로그의 각 아이템이 이 클래스들(fn-rose/fn-teal/fn-gold)을 골라 입힌다.
  const furnitureCSS = `
    .hm-bed.fn-rose{background:linear-gradient(180deg,#4a2035,#2e1524)!important;border-color:#8a3f63!important}
    .hm-bed.fn-rose::after{background:linear-gradient(90deg,#ffb4d122,#ffb4d108)!important;border-color:#ffb4d133!important}
    .hm-bed.fn-teal{background:linear-gradient(180deg,#123333,#0c2323)!important;border-color:#2f6e6e!important}

    .hm-sofa.fn-rose::before{background:linear-gradient(180deg,#6b2c46,#4a1f3350)!important;border-color:#a4527c!important}
    .hm-sofa.fn-rose::after{background:#4a1f33!important;border-color:#a4527c!important}

    .hm-sofa.fn-gold::before{background:linear-gradient(180deg,#4a3a1f,#2e250f50)!important;border-color:#8a6a2f!important}
    .hm-sofa.fn-gold::after{background:#2e250f!important;border-color:#8a6a2f!important}

    .hm-window.fn-teal::after{background:linear-gradient(90deg,transparent 48%,#2f6e6e 48% 52%,transparent 52%),linear-gradient(0deg,transparent 48%,#2f6e6e 48% 52%,transparent 52%)!important}
    .hm-window.fn-gold{border-color:#8a6a2f!important;background:linear-gradient(180deg,#241c0e,#2e230f)!important}
    .hm-window.fn-gold::after{background:linear-gradient(90deg,transparent 48%,#8a6a2f 48% 52%,transparent 52%),linear-gradient(0deg,transparent 48%,#8a6a2f 48% 52%,transparent 52%)!important}
  `;
  const addonFurnitureStyleTag = document.createElement("style");
  addonFurnitureStyleTag.id = "addon-furniture-style";
  addonFurnitureStyleTag.textContent = furnitureCSS;
  document.head.appendChild(addonFurnitureStyleTag);

  // ---------- HOME NET: 상점(SHOP) + 배치(CUSTOMIZE) — 골드 경제와 연동 ----------
  // 구매/배치 상태는 S.homeInv / S.homePlace에 저장한다(별도 localStorage 아님).
  // S는 이미 core.js의 saveGame()/이 addon의 buildSnapshot()이 "{...S}"로 통째로
  // 스프레드해서 저장하기 때문에, S에 새 필드를 얹기만 해도 자동저장·수동슬롯 양쪽에
  // 그대로 같이 저장·복원된다 — 별도 저장 로직 추가 없이 기존 세이브 시스템에 편입.
  function ensureHomeState() {
    if (!S.homeInv) S.homeInv = {};      // { itemId: 보유수량 }
    if (!S.homePlace) S.homePlace = {};  // { slotId: 배치된 itemId }
  }
  ensureHomeState();

  const SLOT_SEL = { bed: ".hm-bed", sofa: ".hm-sofa", tv: ".hm-tv", window: ".hm-window" };
  const ICON_SLOTS = [
    { id: "plant", x: 600, bottom: 108 },
    { id: "poster", x: 700, bottom: 235 },
    { id: "light", x: 470, bottom: 235 },
  ];
  const HOME_TERMINAL_X = 1220; // note(1143~1217) 바로 다음, window(1282~1378) 앞 — 겹침 최소화

  const CATS = ["furniture", "electronics", "decoration", "lighting"];
  const CATALOG = [

      label: { ko: "틸 침대 커버", en: "Teal Bed Cover" }, desc: { ko: "차분한 틸 컬러. 새벽 근무 후 눈이 편해진다.", en: "A calm teal tone — easy on the eyes after a late shift." } },

      label: { ko: "골드 침대 커버", en: "Gold Bed Cover" }, desc: { ko: "고급 원단. 조금 사치스럽지만 하루쯤은 괜찮잖아.", en: "A luxury fabric — a small extravagance, just this once." } },

    { id: "sofa_teal", slot: "sofa", skin: "fn-teal", cat: "furniture", price: 300,
      label: { ko: "틸 소파", en: "Teal Sofa" }, desc: { ko: "밤에 앉아있으면 도시 불빛이 더 선명해 보인다.", en: "At night, the city lights look sharper from here." } },
    { id: "sofa_gold", slot: "sofa", skin: "fn-gold", cat: "furniture", price: 450,
      label: { ko: "골드 소파", en: "Gold Sofa" }, desc: { ko: "낡은 원단을 걷어내고 새로 씌운 고급 소파.", en: "The old fabric replaced with something finer." } },
    { id: "tv_rose", slot: "tv", skin: "fn-rose", cat: "electronics", price: 250,
      label: { ko: "로즈 홀로 TV", en: "Rose Holo-TV" }, desc: { ko: "홀로그램 색온도를 로즈톤으로 튜닝.", en: "Hologram color-tuned to a rose hue." } },
    { id: "tv_teal", slot: "tv", skin: "fn-teal", cat: "electronics", price: 250,
      label: { ko: "틸 홀로 TV", en: "Teal Holo-TV" }, desc: { ko: "뉴스 화면이 좀 더 차갑고 또렷하게 보인다.", en: "Makes the news feed look colder, sharper." } },
    { id: "tv_gold", slot: "tv", skin: "fn-gold", cat: "electronics", price: 400,
      label: { ko: "골드 홀로 TV", en: "Gold Holo-TV" }, desc: { ko: "프리미엄 홀로그램 프로젝터로 교체.", en: "Upgraded to a premium hologram projector." } },
    { id: "window_rose", slot: "window", skin: "fn-rose", cat: "decoration", price: 200,
      label: { ko: "로즈 커튼", en: "Rose Curtain" }, desc: { ko: "아침 햇살이 은은한 로즈빛으로 걸러진다.", en: "Morning light filters through in a soft rose glow." } },
    { id: "window_teal", slot: "window", skin: "fn-teal", cat: "decoration", price: 200,
      label: { ko: "틸 커튼", en: "Teal Curtain" }, desc: { ko: "도시 불빛이 창가에 틸색으로 번진다.", en: "City lights bleed teal across the windowsill." } },

      label: { ko: "몬스테라 화분", en: "Monstera Plant" }, desc: { ko: "삭막한 방에 초록색 하나쯤은 있어도 좋겠지.", en: "The room could use a little green." } },

  const CAT_LABEL = {
    furniture: { ko: "가구", en: "Furniture" }, electronics: { ko: "전자기기", en: "Electronics" },
    decoration: { ko: "장식", en: "Decoration" }, lighting: { ko: "조명", en: "Lighting" },
  };
  const SLOT_LABEL = {
    bed: { ko: "침대", en: "Bed" }, sofa: { ko: "소파", en: "Sofa" }, tv: { ko: "TV", en: "TV" },
    window: { ko: "창문", en: "Window" }, plant: { ko: "화분 자리", en: "Plant spot" },
    poster: { ko: "포스터 자리", en: "Poster spot" }, light: { ko: "조명 자리", en: "Light spot" },
  };

  function applySkinSlots() {
    Object.keys(SLOT_SEL).forEach((slotId) => {
      const target = document.querySelector("#home-strip " + SLOT_SEL[slotId]);
      if (!target) return;
      ["fn-rose", "fn-teal", "fn-gold"].forEach((c) => target.classList.remove(c));
      const item = CATALOG.find((c) => c.id === S.homePlace[slotId]);
      if (item && item.skin) target.classList.add(item.skin);
    });
  }
  function renderDecorSlots() {
    const strip = document.getElementById("home-strip");
    if (!strip) return;
    ICON_SLOTS.forEach((slot) => {
      const d = document.createElement("div");
      d.className = "hm-obj";
      d.style.left = slot.x + "px";
      d.style.bottom = slot.bottom + "px";
      d.style.fontSize = "28px";
      const item = CATALOG.find((c) => c.id === S.homePlace[slot.id]);
      d.innerHTML = item ? item.icon : "";
      strip.appendChild(d);
    });
  }
  function renderHomeTerminal() {
    const strip = document.getElementById("home-strip");
    if (!strip) return;
    const d = document.createElement("div");
    d.className = "hm-obj";
    d.style.left = HOME_TERMINAL_X + "px";
    d.innerHTML = `<div style="width:70px;height:90px;border-radius:8px;background:linear-gradient(180deg,#12203a,#0b1526);
      border:2px solid #4fd1ff88;box-shadow:0 0 18px #4fd1ff44;position:relative">
      <div style="position:absolute;top:10px;left:8px;right:8px;height:40px;border-radius:4px;
        background:linear-gradient(180deg,#0a2436,#071620);border:1px solid #4fd1ff55"></div>
      </div><span>HOME NET</span>`;
    strip.appendChild(d);
  }
  // Home.render()를 감싸서(원본 함수는 그대로 두고 뒤에 한 번 더 실행) 렌더 때마다 재적용
  if (typeof Home !== "undefined" && Home.render && !Home._addonHomeNetWrapped) {
    const origHomeRender = Home.render;
    Home.render = function () {
      origHomeRender.call(this);
      applySkinSlots();
      renderDecorSlots();
      renderHomeTerminal();
    };
    // 단말기 앞에서 E — 원본 nearTarget이 아무것도 못 찾았을 때만 단말기 후보를 얹는다
    const origNearTarget = Home.nearTarget;
    Home.nearTarget = function () {
      const orig = origNearTarget.call(this);
      if (orig) return orig;
      if (Math.abs(HOME_TERMINAL_X - this.lunaX) < 90) {
        return { key: "home_net", label: S.lang === "ko" ? "🖥 HOME NET 접속" : "🖥 Access HOME NET" };
      }
      return null;
    };
    const origInteract = Home.interact.bind(Home);
    Home.interact = async function (key) {
      if (key === "home_net") { openHomeNet("shop"); return; }
      return origInteract(key);
    };
    Home._addonHomeNetWrapped = true;
  }

  function buyItem(item) {
    const isKo = S.lang === "ko";
    if (S.gold < item.price) { toast(isKo ? "골드 부족" : "Not enough gold"); return; }
    S.gold -= item.price;
    S.homeInv[item.id] = (S.homeInv[item.id] || 0) + 1;
    toast(`🛒 ${T(item.label)} +1`);
    updateHUD();
  }
  function placeItem(slotId, itemIdOrNull) {
    if (itemIdOrNull) S.homePlace[slotId] = itemIdOrNull; else delete S.homePlace[slotId];
    applySkinSlots();
    renderDecorSlots();
  }
  function ownedCount(itemId) { return S.homeInv[itemId] || 0; }

  const shopNav = { catIdx: 0, itemIdx: 0, showDetail: false };
  function shopItemsInCat() { return CATALOG.filter((i) => i.cat === CATS[shopNav.catIdx]); }
  function clampShopIdx() {
    const n = shopItemsInCat().length;
    shopNav.itemIdx = n === 0 ? 0 : Math.min(Math.max(0, shopNav.itemIdx), n - 1);
  }

  function openHomeNet(tab) {
    document.querySelector(".ov-addon-homenet")?.remove();
    const isKo = S.lang === "ko";
    const ov = el("div", "ov-dossier ov-addon-homenet show");
    ov.dataset.tab = tab;
    const tabBtn = (id, label) =>
      `<button class="btn ${tab === id ? "" : "tiny"} addon-hn-tab" data-tab="${id}"
        style="${tab === id ? "opacity:1" : "opacity:.6"}">${label}</button>`;

    let body = "";
    if (tab === "shop") {
      clampShopIdx();
      const items = shopItemsInCat();
      const catTabs = CATS.map((c, i) => `
        <button class="btn ${i === shopNav.catIdx ? "" : "tiny"} addon-cat" data-idx="${i}"
          style="opacity:${i === shopNav.catIdx ? 1 : .6}">${T(CAT_LABEL[c])}</button>`).join("");
      const rows = items.map((it, idx) => {
        const sel = idx === shopNav.itemIdx;
        return `<div class="dsr-row addon-shop-row" data-idx="${idx}" style="justify-content:space-between;cursor:pointer;
          background:${sel ? "#3a2f66" : "#221a38"};border-color:${sel ? "#9c86f0" : "#3c3460"}">
          <span>${it.icon ? it.icon + " " : ""}${T(it.label)} <small style="color:#a89ed6">(${isKo ? "보유" : "own"} ${ownedCount(it.id)})</small></span>
          <span style="display:flex;align-items:center;gap:8px">
            <b>${it.price}G</b>
            <button class="btn tiny addon-buy" data-id="${it.id}" ${S.gold < it.price ? "disabled" : ""}>${isKo ? "구매" : "Buy"}</button>
          </span></div>`;
      }).join("") || `<p class="hint">${isKo ? "품목 없음" : "No items"}</p>`;
      const selItem = items[shopNav.itemIdx];
      const detail = shopNav.showDetail && selItem
        ? `<div class="dsr-entry"><span class="dsr-ic">ℹ</span><span><b>${T(selItem.label)}</b><br>${T(selItem.desc)}</span></div>`
        : `<p class="hint">${isKo ? "R : 상품 정보 보기" : "R : view item info"}</p>`;
      body = `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">${catTabs}</div>
        ${rows}${detail}
        <p class="hint" style="margin-top:10px;font-size:11px">
          ${isKo ? "← → 카테고리 · ↑ ↓ / 휠 상품 · PgUp/PgDn 빠른 이동 · Enter · F 구매 · R 정보 · Esc 닫기"
                 : "← → category · ↑ ↓ / wheel item · PgUp/PgDn jump · Enter · F buy · R info · Esc close"}</p>`;
    } else {
      // customize: 슬롯별로 현재 배치 + 보유중인 후보들 (마우스 전용)
      body = Object.keys(SLOT_LABEL).map((slotId) => {
        const candidates = CATALOG.filter((c) => c.slot === slotId && ownedCount(c.id) > 0);
        const curId = S.homePlace[slotId];
        const chips = [
          `<button class="addon-place" data-slot="${slotId}" data-item=""
            style="padding:4px 10px;border-radius:8px;font-size:12px;cursor:pointer;
            background:${!curId ? "#3a2f66" : "#221a38"};border:1px solid ${!curId ? "#9c86f0" : "#3c3460"};color:#eee">
            ${isKo ? "기본" : "Default"}</button>`,
          ...candidates.map((c) => `
            <button class="addon-place" data-slot="${slotId}" data-item="${c.id}"
              style="padding:4px 10px;border-radius:8px;font-size:12px;cursor:pointer;
              background:${curId === c.id ? "#3a2f66" : "#221a38"};border:1px solid ${curId === c.id ? "#9c86f0" : "#3c3460"};color:#eee">
              ${c.icon ? c.icon + " " : ""}${T(c.label)}</button>`),
        ].join("");
        return `<div class="dsr-row" style="flex-direction:column;align-items:flex-start;gap:8px;cursor:default">
          <span>${T(SLOT_LABEL[slotId])}</span>
          <div style="display:flex;flex-wrap:wrap;gap:8px">${chips}</div></div>`;
      }).join("");
    }

    ov.innerHTML = `<div class="dsr-panel" style="width:460px">
      <div class="dsr-head"><h3>🖥 HOME NET</h3><button class="btn tiny dsr-close">✕</button></div>
      <div style="display:flex;gap:8px;margin-bottom:12px">
        ${tabBtn("shop", "🛒 " + (isKo ? "상점" : "Shop"))}
        ${tabBtn("customize", "🛋 " + (isKo ? "배치" : "Customize"))}
      </div>
      <div class="dsr-list" style="width:100%;gap:10px;max-height:420px;overflow-y:auto">${body}</div></div>`;
    document.body.appendChild(ov);
    ov.querySelector(".dsr-close").addEventListener("click", () => ov.remove());
    ov.addEventListener("click", (e) => { if (e.target === ov) ov.remove(); });
    ov.querySelectorAll(".addon-hn-tab").forEach((btn) =>
      btn.addEventListener("click", () => openHomeNet(btn.dataset.tab)));
    ov.querySelectorAll(".addon-cat").forEach((btn) =>
      btn.addEventListener("click", () => { shopNav.catIdx = +btn.dataset.idx; shopNav.itemIdx = 0; shopNav.showDetail = false; openHomeNet("shop"); }));
    ov.querySelectorAll(".addon-shop-row").forEach((row) =>
      row.addEventListener("click", (e) => {
        if (e.target.closest(".addon-buy")) return;
        shopNav.itemIdx = +row.dataset.idx; openHomeNet("shop");
      }));
    ov.querySelectorAll(".addon-buy").forEach((btn) =>
      btn.addEventListener("click", (e) => { e.stopPropagation(); buyItem(CATALOG.find((c) => c.id === btn.dataset.id)); openHomeNet("shop"); }));
    ov.querySelectorAll(".addon-place").forEach((btn) =>
      btn.addEventListener("click", () => { placeItem(btn.dataset.slot, btn.dataset.item || null); openHomeNet("customize"); }));
  }

  function ensureDecorateButton() {
    const controls = document.getElementById("home-controls");
    if (controls && !document.getElementById("btn-addon-furniture")) {
      const btn = el("button", "btn tiny", "🖥");
      btn.id = "btn-addon-furniture";
      btn.title = S.lang === "ko" ? "HOME NET" : "HOME NET";
      btn.addEventListener("click", () => openHomeNet("shop"));
      controls.appendChild(btn);
    }
  }

  // ---------- 시스템 메뉴 (Esc / 우클릭) — 저장·불러오기·대화기록 한 곳에서 ----------
  function openSystemMenu() {
    document.querySelector(".ov-addon-sysmenu")?.remove();
    const isKo = S.lang === "ko";
    const ov = el("div", "ov-dossier ov-addon-sysmenu show");
    ov.innerHTML = `<div class="dsr-panel" style="width:260px">
      <div class="dsr-head"><h3>⚙ ${isKo ? "시스템 메뉴" : "System Menu"}</h3>
        <button class="btn tiny dsr-close">✕</button></div>
      <div class="dsr-list" style="width:100%;gap:10px">
        <button class="btn big addon-sys-save" style="width:100%">💾 ${isKo ? "저장하기 (S)" : "Save (S)"}</button>
        <button class="btn big addon-sys-load" style="width:100%">📂 ${isKo ? "불러오기 (L)" : "Load (L)"}</button>
        <button class="btn big addon-sys-log" style="width:100%">💬 ${isKo ? "대화 기록 (H)" : "Backlog (H)"}</button>
      </div></div>`;
    document.body.appendChild(ov);
    const close = () => ov.remove();
    ov.querySelector(".dsr-close").addEventListener("click", close);
    ov.addEventListener("click", (e) => { if (e.target === ov) close(); });
    ov.querySelector(".addon-sys-save").addEventListener("click", () => { close(); openModal("save"); });
    ov.querySelector(".addon-sys-load").addEventListener("click", () => { close(); openModal("load"); });
    ov.querySelector(".addon-sys-log").addEventListener("click", () => { close(); openBacklog(); });
  }

  // ---------- 단축키: Tab/S 저장 · L 불러오기 · Esc/우클릭 시스템 메뉴 · H 대화기록 · HOME NET 상점 내비 ----------
  window.addEventListener("keydown", (e) => {
    const titleActive = document.getElementById("screen-title")?.classList.contains("active");
    const hn = document.querySelector(".ov-addon-homenet");

    // HOME NET이 열려있는 동안은 배경 집 화면 이동(←→)이 같이 먹지 않게 매 입력마다 무효화
    if (hn && typeof Home !== "undefined") { Home.keys.left = false; Home.keys.right = false; Home.keys.shift = false; }

    if (hn && hn.dataset.tab === "shop") {
      if (e.code === "ArrowLeft") { e.preventDefault(); shopNav.catIdx = (shopNav.catIdx + CATS.length - 1) % CATS.length; shopNav.itemIdx = 0; shopNav.showDetail = false; openHomeNet("shop"); return; }
      if (e.code === "ArrowRight") { e.preventDefault(); shopNav.catIdx = (shopNav.catIdx + 1) % CATS.length; shopNav.itemIdx = 0; shopNav.showDetail = false; openHomeNet("shop"); return; }
      if (e.code === "ArrowUp") { e.preventDefault(); shopNav.itemIdx = Math.max(0, shopNav.itemIdx - 1); openHomeNet("shop"); return; }
      if (e.code === "ArrowDown") { e.preventDefault(); shopNav.itemIdx = Math.min(shopItemsInCat().length - 1, shopNav.itemIdx + 1); openHomeNet("shop"); return; }
      if (e.code === "PageUp") { e.preventDefault(); shopNav.itemIdx = Math.max(0, shopNav.itemIdx - 3); openHomeNet("shop"); return; }
      if (e.code === "PageDown") { e.preventDefault(); shopNav.itemIdx = Math.min(shopItemsInCat().length - 1, shopNav.itemIdx + 3); openHomeNet("shop"); return; }
      if (e.code === "Enter" || e.code === "KeyF") { e.preventDefault(); const it = shopItemsInCat()[shopNav.itemIdx]; if (it) buyItem(it); openHomeNet("shop"); return; }
      if (e.code === "KeyR") { e.preventDefault(); shopNav.showDetail = !shopNav.showDetail; openHomeNet("shop"); return; }
      // Tab은 저장 단축키로 이미 쓰고 있어서 상점 카테고리 전환에는 배정하지 않음(← → 로 대체)
    }

    if (e.code === "Tab" || e.code === "KeyS") {
      if (titleActive) return;                          // 타이틀엔 저장할 진행 상태가 없음
      e.preventDefault();
      document.querySelector(".ov-addon-sysmenu")?.remove();
      if (document.querySelector(".ov-addon-save")) closeModal(); else openModal("save");
      return;
    }
    if (e.code === "KeyL") {
      e.preventDefault();
      document.querySelector(".ov-addon-sysmenu")?.remove();
      if (document.querySelector(".ov-addon-save")) closeModal(); else openModal("load");
      return;
    }
    if (e.code === "Escape") {
      e.preventDefault();
      // 열려있는 애드온 오버레이가 있으면 그것부터 닫는다 (system menu를 그 위에 또 띄우지 않음)
      if (hn) { hn.remove(); return; }
      const sys = document.querySelector(".ov-addon-sysmenu");
      if (sys) { sys.remove(); return; }
      if (document.querySelector(".ov-addon-save")) { closeModal(); return; }
      openSystemMenu();
      return;
    }
    if (e.code === "KeyH") {
      e.preventDefault();
      const blg = document.querySelector(".ov-backlog");
      if (blg) blg.remove(); else openBacklog();
      return;
    }
  });

  // 마우스 휠 — HOME NET 상점이 열려있을 때 상품 목록 이동
  window.addEventListener("wheel", (e) => {
    const hn = document.querySelector(".ov-addon-homenet");
    if (!hn || hn.dataset.tab !== "shop") return;
    e.preventDefault();
    shopNav.itemIdx = Math.min(Math.max(shopItemsInCat().length - 1, 0), Math.max(0, shopNav.itemIdx + (e.deltaY > 0 ? 1 : -1)));
    openHomeNet("shop");
  }, { passive: false });

  // 우클릭 — Esc와 동일한 우선순위: 열린 애드온 모달부터 닫고, 없으면 시스템 메뉴 토글
  window.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    const hn = document.querySelector(".ov-addon-homenet");
    if (hn) { hn.remove(); return; }
    const sys = document.querySelector(".ov-addon-sysmenu");
    if (sys) { sys.remove(); return; }
    closeModal();
    openSystemMenu();
  });

  // ---------- UI 부착: 타이틀 "불러오기" 버튼 + 인게임 HUD "💾" 버튼 ----------
  function attachUI() {
    const btnRow = document.querySelector("#screen-title .btn-row");
    if (btnRow && !document.getElementById("btn-addon-load")) {
      const loadBtn = el("button", "btn big", S.lang === "ko" ? "📂 불러오기" : "📂 Load");
      loadBtn.id = "btn-addon-load";
      loadBtn.addEventListener("click", () => openModal("load"));
      btnRow.appendChild(loadBtn);
    }
    const hud = document.getElementById("hud");
    const langBtn = document.getElementById("hud-lang");
    if (hud && langBtn && !document.getElementById("btn-addon-save")) {
      const saveBtn = el("button", "btn tiny", "💾");
      saveBtn.id = "btn-addon-save";
      saveBtn.title = S.lang === "ko" ? "저장하기" : "Save";
      saveBtn.addEventListener("click", () => openModal("save"));
      hud.insertBefore(saveBtn, langBtn);
    }
    ensureDecorateButton();
  }

  function init() { attachUI(); consumePendingLoad(); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();

</script>
