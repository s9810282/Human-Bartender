        let target = null, tutorial = false;
        if (st.arg === "order") target = this.currentOrder ? this.currentOrder.cocktailId : null;
        else if (st.arg && st.arg.startsWith("tutorial:")) { target = st.arg.slice(9); tutorial = true; }
        this.hideDialog();
        let res;
        if (window.DEV_AUTOCRAFT && target) { // 개발용: 미니게임 생략, good 판정 합성
          res = { cocktail: DATA.master.cocktails.find(c => c.id === target), grade: "good", pct: 0.8 };
          await sleep(300);
        } else {
          res = await Craft.open({ target, tutorial });
        }
        S.lastGrade = res.grade; S.lastPct = res.pct;
        this.lastCraft = res;
        return;
      }
      case "serve": {
        // 스토리 씬의 서빙 — 완성 잔을 클릭해 건넨다
        await this.storyServe(st.actor);
        return;
      }
      case "choice": {
        const goPick = await this.showChoices(st.arg);
        if (goPick && goPick.effects) applyEffects(goPick.effects);
        return goPick && goPick.goto ? goPick.goto : undefined;
      }
      case "effect": return; // effects는 공통 처리
      case "fx": {
        await this.playFx(st.arg);
        return;
      }
      case "sfx": { await sleep(250); return; }
      case "bgm": return;
      case "move": {
        if (window.Commute && $("#screen-commute").classList.contains("active")) {
          await Commute.moveToSpot((st.arg || "").replace("spot:", ""));
        }
        return;
      }
      case "wait": { await sleep((parseFloat(st.arg) || 0.5) * 1000); return; }
      case "camera": return;
      case "end_part": case "end_day": return;
      default: return;
    }
  },

  // ---------- 대화 UI ----------
  say(name, color, text, actorId) {
    logDialog(name, fmtRich(text), color);   // 대화 히스토리 (v1.9.5)
    return new Promise(resolve => {
      const box = $("#dialog");
      box.classList.add("show");
      box.querySelector(".dlg-name").textContent = name;
      box.querySelector(".dlg-name").style.color = color || "#eee";
      box.querySelector(".dlg-portrait").innerHTML = charChip(actorId || "luna", 52);
      box.querySelector(".dlg-text").innerHTML = fmtRich(text);
      const done = () => { box.removeEventListener("click", done); window.removeEventListener("keydown", onKey); resolve(); };
      const onKey = (e) => { if (e.code === "Space" || e.code === "Enter") done(); };
      box.addEventListener("click", done);
      window.addEventListener("keydown", onKey);
    });
  },
  hideDialog() { $("#dialog").classList.remove("show"); },

  showChoices(choiceId) {
    return new Promise(resolve => {
      const opts = choicesOf(choiceId).filter(o => evalWhen(o.when));
      const wrap = $("#choice-box");
      wrap.innerHTML = "";
      opts.forEach(o => {
        const b = el("button", "choice-btn", "");
        b.innerHTML = fmtRich(T(o.text));
        b.addEventListener("click", () => { wrap.classList.remove("show"); resolve(o); });
        wrap.appendChild(b);
      });
      wrap.classList.add("show");
    });
  },

  // ---------- 바 스탠디(2부 등장인물) — 등장/퇴장 시 카메라 자동 프레이밍 ----------
  // 좌석 규칙(v1.9): 2부 손님은 항상 '붙어' 앉는다. 둘째 손님이 대본상 반대편(L↔R)이라도
  // 기존 손님의 옆자리로 스냅 — 카메라가 딱 2좌석 창만 비추면 되도록(3좌석 와이드 배경 불필요).
  castAdd(actorId, seatArg) {
    const seatMap = { L: 0, M: 1, R: 2 };
    let idx = seatMap[seatArg] !== undefined ? seatMap[seatArg] : 1;
    const occupied = Object.entries(this.cast)
      .filter(([a]) => a !== actorId)               // 자기 자신의 재등장은 점유로 안 침
      .map(([, d]) => +(d.closest(".seat")?.dataset.seat)).filter(n => !isNaN(n));
    if (occupied.length) {
      const base = occupied[0];
      if (Math.abs(idx - base) !== 1) {           // 같은 칸이거나 한 칸 이상 떨어짐 → 옆자리로 스냅
        const prefer = seatArg === "L" ? base - 1 : seatArg === "R" ? base + 1 : (base === 0 ? 1 : base - 1);
        const cand = [prefer, base + 1, base - 1].filter(n => n >= 0 && n <= 2 && n !== base && !occupied.includes(n));
        idx = cand.length ? cand[0] : idx;
      }
    }
    const host = $(`.seat[data-seat="${idx}"] .seat-guest`) || $("#screen-bar");
    this.castRemove(actorId);
    const c = charOf(actorId);
    if (c && c.affinity) S.met.add(actorId);   // 단골 수첩 해금 (v1.9.5)
    const d = el("div", "standee");
    d.dataset.actor = actorId;
    d.innerHTML = `${charChip(actorId, 120)}<div class="standee-name" style="color:${c ? c.name_color : "#ccc"}">${T(c ? c.name : { ko: actorId })}</div>`;
    host.appendChild(d);
    this.cast[actorId] = d;
    if (typeof Bar !== "undefined" && Bar.mode === "story") Bar.storyFrame(); // 손님 수에 맞춰 자동 이동/줌
  },
  castRemove(actorId) {
    if (this.cast[actorId]) { this.cast[actorId].remove(); delete this.cast[actorId]; }
    if (typeof Bar !== "undefined" && Bar.mode === "story") Bar.storyFrame();
  },
  castClear() { Object.keys(this.cast).forEach(a => this.castRemove(a)); },

  // ---------- 스토리 서빙 ----------
  storyServe(actorId) {
    return new Promise(resolve => {
      const res = this.lastCraft;
      const chip = el("div", "story-serve-chip");
      chip.innerHTML = `${glassSVG(res && res.cocktail ? res.cocktail.glass : "cocktail", res && res.cocktail ? res.cocktail.color : null, 0.8)}<span>${UI("ui_serve")} ▶</span>`;
      $("#screen-bar").appendChild(chip);
      chip.addEventListener("click", () => {
        chip.remove();
        // 2부도 정가 매출 반영
        if (res && res.cocktail) { S.gold += res.cocktail.price; S.today.sales += res.cocktail.price; S.today.served++; updateHUD(); }
        if (res && res.cocktail) {
          questOnServe(res.cocktail.id, res.grade);            // serve:<칵테일> 퀘스트 목표
          applyTasteAffinity(actorId, res.cocktail, res.grade); // 취향 × 등급 → 호감
        }
        resolve();
      });
    });
  },

  // ---------- 연출 ----------
  async playFx(id) {
    if (id === "terrace_night") { $("#screen-home").classList.add("terrace"); return; }
    if (id === "glitch_in") { $("#screen-dream").classList.add("glitch"); await sleep(700); return; }
    if (id === "hard_cut") {
      const f = $("#flash"); f.classList.add("on"); await sleep(180); f.classList.remove("on"); await sleep(350); return;
    }
    if (id === "cat_on_head") {
      const cat = el("div", "fx-cat", "🐱");
      $("#screen-bar").appendChild(cat);
      await sleep(1100); cat.remove(); return;
    }
    await sleep(250);
  },
};

</script>
<script>
// ===== 제조 미니게임 — 플레이어 선택 주도 (v1.9: 선반 4단계) =====
//   메뉴 → ①잔 선반 → ②도구 선반 → ③가니시 선반 → ④재료 선반 → [제조 시작] → 기믹 실행 → 완성 → 판정
//   각 선반에서 ◀이전으로 돌아가 다시 고를 수 있다 (제한 시간은 계속 흐른다).
// 레시피(RecipeLines/mix/prep/garnish)는 실행 순서가 아니라 '채점 정답'. 담은 것들이 강제된 순서
// (개봉→따르기→스퀴즈→파우더→믹스→필업)로 차례차례 실행된다 — 술을 안 따르고 젓는 일은 불가능.
// 도구: 셰이커=셰이킹 / 믹싱글라스+바스푼=스터 / 따개=병뚜껑(cap)·코르크(cork — 천천히, 급하면 부스러짐)
// 채점: 칵테일_등급_산출서 §2~3 — 항목 단순 평균, 컷은 balance.grade_cuts
"use strict";
const Craft = {
  resolveFn: null,
  target: null,       // 정답 칵테일 id (주문) — null이면 자유 제조
  tutorial: false,
  chosen: null,       // 선택한 칵테일 데이터
  attempt: null,
  stage: null,
  timeStart: 0, timerHandle: null,
  gimmicks: [], gi: 0,

  open(opts) {
    return new Promise(resolve => {
      this.resolveFn = resolve;
      this.target = opts.target || null;
      this.tutorial = !!opts.tutorial;
      this.chosen = null;
      $("#ov-craft").classList.add("show");
      const banner = $("#craft-order-banner");
      if (this.target && !this.tutorial) {
        banner.textContent = `🧾 ${UI("ui_menu")}: "${T(cocktailOf(this.target).name)}"`;
        banner.style.display = "block";
      } else if (this.tutorial) {
        banner.textContent = S.lang === "ko" ? `📖 튜토리얼: ${T(cocktailOf(this.target).name)}을(를) 만들어보자` : `📖 Tutorial: make a ${T(cocktailOf(this.target).name)}`;
        banner.style.display = "block";
      } else banner.style.display = "none";
      this.showMenu();
    });
  },

  close(result) {
    clearInterval(this.timerHandle);
    $("#ov-craft").classList.remove("show");
    const fn = this.resolveFn; this.resolveFn = null;
    fn(result);
  },

  setStage(html) {
    const c = $("#craft-stage");
    c.innerHTML = "";
    if (typeof html === "string") c.innerHTML = html; else c.appendChild(html);
  },

  // ---------- 1) 메뉴 선택 ----------
  showMenu() {
    const wrap = el("div", "craft-menu");
    wrap.appendChild(el("h3", "", UI("ui_menu")));
    const list = el("div", "menu-list");
    // 대본 지정 제조(주문·튜토리얼)는 해금 무시 — 스토리가 시키는 잔은 항상 만들 수 있다
    const pool = unlockedCocktails();
    if (this.target && !pool.some(c => c.id === this.target)) pool.unshift(cocktailOf(this.target));
    pool.forEach(c => {
      const row = el("div", "menu-row");
      row.innerHTML = `<div class="menu-glass">${glassSVG(c.glass, c.color, 0.75)}</div>
        <div class="menu-info"><b>${T(c.name)}</b><span>T${c.tier} · ${c.price}G · ${c.abv}%</span></div>`;
      row.addEventListener("click", () => this.showDesc(c));
      list.appendChild(row);
    });
    wrap.appendChild(list);
    this.setStage(wrap);
  },

  // ---------- 2) 설명 → 확정 ----------
  showDesc(c) {
    const wrap = el("div", "craft-desc");
    wrap.innerHTML = `
      <div class="desc-glass">${glassSVG(c.glass, c.color, 0.78)}</div>
      <h3>${T(c.name)}</h3>
      <p class="desc-flavor">${T(c.flavor)}</p>
      <p class="desc-meta">T${c.tier} · ${c.price}G · ${c.abv}% · ${c.tags.map(t => "#" + t).join(" ")}</p>`;
    const btns = el("div", "btn-row");
    const back = el("button", "btn ghost", "◀ " + UI("ui_menu"));
    back.addEventListener("click", () => this.showMenu());
    const go = el("button", "btn primary", UI("ui_make"));
    go.addEventListener("click", () => this.confirm(c));
    btns.append(back, go);
    wrap.appendChild(btns);
    this.setStage(wrap);
  },

  confirm(c) {
    // §3.9 — 메뉴 확정 시점에 올바른/틀린 즉시 판정 (시뮬레이터 방식)
    this.chosen = c;
    this.isCorrect = this.target ? (c.id === this.target) : true;
    this.attempt = {
      glass: null, garnish: null, pours: {}, fill: null,   // 잔·가니시도 플레이어가 선반에서 고른다 (v1.9)
      usedTool: null, stirTurns: 0, shakeStrokes: 0,
      prepDone: null, corkQuality: 1, opened: {},       // 병 개봉 상태 (cork 병은 따야 따를 수 있음)
    };
    this.pendingBottle = null;
    this.queue = [];        // 담은 재료·도구 {kind,id} — 시작 누르면 논리적 순서로 실행
    this.runList = []; this.ri = 0;
    this.notePeeked = false; // 레시피 노트를 본 뒤에만 글로우 가이드 (시뮬레이터 방식)
    this.coached = {};       // 튜토리얼 코치마크 — 화면·기믹당 1회 (v1.9.6)
    this.timeStart = performance.now();
    this.startTimer(c.time_limit_sec);
    this.slot = 0;
    this.showGlassSelect();
  },

  // 레시피 노트를 본 상태면 — 필요한 잔/재료가 깜빡인다 (아직 안 담은 것만)
  applyGlow() {
    $$("#craft-stage .glow").forEach(x => x.classList.remove("glow"));
    if (!this.notePeeked) return;
    const c = this.chosen;
    // 잔·가니시 선택 스테이지 (정답 없음 = "없음" 칸이 정답)
    $$("#craft-stage .glass-cell").forEach(cell => {
      if (cell.dataset.id === String(c.glass)) cell.classList.add("glow");
    });
    $$("#craft-stage .garnish-cell").forEach(cell => {
      if (cell.dataset.id === String(c.garnish)) cell.classList.add("glow");
    });
    // 선반 스테이지 — 정답에 필요한 재료·도구 중 아직 큐에 안 담긴 것만 안내
    const queued = new Set((this.queue || []).map(x => x.kind + ":" + x.id));
    const need = new Set();
    c.recipe.forEach(r => need.add(r.action + ":" + r.ingredient));
    if (c.fill) need.add("fill:" + c.fill);
    if (c.mix === "shake") need.add("tool:shaker");
    if (c.mix === "stir" || c.mix === "build") need.add("tool:mixing_glass");
    if (c.prep) need.add("tool:opener");
    $$("#craft-stage .ing-cell").forEach(cell => {
      if (need.has(cell.dataset.key) && !queued.has(cell.dataset.key)) cell.classList.add("glow");
    });
  },

  startTimer(limit) {
    const tEl = $("#craft-timer");
    clearInterval(this.timerHandle);
    this.timerHandle = setInterval(() => {
      const t = (performance.now() - this.timeStart) / 1000;
      tEl.textContent = `⏱ ${t.toFixed(1)} / ${limit}s`;
      tEl.classList.toggle("over", t > limit);
    }, 100);
  },
  elapsed() { return (performance.now() - this.timeStart) / 1000; },

  // ---------- 3) 선반 4단계: 잔 → 도구 → 가니시 → 재료 (v1.9) ----------
  // 각 화면은 그 종류가 진열된 '선반'이고, ◀이전으로 돌아가 다시 고를 수 있다.
  // 되돌아가도 제한 시간은 계속 흐른다 — 무한정 고민하는 걸 막기 위해.
  // 선반 슬롯 — ◀▶로 좌우 이동. 마지막 슬롯에서만 '제조 시작'이 뜬다.
  SLOTS: [
    { key: "glass",   icon: "🥃", ui: "ui_shelf_glass",   show: "showGlassSelect" },
    { key: "tool",    icon: "🛠", ui: "ui_shelf_tool",    show: "showToolSelect" },
    { key: "garnish", icon: "🌿", ui: "ui_shelf_garnish", show: "showGarnishSelect" },
    { key: "ing",     icon: "🍾", ui: "ui_shelf_ing",     show: "showShelf" },
  ],
  slot: 0,

  goSlot(i) {
    if (i < 0 || i >= this.SLOTS.length) return;
    this.slot = i;
    this[this.SLOTS[i].show]();
  },

  // 튜토리얼 코치마크 (v1.9.6) — 크리스가 UI를 직접 설명해주는 카드. 튜토리얼 제조에서만, 항목당 1회.
  COACH: {
    glass:   ["🥃", "잔 선반|레시피에 맞는 잔을 고르는 곳이다. 어떤 잔인지 모르겠으면 아래 📖 레시피 노트를 봐라 — 정답 잔이 반짝일 거다.", "The Glass Shelf|Pick the glass the recipe calls for. Not sure? Open the 📖 recipe note below — the right glass will glow."],
    tool:    ["🛠", "도구 선반|저을 거면 믹싱 글라스, 흔들 거면 셰이커, 병뚜껑·코르크는 따개다. 담아두면 알맞은 순서에 알아서 쓰게 된다.", "The Tool Shelf|Mixing glass to stir, shaker to shake, opener for caps and corks. Stock a tool and it runs at the right moment."],
    garnish: ["🌿", "가니시 선반|마지막 장식이다. 레시피에 가니시가 없는 술이면 '없음'을 고르면 돼.", "The Garnish Shelf|The finishing touch. If the recipe has no garnish, pick 'None'."],
    ing:     ["🍾", "재료 선반|레시피의 재료를 눌러 담아라. 잘못 담았으면 다시 누르면 빠진다. 다 담았으면 '제조 시작'!", "The Ingredient Shelf|Tap ingredients to stock them; tap again to put back. When ready, hit 'Start'!"],
    pour:    ["🍺", "따르기|병을 집으면 자동으로 따라진다. 게이지의 목표선에 딱 맞춰 ⏹ 멈추기!", "Pouring|The bottle pours on its own. Hit ⏹ right on the target line!"],
    stir:    ["🌀", "스터|스푼으로 원을 그리며 저어라. 레시피마다 알맞은 바퀴 수가 있다 — 다 저었으면 '그만 젓기'.", "Stirring|Draw circles with the spoon. Each recipe has its right number of turns — then hit 'Enough'."],
    shake:   ["🫨", "셰이킹|위아래로 흔들어라. 덜 흔들면 안 섞이고 너무 흔들면 맛이 죽는다.", "Shaking|Drag up and down. Too little won't mix, too much kills the drink."],
    squeeze: ["🍋", "스퀴즈|버튼을 누르는 동안 즙이 나온다. 목표량에서 손을 떼라.", "Squeezing|Juice flows while you hold. Release at the target."],
    powder:  ["🥄", "파우더|한 스푼씩 탭해서 넣는다. 정량을 지켜라.", "Powder|Tap to add one spoon at a time. Mind the measure."],
    cap:     ["🍾", "병따기|따개로 3번 두드리면 열린다.", "Cap|Tap three times with the opener."],
    cork:    ["🍷", "코르크|천천히, 조심조심 돌려라. 급하면 부스러져서 술에 들어간다.", "Cork|Twist slowly and gently. Rush it and crumbs fall in the drink."],
  },
  coach(key) {
    if (!this.tutorial || !this.coached || this.coached[key]) return;
    this.coached[key] = true;
    const [icon, ko, en] = this.COACH[key];
    const [title, body] = (S.lang === "ko" ? ko : en).split("|");
    document.querySelector(".coach-card")?.remove();
    const card = el("div", "coach-card");
    card.innerHTML = `<div class="coach-head">${icon} <b>${title}</b></div><p>${body}</p>
      <button class="btn tiny primary">${S.lang === "ko" ? "알겠어" : "Got it"}</button>`;
    card.querySelector("button").addEventListener("click", () => card.remove());
    $("#craft-stage").prepend(card);
  },

  // 상단 슬롯 인디케이터 — 지금 몇 번 선반인지 + 직접 점프
  slotBar() {
    const bar = el("div", "slot-bar");
    this.SLOTS.forEach((sl, i) => {
      const tab = el("div", "slot-tab" + (i === this.slot ? " on" : ""),
        `${sl.icon} ${UI(sl.ui)}`);
      tab.addEventListener("click", () => this.goSlot(i));
      bar.appendChild(tab);
    });
    return bar;
  },

  // 좌우 이동 버튼 — 왼쪽=이전 선반, 오른쪽=다음 선반. 마지막 칸은 '제조 시작'
  slotNav() {
    const row = el("div", "slot-nav");
    const prev = el("button", "btn slot-arrow" + (this.slot === 0 ? " off" : ""), "◀");
    prev.addEventListener("click", () => this.slot > 0 ? this.goSlot(this.slot - 1) : this.showMenu());
    prev.title = this.slot === 0 ? (S.lang === "ko" ? "메뉴로" : "Back to menu")
                                 : UI(this.SLOTS[this.slot - 1].ui);
    row.appendChild(prev);
    row.appendChild(this.noteButton());
    const last = this.slot === this.SLOTS.length - 1;
    if (last) {
      const go = el("button", "btn primary", S.lang === "ko" ? "제조 시작 ▶" : "Start ▶");
      go.addEventListener("click", () => this.startRun());
      row.appendChild(go);
    } else {
      const next = el("button", "btn slot-arrow", "▶");
      next.title = UI(this.SLOTS[this.slot + 1].ui);
      next.addEventListener("click", () => this.goSlot(this.slot + 1));
      row.appendChild(next);
    }
    return row;
  },

  // ── 3-1) 잔 선반 ──
  showGlassSelect() {
    const wrap = el("div", "craft-glass");
    wrap.appendChild(this.slotBar());
    wrap.appendChild(el("h3", "", S.lang === "ko" ? "잔 선반 — 잔을 고른다" : "Glass Shelf"));
    if (this.tutorial) wrap.appendChild(el("p", "hint", S.lang === "ko" ? "💡 레시피 노트가 정답 잔을 알려준다" : "💡 The recipe note shows the right glass"));
    const grid = el("div", "glass-grid");
    const pick = (id, cell) => {
      this.attempt.glass = id;
      $$("#craft-stage .glass-cell").forEach(x => x.classList.remove("sel"));
      cell.classList.add("sel");
    };
    unlockedShelf("glass").forEach(g => {
      const cell = el("div", "glass-cell" + (this.attempt.glass === g.id ? " sel" : ""));
      cell.dataset.id = g.id;
      cell.innerHTML = `${glassSVG(g.id, null, 0)}<span>${T(g.name)}</span>`;
      cell.addEventListener("click", () => pick(g.id, cell));
      grid.appendChild(cell);
    });
    // 병맥주(잔 없음) 대응 — "잔 없이(병째)" 선택지
    const none = el("div", "glass-cell" + (this.attempt.glass === null ? " sel" : ""));
    none.dataset.id = "null";
    none.innerHTML = `${glassSVG("bottle", null, 0)}<span>${S.lang === "ko" ? "병째로" : "In the bottle"}</span>`;
    none.addEventListener("click", () => pick(null, none));
    grid.appendChild(none);
    wrap.appendChild(grid);
    wrap.appendChild(this.slotNav());
    this.setStage(wrap);
    this.applyGlow();
    this.coach("glass");
    if (this.tutorial) this.openNote();
  },

  // ── 3-2) 도구 선반 ── (담아두면 실행 순서에 맞춰 알아서 돈다)
  showToolSelect() {
    const wrap = el("div", "craft-ing");
    wrap.appendChild(this.slotBar());
    wrap.appendChild(el("h3", "", S.lang === "ko" ? "도구 선반 — 쓸 도구를 담는다" : "Tool Shelf"));
    wrap.appendChild(el("p", "hint", S.lang === "ko"
      ? "담아두면 순서에 맞춰 실행된다 — 믹스는 재료를 다 넣은 뒤에 돈다"
      : "Stocked tools run in the right order — mixing happens after all pours"));
    const grid = el("div", "ing-grid");
    const row = el("div", "ing-row");
    const queued = new Set(this.queue.filter(x => x.kind === "tool").map(x => x.id));
    const TOOL_ICON = { shaker: "🫨", mixing_glass: "🌀", opener: "🍾" };
    unlockedShelf("tool").forEach(t => {
      const cell = el("div", "ing-cell tool-cell" + (queued.has(t.id) ? " sel" : ""));
      cell.dataset.key = "tool:" + t.id;
      cell.innerHTML = `<div class="tool-icon">${TOOL_ICON[t.id] || "🛠"}</div><span>${T(t.name)}</span>`;
      cell.addEventListener("click", () => this.toggleQueue("tool", t.id));
      row.appendChild(cell);
    });
    grid.appendChild(row);
    wrap.appendChild(grid);
    const picked = [...queued].map(id => T(shelfOf(id).name)).join(", ");
    wrap.appendChild(el("p", "hint", (S.lang === "ko" ? "담은 도구: " : "Stocked: ") +
      (picked || (S.lang === "ko" ? "없음 (도구 없이 진행)" : "none"))));
    wrap.appendChild(this.slotNav());
    this.setStage(wrap);
    this.applyGlow();
    this.coach("tool");
  },

  // ── 3-3) 가니시 선반 ── (v1.9: 비인터랙티브 연출 → 플레이어 선택·채점 대상)
  showGarnishSelect() {
    const wrap = el("div", "craft-glass");
    wrap.appendChild(this.slotBar());
    wrap.appendChild(el("h3", "", S.lang === "ko" ? "가니시 선반 — 장식을 고른다" : "Garnish Shelf"));
    const grid = el("div", "glass-grid");
    const pick = (id, cell) => {
      this.attempt.garnish = id;
      $$("#craft-stage .garnish-cell").forEach(x => x.classList.remove("sel"));
      cell.classList.add("sel");
    };
    // "없음"도 하나의 선택 — 가니시 없는 칵테일인지 스스로 판단해야 한다(정답 힌트를 주지 않는다)
    const none = el("div", "glass-cell garnish-cell" + (this.attempt.garnish === null ? " sel" : ""));
    none.dataset.id = "null";
    none.innerHTML = `<div class="tool-icon">🚫</div><span>${S.lang === "ko" ? "없음" : "None"}</span>`;
    none.addEventListener("click", () => pick(null, none));
    grid.appendChild(none);
    unlockedShelf("garnish").forEach(g => {
      const cell = el("div", "glass-cell garnish-cell" + (this.attempt.garnish === g.id ? " sel" : ""));
      cell.dataset.id = g.id;
      cell.innerHTML = `<div class="tool-icon">🌿</div><span>${T(g.name)}</span>`;
      cell.addEventListener("click", () => pick(g.id, cell));
      grid.appendChild(cell);
    });
    wrap.appendChild(grid);
    wrap.appendChild(this.slotNav());
    this.setStage(wrap);
    this.applyGlow();
    this.coach("garnish");
  },

  noteButton() {
    const b = el("button", "btn note-btn", "📖 " + UI("ui_recipe_note"));
    b.addEventListener("click", () => this.openNote());
    return b;
  },
  openNote() {
    const c = this.chosen;
    const lines = c.recipe.map(r => {
      const nm = T(ingOf(r.ingredient).name);
      const act = { pour: S.lang === "ko" ? "따르기" : "pour", squeeze: S.lang === "ko" ? "스퀴즈" : "squeeze", powder: S.lang === "ko" ? "파우더" : "powder" }[r.action];
      return `<li>${nm} — ${r.qty}${r.unit} <em>(${act})</em></li>`;
    }).join("");
    const mixName = {
      none: "-",
      build: S.lang === "ko" ? "빌드 — 바 스푼 1바퀴" : "Build — 1 stir",
      stir: S.lang === "ko" ? "스터 — 믹싱 글라스 3바퀴" : "Stir — 3 turns",
      shake: S.lang === "ko" ? "셰이크 — 셰이커 8회" : "Shake — 8 strokes",
    }[c.mix];
    const prepName = c.prep ? (c.prep === "cork"
      ? (S.lang === "ko" ? " / 🍾 코르크는 천천히" : " / 🍾 cork — slowly")
      : (S.lang === "ko" ? " / 🍺 병뚜껑 따기" : " / 🍺 pop the cap")) : "";
    const glassName = c.glass ? T(itemOf(c.glass).name) : (S.lang === "ko" ? "병째로" : "In the bottle");
    $("#note-body").innerHTML = `
      <h3>${T(c.name)}</h3>
      <ul>${lines || "<li>-</li>"}</ul>
      <p>🥃 ${glassName} / 🔀 ${mixName}${prepName}${c.fill ? ` / ⬆ ${T(ingOf(c.fill).name)}` : ""}${c.garnish ? ` / 🌿 ${T(itemOf(c.garnish).name)}` : ""}</p>`;
    $("#ov-note").classList.add("show");
    this.notePeeked = true; // 이후 필요한 아이템이 깜빡임
    this.applyGlow();
  },

  // ---------- 4) 선반 — 재료·도구를 '담고' → 시작하면 순서대로 실행 (플레이어 주도) ----------
  CORK_BOTTLES: ["red_wine", "champagne"],   // 코르크 병 — 따개로 따야 딸 수 있음

  lineFor(id, act) { return this.chosen.recipe.find(r => r.ingredient === id && r.action === act); },

  // 담은 것을 클릭 = 토글 (같은 걸 또 누르면 뺀다). 믹스 도구(셰이커/믹싱글라스)는 서로 배타적
  toggleQueue(kind, id) {
    const i = this.queue.findIndex(x => x.kind === kind && x.id === id);
    if (i >= 0) { this.queue.splice(i, 1); }
    else {
      if (kind === "tool" && (id === "shaker" || id === "mixing_glass"))
        this.queue = this.queue.filter(x => !(x.kind === "tool" && (x.id === "shaker" || x.id === "mixing_glass")));
      this.queue.push({ kind, id });
    }
    this.goSlot(this.slot);
  },

  // 담은 것(queue) → 실제 실행 순서로 변환. 카테고리 순서를 강제 = 따르기 전에 젓는 일이 불가능
  //   1 개봉 → 2 따르기(베이스 먼저) → 3 스퀴즈 → 4 파우더 → 5 믹스 → 6 필업
  buildRunList() {
    const c = this.chosen, q = this.queue;
    const has = (kind, id) => q.some(x => x.kind === kind && x.id === id);
    const ids = kind => q.filter(x => x.kind === kind).map(x => x.id);
    const run = [];
    if (has("tool", "opener")) {   // 따개를 담았으면 맨 처음 병을 연다
      const corked = ids("pour").find(id => this.CORK_BOTTLES.includes(id));
      run.push({ t: "open", prep: (c.prep === "cork" || corked) ? "cork" : "cap",
                 bottle: corked || (c.recipe.find(r => r.action === "pour") || {}).ingredient });
    }
    const isBase = id => (ingOf(id) || {}).category === "base";
    ids("pour").sort((a, b) => (isBase(a) ? 0 : 1) - (isBase(b) ? 0 : 1))
      .forEach(id => run.push({ t: "pour", id }));
    ids("squeeze").forEach(id => run.push({ t: "squeeze", id }));
    ids("powder").forEach(id => run.push({ t: "powder", id }));
    const mix = ids("tool").find(id => id === "shaker" || id === "mixing_glass");
    if (mix) run.push({ t: "mix", tool: mix });
    ids("fill").forEach(id => run.push({ t: "fill", id }));   // 탄산·믹서는 마지막
    return run;
  },

  stepLabel(s) {
    const ko = S.lang === "ko";
    const nm = id => T((ingOf(id) || itemOf(id) || { name: { ko: id, en: id } }).name);
    switch (s.t) {
      case "open": return s.prep === "cork" ? "🍷 " + (ko ? "코르크 " : "cork ") + nm(s.bottle)
                                            : "🍺 " + (ko ? "병따기" : "cap");
      case "pour": return "🍾 " + nm(s.id);
      case "squeeze": return "🍋 " + nm(s.id);
      case "powder": return "🥄 " + nm(s.id);
      case "mix": return s.tool === "shaker" ? "🫨 " + (ko ? "셰이킹" : "shake") : "🌀 " + (ko ? "스터" : "stir");
      case "fill": return "⬆ " + nm(s.id);
    }
    return "";
  },

  // 큐 미리보기 칩에서 X를 누르면 그 항목을 큐에서 뺀다
  removeStep(s) {
    if (s.t === "open") this.queue = this.queue.filter(x => !(x.kind === "tool" && x.id === "opener"));
    else if (s.t === "mix") this.queue = this.queue.filter(x => !(x.kind === "tool" && x.id === s.tool));
    else this.queue = this.queue.filter(x => !(x.kind === s.t && x.id === s.id));
  },

  showShelf() {
    const c = this.chosen;
    const wrap = el("div", "craft-ing");
    wrap.appendChild(this.slotBar());
    wrap.appendChild(el("h3", "", S.lang === "ko" ? "재료 선반 — 넣을 재료를 담는다" : "Ingredient Shelf"));

    // 담은 것 미리보기 — 탭한 순서가 아니라 '실제 실행될 순서'로 보여준다
    const tray = el("div", "craft-hist");
    const run = this.buildRunList();
    if (!run.length) {
      tray.innerHTML = `<span class="chip dim">${S.lang === "ko" ? "아직 담은 게 없다" : "Nothing stocked yet"}</span>`;
    } else {
      run.forEach((s, i) => {
        const chip = el("span", "chip rm", `${i + 1}. ${this.stepLabel(s)} ✕`);
        chip.addEventListener("click", () => { this.removeStep(s); this.goSlot(this.slot); });
        tray.appendChild(chip);
      });
    }
    wrap.appendChild(tray);

    const grid = el("div", "ing-grid");
    const queued = new Set(this.queue.map(x => x.kind + ":" + x.id));
    const ingCell = (ing, key, onClick) => {
      const cell = el("div", "ing-cell" + (queued.has(key) ? " sel" : ""));
      cell.dataset.key = key;
      const color = ing.color ? `background:linear-gradient(180deg,transparent 30%,rgba(${ing.color},.75) 30%)` : "";
      cell.innerHTML = `<div class="ing-bottle" style="${color}"></div><span>${T(ing.name)}</span>`;
      cell.addEventListener("click", onClick);
      return cell;
    };
    const section = (label, ings, keyOf, kind) => {
      if (!ings.length) return;
      grid.appendChild(el("div", "ing-group-label", label));
      const row = el("div", "ing-row");
      ings.forEach(ing => row.appendChild(ingCell(ing, keyOf(ing), () => this.toggleQueue(kind, ing.id))));
      grid.appendChild(row);
    };

    // 선반 재료 = 해금분 + 대본 지정 레시피의 잠긴 재료 (스토리가 시키는 잔은 재료도 꺼내준다)
    const avail = unlockedIngredients();
    const needIds = new Set(c.recipe.map(r => r.ingredient));
    if (c.fill) needIds.add(c.fill);
    const shelfIngs = avail.concat(
      shelfKind("ingredient").filter(i => needIds.has(i.id) && !avail.some(x => x.id === i.id)));

    section(S.lang === "ko" ? "따르기" : "Pour",
      shelfIngs.filter(i => ["base", "liqueur", "juice", "dairy", "wine_beer", "syrup"].includes(i.category)),
      i => "pour:" + i.id, "pour");
    section(S.lang === "ko" ? "스퀴즈" : "Squeeze",
      shelfIngs.filter(i => i.category === "fruit"), i => "squeeze:" + i.id, "squeeze");
    section(S.lang === "ko" ? "파우더" : "Powder",
      shelfIngs.filter(i => i.category === "powder"), i => "powder:" + i.id, "powder");
    section(S.lang === "ko" ? "필업 (잔 채우기)" : "Fill-up",
      shelfIngs.filter(i => i.category === "mixer"), i => "fill:" + i.id, "fill");

    wrap.appendChild(grid);
    // 도구는 ② 도구 선반에서 이미 골랐다 — 여기선 무엇을 담았는지만 알려준다
    const tools = this.queue.filter(x => x.kind === "tool").map(x => T(shelfOf(x.id).name));
    wrap.appendChild(el("p", "hint", (S.lang === "ko" ? "🛠 담은 도구: " : "🛠 Tools: ") +
      (tools.join(", ") || (S.lang === "ko" ? "없음" : "none")) +
      (S.lang === "ko" ? " · 🌿 가니시: " : " · 🌿 Garnish: ") +
      (this.attempt.garnish ? T(shelfOf(this.attempt.garnish).name) : (S.lang === "ko" ? "없음" : "none"))));

    wrap.appendChild(this.slotNav());
    this.setStage(wrap);
    this.applyGlow();
    this.coach("ing");
  },

  // 시작 — 담은 것을 순서대로 실행. 병(코르크/뚜껑)을 담았으면 따개도 있어야 한다
  startRun() {
    const c = this.chosen;
    if (!this.queue.some(x => x.kind !== "tool")) {
      toast(S.lang === "ko" ? "재료를 하나도 담지 않았다" : "No ingredients stocked"); return;
    }
    const corkedQueued = this.queue.some(x => x.kind === "pour" && this.CORK_BOTTLES.includes(x.id));
    const hasOpener = this.queue.some(x => x.kind === "tool" && x.id === "opener");
    if ((c.prep || corkedQueued) && !hasOpener) {
      toast(S.lang === "ko" ? "🔒 병을 열 '따개'를 담아야 한다" : "🔒 You need the opener to open the bottle");
      return;
    }
    this.runList = this.buildRunList();
    this.ri = 0;
    this.runNext();
  },

  // 큐의 다음 기믹을 실행. 각 기믹이 끝나면 afterGimmick()→runNext()로 이어진다
  runNext() {
    if (this.ri >= this.runList.length) return this.garnishInfo();
    const s = this.runList[this.ri++];
    if (s.t === "open") { s.prep === "cork" ? this.corkGimmick(s.bottle) : this.capGimmick(); return; }
    if (s.t === "pour") { const ln = this.lineFor(s.id, "pour") || {}; this.pourGimmick({ id: s.id, target: ln.qty || 0, unit: ln.unit || "oz" }); return; }
    if (s.t === "squeeze") { const ln = this.lineFor(s.id, "squeeze") || {}; this.squeezeGimmick({ id: s.id, target: ln.qty || 0, unit: "oz" }); return; }
    if (s.t === "powder") { const ln = this.lineFor(s.id, "powder") || {}; this.tapGimmick({ id: s.id, target: ln.qty || 0, unit: "tsp" }); return; }
    if (s.t === "mix") { s.tool === "shaker" ? this.shakeGimmick() : this.stirGimmick(); return; }
    if (s.t === "fill") { this.fillGimmick({ id: s.id }); return; }
  },

  // 기믹 하나가 끝나면 다음 기믹으로 (큐 소진 시 가니시로)
  afterGimmick() { this.runNext(); },

  // 따르기 — 시뮬레이터 방식: 자동으로 흘러나오고, 타이밍에 맞춰 탭하면 딱 멈춤
  pourGimmick(g) {
    const ing = ingOf(g.id);
    const rate = Math.max(g.unit === "ml" ? 14 : 1.0, (g.target || 2) / 2.4); // 목표까지 약 2.4초
    let amount = 0, flowing = false, last = performance.now();
    const wrap = el("div", "gimmick");
    wrap.innerHTML = `
      <h3>🍾 ${T(ing.name)} ${S.lang === "ko" ? "따르기" : "Pour"}</h3>
      <div class="pour-scene">
        <div class="pour-bottle" style="--bc:rgba(${ing.color || "200,200,200"},.9)"></div>
        <div class="pour-stream" style="background:rgba(${ing.color || "220,220,220"},.8)"></div>
        <div class="pour-visual">${glassSVG(this.attempt.glass || "highball", ing.color || this.chosen.color, 0)}</div>
      </div>
      <div class="gauge"><div class="gauge-target"></div><div class="gauge-fill"></div></div>
      <div class="gauge-num">0.00 / ${g.target || "?"} ${g.unit}</div>
      <button class="btn primary hold-btn stop-btn">${S.lang === "ko" ? "⏹ 멈추기!" : "⏹ Stop!"}</button>
      <p class="hint">${S.lang === "ko" ? "곧 자동으로 따라진다 — 목표선에서 탭!" : "Pouring starts automatically — tap at the line!"}</p>`;
    this.setStage(wrap);
    this.coach("pour");
    const fillEl = wrap.querySelector(".gauge-fill"), numEl = wrap.querySelector(".gauge-num"),
      targetEl = wrap.querySelector(".gauge-target"), glassEl = wrap.querySelector(".pour-visual"),
      stream = wrap.querySelector(".pour-stream"), bottle = wrap.querySelector(".pour-bottle");
    const maxShow = (g.target || 2) * 1.6;
    targetEl.style.left = (100 * (g.target || 2) / maxShow) + "%";
    const startDelay = setTimeout(() => { // 잠깐의 예열 후 자동 따르기 시작
      flowing = true; last = performance.now();
      bottle.classList.add("tilt"); stream.classList.add("on");
    }, 650);
    const timer = setInterval(() => {
      const now = performance.now();
      if (flowing) {
        amount += rate * (now - last) / 1000;
        fillEl.style.width = Math.min(100, 100 * amount / maxShow) + "%";
        fillEl.classList.toggle("over", g.target && amount > g.target * 1.12);
        numEl.textContent = `${amount.toFixed(2)} / ${g.target || "?"} ${g.unit}`;
        glassEl.innerHTML = glassSVG(this.attempt.glass || "highball", ing.color || this.chosen.color, Math.min(0.9, amount / maxShow));
      }
      last = now;
    }, 30);
    wrap.querySelector(".stop-btn").addEventListener("click", () => {
      clearTimeout(startDelay); clearInterval(timer);
      stream.classList.remove("on"); bottle.classList.remove("tilt");
      const k = "pour:" + g.id; // 같은 재료를 또 집으면 누적
      this.attempt.pours[k] = Math.round(((this.attempt.pours[k] || 0) + amount) * 100) / 100;
      setTimeout(() => this.afterGimmick(), 320);
    });
  },

  // 스퀴즈 — 누르는 동안 즙이 나오고, 떼면 확정 (시뮬레이터 방식)
  squeezeGimmick(g) {
    const ing = ingOf(g.id);
    const rate = Math.max(g.unit === "ml" ? 10 : 0.55, (g.target || 1) / 2.2);
    let amount = 0, holding = false, last = performance.now(), touched = false;
    const wrap = el("div", "gimmick");
    wrap.innerHTML = `
      <h3>🍋 ${T(ing.name)} ${S.lang === "ko" ? "스퀴즈" : "Squeeze"}</h3>
      <div class="pour-visual">${glassSVG(this.attempt.glass || "highball", ing.color || this.chosen.color, 0.2)}</div>
      <div class="gauge"><div class="gauge-target"></div><div class="gauge-fill"></div></div>
      <div class="gauge-num">0.00 / ${g.target || "?"} ${g.unit}</div>
      <button class="btn hold-btn sqz-btn">${S.lang === "ko" ? "🤏 쥐어짜기 (떼면 완료)" : "🤏 Squeeze (release to finish)"}</button>`;
    this.setStage(wrap);
    this.coach("squeeze");
    const fillEl = wrap.querySelector(".gauge-fill"), numEl = wrap.querySelector(".gauge-num"),
      targetEl = wrap.querySelector(".gauge-target");
    const maxShow = (g.target || 1) * 1.6;
    targetEl.style.left = (100 * (g.target || 1) / maxShow) + "%";
    const timer = setInterval(() => {
      const now = performance.now();
      if (holding) {
        amount += rate * (now - last) / 1000;
        fillEl.style.width = Math.min(100, 100 * amount / maxShow) + "%";
        fillEl.classList.toggle("over", g.target && amount > g.target * 1.12);
        numEl.textContent = `${amount.toFixed(2)} / ${g.target || "?"} ${g.unit}`;
      }
      last = now;
    }, 30);
    const btn = wrap.querySelector(".sqz-btn");
    btn.addEventListener("pointerdown", () => { holding = true; touched = true; btn.classList.add("squeezing"); });
    const up = () => {
      if (!touched || !holding) return;
      holding = false;
      clearInterval(timer); window.removeEventListener("pointerup", up);
      const k = "squeeze:" + g.id;
      this.attempt.pours[k] = Math.round(((this.attempt.pours[k] || 0) + amount) * 100) / 100;
      setTimeout(() => this.afterGimmick(), 320);
    };
    window.addEventListener("pointerup", up);
  },

  // 파우더 — 탭으로 스푼 추가
  tapGimmick(g) {
    const ing = ingOf(g.id);
    let count = 0;
    const wrap = el("div", "gimmick");
    wrap.innerHTML = `
      <h3>🥄 ${T(ing.name)} (${g.target || "?"} tsp)</h3>
      <div class="tap-count">0 tsp</div>
      <button class="btn hold-btn spoon-btn">${S.lang === "ko" ? "한 스푼 넣기" : "Add a spoon"}</button>
      <button class="btn ghost done-btn">${UI("ui_confirm")}</button>`;
    this.setStage(wrap);
    this.coach("powder");
    wrap.querySelector(".spoon-btn").addEventListener("click", () => {
      count++; wrap.querySelector(".tap-count").textContent = count + " tsp";
    });
    wrap.querySelector(".done-btn").addEventListener("click", () => {
      const k = "powder:" + g.id;
      this.attempt.pours[k] = (this.attempt.pours[k] || 0) + count;
      this.afterGimmick();
    });
  },

  // 병따기(따개·cap) — 3연타
  capGimmick() {
    let taps = 0;
    const wrap = el("div", "gimmick");
    wrap.innerHTML = `<h3>🍺 ${S.lang === "ko" ? "병따기" : "Pop the cap"}</h3>
      <button class="btn hold-btn cap-btn" style="font-size:40px">🔒</button>
      <p class="hint">${S.lang === "ko" ? "3번 두드려서 딴다" : "Tap 3 times"}</p>`;
    this.setStage(wrap);
    this.coach("cap");
    const btn = wrap.querySelector(".cap-btn");
    btn.addEventListener("click", () => {
      taps++;
      btn.style.transform = `rotate(${taps * 12}deg)`;
      if (taps >= 3) { btn.textContent = "🍺"; this.attempt.prepDone = "cap"; setTimeout(() => this.afterGimmick(), 450); }
    });
  },

  // 코르크 따기(따개·cork) — 조심조심 '천천히' 돌려야 한다. 급하게 돌리면 코르크가 부스러진다
  corkGimmick(bottleId) {
    const ing = ingOf(bottleId);
    const NEED = 2;                 // 2바퀴를 천천히
    const SPEED_LIMIT = 2.6;        // rad/s — 이보다 빠르면 무리가 감
    let total = 0, lastAng = null, lastT = 0, dragging = false, strainMs = 0, breaks = 0, done = false;
    const wrap = el("div", "gimmick");
    wrap.innerHTML = `<h3>🍷 ${T(ing.name)} — ${S.lang === "ko" ? "코르크 따기" : "Pull the cork"}</h3>
      <div class="stir-dial cork-dial"><div class="stir-rod"></div><div class="stir-center">🍾</div><div class="cork-crumbs"></div></div>
      <div class="tap-count">0.0 / ${NEED}</div>
      <p class="hint cork-hint">${S.lang === "ko" ? "천천히, 조심조심 돌려서 뽑는다 — 급하면 부스러진다!" : "Twist slowly and gently — rush it and it crumbles!"}</p>`;
    this.setStage(wrap);
    this.coach("cork");
    const dial = wrap.querySelector(".cork-dial"), rod = wrap.querySelector(".stir-rod"),
      count = wrap.querySelector(".tap-count"), hint = wrap.querySelector(".cork-hint"),
      crumbs = wrap.querySelector(".cork-crumbs");
    const angleAt = (e) => {
      const r = dial.getBoundingClientRect();
      return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2));
    };
    const crumble = () => {
      breaks++;
      this.attempt.corkQuality = Math.max(0.2, 1 - 0.4 * breaks);
      crumbs.innerHTML = "🍂".repeat(Math.min(breaks * 3, 9));
      dial.classList.add("shake-fail");
      hint.textContent = S.lang === "ko" ? "💥 코르크가 부스러졌다…! 더 천천히." : "💥 The cork crumbled...! Slower.";
      setTimeout(() => dial.classList.remove("shake-fail"), 350);
    };
    const onDown = (e) => { dragging = true; lastAng = angleAt(e); lastT = performance.now(); };
    const onMove = (e) => {
      if (!dragging || done) return;
      const now = performance.now(), a = angleAt(e);
      let d = a - lastAng;
      if (d > Math.PI) d -= Math.PI * 2;
      if (d < -Math.PI) d += Math.PI * 2;
      const dt = Math.max(1, now - lastT);
      const speed = Math.abs(d) / (dt / 1000);
      if (speed > SPEED_LIMIT) {                    // 너무 빠름 — 무리 누적
        strainMs += dt;
        dial.classList.add("strain");
        if (strainMs > 420 && breaks < 2) { strainMs = 0; crumble(); }
      } else { dial.classList.remove("strain"); strainMs = Math.max(0, strainMs - dt * 0.5); }
      total += Math.abs(d);
      lastAng = a; lastT = now;
      rod.style.transform = `rotate(${a}rad)`;
      const turns = total / (Math.PI * 2);
      count.textContent = `${turns.toFixed(1)} / ${NEED}`;
      if (turns >= NEED) {
        done = true;
        window.removeEventListener("pointermove", onMove); window.removeEventListener("pointerup", onUp);
        this.attempt.prepDone = "cork";
        this.attempt.opened[bottleId] = true;
        this.pendingBottle = null;
        count.textContent = this.attempt.corkQuality >= 1 ? "🍾 뽕!" : "🍾…💥";
        hint.textContent = this.attempt.corkQuality >= 1
          ? (S.lang === "ko" ? "깔끔하게 열렸다." : "A clean pull.")
          : (S.lang === "ko" ? "열리긴 했는데… 부스러기가 들어갔을지도." : "It's open... but there may be crumbs.");
        setTimeout(() => this.afterGimmick(), 700);
      }
    };
    const onUp = () => { dragging = false; lastAng = null; };
    dial.addEventListener("pointerdown", onDown);
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
  },

  // 필업 — 원클릭
  fillGimmick(g) {
    const ing = ingOf(g.id);
    const wrap = el("div", "gimmick");
    wrap.innerHTML = `<h3>⬆ ${T(ing.name)}</h3>
      <div class="pour-visual">${glassSVG(this.attempt.glass || "highball", this.chosen.color, 0.4)}</div>
      <button class="btn primary fill-btn">${S.lang === "ko" ? "잔 끝까지 채우기" : "Fill to the top"}</button>`;
    this.setStage(wrap);
    wrap.querySelector(".fill-btn").addEventListener("click", () => {
      this.attempt.fill = g.id;
      wrap.querySelector(".pour-visual").innerHTML = glassSVG(this.attempt.glass || "highball", this.chosen.color, 0.9);
      setTimeout(() => this.afterGimmick(), 420);
    });
  },

  // 셰이크(도구: 셰이커) — 자유형: 원하는 만큼 흔들고 스스로 멈춘다. 몇 번이 적당한지는 레시피 노트가 힌트
  shakeGimmick() {
    let strokes = 0, dragging = false, lastY = 0, dir = 0, travel = 0;
    const wrap = el("div", "gimmick");
    wrap.innerHTML = `<h3>🫨 ${S.lang === "ko" ? "셰이킹! 위아래로 흔들어라" : "Shake! Drag up & down"}</h3>
      <div class="shake-track"><div class="shake-puck">🥤</div></div>
      <div class="tap-count">0</div>
      <button class="btn primary done-btn">${S.lang === "ko" ? "그만 흔들기 ✓" : "Enough ✓"}</button>
      <p class="hint">${S.lang === "ko" ? "덜 흔들면 안 섞이고, 너무 흔들면 죽는 맛이 있다" : "Too little won't mix; too much kills the drink"}</p>`;
    this.setStage(wrap);
    this.coach("shake");
    const track = wrap.querySelector(".shake-track"), puck = wrap.querySelector(".shake-puck"),
      count = wrap.querySelector(".tap-count");
    const onDown = (e) => { dragging = true; lastY = e.clientY; dir = 0; travel = 0; };
    const onMove = (e) => {
      if (!dragging) return;
      const dy = e.clientY - lastY; lastY = e.clientY;
      if (!dy) return;
      const rect = track.getBoundingClientRect();
      const ratio = track.offsetHeight / rect.height || 1;
      const y = Math.min(Math.max((e.clientY - rect.top) * ratio, 24), track.offsetHeight - 24);
      puck.style.top = (y - 24) + "px";
      const nd = dy > 0 ? 1 : -1;
      if (nd === dir) { travel += Math.abs(dy); return; }
      if (dir !== 0 && travel > 26) { strokes++; count.textContent = String(strokes); }
      dir = nd; travel = Math.abs(dy);
    };
    const onUp = () => dragging = false;
    track.addEventListener("pointerdown", onDown);
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    wrap.querySelector(".done-btn").addEventListener("click", () => {
      window.removeEventListener("pointermove", onMove); window.removeEventListener("pointerup", onUp);
      this.attempt.usedTool = "shaker";
      this.attempt.shakeStrokes = strokes;
      this.afterGimmick();
    });
  },

  // 스터(도구: 믹싱 글라스 & 바 스푼) — 자유형: 원하는 바퀴수만큼 젓고 스스로 멈춘다 (스터 3바퀴 / 빌드 1바퀴가 정답)
  stirGimmick() {
    let total = 0, lastAng = null, dragging = false;
    const wrap = el("div", "gimmick");
    wrap.innerHTML = `<h3>🌀 ${S.lang === "ko" ? "스터 — 원을 그리며 젓는다" : "Stir — draw smooth circles"}</h3>
      <div class="stir-dial"><div class="stir-rod"></div><div class="stir-center">🥄</div></div>
      <div class="tap-count">0.0</div>
      <button class="btn primary done-btn">${S.lang === "ko" ? "그만 젓기 ✓" : "Enough ✓"}</button>
      <p class="hint">${S.lang === "ko" ? "레시피마다 알맞은 바퀴 수가 있다" : "Each recipe has its right number of turns"}</p>`;
    this.setStage(wrap);
    this.coach("stir");
    const dial = wrap.querySelector(".stir-dial"), rod = wrap.querySelector(".stir-rod"),
      count = wrap.querySelector(".tap-count");
    const angleAt = (e) => {
      const r = dial.getBoundingClientRect();
      return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2));
    };
    const onDown = (e) => { dragging = true; lastAng = angleAt(e); };
    const onMove = (e) => {
      if (!dragging) return;
      const a = angleAt(e);
      let d = a - lastAng;
      if (d > Math.PI) d -= Math.PI * 2;
      if (d < -Math.PI) d += Math.PI * 2;
      total += Math.abs(d);
      lastAng = a;
      rod.style.transform = `rotate(${a}rad)`;
      count.textContent = (total / (Math.PI * 2)).toFixed(1);
    };
    const onUp = () => { dragging = false; lastAng = null; };
    dial.addEventListener("pointerdown", onDown);
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    wrap.querySelector(".done-btn").addEventListener("click", () => {
      window.removeEventListener("pointermove", onMove); window.removeEventListener("pointerup", onUp);
      this.attempt.usedTool = "mixing_glass";
      this.attempt.stirTurns = total / (Math.PI * 2);
      this.afterGimmick();
    });
  },

  // ---------- 6) 완성 화면 — 플레이어가 '고른' 가니시로 장식된다 (v1.9)
  // 정답 가니시가 아니라 선택한 가니시를 보여준다. 맞았는지는 판정 화면에서 알게 된다.
  garnishInfo() {
    const c = this.chosen, picked = this.attempt.garnish;
    const wrap = el("div", "gimmick garnish-info");
    const gname = picked ? T(shelfOf(picked).name) : (S.lang === "ko" ? "장식 없이" : "no garnish");
    wrap.innerHTML = `<h3>🌿 ${S.lang === "ko" ? "완성" : "Finished"}</h3>
      <div class="pour-visual">${glassSVG(this.attempt.glass || "bottle", c.color, 0.85)}</div>
      <p>${S.lang === "ko" ? "잔에 옮겨 담고 장식을 올린다." : "Poured into the glass and garnished."}</p>
      <p class="garnish-name">— ${gname}</p>
      <button class="btn primary">${UI("ui_next")} ▶</button>`;
    this.setStage(wrap);
    wrap.querySelector("button").addEventListener("click", () => this.score());
  },

  // ---------- 7) 판정 (⑧문서 공식) ----------
  score() {
    clearInterval(this.timerHandle);
    const c = this.chosen, a = this.attempt;
    const rows = [];
    let total = 0, weight = 0;
    const add = (label, s, note) => { total += s; weight += 1; rows.push({ label, s, note }); };
    const scoreQty = (target, actual) => {
      if (!target) return actual > 0 ? 0 : 1;
      return Math.max(0, 1 - Math.abs(target - actual) / target);
    };
    // 시간
    const elapsed = this.elapsed(), limit = c.time_limit_sec;
    const timeS = elapsed <= limit ? 1 : Math.max(0, limit / elapsed);
    add(S.lang === "ko" ? `제한 시간 ${limit}s` : `Time ${limit}s`, timeS, `${elapsed.toFixed(1)}s`);
    // 잔
    const glassOk = a.glass === c.glass;
    add(S.lang === "ko" ? "잔 선택" : "Glass", glassOk ? 1 : 0, glassOk ? "✓" : "✗");
    // 병 개봉(prep) — cap: 땄는가 / cork: 얼마나 조심스럽게 땄는가
    if (c.prep) {
      const s = a.prepDone !== c.prep ? 0 : (c.prep === "cork" ? a.corkQuality : 1);
      add(c.prep === "cork" ? (S.lang === "ko" ? "코르크" : "Cork") : (S.lang === "ko" ? "병따기" : "Cap"),
        s, a.prepDone !== c.prep ? "✗" : (s >= 1 ? "✓" : "💥"));
    }
    // 믹스 — 올바른 도구 + 알맞은 양 (shake 8회 / stir 3바퀴 / build 1바퀴)
    if (c.mix === "shake") {
      const s = a.usedTool === "shaker" ? scoreQty(8, a.shakeStrokes) : 0;
      add(S.lang === "ko" ? "셰이킹" : "Shake", s, a.usedTool === "shaker" ? `×${a.shakeStrokes}` : "✗");
    } else if (c.mix === "stir" || c.mix === "build") {
      const need = c.mix === "stir" ? 3 : 1;
      const s = a.usedTool === "mixing_glass" ? scoreQty(need, a.stirTurns) : 0;
      add(c.mix === "stir" ? (S.lang === "ko" ? "스터" : "Stir") : (S.lang === "ko" ? "빌드(젓기)" : "Build"),
        s, a.usedTool === "mixing_glass" ? `×${a.stirTurns.toFixed(1)}` : "✗");
    }
    // 레시피 라인
    c.recipe.forEach(r => {
      const actual = a.pours[r.action + ":" + r.ingredient] || 0;
      const s = scoreQty(r.qty, actual);
      add(`${T(ingOf(r.ingredient).name)} ${r.qty}${r.unit}`, s, `${actual}${r.unit}`);
    });
    // 필
    if (c.fill) {
      const ok = a.fill === c.fill;
      add(S.lang === "ko" ? "필업" : "Fill", ok ? 1 : 0, ok ? "✓" : "✗");
    }
    // 가니시 — v1.9부터 플레이어가 고르는 채점 항목 (정답이 '없음'인 칵테일은 없음을 골라야 맞다)
    {
      const want = c.garnish || null, got = a.garnish || null;
      const ok = want === got;
      add(S.lang === "ko" ? "가니시" : "Garnish", ok ? 1 : 0,
        ok ? "✓" : (got ? T(shelfOf(got).name) : (S.lang === "ko" ? "없음" : "none")));
    }
    // 불필요 행동 — 레시피에 없는 투입 / 안 쓰는 도구 / 안 따도 되는 병 (건당 -50%)
    const needKeys = new Set(c.recipe.map(r => r.action + ":" + r.ingredient));
    let extras = Object.keys(a.pours).filter(k => !needKeys.has(k)).length;
    if (c.mix === "none" && a.usedTool) extras++;
    if (!c.prep && a.prepDone) extras++;
    if (c.fill == null && a.fill) extras++;
    if (extras) add(S.lang === "ko" ? "불필요한 행동" : "Extras", Math.max(0, 1 - 0.5 * extras), `×${extras}`);
    const pct = weight ? Math.round(total / weight * 100) : 0;
    const grade = gradeForPct(pct);
    this.showResult(pct, grade, rows);
  },

  showResult(pct, grade, rows) {
    const c = this.chosen;
    const wrap = el("div", "craft-result");
    wrap.innerHTML = `
      <div class="result-glass">${glassSVG(this.attempt.glass || "bottle", c.color, 0.82)}</div>
      <div class="result-grade grade-${grade}">${grade.toUpperCase()}</div>
      <div class="result-pct">${T(c.name)} · ${pct}%</div>
      <div class="result-rows">${rows.map(r =>
        `<div class="rrow ${r.s > 0.85 ? "ok" : r.s > 0.4 ? "mid" : "bad"}"><span>${r.label}</span><span>${r.note} (${Math.round(r.s * 100)}%)</span></div>`).join("")}</div>`;
    const done = el("button", "btn primary", UI("ui_confirm"));
    done.addEventListener("click", () => {
      this.close({ pct, grade, cocktail: c, isCorrect: this.isCorrect });
    });
    wrap.appendChild(done);
    this.setStage(wrap);
  },
};

document.addEventListener("DOMContentLoaded", () => {
  $("#note-close").addEventListener("click", () => $("#ov-note").classList.remove("show"));
});

</script>
<script>
// ===== 바 내부 — 포커스 카메라 + 좌석 3 상태머신 =====
// 1부: 한 화면에 손님 1명(포커스), 좌우는 잘린 실루엣. 플레이어가 슬롯을 옮겨 다니며 응대.
// 2부: 슬롯 3개 중 최대 2명 — 1명이면 포커스 줌, 2명이면 자동으로 카메라가 넓어져 둘 다 프레이밍.
"use strict";

const VIEW_W = 1280;
const SLOT_X = [640, 1300, 1960];   // 좌석 간격 660 → 포커스 시 이웃 손님 실루엣이 화면 가장자리에 ~45px 걸림

const BarCam = {
  cx: SLOT_X[1], zoom: 1,
  apply(cx, zoom, instant) {
    this.cx = cx; this.zoom = zoom;
    const w = $("#bar-world");
    w.style.transition = instant ? "none" : "transform .55s cubic-bezier(.4,0,.2,1)";
    w.style.transform = `translateX(${VIEW_W / 2 - cx * zoom}px) scale(${zoom})`;
  },
};

function makeSeat(i) {
  return { index: i, state: "empty", guest: null, result: null, discontent: 0, threshold: 0, callStage: 1, nextIdleAt: 0, idleUntil: 0 };
}

const Bar = {
  seats: [makeSeat(0), makeSeat(1), makeSeat(2)],
  slots: [], slotIdx: 0, nextSpawnAt: 0,
  paused: false, active: false, mode: "part1",
  focus: 1,
  pendingSeat: null, resolveDay: null, tickHandle: null,

  // ---------- 모드/카메라 ----------
  setMode(mode) {
    this.mode = mode;
    if (mode === "story") {
      this.focus = 1;
      this.renderSeats(); // 1부 실루엣(dim) 해제
      this.storyFrame();
      $("#slot-nav").style.display = "none";
    } else {
      $("#slot-nav").style.display = this.active ? "flex" : "none";
      this.focusSlot(this.focus, true);
    }
    this.updateIndicator();
  },

  focusSlot(i, instant) {
    if (this.mode !== "part1") return;
    this.focus = Math.max(0, Math.min(2, i));
    BarCam.apply(SLOT_X[this.focus], 1, instant);
    this.renderSeats();
    this.updateIndicator();
  },

  // 2부 — 스탠디 자동 프레이밍 (1명: 줌인 / 2명: '딱 2좌석 창'만 줌아웃)
  // 좌석 배치가 인접 강제(dialogue.castAdd)라 3좌석 와이드는 절대 안 나온다 — 배경 리소스 절약.
  TWO_SEAT_SPAN: 660 + 760,   // 인접 좌석 간격 + 좌우 손님 몸통 여유 → zoom ≈ 0.90
  storyFrame() {
    const occupied = this.seats.map(s => s.index).filter(i =>
      $(`.seat[data-seat="${i}"] .standee`));
    this.updateIndicator();
    if (!occupied.length) { BarCam.apply(SLOT_X[1], 0.92); return; }
    if (occupied.length === 1) { BarCam.apply(SLOT_X[occupied[0]], 1); return; }
    const xs = occupied.map(i => SLOT_X[i]);
    const zoom = VIEW_W / this.TWO_SEAT_SPAN;          // 항상 2좌석 고정 줌 (인접 전제)
    BarCam.apply((Math.min(...xs) + Math.max(...xs)) / 2, zoom);
  },

  // ---------- 진입점: 그날의 1부 ----------
  runPart1(day) {
    return new Promise(resolve => {
      this.resolveDay = resolve;
      this.slots = DATA.schedule.guest_slots.filter(g => g.day === day).sort((a, b) => a.seq - b.seq);
      if (!this.slots.length) { resolve(); return; }
      this.slotIdx = 0;
      this.nextSpawnAt = performance.now() + 2500;
      this.seats = [makeSeat(0), makeSeat(1), makeSeat(2)];
      this.active = true; this.paused = false; this.pendingSeat = null;
      this.setMode("part1");
      this.renderSeats(); this.renderCoaster(); this.renderGlassTray();
      $("#btn-close-early").style.display = "block";
      $("#slot-nav").style.display = "flex";
      this.tickHandle = setInterval(() => this.tick(), 200);
      this.updateRemain(); this.updateIndicator();
    });
  },

  endPart1() {
    this.active = false;
    clearInterval(this.tickHandle);
    $("#btn-close-early").style.display = "none";
    $("#slot-nav").style.display = "none";
    $("#hud-remain").textContent = "";
    const fn = this.resolveDay; this.resolveDay = null;
    if (fn) fn();
  },

  closeEarly() {
    if (!this.active) return;
    this.slotIdx = this.slots.length;
    this.seats.forEach(s => { if (s.state !== "empty") Object.assign(s, makeSeat(s.index)); });
    this.renderSeats(); this.renderGlassTray(); this.updateIndicator();
    this.checkEnd();
  },

  updateRemain() {
    const seated = this.seats.filter(s => s.state !== "empty").length;
    const remain = (this.slots.length - this.slotIdx) + seated;
    $("#hud-remain").textContent = this.active ? `👥 ${remain}` : "";
  },

  // ---------- 스폰 ----------
  trySpawn(now) {
    if (this.slotIdx >= this.slots.length || now < this.nextSpawnAt) return;
    const seat = this.seats.find(s => s.state === "empty");
    if (!seat) return;
    const slot = this.slots[this.slotIdx++];
    if (this.slotIdx < this.slots.length)
      this.nextSpawnAt = now + this.slots[this.slotIdx].delay_sec * 1000;
    const pool = unlockedCocktails().filter(c => c.tier === slot.tier);
    const cocktail = pool.length ? pick(pool) : pick(unlockedCocktails());
    const isCameo = !!slot.character;
    const ch = isCameo ? charOf(slot.character) : null;
    const personality = slot.personality || pick(DATA.master.personalities).id;
    seat.state = "entering";
    seat.guest = {
      name: isCameo ? T(ch.name) : pick(GUEST_NAMES),
      color: isCameo ? ch.name_color : pick(GUEST_COLORS),
      voice: isCameo ? slot.character : personality,
      character: isCameo ? slot.character : null,
      personality,
      cameoScene: slot.cameo_scene || null,
      target: cocktail,
      round: 1, maxRounds: slot.max_rounds || 1,
      isCorrect: null,
    };
    toast(S.lang === "ko" ? "🚪 손님이 들어왔다" : "🚪 A guest walked in");
    this.renderSeats(); this.updateRemain(); this.updateIndicator();
    setTimeout(() => {
      if (seat.state !== "entering") return;
      seat.state = "waitingCoaster";
      seat.discontent = 0;
      seat.threshold = Math.max(CFG.coaster_min_sec, CFG.coaster_base_sec - S.day * CFG.coaster_per_tier_sec);
      seat.callStage = 1;
      seat.float = bark(seat.guest.voice, "call");
      this.renderSeats(); this.updateIndicator();
    }, 1100);
  },

  // ---------- 코스터 → 주문 3박자 플로우 (루나 질문 → 손님 고민 → 주문) ----------
  onCoasterDrop(seatIndex) {
    if (seatIndex === null || seatIndex !== this.focus) return; // 포커스한 손님만 응대 가능
    const s = this.seats[seatIndex];
    if (!s || s.state !== "waitingCoaster") return;
    this.startOrder(s);
  },

  async startOrder(s) {
    s.state = "ordering"; // 대화 박자 동안은 인내심 정지
    s.float = "";
    this.renderSeats();
    lunaSay(bark("luna", "ask_order"));
    await sleep(1100);
    if (s.state !== "ordering") return;
    s.float = bark(s.guest.voice, "order_think");
    this.renderSeats();
    await sleep(1300 + Math.random() * 900);
    if (s.state !== "ordering") return;
    s.state = "waitingMake";
    s.discontent = 0;
    s.threshold = Math.max(
      s.guest.target.time_limit_sec + CFG.serve_min_bonus_sec,
      s.guest.target.time_limit_sec + CFG.serve_bonus_sec - S.day * CFG.serve_per_tier_sec);
    s.callStage = 1;
    s.nextIdleAt = performance.now() + 8000 + Math.random() * 5000;
    const situ = s.guest.round > 1 ? "reorder" : "order";
    s.float = bark(s.guest.voice, situ).replace("{cocktail}", T(s.guest.target.name));
    this.renderSeats(); this.updateIndicator();
  },

  async onSeatTap(seatIndex) {
    if (this.mode !== "part1") return;
    if (seatIndex !== this.focus) { this.focusSlot(seatIndex); return; } // 다른 슬롯 클릭 = 이동
    const s = this.seats[seatIndex];
    if (!s || s.state !== "waitingMake" || this.paused || Dlg.running) return;
    this.pendingSeat = seatIndex;
    s.state = "making";
    this.paused = true; // §3.5 제조 중 전 좌석 인내심 정지
    this.renderSeats(); this.updateIndicator();
    const res = await Craft.open({ target: s.guest.target.id });
    this.paused = false;
    s.result = res;
    s.guest.isCorrect = res.isCorrect;
    this.showReview(s);
  },

  showReview(s) {
    const ov = $("#ov-review");
    const r = s.result;
    $("#review-body").innerHTML = `
      <div class="result-glass">${glassSVG(r.cocktail.glass || "bottle", r.cocktail.color, 0.8)}</div>
      <h3>${T(r.cocktail.name)} · <span class="grade-${r.grade}">${r.grade.toUpperCase()} ${r.pct}%</span></h3>
      <p class="critic">${this.criticLine(r.grade)}</p>`;
    ov.classList.add("show");
    $("#btn-review-serve").onclick = () => { ov.classList.remove("show"); this.confirmDrink(s); };
    $("#btn-review-discard").onclick = () => {
      ov.classList.remove("show");
      s.result = null; s.state = "waitingMake"; this.pendingSeat = null;
      toast(S.lang === "ko" ? "🗑 잔을 버렸다 — 다시 제조" : "🗑 Discarded — make it again");
      this.renderSeats(); this.updateIndicator();
    };
  },
  criticLine(grade) {
    const ko = { excellent: "크리스: \"…제법이군. 금방 유명해지겠는데?\"", good: "크리스: \"나쁘지 않은 솜씨야.\"", decent: "크리스: \"음… 그럭저럭이군.\"", poor: "크리스: \"다시 연습이 필요해 보여.\"", sewage: "크리스: \"손님한테 이걸 낼 순 없지 않나?\"" };
    const en = { excellent: "Chris: \"...Not bad at all. You'll be famous soon.\"", good: "Chris: \"Decent work.\"", decent: "Chris: \"Hm... passable.\"", poor: "Chris: \"You need more practice.\"", sewage: "Chris: \"You can't serve THIS to a customer.\"" };
    return (S.lang === "ko" ? ko : en)[grade];
  },

  confirmDrink(s) {
    s.state = "waitingServe";
    this.pendingSeat = null;
    this.renderSeats(); this.renderGlassTray(); this.updateIndicator();
  },

  onGlassDrop(fromSeat, dropSeat) {
    if (fromSeat !== dropSeat || dropSeat !== this.focus) return;
    const s = this.seats[fromSeat];
    if (!s || s.state !== "waitingServe") return;
    this.serve(s);
  },

  // ---------- 서빙 → 반응 → 정산/퇴장 ----------
  async serve(s) {
    s.state = "reacting"; s.float = "";
    this.renderSeats(); this.renderGlassTray(); this.updateIndicator();
    const g = s.guest, r = s.result;
    const say = (txt) => { s.float = txt; this.renderSeats(); };
    say(g.isCorrect ? bark(g.voice, "react_" + r.grade) : bark(g.voice, "wrong_receive"));
    await sleep(1400);
    say(S.lang === "ko" ? "( 마시는 중… )" : "( drinking... )");
    await sleep(1200);
    if (!g.isCorrect) { say(bark(g.voice, "wrong_drink")); await sleep(1400); }

    // 정산 = balance.grade_payout 표대로 (v1.9). revenue_mult 음수 = 배상.
    // sewage와 오제조만 배상(-1.0), poor는 배상 없이 팁만 없음.
    const price = r.cocktail.price;
    const pers = DATA.master.personalities.find(p => p.id === g.personality);
    const pay = (DATA.balance.grade_payout || {})[r.grade] || { revenue_mult: 1, tip_mult: 0 };
    const revMult = g.isCorrect ? pay.revenue_mult
                                : (DATA.balance.config.wrong_cocktail_revenue_mult ?? -1);
    const revenue = Math.round(price * revMult);
    const tip = g.isCorrect
      ? Math.max(0, Math.round(price * pay.tip_mult * (pers ? pers.tip_mult : 1))) : 0;
    const positive = revenue >= 0 && g.isCorrect;
    S.gold += revenue + tip;
    S.today.sales += revenue; S.today.tips += tip;
    const repD = positive ? (r.grade === "excellent" ? 2 : r.grade === "good" ? 1 : 0) : -2;
    S.rep += repD; S.today.repDelta += repD;
    if (g.isCorrect) {
      questOnServe(r.cocktail.id, r.grade);                             // serve:<칵테일> 퀘스트 목표
      if (g.character) { S.met.add(g.character); applyTasteAffinity(g.character, r.cocktail, r.grade); } // 카메오 취향 호감 + 수첩 해금
    }
    updateHUD();

    // 다회 주문 — 코스터 없이 곧장 다음 잔 (§3.8)
    if (positive && g.round < g.maxRounds) {
      g.round++;
      const pool = unlockedCocktails().filter(c => c.tier === r.cocktail.tier);
      g.target = pool.length ? pick(pool) : g.target;
      s.result = null;
      await sleep(800);
      this.startOrder(s);
      return;
    }

    say((positive ? bark(g.voice, "bye_good") : bark(g.voice, "bye_bad")) + ` (${revenue + tip >= 0 ? "+" : ""}${revenue + tip}G)`);
    await sleep(1400);

    if (g.cameoScene) { // 카메오 — 퇴장 전 짧은 씬
      this.paused = true;
      await Dlg.runScene(g.cameoScene);
      this.paused = false;
    }
    S.today.served++; S.stats.servedTotal++;
    this.clearSeat(s);
  },

  angryLeave(s) {
    const kind = s.state === "waitingCoaster" ? "coaster" : "serve";
    const repD = kind === "coaster" ? CFG.leave_coaster_rep : CFG.leave_serve_rep;
    S.rep += repD; S.today.repDelta += repD;
    S.today.angry++; S.stats.angryTotal++;
    s.float = bark(s.guest.voice, kind === "coaster" ? "leave_coaster" : "leave_serve");
    s.state = "angryLeft";
    this.renderSeats(); this.renderGlassTray(); updateHUD(); this.updateIndicator();
    setTimeout(() => this.clearSeat(s), 1400);
  },

  clearSeat(s) {
    Object.assign(s, makeSeat(s.index));
    this.renderSeats(); this.renderGlassTray(); this.updateRemain(); this.updateIndicator();
    this.checkEnd();
  },

  checkEnd() {
    if (!this.active) return;
    if (this.slotIdx >= this.slots.length && this.seats.every(s => s.state === "empty")) this.endPart1();
  },

  // ---------- 틱 ----------
  tick() {
    if (!this.active) return;
    const now = performance.now();
    if (!this.paused && !Dlg.running) this.trySpawn(now);
    if (this.paused || Dlg.running) return; // §3.5
    this.seats.forEach(s => {
      if (!["waitingCoaster", "waitingMake", "waitingServe"].includes(s.state)) return;
      const pers = DATA.master.personalities.find(p => p.id === s.guest.personality);
      s.discontent += 0.2 / (pers ? pers.patience_mult : 1);
      if (s.discontent >= s.threshold) { this.angryLeave(s); return; }
      const pct = s.discontent / s.threshold;
      const stage = pct >= CFG.warn_red_ratio ? 3 : pct >= CFG.warn_yellow_ratio ? 2 : 1;
      if (stage !== s.callStage) {
        s.callStage = stage; s.idleUntil = 0;
        if (s.state === "waitingCoaster")
          s.float = bark(s.guest.voice, stage === 3 ? "call_final" : stage === 2 ? "call_urge" : "call");
        else
          s.float = bark(s.guest.voice, stage === 3 ? "serve_final" : "serve_urge");
        this.renderSeats();
      } else if (stage === 1 && s.state !== "waitingCoaster" && now >= s.nextIdleAt) {
        // 한적한 바의 공기 — 기다리는 손님이 이따금 혼잣말을 한다
        s.nextIdleAt = now + 9000 + Math.random() * 7000;
        s.idleUntil = now + 3200;
        s.prevFloat = s.float;
        s.float = bark(s.guest.voice, "idle");
        this.renderSeats();
      } else if (s.idleUntil && now >= s.idleUntil) {
        s.idleUntil = 0;
        s.float = s.prevFloat || s.float;
        this.renderSeats();
      } else {
        this.renderBar(s);
      }
    });
    this.updateIndicator();
  },

  // ---------- 렌더 ----------
  renderSeats() {
    this.seats.forEach(s => {
      const elm = $(`.seat[data-seat="${s.index}"]`);
      elm.classList.toggle("dim", this.mode === "part1" && s.index !== this.focus);
      const guestEl = elm.querySelector(".seat-guest");
      const floatEl = elm.querySelector(".float-text");
      const barEl = elm.querySelector(".discontent-bar");
      const coasterEl = elm.querySelector(".seat-coaster");
      if (guestEl.querySelector(".standee")) return; // 2부 스탠디 보호
      guestEl.innerHTML = "";
      floatEl.classList.remove("show");
      barEl.style.visibility = "hidden";
      coasterEl.className = "seat-coaster";
      if (s.state === "empty") return;
      if (s.state === "entering") {
        guestEl.innerHTML = `<div class="guest-fig entering" style="--gc:#666"><span class="guest-face">…</span></div>`;
        return;
      }
      const g = s.guest;
      guestEl.innerHTML = `<div class="guest-fig ${s.state === "angryLeft" ? "angry" : ""}" style="--gc:${g.color}">
        <span class="guest-face">${g.cameoScene ? "★" : "●"}</span>
        <span class="guest-name" style="color:${g.color}">${g.name}</span></div>`;
      if (s.float && s.index === this.focus) { floatEl.textContent = s.float; floatEl.classList.add("show"); }
      if (["waitingCoaster", "waitingMake", "waitingServe"].includes(s.state) && s.index === this.focus) {
        barEl.style.visibility = "visible"; this.renderBar(s);
      }
      if (["ordering", "waitingMake", "making", "waitingServe", "reacting"].includes(s.state)) {
        coasterEl.classList.add("placed");
        if ((s.state === "waitingServe" || s.state === "reacting") && s.result)
          coasterEl.classList.add("with-glass");
      }
    });
  },
  renderBar(s) {
    if (s.index !== this.focus) return;
    const fill = $(`.seat[data-seat="${s.index}"] .discontent-fill`);
    if (!fill) return;
    const pct = Math.min(100, s.discontent / s.threshold * 100);
    fill.style.width = pct + "%";
    fill.style.background = pct >= 80 ? "#e04a3a" : pct >= 50 ? "#e0c23a" : "#3ad13a";
  },

  // 슬롯 인디케이터 — ①문서 §3.2: 색/점멸로 곁눈질 판단
  updateIndicator() {
    const wrap = $("#slot-indicator");
    if (!wrap.children.length) {
      for (let i = 0; i < 3; i++) {
        const cell = el("div", "ind-cell");
        cell.dataset.slot = i;
        cell.innerHTML = `<div class="ind-dot"></div><span class="ind-label">${i + 1}</span>`;
        cell.addEventListener("click", () => this.focusSlot(i));
        wrap.appendChild(cell);
      }
    }
    this.seats.forEach(s => {
      const cell = wrap.children[s.index];
      const dot = cell.querySelector(".ind-dot");
      cell.classList.toggle("focused", this.mode === "part1" && s.index === this.focus);
      let cls = "ind-dot";
      if (this.mode === "story") {
        if ($(`.seat[data-seat="${s.index}"] .standee`)) cls += " on";
      } else if (s.state === "entering") cls += " on blink";
      else if (s.state !== "empty") {
        const pct = s.threshold ? s.discontent / s.threshold : 0;
        if (["waitingCoaster", "waitingMake", "waitingServe"].includes(s.state) && pct >= CFG.warn_red_ratio) cls += " danger blink";
        else if (["waitingCoaster", "waitingMake", "waitingServe"].includes(s.state) && pct >= CFG.warn_yellow_ratio) cls += " warn";
        else cls += " on";
      }
      dot.className = cls;
    });
  },

  renderCoaster() {
    const tray = $("#coaster-tray");
    tray.innerHTML = `<div class="coaster-pile"></div>`;
    const top = el("div", "coaster-top", "◯");
    top.title = S.lang === "ko" ? "코스터 — 손님에게 드래그" : "Coaster — drag to the guest";
    makeDraggable(top, idx => this.onCoasterDrop(idx));
    tray.appendChild(top);
  },
  renderGlassTray() {
    const tray = $("#glass-tray");
    tray.innerHTML = "";
    this.seats.forEach(s => {
      if (s.state !== "waitingServe" || !s.result) return;
      const chip = el("div", "glass-chip");
      chip.innerHTML = glassSVG(s.result.cocktail.glass || "bottle", s.result.cocktail.color, 0.78);
      chip.title = (S.lang === "ko" ? "드래그해서 서빙: " : "Drag to serve: ") + s.guest.name;
      makeDraggable(chip, idx => this.onGlassDrop(s.index, idx));
      tray.appendChild(chip);
    });
  },
};

const GUEST_NAMES = ["김서준", "이하윤", "박지우", "최민준", "정예은", "강도현", "윤서아", "임태양", "한소율", "오준혁"];
const GUEST_COLORS = ["#b9a58a", "#8aa5b9", "#a58ab9", "#8ab99b", "#b98a8a", "#9b8ab9"];

// 루나(바텐더) 말풍선 — 카운터 쪽에서 뜬다
let lunaSayTimer = null;
function lunaSay(text) {
  const b = $("#luna-bubble");
  b.textContent = "LUNA — " + text;
  b.classList.add("show");
  clearTimeout(lunaSayTimer);
  lunaSayTimer = setTimeout(() => b.classList.remove("show"), 2200);
}

// 포인터 드래그 (시뮬레이터 makeDraggable 이식)
function makeDraggable(elm, onDrop) {
  elm.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    const ghost = elm.cloneNode(true);
    ghost.classList.add("drag-ghost");
    document.body.appendChild(ghost);
    const place = (x, y) => { ghost.style.left = (x - 26) + "px"; ghost.style.top = (y - 26) + "px"; };
    place(e.clientX, e.clientY);
    $$(".seat").forEach(s => s.classList.add("droptarget"));
    const move = ev => place(ev.clientX, ev.clientY);
    const up = ev => {
      document.removeEventListener("pointermove", move);
      ghost.remove();
      $$(".seat").forEach(s => s.classList.remove("droptarget"));
      const t = document.elementFromPoint(ev.clientX, ev.clientY);
      const seatEl = t && t.closest(".seat");
      onDrop(seatEl ? parseInt(seatEl.dataset.seat, 10) : null);
    };
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", up, { once: true });
  });
}

</script>
<script>
// ===== 메인 — 하루 페이즈 머신 + 출퇴근/집/꿈/입고/정산 =====
// 페이즈 순서(설계서 §1): commute_in → stock_in → bar(1부→2부) → settlement → commute_out → home → sleep
"use strict";

// ---------- 출퇴근 횡스크롤 (짧은 두 블록 — 26.07.17 피드백으로 축소) ----------
// v1.9.6: 거리 축소(PD — 출퇴근이 너무 김) + Shift 달리기
const SPOT_X = { home_door: 70, street_mid: 330, street_board: 500, street_stall: 690, alley_in: 850, alley_deep: 960, elevator: 1060, bar_door: 1150 };
const STRIP_W = 1230;

const Commute = {
  phase: null, lunaX: 70, goal: null, resolveFn: null, keys: {}, rafHandle: null,

  async run(phase) {
    this.phase = phase;
    showScreen("screen-commute");
    $("#screen-commute").classList.toggle("rain", S.day === 1);   // day1 = 비 오는 거리 (데모 연출, 행인 없음)
    const goingIn = phase === "commute_in";
    this.lunaX = goingIn ? SPOT_X.home_door : SPOT_X.bar_door;
    this.goal = goingIn ? "bar_door" : "home_door";
    $("#commute-label").textContent = goingIn
      ? `🌃 ${UI("ui_stock_in") && ""}${S.lang === "ko" ? "출근길" : "To work"} — ${CFG.commute_in_time}`
      : `🌌 ${S.lang === "ko" ? "퇴근길" : "Heading home"} — ${CFG.commute_out_time}`;
    this.renderStrip();
    await Dlg.runPhaseScenes(S.day, phase); // auto 씬
    this.renderStrip();
    if (window.DEV_SKIPWALK) return; // 개발용: 걷기 구간 생략
    return new Promise(resolve => {
      this.resolveFn = resolve;
      this.loop();
    });
  },

  finish() {
    clearInterval(this.rafHandle);
    this.keys = {};
    const fn = this.resolveFn; this.resolveFn = null;
    if (fn) fn();
  },

  activePoints() {
    return DATA.schedule.points.filter(p =>
      (p.phase === this.phase || p.phase === "both") &&
      !S.usedPoints.has(p.id) &&                       // once 소진은 영구 (v1.9.4)
      evalWhen(p.when, { phase: this.phase }) &&
      this.resolvePointScene(p) !== null);             // conditional에 맞는 씬이 없으면 마커도 숨김
  },

  // ---------- 포인트 → 씬 해석 (Points.selection 4모드 — 구엔진 NPC flow 대응, v1.9.4) ----------
  // scene_or_shop이 "group:이름"이면 그 그룹의 씬들(seq 순) 중에서 고른다:
  //   once/repeat     : 그룹이면 when 통과한 첫 씬, 단일이면 그 씬
  //   sequential      : 볼 때마다 다음 씬(1→2→3), 다 보면 마지막 씬 반복 (구엔진 revisit_repeat 패턴)
  //   conditional     : when 통과한 첫 씬 = first-match (구엔진 시바 flow 패턴 — 1회성은 씬 when에 !flag, 폴백은 when 공란)
  resolvePointScene(p, consume) {
    const t = p.scene_or_shop;
    if (t.startsWith("shop:")) return t;
    if (!t.startsWith("group:")) return t;
    const g = t.slice(6);
    const pool = [];   // 전 스크립트에서 group 일치 + when 통과 씬 수집
    Object.values(DATA.scripts).forEach(sc => (sc.scenes || []).forEach(s => {
      if (s.group === g && evalWhen(s.when)) pool.push(s);
    }));
    pool.sort((a, b) => a.seq - b.seq);
    if (!pool.length) return null;
    if (p.selection === "sequential") {
      const i = Math.min(S.groupProgress[g] || 0, pool.length - 1);
      if (consume) S.groupProgress[g] = Math.min((S.groupProgress[g] || 0) + 1, pool.length - 1);
      return pool[i].id;
    }
    return pool[0].id;   // conditional/once/repeat: first-match
  },

  renderStrip() {
    const strip = $("#commute-strip");
    strip.innerHTML = "";
    // 배경 건물 실루엣
    for (let i = 0; i < 8; i++) {
      const b = el("div", "bldg");
      b.style.left = (i * 158 + 10) + "px";
      b.style.height = (80 + ((i * 53) % 120)) + "px";
      strip.appendChild(b);
    }
    // 지형지물: 바 / 집
    const barD = el("div", "landmark", "🍸<span>UNKNOWN</span>"); barD.style.left = SPOT_X.bar_door + "px"; strip.appendChild(barD);
    const homeD = el("div", "landmark", "🏠<span>HOME</span>"); homeD.style.left = SPOT_X.home_door + "px"; strip.appendChild(homeD);
    // 인터랙션 포인트
    this.activePoints().forEach(p => {
      const icon = p.kind === "shop" ? "🛒" : p.kind === "npc" ? "💬" : "❔";
      const m = el("div", "point-marker", `${icon}<span>${p.id.startsWith("p_news") ? (S.lang === "ko" ? "전광판" : "Board") : ""}</span>`);
      m.style.left = (SPOT_X[p.spot] || 400) + "px";
      m.dataset.point = p.id;
      strip.appendChild(m);
    });
    // 루나
    const luna = el("div", "luna-fig", `<div class="luna-body"></div><span>LUNA</span>`);
    luna.id = "luna-fig";
    luna.style.left = this.lunaX + "px";
    strip.appendChild(luna);
  },

  loop() { // setInterval — 백그라운드 탭에서도 동작 (RAF는 hidden에서 정지)
    const step = () => {
      const spd = this.keys.shift ? 8.6 : 4.4;   // Shift = 달리기 (v1.9.6)
      if (this.keys.left) this.lunaX = Math.max(30, this.lunaX - spd);
      if (this.keys.right) this.lunaX = Math.min(STRIP_W - 40, this.lunaX + spd);
      const luna = $("#luna-fig");
      if (luna) {
        luna.style.left = this.lunaX + "px";
        luna.classList.toggle("walking", !!(this.keys.left || this.keys.right));
        luna.classList.toggle("flip", !!this.keys.left);
      }
      // 카메라
      const view = $("#commute-view");
      const target = Math.max(0, Math.min(STRIP_W - view.clientWidth, this.lunaX - view.clientWidth / 2));
      $("#commute-strip").style.transform = `translateX(${-target}px)`;
      // 근처 포인트 / 목적지
      const near = this.activePoints().find(p => Math.abs((SPOT_X[p.spot] || 0) - this.lunaX) < 60);
      const nearGoal = Math.abs(SPOT_X[this.goal] - this.lunaX) < 70;
      const act = $("#btn-interact");
      if (near) {
        act.style.display = "block";
        act.textContent = near.kind === "shop" ? "🛒 " + (S.lang === "ko" ? "노점 보기" : "Shop") : "🔍 " + (S.lang === "ko" ? "조사하기" : "Look");
        act.dataset.point = near.id;
      } else if (nearGoal) {
        act.style.display = "block";
        act.textContent = this.goal === "bar_door" ? "🍸 " + (S.lang === "ko" ? "바에 들어가기" : "Enter the bar") : "🏠 " + (S.lang === "ko" ? "집에 들어가기" : "Go inside");
        act.dataset.point = "";
      } else act.style.display = "none";
    };
    this.rafHandle = setInterval(step, 28);
  },

  async interact(pointId) {
    if (!pointId) { this.finish(); return; }
    const p = DATA.schedule.points.find(x => x.id === pointId);
    if (!p) return;
    const target = this.resolvePointScene(p, true);   // consume=true → sequential 진행
    if (!target) return;
    if (target.startsWith("shop:")) { openShop(); return; }
    if (p.selection === "once") S.usedPoints.add(p.id);   // once만 소진 (영구)
    this.renderStrip();
    await Dlg.runScene(target);
    this.renderStrip();
  },

  moveToSpot(spotId) { // move 스텝
    return new Promise(resolve => {
      const target = SPOT_X[spotId] || this.lunaX;
      const t = setInterval(() => {
        const d = target - this.lunaX;
        const luna = $("#luna-fig");
        if (Math.abs(d) < 6) { clearInterval(t); if (luna) luna.classList.remove("walking"); resolve(); return; }
        this.lunaX += Math.sign(d) * 5;
        if (luna) { luna.style.left = this.lunaX + "px"; luna.classList.add("walking"); luna.classList.toggle("flip", d < 0); }
      }, 28);
    });
  },
};

// ---------- 집 내부 (v1.9.6 — PDF 배치도: 침실|문|TV|소파|창|테라스, 테라스는 우측 가려짐) ----------
const HOME_X = { bed: 190, door: 470, tv: 700, photo: 880, sofa: 1060, note: 1180, window: 1330, terrace: 1580 };
const HOME_W = 1760;

const Home = {
  mode: null, lunaX: 0, keys: {}, handle: null, resolveFn: null,

  // mode: "morning"(소파 기상→쪽지→현관 출근) / "evening"(현관 귀가→소파 '하루 마치기')
  run(mode) {
    this.mode = mode;
    showScreen("screen-home");
    $("#home-label").textContent = mode === "morning"
      ? (S.lang === "ko" ? "🏠 집 — 아침" : "🏠 Home — Morning")
      : (S.lang === "ko" ? "🏠 집 — 밤" : "🏠 Home — Night");
    this.lunaX = mode === "morning" ? HOME_X.sofa : HOME_X.door + 60;
    this.render();
    return new Promise(resolve => { this.resolveFn = resolve; this.loop(); });
  },

  finish() { clearInterval(this.handle); this.keys = {}; const fn = this.resolveFn; this.resolveFn = null; if (fn) fn(); },

  render() {
    const strip = $("#home-strip");
    strip.innerHTML = "";
    const put = (cls, x, label, extraCls) => {
      const d = el("div", "hm-obj " + (extraCls || ""), `<div class="${cls}"></div>${label ? `<span>${label}</span>` : ""}`);
      d.style.left = x + "px"; strip.appendChild(d); return d;
    };
    put("hm-bed", HOME_X.bed - 95, S.lang === "ko" ? "크리스의 침대" : "CHRIS");
    const wall = el("div", "hm-wall"); wall.style.left = "380px"; strip.appendChild(wall);
    put("hm-door", HOME_X.door - 42, S.lang === "ko" ? "현관" : "DOOR");
    put("hm-tv", HOME_X.tv - 75, "TV").querySelector(".hm-tv") && null;
    // TV 구조가 중첩이라 직접 구성
    strip.lastChild.innerHTML = `<div class="hm-tv"><div class="tv-screen"></div><div class="tv-base"></div></div><span>TV</span>`;
    put("hm-photo", HOME_X.photo - 30, "");
    put("hm-sofa", HOME_X.sofa - 100, S.lang === "ko" ? "소파" : "SOFA");
    const tbl = put("hm-table", HOME_X.note - 37, "");
    if (this.mode === "morning" && S.day === 1 && !S.flags.has("d1_note_read"))
      tbl.firstChild.innerHTML = '<div class="hm-note">📄</div>';
    put("hm-window", HOME_X.window - 48, "");
    // 테라스 존
    const terr = el("div", "hm-terrace",
      `<div class="hm-rail"></div>
       <div class="hm-tstool" style="left:60px"></div>
       <div class="hm-ttable" style="left:130px"></div>
       <div class="hm-tstool" style="left:220px"></div>`);
    strip.appendChild(terr);
    // 루나
    const luna = el("div", "luna-fig", `<div class="luna-body"></div><span>LUNA</span>`);
    luna.id = "home-luna"; luna.style.left = this.lunaX + "px";
    luna.style.bottom = "104px"; luna.style.position = "absolute";
    strip.appendChild(luna);
  },

  // 근처 상호작용 대상 계산 — 모드별로 다르다
  nearTarget() {
    const near = (x, r) => Math.abs(x - this.lunaX) < (r || 70);
    if (this.mode === "morning") {
      if (S.day === 1 && !S.flags.has("d1_note_read") && near(HOME_X.note)) return { key: "note", label: S.lang === "ko" ? "📄 쪽지 읽기" : "📄 Read note" };
      if (near(HOME_X.tv)) return { key: "tv", label: S.lang === "ko" ? "📺 TV 보기" : "📺 Watch TV" };
      if (near(HOME_X.door, 60)) return { key: "exit", label: S.lang === "ko" ? "🚪 출근하기" : "🚪 Head to work" };
    } else {
      if (near(HOME_X.tv)) return { key: "tv", label: S.lang === "ko" ? "📺 TV 보기" : "📺 Watch TV" };
      if (near(HOME_X.sofa, 90)) return { key: "sofa", label: "🛏 " + UI("ui_end_day") };
    }
    return null;
  },

  loop() {
    const step = () => {
      const spd = this.keys.shift ? 8.6 : 4.4;
      if (this.keys.left) this.lunaX = Math.max(60, this.lunaX - spd);
      if (this.keys.right) this.lunaX = Math.min(HOME_W - 60, this.lunaX + spd);
      const luna = $("#home-luna");
      if (luna) {
        luna.style.left = this.lunaX + "px";
        luna.classList.toggle("walking", !!(this.keys.left || this.keys.right));
        luna.classList.toggle("flip", !!this.keys.left);
      }
      const view = $("#home-view");
      const target = Math.max(0, Math.min(HOME_W - view.clientWidth, this.lunaX - view.clientWidth / 2));
      $("#home-strip").style.transform = `translateX(${-target}px)`;
      const near = this.nearTarget();
      const act = $("#btn-home-act");
      if (near && !Dlg.running) { act.style.display = "block"; act.textContent = near.label; act.dataset.key = near.key; }
