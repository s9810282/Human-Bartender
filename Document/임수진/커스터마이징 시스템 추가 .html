<style>
/* ===== L.U.N.A 웹 프로토타입 (1280×720) ===== */
* { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
html, body {
  margin: 0; padding: 0; height: 100%; overflow: hidden;
  background: #0b0a12;
  font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
  color: #eee2c8;
}
#stage {
  position: absolute; left: 50%; top: 50%;
  width: 1280px; height: 720px; margin: -360px 0 0 -640px;
  background: #12101c; overflow: hidden;
  box-shadow: 0 0 60px rgba(0,0,0,.8);
  transform-origin: center center;
  border-radius: 8px;
}

/* ---------- HUD ---------- */
#hud {
  position: absolute; top: 0; left: 0; right: 0; height: 46px; z-index: 50;
  display: flex; align-items: center; gap: 18px; padding: 0 16px;
  background: linear-gradient(180deg, #000b, transparent);
  font-size: 16px; font-weight: bold; pointer-events: none;
}
#hud > * { pointer-events: auto; }
#hud-gold { color: #ffd76a; }
#hud-rep { color: #9fd08f; }
#hud-remain { color: #e8b4ff; }
#btn-close-early { margin-left: auto; }
#hud-lang { margin-left: 8px; }

/* ---------- 공용 ---------- */
.screen { position: absolute; inset: 0; display: none; }
.screen.active { display: block; }
.btn {
  background: #2a2440; color: #eee2c8; border: 1px solid #57508a;
  border-radius: 9px; padding: 10px 18px; font-size: 15px; cursor: pointer;
  font-family: inherit; transition: transform .06s, background .15s;
}
.btn:hover { background: #372f56; }
.btn:active { transform: scale(.96); }
.btn.primary { background: #6a4fc9; border-color: #9c86f0; }
.btn.primary:hover { background: #7c60e0; }
.btn.ghost { background: transparent; }
.btn.big { font-size: 20px; padding: 14px 34px; }
.btn.tiny { font-size: 12px; padding: 4px 10px; }
.btn.small { font-size: 13px; padding: 5px 12px; }
.btn-row { display: flex; gap: 12px; justify-content: center; margin-top: 16px; }
.panel {
  background: #1b1730; border: 1px solid #57508a; border-radius: 16px;
  padding: 26px; max-width: 640px; max-height: 600px; overflow-y: auto;
  box-shadow: 0 18px 60px #000c;
}
.overlay {
  position: absolute; inset: 0; z-index: 80; display: none;
  align-items: center; justify-content: center; background: #000a;
}
.overlay.show { display: flex; }
.area-label { text-align: center; font-size: 15px; color: #b9aed8; letter-spacing: 1px; }
.hint { color: #9a8fc0; font-size: 13px; }

/* ---------- 타이틀 ---------- */
#screen-title { background: radial-gradient(ellipse at 50% 30%, #241d45 0%, #0b0a12 70%); }
.title-inner { text-align: center; padding-top: 140px; }
.title-sub { letter-spacing: 12px; color: #7a6fb0; margin: 0; font-size: 15px; }
.title-inner h1 { font-size: 88px; margin: 6px 0 12px; letter-spacing: 22px; padding-left: 22px; color: #cfe3ee; text-shadow: 0 0 34px #6a4fc9aa; }
.title-tag { color: #9a8fc0; font-size: 16px; line-height: 1.7; }
.title-help { margin-top: 30px; font-size: 13px; color: #6f6795; }

/* ---------- 출퇴근 횡스크롤 ---------- */
#screen-commute { background: linear-gradient(180deg, #0d0c1d 0%, #171430 66%, #0a0914 66%); }
#commute-label { margin-top: 58px; }
#commute-view { position: absolute; top: 100px; bottom: 130px; left: 0; right: 0; overflow: hidden; }
#commute-strip { position: absolute; top: 0; bottom: 0; width: 1640px; transition: transform .08s linear; }
.bldg {
  position: absolute; bottom: 116px; width: 128px;
  background: linear-gradient(180deg, #1c1836, #241f44);
  border-top: 2px solid #423a6e;
}
.bldg::after { content: ""; position: absolute; inset: 9px; background:
  repeating-linear-gradient(0deg, transparent 0 16px, #ffd76a14 16px 23px); }
.landmark {
  position: absolute; bottom: 120px; font-size: 52px; text-align: center; width: 100px; margin-left: -50px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.landmark span { font-size: 12px; letter-spacing: 2px; color: #ffd76a; text-shadow: 0 0 8px #ffd76a88; }
.point-marker {
  position: absolute; bottom: 126px; width: 70px; margin-left: -35px; text-align: center;
  font-size: 32px; animation: bob 1.6s ease-in-out infinite;
  display: flex; flex-direction: column; align-items: center;
}
.point-marker span { font-size: 12px; color: #8fd7ff; }
@keyframes bob { 50% { transform: translateY(-8px); } }
.luna-fig {
  position: absolute; bottom: 114px; width: 36px; margin-left: -18px; text-align: center; z-index: 5;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.luna-fig span { font-size: 10px; letter-spacing: 2px; color: #8fb8ff; }
.luna-body {
  width: 26px; height: 56px; border-radius: 10px 10px 5px 5px;
  background: linear-gradient(180deg, #8fb8ff 0 30%, #2e3a66 30%);
  box-shadow: 0 0 16px #5e9fe166;
}
.luna-fig.walking .luna-body { animation: walk .35s infinite; }
.luna-fig.flip .luna-body { transform: scaleX(-1); }
@keyframes walk { 50% { transform: translateY(-4px) rotate(2.5deg); } }
#commute-ground { position: absolute; left: 0; right: 0; bottom: 130px; height: 3px; background: #3a3358; z-index: 4; }
#commute-controls {
  position: absolute; bottom: 32px; left: 0; right: 0;
  display: flex; justify-content: center; gap: 22px; z-index: 10;
}
.btn.move { font-size: 26px; padding: 12px 32px; touch-action: none; }

/* ---------- 바 내부 — 포커스 카메라 ---------- */
#screen-bar { background: linear-gradient(180deg, #16101f 0%, #1e1229 100%); }
#bar-viewport { position: absolute; top: 46px; bottom: 128px; left: 0; right: 0; overflow: hidden; }
#bar-world {
  position: absolute; top: 0; height: 100%; width: 2600px;
  transform-origin: 0 0;
}
.bar-backdrop {
  position: absolute; inset: 0;
  background:
    repeating-linear-gradient(90deg, transparent 0 40px, #ffd76a0c 40px 44px, transparent 44px 120px),
    linear-gradient(180deg, #241630 0%, #1a1224 60%, #140d1c 60%);
}
.bar-backdrop::before { /* 뒷선반 술병 실루엣 라인 */
  content: ""; position: absolute; top: 60px; left: 0; right: 0; height: 70px;
  background: repeating-linear-gradient(90deg, #ffd76a1e 0 14px, transparent 14px 46px);
  border-bottom: 3px solid #4a3a5e; opacity: .6;
}
.seat {
  position: absolute; bottom: 20px; width: 460px; height: 430px;
  margin-left: -230px; cursor: pointer;
}
.seat[data-seat="0"] { left: 640px; }
.seat[data-seat="1"] { left: 1300px; }
.seat[data-seat="2"] { left: 1960px; }
.seat.droptarget { outline: 3px dashed #9c86f0; outline-offset: 8px; border-radius: 16px; }
.seat.dim { pointer-events: auto; }
.seat.dim .guest-fig { filter: grayscale(1) brightness(.22); }
.seat.dim .seat-coaster, .seat.dim .discontent-bar { opacity: .25; }
.seat-stool {
  position: absolute; bottom: 0; left: 50%; width: 120px; height: 42px; margin-left: -60px;
  background: #4a3050; border-radius: 12px 12px 0 0; border-top: 4px solid #6a4460;
}
.seat-guest { position: absolute; bottom: 42px; left: 0; right: 0; height: 300px; display: flex; align-items: flex-end; justify-content: center; }
.guest-fig {
  width: 130px; height: 250px; border-radius: 60px 60px 14px 14px; position: relative;
  background: linear-gradient(180deg, var(--gc) 0 32%, color-mix(in srgb, var(--gc) 36%, #16121f) 32%);
  box-shadow: 0 8px 24px #000a; display: flex; align-items: flex-start; justify-content: center;
  transition: filter .4s;
}
.guest-fig.entering { opacity: .35; }
.guest-fig.angry { filter: hue-rotate(-30deg) saturate(2); }
.guest-face { margin-top: 22px; font-size: 26px; color: #fff9; }
.guest-name {
  position: absolute; bottom: -26px; left: 50%; transform: translateX(-50%);
  font-size: 16px; white-space: nowrap; font-weight: bold;
}
.float-text {
  position: absolute; top: 2px; left: 50%; transform: translateX(-50%);
  min-width: 200px; max-width: 380px; padding: 11px 16px;
  background: #000d; border: 1px solid #57508a; border-radius: 13px;
  font-size: 16px; line-height: 1.5; text-align: center; opacity: 0; transition: opacity .2s;
  pointer-events: none; z-index: 6;
}
.float-text.show { opacity: 1; }
.float-text.show::after {
  content: ""; position: absolute; bottom: -7px; left: 50%; margin-left: -7px;
  border: 7px solid transparent; border-top-color: #57508a; border-bottom: none;
}
.discontent-bar {
  position: absolute; bottom: 320px; left: 50%; width: 130px; height: 10px; margin-left: -65px;
  background: #0009; border: 1px solid #444; border-radius: 6px; visibility: hidden;
}
.discontent-fill { height: 100%; width: 0; border-radius: 5px; background: #3ad13a; }
.seat-coaster {
  position: absolute; bottom: 6px; left: 50%; width: 84px; height: 24px; margin-left: -42px;
  border-radius: 50%; display: none; z-index: 4;
}
.seat-coaster.placed { display: block; background: #7a5a30; border: 3px solid #a8814d; }
.seat-coaster.with-glass::after { content: "🍸"; position: absolute; top: -30px; left: 26px; font-size: 26px; }
.standee { display: flex; flex-direction: column; align-items: center; gap: 8px; animation: fadein .45s; }
.standee-name { font-size: 18px; font-weight: bold; text-shadow: 0 2px 6px #000; }
@keyframes fadein { from { opacity: 0; transform: translateY(12px); } }
.char-chip {
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 50%; border: 3px solid; font-weight: bold; color: #fff;
  box-shadow: 0 6px 20px #000a;
}
/* 슬롯 인디케이터 — 곁눈질용 (①문서 §3.2) */
#slot-indicator {
  position: absolute; top: 52px; left: 50%; transform: translateX(-50%); z-index: 40;
  display: flex; gap: 14px;
}
.ind-cell {
  width: 58px; padding: 6px 0 4px; text-align: center; cursor: pointer;
  background: #0009; border: 1px solid #3a3358; border-radius: 10px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.ind-cell.focused { border-color: #9c86f0; box-shadow: 0 0 12px #6a4fc966; }
.ind-label { font-size: 11px; color: #8f84b5; }
.ind-dot { width: 16px; height: 16px; border-radius: 50%; background: #3a3345; }
.ind-dot.on { background: #3ad13a; box-shadow: 0 0 8px #3ad13a88; }
.ind-dot.warn { background: #e0c23a; box-shadow: 0 0 8px #e0c23a88; }
.ind-dot.danger { background: #e04a3a; box-shadow: 0 0 10px #e04a3acc; }
.ind-dot.blink { animation: blinkdot .55s steps(2) infinite; }
@keyframes blinkdot { 50% { opacity: .25; } }
#slot-nav {
  position: absolute; bottom: 140px; left: 0; right: 0; z-index: 30;
  display: flex; justify-content: space-between; padding: 0 26px; pointer-events: none;
}
#slot-nav .btn { pointer-events: auto; opacity: .85; }
.bar-counter {
  position: absolute; bottom: 0; left: 0; right: 0; height: 96px;
  background: linear-gradient(180deg, #5a3c28, #3a2517);
  border-top: 6px solid #7a5638; box-shadow: 0 -8px 22px #0009;
  display: flex; align-items: center; padding: 0 60px; gap: 46px; z-index: 25;
}
#coaster-tray { position: relative; width: 120px; height: 66px; }
.coaster-pile {
  position: absolute; bottom: 6px; left: 10px; width: 84px; height: 28px;
  background: #6a4a26; border-radius: 50%; border: 2px solid #96703f;
  box-shadow: 0 -7px 0 #7a5a30, 0 -14px 0 #6a4a26;
}
.coaster-top {
  position: absolute; bottom: 30px; left: 16px; width: 78px; height: 30px;
  background: #96703f; border: 3px solid #c49a5e; border-radius: 50%;
  cursor: grab; display: flex; align-items: center; justify-content: center;
  color: #5c401f; font-size: 13px; touch-action: none;
}
.coaster-top:hover { box-shadow: 0 0 14px #ffd76a99; }
#glass-tray { display: flex; gap: 16px; }
.glass-chip {
  width: 64px; height: 64px; cursor: grab; touch-action: none;
  filter: drop-shadow(0 4px 8px #000b);
}
.glass-chip:hover { filter: drop-shadow(0 0 12px #8fd7ffcc); }
.glass-chip svg { width: 100%; height: 100%; }
.drag-ghost { position: fixed; z-index: 999; width: 56px; height: 56px; pointer-events: none; opacity: .85; }
#luna-bubble {
  position: absolute; bottom: 104px; left: 50%; transform: translateX(-50%); z-index: 35;
  background: #14243add; border: 1px solid #5e9fe1; border-radius: 14px;
  padding: 10px 20px; font-size: 16px; color: #cfe3ee;
  opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 560px;
}
#luna-bubble.show { opacity: 1; }
.fx-cat { position: absolute; top: 220px; left: 50%; font-size: 52px; animation: catjump 1s ease; z-index: 20; }
@keyframes catjump { 0% { transform: translate(-200px, -80px) rotate(-20deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: translate(0, 0); } }
.story-serve-chip {
  position: absolute; bottom: 190px; left: 50%; transform: translateX(-50%); z-index: 40;
  width: 120px; text-align: center; cursor: pointer; animation: bob 1.4s infinite;
}
.story-serve-chip svg { width: 80px; height: 80px; filter: drop-shadow(0 0 14px #8fd7ff99); }
.story-serve-chip span { display: block; font-size: 15px; color: #8fd7ff; font-weight: bold; }

/* ---------- 대화 ---------- */
#dialog {
  position: absolute; left: 70px; right: 70px; bottom: 24px; z-index: 70;
  background: #100d20ee; border: 1px solid #57508a; border-radius: 14px;
  padding: 16px 22px; display: none; gap: 16px; cursor: pointer; min-height: 96px;
  align-items: flex-start;
}
#dialog.show { display: flex; }
.dlg-portrait { flex: 0 0 auto; padding-top: 2px; }
.dlg-body { flex: 1; }
.dlg-name { font-weight: bold; font-size: 16px; margin-bottom: 6px; }
.dlg-text { font-size: 18px; line-height: 1.6; }
.dlg-next { align-self: flex-end; animation: bob 1s infinite; color: #9c86f0; font-size: 18px; }
#choice-box {
  position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%); z-index: 75;
  display: none; flex-direction: column; gap: 10px; min-width: 400px;
}
#choice-box.show { display: flex; }
.choice-btn {
  background: #221c3add; border: 1px solid #6a5fa0; color: #eee2c8;
  border-radius: 12px; padding: 14px 22px; font-size: 16px; cursor: pointer; font-family: inherit;
}
.choice-btn:hover { background: #6a4fc9; }

/* ---------- 제조 패널 (주문 단말 — 시뮬레이터 방식) ---------- */
.craft-panel {
  width: 480px; height: 660px; border-radius: 26px;
  background: linear-gradient(180deg, #2a1d3d 0%, #171226 100%);
  border: 9px solid #0a0714; box-shadow: 0 20px 70px #000c;
  display: flex; flex-direction: column; overflow: hidden;
}
.craft-head {
  padding: 12px 16px; display: flex; justify-content: space-between; gap: 10px;
  border-bottom: 1px solid #443a66; font-size: 14px; align-items: center;
}
#craft-timer.over { color: #e04a3a; font-weight: bold; }
#craft-order-banner { color: #ffd76a; font-size: 13px; }
#craft-stage { flex: 1; overflow-y: auto; padding: 16px; }
#craft-stage h3 { margin: 4px 0 12px; font-size: 18px; text-align: center; }
.menu-list { display: flex; flex-direction: column; gap: 7px; }
.menu-row {
  display: flex; gap: 12px; align-items: center; padding: 8px 10px;
  background: #221a38; border: 1px solid #443a66; border-radius: 12px; cursor: pointer;
}
.menu-row:hover { border-color: #9c86f0; background: #2c2348; }
.menu-glass { width: 46px; height: 46px; flex: 0 0 auto; }
.menu-glass svg, .glass-cell svg, .pour-visual svg, .desc-glass svg, .result-glass svg { width: 100%; height: 100%; }
.menu-info { display: flex; flex-direction: column; font-size: 15px; }
.menu-info span { color: #9a8fc0; font-size: 12px; }
.craft-desc { text-align: center; }
.desc-glass { width: 104px; height: 104px; margin: 8px auto; }
.desc-flavor { font-size: 14px; color: #c9bfe0; line-height: 1.65; }
.desc-meta { font-size: 12px; color: #8f84b5; }
.glass-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.glass-cell {
  background: #221a38; border: 1px solid #443a66; border-radius: 12px;
  padding: 10px 4px; text-align: center; cursor: pointer; font-size: 12px;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
}
.glass-cell:hover { border-color: #9c86f0; }
.glass-cell svg { width: 56px; height: 56px; }
.note-btn { margin: 12px auto; display: block; }
.ing-grid { display: flex; flex-direction: column; gap: 5px; }
.ing-group-label { font-size: 12px; color: #9a8fc0; margin-top: 9px; letter-spacing: 1px; }
.ing-row { display: flex; flex-wrap: wrap; gap: 7px; }
.ing-cell {
  width: 82px; background: #221a38; border: 1px solid #443a66; border-radius: 10px;
  padding: 8px 2px; text-align: center; cursor: pointer; font-size: 11px;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
}
/* 담김/선택 표시 — 한눈에 보이게: 금색 발광 + ✓ 배지 + 살짝 확대 (v1.9 가시성 개선) */
.ing-cell, .glass-cell { position: relative; }
.ing-cell.sel, .glass-cell.sel {
  border-color: #ffd76a; background: #46381c;
  box-shadow: 0 0 0 2px #ffd76a66, 0 0 16px #ffd76a44;
  transform: scale(1.05);
}
.ing-cell.sel::after, .glass-cell.sel::after {
  content: "✓"; position: absolute; top: -8px; right: -8px;
  width: 22px; height: 22px; line-height: 22px; border-radius: 50%;
  background: #ffd76a; color: #2a2005; font-size: 14px; font-weight: 900;
  box-shadow: 0 2px 6px #000a;
}
.ing-cell.sel span, .glass-cell.sel span { color: #ffe9a8; font-weight: bold; }
.ing-bottle {
  width: 26px; height: 40px; border: 1px solid #cfe3ee55; border-radius: 6px 6px 3px 3px;
  background: #ffffff10;
}
.ing-bottle.big { width: 38px; height: 58px; }
/* 레시피 노트를 본 뒤 — 필요한 아이템 깜빡임 가이드 (시뮬레이터 glow 계승) */
.glow { animation: glowblink .75s ease-in-out infinite; border-color: #ffd76a !important; }
@keyframes glowblink {
  0%, 100% { box-shadow: 0 0 4px #ffd76a55; }
  50% { box-shadow: 0 0 16px #ffd76acc; background-color: #4a3c22; }
}
.gimmick { text-align: center; padding-top: 12px; }
.pour-visual { width: 130px; height: 130px; margin: 6px auto; }
.pour-visual.dim { opacity: .55; filter: blur(1px); }
/* 따르기 연출 — 기울어지는 병 + 스트림 */
.pour-scene { position: relative; width: 220px; height: 210px; margin: 0 auto; }
.pour-bottle {
  position: absolute; top: 0; left: 50%; width: 34px; height: 78px; margin-left: -60px;
  background: linear-gradient(180deg, #ffffff18 0 26%, var(--bc) 26%);
  border: 1px solid #cfe3ee66; border-radius: 8px 8px 5px 5px;
  transform-origin: bottom right; transition: transform .4s;
}
.pour-bottle.tilt { transform: rotate(112deg) translateY(-8px); }
.pour-stream {
  position: absolute; top: 66px; left: 50%; width: 5px; height: 0; margin-left: -3px;
  border-radius: 3px; transition: height .25s;
}
.pour-stream.on { height: 62px; }
.pour-scene .pour-visual { position: absolute; bottom: 0; left: 50%; margin-left: -65px; }
.gauge {
  position: relative; height: 26px; background: #0008; border: 1px solid #57508a;
  border-radius: 13px; margin: 14px 26px; overflow: hidden;
}
.gauge-fill { height: 100%; width: 0; background: linear-gradient(90deg, #6a4fc9, #9c86f0); transition: width .05s linear; }
.gauge-fill.over { background: linear-gradient(90deg, #c94f4f, #f08686); }
.gauge-target { position: absolute; top: 0; bottom: 0; width: 4px; background: #ffd76a; z-index: 2; box-shadow: 0 0 6px #ffd76a; }
.gauge-num { font-size: 15px; color: #ffd76a; margin-bottom: 10px; }
.hold-btn { font-size: 17px; padding: 15px 32px; margin: 8px; touch-action: none; }
.sqz-btn.squeezing { transform: scale(.93); background: #7c60e0; }
.tap-count { font-size: 26px; color: #ffd76a; margin: 12px; }
/* 셰이크 — 위아래 드래그 트랙 */
.shake-track {
  position: relative; width: 130px; height: 240px; margin: 8px auto;
  background: #0007; border: 2px solid #57508a; border-radius: 65px;
  touch-action: none; cursor: grab;
}
.shake-puck {
  position: absolute; left: 50%; top: 90px; width: 68px; height: 68px; margin-left: -34px;
  font-size: 44px; display: flex; align-items: center; justify-content: center;
  background: #2a2440; border: 2px solid #9c86f0; border-radius: 50%;
  pointer-events: none;
}
/* 스터 — 원형 다이얼 */
.stir-dial {
  position: relative; width: 210px; height: 210px; margin: 10px auto;
  border: 3px dashed #57508a; border-radius: 50%;
  touch-action: none; cursor: grab;
}
.stir-rod {
  position: absolute; top: 50%; left: 50%; width: 92px; height: 5px;
  background: linear-gradient(90deg, transparent 12%, #c9c2e6 12%);

 "desc", "when": null, "text": {"ko": "바 '언노운'의 마스터. 말수가 적다.", "en": "Master of Bar Unknown. A man of few words."}}, {"character_id": "chris", "min_affinity": 20, "kind": "taste", "when": null, "text": {"ko": "클래식 칵테일을 조용히 비운다.", "en": "Quietly empties classic cocktails."}}, {"character_id": "chris", "min_affinity": 35, "kind": "history", "when": null, "text": {"ko": "전직은 아무도 모른다. 손님들도 묻지 않는다.", "en": "Nobody knows what he did before. The regulars don't ask."}}, {"character_id": "chris", "min_affinity": 50, "kind": "secret", "when": null, "text": {"ko": "루나를 받아준 이유를 아직 말하지 않았다. '때가 되면'이라고만 한다.", "en": "He still hasn't said why he took Luna in. Only: 'when it's time.'"}}, {"character_id": "port", "min_affinity": 10, "kind": "desc", "when": null, "text": {"ko": "고물 로봇과 함께 다니는 노인. 진피즈 한 우물.", "en": "An old man with a scrap robot. Gin Fizz, always."}}, {"character_id": "port", "min_affinity": 20, "kind": "taste", "when": null, "text": {"ko": "수십 년째 진피즈. '정석대로'가 주문의 전부다.", "en": "Decades of Gin Fizz. 'By the book' is his whole order."}}, {"character_id": "port", "min_affinity": 35, "kind": "history", "when": null, "text": {"ko": "골목에 쓰러져 있던 루나를 처음 발견해 데려온 사람.", "en": "The one who first found Luna collapsed in an alley and carried her in."}}, {"character_id": "port", "min_affinity": 50, "kind": "secret", "when": null, "text": {"ko": "그의 로봇에는 지워지지 않는 이름 하나가 저장되어 있다고 한다.", "en": "They say one name is stored in his robot that can never be erased."}}, {"character_id": "aili", "min_affinity": 10, "kind": "desc", "when": null, "text": {"ko": "새벽에 나타나는 의사. 루나를 '예쁜이'라고 부른다.", "en": "A doctor who appears at dawn. Calls Luna 'sweetie.'"}}, {"character_id": "aili", "min_affinity": 20, "kind": "taste", "when": null, "text": {"ko": "샴페인 애호가. 독주는 의사로서 사양한다.", "en": "A champagne lover. Declines hard liquor, doctor's orders."}}, {"character_id": "aili", "min_affinity": 35, "kind": "history", "when": null, "text": {"ko": "루나의 수리에 참여했다. 몸의 흉터 위치를 전부 알고 있다.", "en": "She took part in Luna's repairs. She knows where every scar is."}}, {"character_id": "aili", "min_affinity": 50, "kind": "secret", "when": null, "text": {"ko": "면허가 왜 정지됐는지는 술이 꽤 들어가야 나오는 이야기다.", "en": "Why her license was suspended is a story that takes quite a few drinks."}}, {"character_id": "samho", "min_affinity": 10, "kind": "desc", "when": null, "text": {"ko": "애니멀 갱의 말단. 시끄럽고, 정이 많다.", "en": "Animal Gang's newest grunt. Loud, and soft-hearted."}}, {"character_id": "samho", "min_affinity": 20, "kind": "taste", "when": null, "text": {"ko": "독한 술을 동경한다. 보스가 마시는 마티니처럼.", "en": "Admires hard liquor. Like the martini his boss drinks."}}, {"character_id": "samho", "min_affinity": 35, "kind": "history", "when": null, "text": {"ko": "부모가 데려온 일곱 동생을 혼자 돌보고 있다.", "en": "Raising the seven siblings his parents took in — alone now."}}, {"character_id": "samho", "min_affinity": 50, "kind": "secret", "when": null, "text": {"ko": "전 재산을 털어 산 아머는 동생들 앞에서 멋있어 보이고 싶어서였다.", "en": "The armor he bought with everything he had — he just wanted to look cool for his siblings."}}, {"character_id": "samho", "min_affinity": 0, "kind": "recent", "when": "flag.samho_death_route", "text": {"ko": "취한 채로 꽃을 가지러 나갔다. …밖이 소란스럽다.", "en": "Went out drunk to fetch a flower. ...It's loud outside."}}, {"character_id": "samho", "min_affinity": 0, "kind": "recent", "when": "flag.samho_refused_drink", "text": {"ko": "내일 노란 꽃을 보여주겠다고 약속했다.", "en": "Promised to show a yellow flower tomorrow."}}, {"character_id": "bubi", "min_affinity": 10, "kind": "desc", "when": null, "text": {"ko": "아일리를 따라다니는 고양이. 잘 잔다.", "en": "The cat that follows Aili around. Sleeps well."}}, {"character_id": "bubi", "min_affinity": 20, "kind": "taste", "when": null, "text": {"ko": "깔루아 밀크가 나오면 눈이 떠진다.", "en": "Eyes open the moment Kahlua Milk appears."}}], "cutscenes": [{"id": "tl_intro", "kind": "timeline", "resource_key": "INTRO", "note": "타이틀/도입 연출"}, {"id": "tl_intro_lab", "kind": "timeline", "resource_key": "Intro lab", "note": "연구소 도입 — 꿈(습격) 연출 재료 t": {"ko": "육안으로 봤을 때 강아지로 판단됩니다.", "en": "Visual assessment indicates: dog."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 8, "type": "say", "actor": "shiba", "arg": "default", "text": {"ko": "사람을 얼굴로 판단하지 말라고.\n못생긴 놈 같으니.", "en": "Don't judge people by their faces,\nyou ugly mug."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 9, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "…그럼 사람이 맞는 건가요?", "en": "...So you ARE a person?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 10, "type": "say", "actor": "shiba", "arg": "default", "text": {"ko": "아니?", "en": "Nope?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 11, "type": "say", "actor": "shiba", "arg": "default", "text": {"ko": "딱 보면 시바잖아, 시바.", "en": "One look and you can tell I'm a shiba, shiba."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 12, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "아하… 확인했습니다.", "en": "I see... confirmed."}, "when": null, "effects": "flag.shiba_met = true", "sync": "wait"}]}, {"id": "np_shiba_2", "day": 0, "phase": "street", "seq": 2, "trigger": "interact", "when": "", "title": "[이식] 시바 반복 대사 (구 revisit_repeat)", "skippable": false, "group": "np_shiba", "steps": [{"seq": 1, "type": "say", "actor": "shiba", "arg": "default", "text": {"ko": "이제 좀 가, 시바.", "en": "Go away already, shiba."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 2, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "왜죠?", "en": "Why?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 3, "type": "say", "actor": "shiba", "arg": "default", "text": {"ko": "이제 더 대화할 대사 데이터도 없단 말이야.", "en": "I'm out of dialogue data, that's why."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 4, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "…?", "en": "...?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 5, "type": "say", "actor": "shiba", "arg": "default", "text": {"ko": "불만 "(Looks like someone just used it.)"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 3, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "(더는 보고 싶지 않다.)", "en": "(I don't want to look at this any longer.)"}, "when": null, "effects": null, "sync": "wait"}]}], "choices": {}}, "1": {"day": 1, "scenes": [{"id": "d1_walk_home", "day": 1, "phase": "commute_out", "seq": 1, "trigger": "auto", "when": "", "title": "첫 퇴근길 — 크리스가 길을 알려줌", "skippable": false, "group": "", "steps": [{"seq": 1, "type": "move", "actor": "luna", "arg": "spot:street_mid", "text": null, "when": null, "effects": null, "sync": "wait"}, {"seq": 2, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "집은 바에서 두 블록이다. 밤길은 밝은 쪽으로만 다녀라.", "en": "Home is two blocks from the bar. Stay on the lit side of the street at night."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 3, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "…크리스 씨는요?", "en": "...What about you, Chris?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 4, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "마감 정리하고 간다. 먼저 자라.", "en": "I'll close up and follow. Sleep first."}, "when": null, "effects": null, "sync": "wait"}]}, {"id": "d1_home_talk", "day": 1, "phase": "home", "seq": 1, "trigger": "auto", "when": "", "title": "테라스 — 바텐더의 태도 + 근황", "skippable": false, "group": "", "steps": [{"seq": 1, "type": "fx", "actor": null, "arg": "terrace_night", "text": null, "when": null, "effects": null, "sync": "wait"}, {"seq": 2, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "…안 자고 있었나.", "en": "...Still up?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 3, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "잠이 안 와서요.", "en": "Couldn't sleep."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 4, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "바텐더는 별별 손님을 다 만난다. 취한 놈, 우는 놈, 말 없는 놈. 무슨 일이 있어도 잔을 만드는 손은 흔들리지 마라.", "en": "A bartender meets every kind of guest. Drunk ones, crying ones, silent ones. Whatever happens, the hand that makes the drink must not shake."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 5, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "…이 집은 지낼 만하고?", "en": "...Is this place livable, by the way?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 6, "type": "choice", "actor": null, "arg": "ch_d1_home", "text": null, "when": null, "effects": null, "sync": "wait"}, {"seq": 7, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "그래. 천천히 하면 된다. 늦잠 자지 마라.", "en": "Good. Take it slow. And don't oversleep."}, "when": null, "effects": null, "sync": "wait"}]}, {"id": "d1_intro", "day": 1, "phase": "intro", "seq": 1, "trigger": "auto", "when": "", "title": "인트로 — 검은 화면, 루나가 처음 눈뜨던 밤", "skippable": false, "group": "", "steps": [{"seq": 1, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "…정신이 드나.", "en": "...You're awake."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 2, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "…여기는.", "en": "...Where is this."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 3, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "내 집이다. 포트라는 노인이 널 업어왔지.\n골목에 쓰러져 있었다더군.", "en": "My home. An old man named Port carried you in.\nSaid you were collapsed in an alley."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 4, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "…당신은, 누구죠.", "en": "...And you are?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 5, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "크리스. 바 '언노운'의 마스터다.", "en": "Chris. Master of Bar Unknown."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 6, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "저는… 기억이, 없습니다.\n이름 말고는, 아무것도.", "en": "I... don't remember anything.\nNothing but my name."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 7, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "…그런 것 같더군.", "en": "...So it seems."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 8, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "당분간 여기 있어라.\n마침 가게에 일할 손이 필요하던 참이다.", "en": "Stay here for now.\nAs it happens, I need an extra pair of hands at the bar."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 9, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "(…그렇게, 이 집의 소파가 내 자리가 되었다.)", "en": "(...And so, the sofa in this house became my place.)"}, "when": null, "effects": null, "sync": "wait"}]}, {"id": "d1_note", "day": 1, "phase": "home", "seq": 0, "trigger": "interact", "when": "!flag.d1_note_read", "title": "크리스의 쪽지", "skippable": false, "group": "", "steps": [{"seq": 1, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "(테이블 위에 쪽지가 놓여 있다.)", "en": "(There's a note on the table.)"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 2, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "「먼저 나간다. 가게로 와라.\n길은 어제 알려준 대로. — 크리스」", "en": "\"Went ahead. Come to the bar.\nThe way I showed you yesterday. — Chris\""}, "when": null, "effects": null, "sync": "wait"}, {"seq": 3, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "(…출근이라는 걸, 해보자.)", "en": "(...Time to try this thing called 'going to work.')"}, "when": null, "effects": "flag.d1_note_read = true", "sync": "wait"}]}, {"id": "d1_port", "day": 1, "phase": "bar", "seq": 3, "trigger": "auto", "when": "", "title": "포트 첫 잔 — 진피즈 (튜토리얼 두 번째 제조)", "skippable": false, "group": "", "steps": [{"seq": 1, "type": "enter", "actor": "port", "arg": "R", "text": null, "when": null, "effects": null, "sync": "wait"}, {"seq": 2, "type": "say", "actor": "port", "arg": "default", "text": {"ko": "…새 얼굴이군.", "en": "...A new face."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 3, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "포트. 인사해라, 루나다. 오늘부터 일한다.", "en": "Port. Meet Luna. She starts today."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 4, "type": "say", "actor": "port", "arg": "default", "text": {"ko": "루나… 그래. 잘 부탁하네.", "en": "Luna... I see. Good to meet you."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 5, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "마침 잘 왔어. 루나, 연습 삼아 한 잔 더 만들어봐라.", "en": "Good timing. Luna — one more glass, for practice."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 6, "type": "say", "actor": "port", "arg": "default", "text": {"ko": "그럼, 늘 마시던 걸로.", "en": "Then I'll have my usual."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 7, "type": "order", "actor": "port", "arg": "exact:gin_fizz", "text": {"ko": "진피즈, 정석대로.", "en": "Gin Fizz. By the book."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 8, "type": "craft", "actor": null, "arg": "order", "text": null, "when": null, "effects": null, "sync": "wait"}, {"seq": 9, "type": "serve", "actor": "port", "arg": null, "text": null, "when": null, "effects": null, "sync": "wait"}, {"seq": 10, "type": "say", "actor": "port", "arg": "default", "text": {"ko": "…손끝이 좋군. 오늘이 처음이라고?", "en": "...Good hands. First day, you said?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 11, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "오늘이 처음이다.", "en": "First day."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 12, "type": "say", "actor": "port", "arg": "default", "text": {"ko": "허. …이 가게, 오래 다녀야겠어.", "en": "Hah. ...I'll be coming here a long while yet."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 13, "type": "exit", "actor": "port", "arg": null, "text": null, "when": null, "effects": null, "sync": "wait"}, {"seq": 14, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "오늘은 여기까지. 정리는 내가 한다.\n먼저 들어가라.", "en": "That's enough for today. I'll close up.\nHead home first."}, "when": null, "effects": null, "sync": "wait"}]}, {"id": "d1_elevator", "day": 1, "phase": "commute_out", "seq": 2, "trigger": "auto", "when": "", "title": "퇴근길 엘리베이터 — 라디오 뉴스 (구엔진 elevator_radio 이식)", "skippable": false, "group": "", "steps": [{"seq": 1, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "(엘리베이터가 낡은 소리를 내며 내려간다.)", "en": "(The elevator rattles its way down.)"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 2, "type": "say", "actor": "radio", "arg": "default", "text": {"ko": "…다음 뉴스입니다.", "en": "...In other news."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 3, "type": "say", "actor": "radio", "arg": "default", "text": {"ko": "뉴런 트롤프 주니어가 대통령 8연임에 성공하며,\n신미합중국의 제67대 대통령으로 다시 한번 당선되었습니다.", "en": "Newron Trolph Jr. has won his eighth term,\nre-elected as the 67th President of the New United States."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 4, "type": "say", "actor": "radio", "arg": "default", "text": {"ko": "트롤프 대통령은 당선 직후 연설에서", "en": "In his victory speech, President Trolph declared:"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 5, "type": "say", "actor": "radio", "arg": "default", "text": {"ko": "\"위대한 국가 재건은 아직 끝나지 않았다.\"\n\"신미합중국은 다시 한 번 세계의 중심에 설 것이다.\"", "en": "\"The great national rebuilding is not over.\"\n\"The New United States will stand at the center of the world once more.\""}, "when": null, "effects": null, "sync": "wait"}, {"seq": 6, "type": "say", "actor": "radio", "arg": "default", "text": {"ko": "라고 밝혔습니다.", "en": "— he stated."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 7, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "(…세계는, 생각보다 넓다.)", "en": "(...The world is wider than I thought.)"}, "when": null, "effects": null, "sync": "wait"}]}, {"id": "d1_tutorial_chris", "day": 1, "phase": "bar", "seq": 1, "trigger": "auto", "when": "", "title": "튜토리얼 — 크리스의 드라이 마티니 강습 (구 day0_chris)", "skippable": false, "group": "", "steps": [{"seq": 1, "type": "timeline", "actor": null, "arg": "tl_intro_lab", "text": null, "when": null, "effects": null, "sync": "wait"}, {"seq": 2, "type": "enter", "actor": "chris", "arg": "R", "text": null, "when": null, "effects": null, "sync": "wait"}, {"seq": 3, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "루나.", "en": "Luna."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 4, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "네?", "en": "Yes?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 5, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "방금 내가 무슨 말을 했는지 듣긴 한 거야?", "en": "Did you hear a word of what I just said?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 6, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "무슨 말이요?", "en": "What did you say?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 7, "type": "say", "actor": "chris", "arg": "fail", "text": {"ko": ".....", "en": "....."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 8, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "집중해. 이제 와서 관두지도 못한다고.", "en": "Focus. It's too late to quit now."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 9, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "네. 알겠습니다.", "en": "Yes. Understood."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 10, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "그럼 방금 배웠던 내용을 다시 짚어보자.", "en": "Then let's go over what you just learned."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 11, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "알겠습니다.", "en": "Understood."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 12, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "<order>드라이 마티니</order> 하나만 만들 수 있게 되면 더는 확인하지 않을 거야.\n금방 하는 거니까 지루해도 참아.", "en": "Once you can make a single <order>Dry Martini</order>, I'll stop checking on you.\nIt won't take long, so bear with the boredom."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 13, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "(건조한 마티니? 축축한 마티니는 무슨 맛일까.)", "en": "(A dry martini? I wonder what a wet one tastes like.)"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 14, "type": "say", "actor": "chris", "arg": "fail", "text": {"ko": "또 딴생각하지.", "en": "You're drifting off again."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 15, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "아니요. 바로 시작하죠.", "en": "No. Let's start right away."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 16, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "좋아.", "en": "Good."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 17, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "먼저 손님의 주문을 받은 뒤 칵테일을 만드는 상황이 되면\n바 스테이션으로 화면이 전환될 거야.", "en": "First — once you've taken a guest's order and it's time to mix,\nthe view will switch over to the bar station."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 18, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "그때 너의 시각 인터페이스에 칵테일을 만들 때 필요한 정보들이 출력될 거야.", "en": "That's when your visual interface will display everything you need to build the cocktail."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 19, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "먼저 좌측 상단에는 <name>손님의 주문</name>이 정리되어서 보일 텐데,\n혹시라도 손님의 주문을 잊었다면 여기서 확인하면 돼.", "en": "At the top left you'll see the <name>guest's order</name>, laid out clean.\nIf you ever forget what they asked for, check it there."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 20, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "좌측 주문 정보 아래에서 칵테일 레시피를 확인할 수 있어.", "en": "Below the order info on the left, you can browse cocktail recipes."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 21, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "보고 싶은 칵테일을 눌러보면 그 칵테일을 만드는 데\n필요한 <world>재료</world>, <world>제조 방법</world>, <world>설명</world> 등이 보일 거야.", "en": "Tap the cocktail you want and you'll see its\n<world>ingredients</world>, <world>method</world>, <world>description</world> — everything it takes."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 22, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "전에 이식한 <name>바텐더 가이드 칩</name>에 대부분의 칵테일 <name>레시피</name>가 들어 있어.\n하지만 지금은 레시피 정보가 조금밖에 안 보일 거야.", "en": "The <name>bartender guide chip</name> we implanted holds most of the cocktail <name>recipes</name>.\nFor now, though, you'll only see a handful of them."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 23, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "이유가 있습니까?", "en": "Is there a reason?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 24, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "“드라이 마티니 하나도 제대로 만들지 못한다면,\n다른 칵테일을 배울 필요도 없다.”이게 전에 있던 마스터가 남긴 방침이야.", "en": "\"If you can't make a single Dry Martini properly,\nyou have no business learning any other cocktail.\" That was the old master's policy."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 25, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "옳은 생각인 것 같습니다.", "en": "That sounds like sound reasoning."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 26, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "동감이다. 그래서 지금 네가 만들 수 있는 칵테일은 몇 개 안 돼.", "en": "Agreed. Which is why you can only make a few cocktails right now."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 27, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "계속 일하면서 <name>숙련도</name>가 쌓이면 만들 수 있는 칵테일이 늘어날 거야.", "en": "Keep working, build up your <name>proficiency</name>, and the list will grow."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 28, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "숙련도를 어떻게 확인하는 거죠?", "en": "How do I check my proficiency?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 29, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "네가 손님의 주문에 맞는 칵테일을 주거나, 제조 과정을 완벽하게 수행한다면\n바텐더 가이드 칩이 분석해서 숙련도를 기록할 거야.", "en": "When you serve what the guest actually ordered, or nail the mixing process,\nthe guide chip analyzes it and logs your proficiency."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 30, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "일정 수준에 도달하면 <name>새로운 레시피</name>도 열릴 테고.", "en": "Reach a certain level, and <name>new recipes</name> will unlock too."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 31, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "생각보다 유용한 칩이었네요.", "en": "The chip is more useful than I expected."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 32, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "그거 만들겠다고 전 마스터가 고생 좀 했지.", "en": "The old master went through hell building that thing."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 33, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "메뉴에서 레시피를 고르면 선반이 차례로 나온다.\n잔, 도구, 가니시, 재료 순서야. 필요한 걸 골라 담으면 돼.", "en": "Pick a recipe from the menu and the shelves come one by one —\nglass, tools, garnish, then ingredients. Take what you need."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 34, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "잘못 담았으면 다시 눌러서 빼면 되고, 화살표로 앞 선반에\n돌아갈 수도 있어. 다 담았으면 '제조 시작'이다.", "en": "Tap again to put something back, or use the arrows to revisit\na shelf. When you have everything, hit 'Start'."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 35, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "제조 과정은 <world>쉐이킹</world>, <world>스터</world>, <world>빌드</world>, 이렇게 세 가지로 분류되는 것이 맞나요?", "en": "The methods fall into three categories — <world>shaking</world>, <world>stirring</world>, and <world>building</world>. Is that correct?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 36, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "기억은 하는군. 각 방법이 뭐가 다른지에 대한 설명도 필요하나?", "en": "So you do remember. Need me to explain how they differ?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 37, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "원활한 업무를 위해 필요할 것 같습니다.", "en": "It would help me operate smoothly."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 38, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "좋아. 먼저 <world>쉐이킹</world>은 보스턴 쉐이커에 재료를 담은 뒤\n위아래로 강하게 흔들면서 섞는 방법이다.", "en": "Fine. <world>Shaking</world> first: load the ingredients into a Boston shaker\nand mix them hard, shaking up and down."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 39, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "잘 안 섞이는 재료들이 들어갈 때 주로 사용하지.", "en": "You mostly use it for ingredients that don't blend easily."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 40, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "<world>스터</world>는 믹싱 글라스에 재료를 넣고 바 스푼으로 천천히 저어 만드는 방법이다.\n재료를 강하게 섞을 필요가 없거나, 향과 맛을 섬세하게 살릴 때 자주 사용해.", "en": "<world>Stirring</world> means adding the ingredients to a mixing glass and slowly stirring with a bar spoon.\nUse it when the mix doesn't need force, or when the aroma and flavor should stay delicate."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 41, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "<world>빌드</world>는 완성 잔에 재료를 직접 넣어서 만드는 방식이다.\n자연스럽게 섞이는 재료나 탄산이 들어가는 칵테일에 주로 사용하지.", "en": "<world>Building</world> means pouring the ingredients straight into the serving glass.\nIt's for things that blend on their own, or anything with carbonation."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 42, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "여기까지 이해했나.", "en": "Following so far?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 43, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "평범한 사람이라면 전부 기억하기 힘들 것 같습니다.", "en": "An ordinary person would struggle to remember all of this."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 44, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "그래. 그래도 넌 <world>평범한 사람</world>이 아니잖아.", "en": "Right. But then, you're no <world>ordinary person</world>."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 45, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "저는 평범하다고 생각합니다.", "en": "I consider myself ordinary."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 46, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "...그렇게 생각하면 할 말은 없지.\n지금 몰라도 나중에 또 알려 줄 테니 괜찮을 거다.", "en": "...If that's how you see it, I've got nothing to add.\nDon't worry — if it doesn't stick now, I'll walk you through it again later."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 47, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "제조를 시작하면 담아둔 것들이 올바른 순서로 진행된다.\n술은 <name>목표선</name>에 맞춰 멈추고, 저을 땐 스푼으로 원을 그리면 돼.", "en": "Once you start, everything you stocked plays out in proper order.\nStop the pour at the <name>target line</name>; stir by drawing circles with the spoon."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 48, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "레시피의 <name>정량</name>에 가까울수록 <world>완성도</world>가 올라간다.\n헷갈리면 레시피 노트를 다시 봐도 좋아.", "en": "The closer you are to the recipe's <name>exact measures</name>, the higher the <world>quality</world>.\nCheck the recipe note anytime you're unsure."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 49, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "그리고 마무리로 손님한테 제공하면 끝이야.", "en": "Then serve it to the guest, and you're done."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 50, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "이해했습니다.", "en": "Understood."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 51, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "좋아. 그럼 <order>드라이 마티니</order> 한 잔 만들어 봐.", "en": "Good. Now — make me a <order>Dry Martini</order>."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 52, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "주문받았습니다.", "en": "Order received."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 53, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "(<order>드라이 마티니</order> 한 잔… 흔들지 말고, <order>저어서</order>.)", "en": "(One <order>Dry Martini</order>... don't shake it — <order>stir</order>.)"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 54, "type": "order", "actor": "chris", "arg": "exact:dry_martini", "text": {"ko": "드라이 마티니 한 잔. 흔들지 말고 저어서.", "en": "One Dry Martini. Stirred, not shaken."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 55, "type": "craft", "actor": null, "arg": "tutorial:dry_martini", "text": null, "when": null, "effects": null, "sync": "wait"}, {"seq": 56, "type": "serve", "actor": "chris", "arg": null, "text": null, "when": null, "effects": null, "sync": "wait"}, {"seq": 57, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "어떤가요?", "en": "How is it?"}, "when": "grade >= excellent", "effects": null, "sync": "wait"}, {"seq": 58, "type": "say", "actor": "chris", "arg": "success", "text": {"ko": "…생각보다 재능이 있군.", "en": "...More talent than I expected."}, "when": "grade >= excellent", "effects": "affinity.chris += 5", "sync": "wait"}, {"seq": 59, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "이제 반복 학습에서 벗어날 수 있나요?", "en": "Does this mean I'm free from the repetition drills?"}, "when": "grade >= excellent", "effects": null, "sync": "wait"}, {"seq": 60, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "그래. 기본적인 제조 수업은 끝이야.", "en": "Yes. The basic mixing lessons are over."}, "when": "grade >= excellent", "effects": null, "sync": "wait"}, {"seq": 61, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "어떤가요?", "en": "How is it?"}, "when": "grade >= good && grade < excellent", "effects": null, "sync": "wait"}, {"seq": 62, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": ".....", "en": "....."}, "when": "grade >= good && grade < excellent", "effects": null, "sync": "wait"}, {"seq": 63, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "맛이 이상합니까?", "en": "Does it taste wrong?"}, "when": "grade >= good && grade < excellent", "effects": null, "sync": "wait"}, {"seq": 64, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "괜찮군.", "en": "Not bad."}, "when": "grade >= good && grade < excellent", "effects": "affinity.chris += 1", "sync": "wait"}, {"seq": 65, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "이 정도면 기본적인 제조법은 익힌 것 같아.", "en": "At this level, I'd say you've got the basics down."}, "when": "grade >= good && grade < excellent", "effects": null, "sync": "wait"}, {"seq": 66, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "다행이네요.", "en": "That's a relief."}, "when": "grade >= good && grade < excellent", "effects": null, "sync": "wait"}, {"seq": 67, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "아직 개선할 부분은 있지만, 나머지는 일하면서 익히면 되겠어.", "en": "There's still room to improve, but the rest you can pick up on the job."}, "when": "grade >= good && grade < excellent", "effects": null, "sync": "wait"}, {"seq": 68, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "확인했습니다.", "en": "Acknowledged."}, "when": "grade >= good && grade < excellent", "effects": null, "sync": "wait"}, {"seq": 69, "type": "say", "actor": "chris", "arg": "fail", "text": {"ko": "이건 내가 말한 칵테일이 아닌데.", "en": "This isn't the cocktail I asked for."}, "when": "grade < good", "effects": null, "sync": "wait"}, {"seq": 70, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "다른 칵테일의 레시피를 확인한 것 같네요.", "en": "It seems I checked the wrong recipe."}, "when": "grade < good", "effects": null, "sync": "wait"}, {"seq": 71, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "이런 식이면 곤란한데, 루나.\n제대로 만들어.", "en": "This won't do, Luna.\nMake it properly."}, "when": "grade < good", "effects": null, "sync": "wait"}, {"seq": 72, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "네, 알겠습니다.", "en": "Yes, understood."}, "when": "grade < good", "effects": null, "sync": "wait"}, {"seq": 73, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "(<order>드라이 마티니</order> 한 잔이야… 제대로 확인해 보자.)", "en": "(One <order>Dry Martini</order>... let's check it properly this time.)"}, "when": "grade < good", "effects": null, "sync": "wait"}, {"seq": 74, "type": "order", "actor": "chris", "arg": "exact:dry_martini", "text": {"ko": "드라이 마티니 한 잔. 흔들지 말고 저어서.", "en": "One Dry Martini. Stirred, not shaken."}, "when": "grade < good", "effects": null, "sync": "wait"}, {"seq": 75, "type": "craft", "actor": null, "arg": "order", "text": null, "when": "grade < good", "effects": null, "sync": "wait"}, {"seq": 76, "type": "serve", "actor": "chris", "arg": null, "text": null, "when": "grade < good", "effects": null, "sync": "wait"}]}, {"id": "d1_tutorial_wrap", "day": 1, "phase": "bar", "seq": 2, "trigger": "auto", "when": "", "title": "튜토리얼 마무리 — 애매한 주문 조언 + '보스' 호칭 (구 d0c_end)", "skippable": false, "group": "", "steps": [{"seq": 1, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "방금은 내가 원하는 칵테일을 정확히 주문했지만,\n손님에 따라서는 주문을 <world>애매하게</world> 하거나 <world>칵테일 선택</world>을 맡길 수도 있어.", "en": "Just now I told you exactly what I wanted — but some guests\nwill order <world>vaguely</world>, or leave the <world>choice of cocktail</world> entirely to you."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 2, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "그러면 제 마음대로 만들어 주면 되는 건가요?", "en": "Then I may make whatever I like?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 3, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "그래도 되겠지. 하지만 아무 생각 없이 만들어서는 안 돼.", "en": "You could. But never mix without thinking."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 4, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "그러면 어떻게 해야 하죠?", "en": "Then what should I do?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 5, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "애매한 주문이라도 최대한 <world>의도</world>를 파악하려고 해 봐.\n눈앞에 있는 손님이 어떤 맛을 좋아할지도 생각해 보고.", "en": "Even with a vague order, try to read the <world>intent</world> behind it.\nAnd think about what the guest in front of you might actually enjoy."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 6, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "크리스도 알다시피 저는 타인의 취향을 짐작하는 일에는 익숙하지 않습니다.", "en": "As you well know, Chris, guessing other people's tastes is not something I'm used to."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 7, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "뭐든 해 보려는 마음가짐이 중요한 거지.", "en": "What matters is the willingness to try."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 8, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "헷갈리면 가이드 칩에 기록된 <name>칵테일 설명</name>을 읽어 봐.\n어떤 사람에게 어울리는지 판단하는 데 도움이 될 거야.", "en": "If you get lost, read the <name>cocktail descriptions</name> on the guide chip.\nThey'll help you judge who a drink suits."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 9, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "거기에 맛을 기준으로 <name>필터링</name>하는 기능도 있으니까\n그걸 활용해도 좋고.", "en": "There's also a <name>filter</name> that sorts by flavor.\nFeel free to lean on that, too."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 10, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "노력해 보겠습니다.", "en": "I will try."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 11, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "좋아. 처음에는 그렇게 시작하는 거지.", "en": "Good. That's how everyone starts."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 12, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "아직 배워야 될 게 또 남았나요?", "en": "Is there more I need to learn?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 13, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "음... 바텐더의 마음가짐이라든가,\n손님 대하는 방법 같은 것들도 알려 줘야 하지만…", "en": "Hm... there's still the bartender's mindset,\nhow to handle guests, that sort of thing..."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 14, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": ".....", "en": "....."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 15, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "…그래. 오늘은 이 정도면 충분하겠지.\n나머지는 일하면서 배우는 걸로.", "en": "...Right. This is enough for today.\nYou'll learn the rest on the job."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 16, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "이제 가게에서는 크리스 말고 보스라고 불러.", "en": "From now on, in the bar, it's not 'Chris' — call me 'Boss.'"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 17, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "이유가 있습니까?", "en": "Is there a reason?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 18, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "우리 가게 규칙이라고 생각하면 돼.\n나도 처음 왔을 때 그랬어.", "en": "Think of it as a house rule.\nI did the same when I first came here."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 19, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "알겠습니다, 보스.", "en": "Understood, Boss."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 20, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "오늘은 이걸로 끝이니까 먼저 집으로 가.", "en": "That's it for today. Head home ahead of me."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 21, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "보스는 같이 안 가는 겁니까?", "en": "You're not coming, Boss?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 22, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "그래. 원래 오늘은 쉬는 날이지만 거절할 수 없는 <world>손님</world>이 있어서 같이 못 가.", "en": "No. Today was supposed to be my day off, but there's a <world>guest</world> I can't turn away."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 23, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "물론 앞으로도 교대 근무로 할 거라 출퇴근을 같이 하진 못할 거다.", "en": "We'll be working in shifts from here on anyway, so don't expect us to commute together."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 24, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "알겠습니다.", "en": "Understood."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 25, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "밖에서 처음 보는 사람이랑 말하거나 딴 길로 새지 말고 바로 집으로 가.", "en": "Don't talk to strangers out there, and don't wander — go straight home."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 26, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "네, 보스.", "en": "Yes, Boss."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 27, "type": "end_part", "actor": null, "arg": null, "text": null, "when": null, "effects": null, "sync": "wait"}]}], "choices": {"ch_d1_home": [{"seq": 1, "text": {"ko": "지낼 만해요.", "en": "It's livable."}, "when": null, "effects": "affinity.chris += 2", "goto": null}, {"seq": 2, "text": {"ko": "…아직 모르겠어요.", "en": "...I don't know yet."}, "when": null, "effects": "affinity.chris += 1", "goto": null}]}}, "2": {"day": 2, "scenes": [{"id": "d2_meet", "day": 2, "phase": "commute_in", "seq": 2, "trigger": "auto", "when": "", "title": "출근길 — 삼호와 시바견", "skippable": false, "group": "", "steps": [{"seq": 1, "type": "say", "actor": "samho", "arg": "default", "text": {"ko": "어? 너, 그 언노운의 새 바텐더 아냐?", "en": "Huh? You're that new bartender at Unknown, right?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 2, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "맞습니다. 당신은…", "en": "That's right. And you are..."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 3, "type": "say", "actor": "samho", "arg": "default", "text": {"ko": "삼호! 이 구역 애니멀 갱의 미래지. 기억해 둬.", "en": "Samho! The future of the Animal Gang in this district. Remember it."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 4, "type": "say", "actor": "shiba", "arg": "default", "text": {"ko": "시끄러워, 시바.", "en": "Too loud, shiba."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 5, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "(…개가, 말을 했다.)", "en": "(...The dog. It talked.)"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 6, "type": "say", "actor": "shiba", "arg": "default", "text": {"ko": "뭘 봐. 처음 봐, 시바?", "en": "What're you looking at. Never seen one before, shiba?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 7, "type": "say", "actor": "samho", "arg": "default", "text": {"ko": "하하, 얘는 시바. 말버릇은 저래도 나쁜 녀석은 아냐.", "en": "Haha, this is Shiba. Foul mouth, decent guy."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 8, "type": "say", "actor": "shiba", "arg": "default", "text": {"ko": "네가 나쁜 놈이 아닌 거겠지, 시바.", "en": "You mean YOU'RE the decent one, shiba."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 9, "type": "say", "actor": "samho", "arg": "default", "text": {"ko": "아무튼! 조만간 그 가게에 들를 거니까, 맛있는 거 준비해 둬!", "en": "Anyway! I'll drop by that bar of yours soon — have something good ready!"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 10, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "(…시끄러운 아침이다.)", "en": "(...A loud morning.)"}, "when": null, "effects": null, "sync": "wait"}]}, {"id": "d2_home_talk", "day": 2, "phase": "home", "seq": 1, "trigger": "auto", "when": "", "title": "테라스 — 이틀째 밤", "skippable": false, "group": "", "steps": [{"seq": 1, "type": "fx", "actor": null, "arg": "terrace_night", "text": null, "when": null, "effects": null, "sync": "wait"}, {"seq": 2, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "…이틀째다. 오늘은 어땠나.", "en": "...Day two. How was it."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 3, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "손님이 많았습니다. …사람들은, 전부 다르네요.", "en": "There were many guests. ...People are all different."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 4, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "그래. 같은 잔을 시켜도 이유는 전부 다르다.", "en": "Right. Even when they order the same glass, the reasons are never the same."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 5, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "그걸 읽는 게 이 일의 절반이야.", "en": "Reading that is half of this job."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 6, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "…나머지 절반은요?", "en": "...And the other half?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 7, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "기다리는 거다. 손님이 먼저 말할 때까지.", "en": "Waiting. Until the guest speaks first."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 8, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "(기다린다… 기록해 둔다.)", "en": "(Waiting... noted.)"}, "when": null, "effects": null, "sync": "wait"}]}, {"id": "d2_commute_in", "day": 2, "phase": "commute_in", "seq": 1, "trigger": "auto", "when": "", "title": "첫 단독 출근", "skippable": false, "group": "", "steps": [{"seq": 1, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "(첫 정식 출근. 크리스는 먼저 나갔다.)", "en": "(My first real shift. Chris left ahead of me.)"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 2, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "(…거리의 냄새는 아직 낯설다.)", "en": "(...The smell of this street is still unfamiliar.)"}, "when": null, "effects": null, "sync": "wait"}]}, {"id": "d2_news", "day": 2, "phase": "commute_in", "seq": 0, "trigger": "interact", "when": "", "title": "전광판 — 코라테크/실종 뉴스", "skippable": false, "group": "", "steps": [{"seq": 1, "type": "say", "actor": "board", "arg": "default", "text": {"ko": "[속보] 코라테크, 3분기 신경보철 출하량 사상 최대 기록", "en": "[BREAKING] CoraTech posts record Q3 shipments of neural prosthetics"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 2, "type": "say", "actor": "board", "arg": "default", "text": {"ko": "[지역] 서울 외곽 3구역, 실종 신고 3개월 연속 증가… 경비업체 \"순찰 강화\"", "en": "[LOCAL] Missing-person reports in Outer Seoul District 3 rise for a third straight month... security firms 'stepping up patrols'"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 3, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "(…외곽. 남 일 같지 않은 단어다.)", "en": "(...The outskirts. A word that doesn't feel like someone else's problem.)"}, "when": null, "effects": null, "sync": "wait"}]}, {"id": "d2_vendor_intro", "day": 2, "phase": "commute_in", "seq": 0, "trigger": "interact", "when": "", "title": "노점상 완 — 인사 + 상자 퀘스트", "skippable": false, "group": "", "steps": [{"seq": 1, "type": "say", "actor": "vendor", "arg": "default", "text": {"ko": "오, 새 얼굴. 언노운의 새 알바가 너구나? 크리스한테 얘기 들었다.", "en": "Oh, a new face. You're Unknown's new hire, aren't you? Chris told me about you."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 2, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "…안녕하세요. 루나입니다.", "en": "...Hello. I'm Luna."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 3, "type": "say", "actor": "vendor", "arg": "default", "text": {"ko": "난 완. 이 노점 주인이다. 과일이든 탄산이든, 재료가 떨어지면 나한테 와라.", "en": "Name's Wan. I run this stall. Fruit, fizz, whatever — when you run out of stock, come to me."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 4, "type": "say", "actor": "vendor", "arg": "default", "text": {"ko": "아 참 — 어제 배송 상자 하나를 뒷골목에서 흘렸다. 퇴근길에 보이면 주워다 주라. 사례는 하마.", "en": "Oh, right — I dropped a delivery box in the back alley yesterday. If you spot it on your way home, bring it over. I'll make it worth your while."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 5, "type": "effect", "actor": null, "arg": null, "text": null, "when": null, "effects": "flag.q_lost_box_started = true", "sync": "wait"}]}, {"id": "d2_bar_open", "day": 2, "phase": "bar_open", "seq": 1, "trigger": "auto", "when": "", "title": "개점 전 — 크리스의 확인, OPEN 간판을 걸기까지", "skippable": false, "group": "", "steps": [{"seq": 1, "type": "enter", "actor": "chris", "arg": "M", "text": null, "when": null, "effects": null, "sync": "wait"}, {"seq": 2, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "오늘부터는 손님을 직접 받는다. 어제 배운 대로 할 수 있겠지?", "en": "From tonight you take the guests yourself. You can do it the way I taught you, right?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 3, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "코스터를 먼저 내고, 주문을 받고, 만들어서 코스터 위에 올린다.", "en": "Coaster first, then take the order, make it, and set it on the coaster."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 4, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "…외우긴 잘 외웠군. 손이 따라오는지는 해봐야 알겠지만.", "en": "...You memorized it well enough. Whether your hands follow is another matter."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 5, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "틀리면 어떻게 하죠?", "en": "What if I get it wrong?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 6, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "틀린 잔은 내가 물어준다. 두 번 틀리지만 마라.", "en": "I'll cover the wrong ones. Just don't make the same mistake twice."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 7, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "좋아, 시작해보자. 간판 걸어라.", "en": "All right. Let's open. Go flip the sign."}, "when": null, "effects": null, "sync": "wait"}]}, {"id": "d2_commute_out", "day": 2, "phase": "commute_out", "seq": 1, "trigger": "auto", "when": "", "title": "퇴근길 독백", "skippable": false, "group": "", "steps": [{"seq": 1, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "(말하는 개, 목소리 큰 단골… 인간의 밤은 소란스럽다.)", "en": "(A talking dog, a loud regular... human nights are noisy.)"}, "when": null, "effects": null, "sync": "wait"}]}, {"id": "d2_box_found", "day": 2, "phase": "commute_out", "seq": 0, "trigger": "interact", "when": "", "title": "상자 발견(퀘스트 완료)", "skippable": false, "group": "", "steps": [{"seq": 1, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "(…골목 구석, 발자국에 밟힌 상자. 노점 마크가 찍혀 있다.)", "en": "(...A box in the corner of the alley, trampled, stamped with the stall's mark.)"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 2, "type": "effect", "actor": null, "arg": null, "text": null, "when": null, "effects": "flag.q_lost_box_done = true; quest(lost_box).advance", "sync": "wait"}, {"seq": 3, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "(내일 완 아저씨한테 가져다주자.)", "en": "(I'll bring it to Wan tomorrow.)"}, "when": null, "effects": null, "sync": "wait"}]}, {"id": "d2_dream", "day": 2, "phase": "dream", "seq": 1, "trigger": "auto", "when": "", "title": "꿈 — 습격 1: 유나의 목소리와 총성", "skippable": false, "group": "", "steps": [{"seq": 1, "type": "fx", "actor": null, "arg": "glitch_in", "text": null, "when": null, "effects": null, "sync": "wait"}, {"seq": 2, "type": "say", "actor": "yuna", "arg": "default", "text": {"ko": "루나. 눈 감아. 무슨 소리가 나도, 뜨면 안 돼.", "en": "Luna. Close your eyes. Whatever you hear — don't open them."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 3, "type": "sfx", "actor": null, "arg": "alarm_distant", "text": null, "when": null, "effects": null, "sync": "wait"}, {"seq": 4, "type": "say", "actor": "yuna", "arg": "default", "text": {"ko": "괜찮아. …넌 사람을 돕는 아이야. 그렇지?", "en": "It's okay. ...You're a child who helps people. Aren't you?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 5, "type": "sfx", "actor": null, "arg": "gunshot", "text": null, "when": null, "effects": null, "sync": "wait"}, {"seq": 6, "type": "fx", "actor": null, "arg": "hard_cut", "text": null, "when": null, "effects": null, "sync": "wait"}, {"seq": 7, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "…!!", "en": "...!!"}, "when": null, "effects": "flag.dream_raid_1 = true", "sync": "wait"}]}, {"id": "d2_open", "day": 2, "phase": "bar", "seq": 1, "trigger": "auto", "when": "", "title": "개점 — 크리스와 교대 전 당부", "skippable": false, "group": "", "steps": [{"seq": 1, "type": "enter", "actor": "chris", "arg": "R", "text": null, "when": null, "effects": null, "sync": "wait"}, {"seq": 2, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "좋아. 그럼 부탁한다.", "en": "Alright. Then I'm counting on you."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 3, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "네, 크리스.", "en": "Yes, Chris."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 4, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "보스.", "en": "Boss."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 5, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "네, 보스.", "en": "Yes, Boss."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 6, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "그래. 오늘이 첫날인데 너무 긴장하진 말고.\n물론 넌 안 할 것 같지만.", "en": "Good. It's your first day, so don't be too nervous.\nNot that you seem capable of it."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 7, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "저도 긴장할 때가 있습니다.", "en": "I do get nervous sometimes."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 8, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "..너가?", "en": "..You?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 9, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "개와 흡사하게 생긴 사람을 보면 거부 반응을 일으킵니다.", "en": "I experience a rejection response when I see people who closely resemble dogs."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 10, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "…무슨 이유인지 물어보진 않겠다.", "en": "...I'm not going to ask why."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 11, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "네, 보스.", "en": "Yes, Boss."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 12, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "좋아. 그럼 자정 전까지만 부탁해.\n그 이후엔 나랑 교대할 거야.", "en": "Alright. You've got the counter until midnight.\nAfter that, I'll take over."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 13, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "그리고 오늘부터 매일 유지비를 계속 내야 하니까 알아둬.", "en": "And heads up — starting today, you pay the daily upkeep."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 14, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "그걸 제가 내는 건가요?", "en": "I'm the one paying that?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 15, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "그래. 언제까지 놀고먹을 수는 없어.\n사회로 나왔으면 자기 몫은 해야지.", "en": "That's right. You can't freeload forever.\nYou're out in the world now — pull your own weight."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 16, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "제가 생각하기엔 행복이란 건 \n일을 하지 않아도 되는 삶인 것 같습니다.", "en": "In my analysis, happiness is\na life where one does not have to work."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 17, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "너 오늘 첫 출근이야. 앓는 소리는 짬 차면 해.", "en": "It's your first shift. Earn some seniority before you start whining."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 18, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "노력해 보겠습니다.", "en": "I will make an effort."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 19, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "또 몰래 재료 먹으면 안 돼.", "en": "And no sneaking bites of the ingredients again."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 20, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "네. 알겠습니다.", "en": "Yes. Understood."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 21, "type": "say", "actor": "chris", "arg": "default", "text": {"ko": "그래, 간다.", "en": "Right. I'm off."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 22, "type": "exit", "actor": "chris", "arg": null, "text": null, "when": null, "effects": null, "sync": "wait"}, {"seq": 23, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "……", "en": "......"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 24, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "이번엔 올리브를 한 번……", "en": "This time, maybe an olive......"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 25, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "……생각보다 기름지고 쓴맛이 느껴지네.", "en": "......Oilier and more bitter than expected."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 26, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "이게 라임이었나?", "en": "Was this a lime?"}, "when": null, "effects": null, "sync": "wait"}]}, {"id": "d2_port", "day": 2, "phase": "bar", "seq": 2, "trigger": "auto", "when": "", "title": "포트 첫 방문 — 진피즈, 조니 이야기, 부비 배달", "skippable": false, "group": "", "steps": [{"seq": 1, "type": "enter", "actor": "port", "arg": "R", "text": null, "when": null, "effects": null, "sync": "wait"}, {"seq": 2, "type": "say", "actor": "port", "arg": "default", "text": {"ko": "뭐야. 진짜 여기서 일하고 있네.", "en": "What the. You really do work here."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 3, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "아응넝하세요. 소응님.", "en": "Wewcome in, shir. Guhd ebening."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 4, "type": "say", "actor": "port", "arg": "default", "text": {"ko": "뭘 입에다 쳐 넣고 얘기하는 거야?", "en": "What the hell are you talking with in your mouth?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 5, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "크흠. 아닙니다. 어서 오세요.", "en": "Ahem. Nothing. Welcome in."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 6, "type": "say", "actor": "port", "arg": "default", "text": {"ko": "크리스가 와 보라고 한 이유가 있었구만?", "en": "So Chris had a reason for telling me to drop by."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 7, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "손님으로 온 건가요?", "en": "Are you here as a customer?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 8, "type": "say", "actor": "port", "arg": "default", "text": {"ko": "당연하지. 내가 그럼 여기 일하러 왔을까 봐?", "en": "Obviously. What, you think I came here to work?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 9, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "확인했습니다. 혹시 옆에 있는 로봇은 무슨 로봇입니까?", "en": "Confirmed. By the way, what is that robot next to you?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 10, "type": "say", "actor": "port", "arg": "default", "text": {"ko": "뭐?", "en": "What?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 11, "type": "say", "actor": "port", "arg": "event_surprise", "text": {"ko": "ㅁ..뭐야! 니미랄!!!", "en": "Wh..what the! Son of a—!!!"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 12, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "키우는 게 아니였군요.", "en": "So it is not a pet."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 13, "type": "say", "actor": "port", "arg": "default", "text": {"ko": "흠.. 아까 폐기물 매립 구역에서 붙은 놈인가보군..", "en": "Hm.. must've latched onto me back at the waste landfill zone.."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 14, "type": "say", "actor": "port", "arg": "default", "text": {"ko": "이 놈도 이따 가서 한번 손 봐야겠어.", "en": "I'll have to take this one apart later too."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 15, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "아재 주문을 부탁드립니다.", "en": "Old-timer, your order, please."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 16, "type": "say", "actor": "port", "arg": "default", "text": {"ko": "흠… 기다려 봐.", "en": "Hmm... hold on."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 17, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "아쉽지만 '기다려 봐'라는 술은 없습니다.", "en": "Unfortunately, we do not carry a drink called 'Hold On.'"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 18, "type": "say", "actor": "port", "arg": "default", "text": {"ko": "야 이 또라이야 자꾸 그럴래?", "en": "Hey, you lunatic, you gonna keep that up?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 19, "type": "say", "actor": "port", "arg": "default", "text": {"ko": "크리스 이 자식은 대체 뭘 가르친 거야?", "en": "What the hell did Chris even teach you?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 20, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "보스가 나머지는 일하면서 배우라고 했습니다.", "en": "Boss said I should learn the rest on the job."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 21, "type": "say", "actor": "port", "arg": "
