default", "text": {"ko": "어쩐지 나보고 오늘 일찍 끝내고 오라더니…\n이 썩을 놈이 날 교육 자료로 써?", "en": "No wonder he told me to close up early and come over...\nThat rotten bastard's using me as training material?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 22, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "교육 자료로 쓰기엔 많이 노후된 걸로 보입니다.", "en": "You appear too worn-out to serve as training material."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 23, "type": "say", "actor": "port", "arg": "default", "text": {"ko": "……", "en": "......"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 24, "type": "say", "actor": "port", "arg": "default", "text": {"ko": "……일단 <name>진피즈</name> 한 잔 줘. 정석대로.", "en": "......Just get me a <name>Gin Fizz</name>. By the book."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 25, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "네, 손님.", "en": "Yes, sir."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 26, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "(<name>진피즈</name> 한 잔. 정석대로.)", "en": "(One <name>Gin Fizz</name>. By the book.)"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 27, "type": "order", "actor": "port", "arg": "exact:gin_fizz", "text": {"ko": "진피즈, 정석대로.", "en": "A Gin Fizz, by the book."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 28, "type": "craft", "actor": null, "arg": "order", "text": null, "when": null, "effects": null, "sync": "wait"}, {"seq": 29, "type": "serve", "actor": "port", "arg": null, "text": null, "when": null, "effects": null, "sync": "wait"}, {"seq": 30, "type": "say", "actor": "port", "arg": "default", "text": {"ko": "야!", "en": "Hey!"}, "when": "grade >= excellent", "effects": null, "sync": "wait"}, {"seq": 31, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "왜요?", "en": "Yes?"}, "when": "grade >= excellent", "effects": null, "sync": "wait"}, {"seq": 32, "type": "say", "actor": "port", "arg": "default", "text": {"ko": "이거 왜 맛있어?", "en": "Why does this taste good?"}, "when": "grade >= excellent", "effects": null, "sync": "wait"}, {"seq": 33, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "혹시 주문이 맛없는 진피즈였습니까?", "en": "Was your order for a bad Gin Fizz?"}, "when": "grade >= excellent", "effects": null, "sync": "wait"}, {"seq": 34, "type": "say", "actor": "port", "arg": "joy", "text": {"ko": "아니. 그건 아니지만. 애송이가 만든 거라고 믿기지 않는군.", "en": "No. It's not that. Just hard to believe a greenhorn made this."}, "when": "grade >= excellent", "effects": null, "sync": "wait"}, {"seq": 35, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "칭찬 감사합니다.\n나가실 때 추가 팁은 테이블 위에 올려두시면 됩니다.", "en": "Thank you for the compliment.\nAdditional tips may be left on the table on your way out."}, "when": "grade >= excellent", "effects": null, "sync": "wait"}, {"seq": 36, "type": "say", "actor": "port", "arg": "serious", "text": {"ko": "…아직 손님 응대는 개판이지만.", "en": "...Though your customer service is still a mess."}, "when": "grade >= excellent", "effects": null, "sync": "wait"}, {"seq": 37, "type": "say", "actor": "port", "arg": "serious", "text": {"ko": "흠…", "en": "Hmm..."}, "when": "grade >= good && grade < excellent", "effects": null, "sync": "wait"}, {"seq": 38, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "어떤가요?", "en": "How is it?"}, "when": "grade >= good && grade < excellent", "effects": null, "sync": "wait"}, {"seq": 39, "type": "say", "actor": "port", "arg": "joy", "text": {"ko": "생각보다 나쁘지않네.", "en": "Not as bad as I expected."}, "when": "grade >= good && grade < excellent", "effects": null, "sync": "wait"}, {"seq": 40, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "칭찬입니까?", "en": "Is that a compliment?"}, "when": "grade >= good && grade < excellent", "effects": null, "sync": "wait"}, {"seq": 41, "type": "say", "actor": "port", "arg": "joy", "text": {"ko": "이제 막 시작한 애송이한테 이 정도면 칭찬이지.", "en": "For a greenhorn who just started, that's a compliment, yeah."}, "when": "grade >= good && grade < excellent", "effects": null, "sync": "wait"}, {"seq": 42, "type": "say", "actor": "port", "arg": "serious", "text": {"ko": "흐음.", "en": "Hmmm."}, "when": "grade >= decent && grade < good", "effects": null, "sync": "wait"}, {"seq": 43, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "맛이 어떠십니까?", "en": "How does it taste?"}, "when": "grade >= decent && grade < good", "effects": null, "sync": "wait"}, {"seq": 44, "type": "say", "actor": "port", "arg": "serious", "text": {"ko": "진피즈긴 한데… 뭔가 어설퍼.", "en": "It's a Gin Fizz, sure... but something's clumsy about it."}, "when": "grade >= decent && grade < good", "effects": null, "sync": "wait"}, {"seq": 45, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "제조 과정에서 완성도가 부족했던 것 같습니다.", "en": "It appears the execution lacked polish."}, "when": "grade >= decent && grade < good", "effects": null, "sync": "wait"}, {"seq": 46, "type": "say", "actor": "port", "arg": "serious", "text": {"ko": "마시는 데 지장은 없어. 다음엔 좀 더 정성 들여.", "en": "It's drinkable. Put more care into the next one."}, "when": "grade >= decent && grade < good", "effects": null, "sync": "wait"}, {"seq": 47, "type": "say", "actor": "port", "arg": "default", "text": {"ko": "이야 대단한데?", "en": "Wow, impressive."}, "when": "grade >= poor && grade < decent", "effects": null, "sync": "wait"}, {"seq": 48, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "네?", "en": "Pardon?"}, "when": "grade >= poor && grade < decent", "effects": null, "sync": "wait"}, {"seq": 49, "type": "say", "actor": "port", "arg": "serious", "text": {"ko": "얼마나 자신있으면 시키지도 않은 술을 주는 거지?", "en": "How confident do you have to be to serve a drink nobody ordered?"}, "when": "grade >= poor && grade < decent", "effects": null, "sync": "wait"}, {"seq": 50, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "죄송합니다. 레시피를 다른 것으로 찾은 것 같습니다.", "en": "My apologies. I appear to have pulled up the wrong recipe."}, "when": "grade >= poor && grade < decent", "effects": null, "sync": "wait"}, {"seq": 51, "type": "say", "actor": "port", "arg": "serious", "text": {"ko": "나 말고도 다른 손님한테 이러면 곤란할 텐데.", "en": "You pull this on other customers, you're in trouble."}, "when": "grade >= poor && grade < decent", "effects": null, "sync": "wait"}, {"seq": 52, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "다시 만들어 드리겠습니다.", "en": "I will make it again."}, "when": "grade >= poor && grade < decent", "effects": null, "sync": "wait"}, {"seq": 53, "type": "say", "actor": "port", "arg": "serious", "text": {"ko": "됐어. 그냥 마실 테니 다음부턴 실수하지 마.", "en": "Forget it. I'll drink it — just don't slip up again."}, "when": "grade >= poor && grade < decent", "effects": null, "sync": "wait"}, {"seq": 54, "type": "say", "actor": "port", "arg": "serious", "text": {"ko": "하지만 내가 주문한 것도 아닌 걸 줬으니.\n돈은 못 내, 알았지?", "en": "But since this isn't what I ordered,\nI'm not paying for it. Got it?"}, "when": "grade >= poor && grade < decent", "effects": null, "sync": "wait"}, {"seq": 55, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "네, 알겠습니다.", "en": "Yes, understood."}, "when": "grade >= poor && grade < decent", "effects": null, "sync": "wait"}, {"seq": 56, "type": "say", "actor": "port", "arg": "default", "text": {"ko": "……", "en": "......"}, "when": "grade < poor", "effects": null, "sync": "wait"}, {"seq": 57, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "왜 아무 말도 없으십니까?", "en": "Why are you not saying anything?"}, "when": "grade < poor", "effects": null, "sync": "wait"}, {"seq": 58, "type": "say", "actor": "port", "arg": "anger", "text": {"ko": "이게 술이냐?", "en": "You call this a drink?"}, "when": "grade < poor", "effects": null, "sync": "wait"}, {"seq": 59, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "형식상으로는 그렇습니다.", "en": "Technically, it qualifies as one."}, "when": "grade < poor", "effects": null, "sync": "wait"}, {"seq": 60, "type": "say", "actor": "port", "arg": "anger", "text": {"ko": "아니, 나는 내 미각을 마비시키는 무언가를 쓰레기라 부르기로 했어.", "en": "No. I've decided to call anything that paralyzes my taste buds garbage."}, "when": "grade < poor", "effects": null, "sync": "wait"}, {"seq": 61, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "손님의 감각 기관에 손상을 줄 의도는 없었습니다.", "en": "There was no intent to damage your sensory organs."}, "when": "grade < poor", "effects": null, "sync": "wait"}, {"seq": 62, "type": "say", "actor": "port", "arg": "anger", "text": {"ko": "사람한테 총을 쏴 놓고 고의가 아니라고 하는 등신 같은 갱놈들 같군.\n기회를 주지. 다시 만들어.", "en": "You sound like those idiot gangers who shoot a man and claim it wasn't on purpose.\nI'll give you one more chance. Make it again."}, "when": "grade < poor", "effects": null, "sync": "wait"}, {"seq": 63, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "알겠습니다.", "en": "Understood."}, "when": "grade < poor", "effects": null, "sync": "wait"}, {"seq": 64, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "(<진피즈> 한 잔. 레시피를 잘 확인하자.)", "en": "(One <Gin Fizz>. Check the recipe carefully this time.)"}, "when": "grade < poor", "effects": null, "sync": "wait"}, {"seq": 65, "type": "effect", "actor": null, "arg": null, "text": null, "when": "grade < poor", "effects": "flag.d2_port_retry = true", "sync": "wait"}, {"seq": 66, "type": "order", "actor": "port", "arg": "exact:gin_fizz", "text": {"ko": "진피즈, 정석대로.", "en": "A Gin Fizz, by the book."}, "when": "flag.d2_port_retry", "effects": null, "sync": "wait"}, {"seq": 67, "type": "craft", "actor": null, "arg": "order", "text": null, "when": "flag.d2_port_retry", "effects": null, "sync": "wait"}, {"seq": 68, "type": "serve", "actor": "port", "arg": null, "text": null, "when": "flag.d2_port_retry", "effects": null, "sync": "wait"}, {"seq": 69, "type": "say", "actor": "port", "arg": "default", "text": {"ko": "네가 아무리 못 만들어도 크리스가 처음 만든 술보다는 훨씬 낫지.", "en": "However badly you make it, it's still miles better than Chris's first drink."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 70, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "보스가 만든 술은 맛이 없었습니까?", "en": "Was the Boss's drink that bad?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 71, "type": "say", "actor": "port", "arg": "serious", "text": {"ko": "마시면 인생을 다시 생각하게 되는 맛이었지.", "en": "It was the kind of taste that makes you reconsider your whole life."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 72, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "철학적인 맛이었나 보네요.", "en": "A philosophical flavor, it seems."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 73, "type": "say", "actor": "port", "arg": "serious", "text": {"ko": "아니. 대체 어쩌다 내가 휘발유 맛이 나는 술을 마시고 있는\n인생을 살게 되었는지 생각한 거야.", "en": "No. I mean I sat there wondering how my life had come to the point\nwhere I was drinking something that tasted like gasoline."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 74, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "지금은 어떤가요?", "en": "And now?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 75, "type": "say", "actor": "port", "arg": "serious", "text": {"ko": "처음보단 나아졌지만 여전히 쓰레기지.\n무슨 수로 지금까지 버틴 건지 참……", "en": "Better than at first, but still garbage.\nHow this place survived is beyond me......"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 76, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "이전에 보스가 바를 닫으려고 생각한 적이 있다고 했습니다.", "en": "The Boss once mentioned he'd thought about closing the bar."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 77, "type": "say", "actor": "port", "arg": "anger", "text": {"ko": "뭐? 이 썩을 놈이 이 가게가 어떤 곳인 줄 알고 문을 닫아.", "en": "What? That rotten punk — does he even know what this place is, talking about closing it?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 78, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "보스가 운영하던 가게가 아니었습니까?", "en": "Was it not the Boss's bar to begin with?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 79, "type": "say", "actor": "port", "arg": "serious", "text": {"ko": "원래 이 바의 주인은 조니라는 친구였지.", "en": "The original owner of this bar was a guy named Johnny."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 80, "type": "say", "actor": "port", "arg": "serious", "text": {"ko": "조니가 있었으면 언노운이 이렇게 되진 않았을 텐데.", "en": "If Johnny were still around, Unknown wouldn't have ended up like this."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 81, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "……", "en": "......"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 82, "type": "say", "actor": "port", "arg": "default", "text": {"ko": "그래도 루나 널 보니 뭔가 달라질 수도 있을 것 같네.\n아직 애송이지만 말이야.", "en": "Still, looking at you, Luna, maybe things could change around here.\nEven if you're still a greenhorn."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 83, "type": "say", "actor": "port", "arg": "default", "text": {"ko": "계속 크리스가 운영했었으면 십중팔구 갱단 아지트가 되었겠지.", "en": "If Chris had kept running it alone, odds are it'd be a gang hideout by now."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 84, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "하지만 제가 배운 것들은 다 보스가 알려준 겁니다.", "en": "But everything I know was taught to me by the Boss."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 85, "type": "say", "actor": "port", "arg": "default", "text": {"ko": "무슨 이유인지 몰라도 그 자식은 조니한테 잘 배워 놓고\n술은 드럽게 못 만들어.", "en": "For whatever reason, that punk learned everything from Johnny\nand still makes drinks like absolute filth."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 86, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "일부러 못만드는 게 아닌가요?", "en": "Could he be making them badly on purpose?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 87, "type": "say", "actor": "port", "arg": "default", "text": {"ko": "그런 거라면 당장 저 문을 열고 면상에 한 방 꽂아주고 싶군.", "en": "If that's the case, I'd like to walk through that door right now and plant one in his face."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 88, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "흥미롭네요. 이런 건 처음 들었습니다.", "en": "Interesting. I have never heard any of this."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 89, "type": "say", "actor": "port", "arg": "default", "text": {"ko": "그래도 네 보스잖아. 너무 나쁘게 보지는 말라고.", "en": "Still, he's your boss. Don't think too badly of him."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 90, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "지금까지 보스를 욕한 건 포트 혼자였습니다.", "en": "So far, the only one badmouthing the Boss has been you, Port."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 91, "type": "say", "actor": "port", "arg": "serious", "text": {"ko": "…그래도 크리스가 술 만드는 것 이외에\n바텐더로서 뭘 해야 하는지는 잘 알고 있으니까 배워 둬.", "en": "...Still, aside from the actual mixing,\nChris knows exactly what a bartender should be. Learn that from him."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 92, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "네, 알겠습니다.", "en": "Yes, understood."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 93, "type": "say", "actor": "port", "arg": "default", "text": {"ko": "그래.", "en": "Good."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 94, "type": "say", "actor": "port", "arg": "default", "text": {"ko": "그나저나 내가 첫 손님인데 부탁 하나 해도 되지?", "en": "By the way — I'm your first customer. Mind doing me a favor?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 95, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "여기는 유흥업소가 아닙니다.", "en": "This is not that kind of establishment."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 96, "type": "say", "actor": "port", "arg": "default", "text": {"ko": "뭔 헛소리야? 그딴 주문 말고 다른 거.", "en": "What kind of nonsense is that? Not that kind of favor — something else."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 97, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "말씀하세요.", "en": "Go ahead."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 98, "type": "say", "actor": "port", "arg": "default", "text": {"ko": "밖에 나가면 고양이 한 마리가 자고 있을 텐데.\n데리고 와줘.", "en": "There should be a cat sleeping right outside.\nBring it in for me."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 99, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "혹시 바텐더 업무에 야생동물 포획이 포함되는 겁니까?", "en": "Does bartending duty include the capture of wild animals?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 100, "type": "say", "actor": "port", "arg": "joy", "text": {"ko": "내가 부탁이라고 했잖아. 나도 어찌 보면 생명의 은인인데,\n이 정도는 해 줄 수 있지?", "en": "I said it was a favor. I did save your life, in a manner of speaking —\nyou can do this much for me, right?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 101, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "보수가 충분하다면 못 할 일은 아닙니다.", "en": "Given sufficient compensation, it is not impossible."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 102, "type": "say", "actor": "port", "arg": "serious", "text": {"ko": "…내가 아주 골치 아픈 놈을 고쳐놨군.\n알겠으니까 부탁하지.", "en": "...I really fixed up one troublesome piece of work.\nFine, fine. Please."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 103, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "네, 손님.", "en": "Yes, sir."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 104, "type": "timeline", "actor": null, "arg": "tl_bubi_meet", "text": null, "when": null, "effects": null, "sync": "wait"}, {"seq": 105, "type": "enter", "actor": "bubi", "arg": "L", "text": null, "when": null, "effects": null, "sync": "wait"}, {"seq": 106, "type": "say", "actor": "bubi", "arg": "default", "text": {"ko": "먀옹.", "en": "Meow."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 107, "type": "say", "actor": "port", "arg": "joy", "text": {"ko": "좋아. 잘 데려왔구먼.", "en": "Good. Nicely done."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 108, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "데려오라고 한 이유가 뭐죠?", "en": "Why did you want it brought in?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 109, "type": "say", "actor": "port", "arg": "default", "text": {"ko": "이번에 새로 찾은 물건이 있어서 살펴봐야되는데.\n부비가 옆에서 계속 방해를 하거든.", "en": "I picked up a new find I need to look over,\nbut Bubi keeps getting in the way."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 110, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "이 고양이의 이름이 부비인가요?", "en": "Is this cat's name Bubi?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 111, "type": "say", "actor": "port", "arg": "joy", "text": {"ko": "맞아. 그럼 먼저 일어난다.\n잘 부탁할게.", "en": "That's right. Well, I'm off.\nTake good care of her."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 112, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "네? 어디 가세요?", "en": "Pardon? Where are you going?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 113, "type": "say", "actor": "port", "arg": "joy", "text": {"ko": "크크. 오랜만에 제대로 된 작업을 할 수 있겠구먼.", "en": "Heh heh. Finally, some proper work after all this time."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 114, "type": "exit", "actor": "port", "arg": null, "text": null, "when": null, "effects": null, "sync": "wait"}, {"seq": 115, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "……", "en": "......"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 116, "type": "say", "actor": "bubi", "arg": "default", "text": {"ko": "먀옹.", "en": "Meow."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 117, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "…이런 건 생각 못했는데.", "en": "...I did not anticipate this."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 118, "type": "say", "actor": "bubi", "arg": "default", "text": {"ko": "먀옹.", "en": "Meow."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 119, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "혹시 올리브를 좋아하시나요?", "en": "Do you happen to like olives?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 120, "type": "say", "actor": "bubi", "arg": "default", "text": {"ko": "먀옹.", "en": "Meow."}, "when": null, "effects": null, "sync": "wait"}]}, {"id": "d2_aili", "day": 2, "phase": "bar", "seq": 3, "trigger": "auto", "when": "", "title": "아일리 등장 — 박스 위의 레이디", "skippable": false, "group": "", "steps": [{"seq": 1, "type": "enter", "actor": "aili", "arg": "R", "text": null, "when": null, "effects": null, "sync": "wait"}, {"seq": 2, "type": "say", "actor": "aili", "arg": "default", "text": {"ko": "손님 받아라!!!", "en": "Customer coming through!!!"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 3, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "어서 오세요, 손님.", "en": "Welcome in, ma'am."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 4, "type": "say", "actor": "aili", "arg": "default", "text": {"ko": "오랜만이야, 이쁜이. 진짜 여기서 일하고 있었구나.", "en": "Long time no see, cutie. So you really are working here."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 5, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "네? 누가 말해주던가요?", "en": "Pardon? Who told you?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 6, "type": "say", "actor": "aili", "arg": "default", "text": {"ko": "방금 여기서 도망간 영감이 말해줬지.\n나한테 여기로 꺼지라는 말과 함께.", "en": "The old man who just fled this place told me.\nRight along with 'get lost and head to the bar.'"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 7, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "이해했습니다. 두 분 다 위에 있는 수리점에서\n같이 일하고 있었죠?", "en": "Understood. You both work together\nat the repair shop upstairs, correct?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 8, "type": "say", "actor": "aili", "arg": "default", "text": {"ko": "맞아. 서로 하는 일은 좀 다르지만 말이야.", "en": "Right. Though what we each do is a little different."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 9, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "혹시 그분은 길고양이 유기가 취미인가요?", "en": "Is abandoning stray cats a hobby of his?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 10, "type": "say", "actor": "aili", "arg": "default", "text": {"ko": "큭큭. 그 영감 취미가 제정신은 아니긴 해.\n근데 쟨 할배가 전부터 키우던 고양이야.", "en": "Heh heh. The old man's hobbies aren't exactly sane, true.\nBut that one's a cat he's kept for ages."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 11, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "무슨 이유로 저한테 맡긴 걸까요?", "en": "Why would he leave her with me?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 12, "type": "say", "actor": "aili", "arg": "default", "text": {"ko": "몰라. 오늘 혼자서 만들고 싶은 게 있다고 그러던데.", "en": "No idea. He said there was something he wanted to build alone today."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 13, "type": "say", "actor": "aili", "arg": "default", "text": {"ko": "나도 쫓겨났다니까?\n빌어먹을 영감탱이.", "en": "He kicked me out too, you know?\nDamn old geezer."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 14, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "흠. 곤란하네요. 아직 동물을 다루는 방법은 배우지 못했습니다.", "en": "Hm. This is problematic. I have not yet learned how to handle animals."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 15, "type": "say", "actor": "aili", "arg": "default", "text": {"ko": "걱정 마. 부비가 평범한 고양이는 아니거든.", "en": "Don't worry. Bubi's no ordinary cat."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 16, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "이름이 부비인가요?", "en": "Her name is Bubi?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 17, "type": "say", "actor": "aili", "arg": "default", "text": {"ko": "맞아. 나름 이 동네에서 악명을 떨치는 고양이니까 \n놀러 오면 잘 대접해주라고.", "en": "Yep. She's got quite the reputation around this neighborhood,\nso treat her well when she visits."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 18, "type": "say", "actor": "bubi", "arg": "default", "text": {"ko": "먀옹.", "en": "Meow."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 19, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "네. 향후 바텐더 업무 내용에 참고하겠습니다.", "en": "Noted. I will factor it into future bartending duties."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 20, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "그리고 혹시 왜 의자에 앉지 않는 건지 알려주실 수 있나요?", "en": "Also, may I ask why you will not sit on a chair?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 21, "type": "say", "actor": "aili", "arg": "default", "text": {"ko": "난 날 내려다 보는 사람이 있으면 \n면상에 총알을 박아주고 싶은 병이있어.", "en": "I've got this condition — when someone looks down on me,\nI want to put a bullet in their face."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 22, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "그런 병은 처음 들어 봤습니다.", "en": "I have never heard of such a condition."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 23, "type": "say", "actor": "aili", "arg": "default", "text": {"ko": "음음. 그럴 수 있어. 이건 희귀한 병이기 때문이지.", "en": "Mm-hm. Understandable. It's a very rare condition."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 24, "type": "say", "actor": "aili", "arg": "fail", "text": {"ko": "아무튼 내가 의자에 앉으면 다른 사람들이 건방지게 날 깔본단 말이야.", "en": "Anyway, when I sit on a chair, people get cocky and look down on me."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 25, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "그래서 그 박스를 밟고 서 계신 겁니까?", "en": "Is that why you are standing on that box?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 26, "type": "say", "actor": "aili", "arg": "fail", "text": {"ko": "맞아 이 박스 덕분에 건방진 크리스가 아직 총에 맞지 않는거야.\n어떻게 보면 이 박스가 사람 하나 살려준 셈이지.", "en": "Exactly. Thanks to this box, that cocky Chris hasn't been shot yet.\nIn a way, this box has saved a man's life."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 27, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "아하… 이해했습니다.", "en": "Ah... understood."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 28, "type": "say", "actor": "aili", "arg": "default", "text": {"ko": "좋아. 그럼 슬슬 이쁜이가 만들어 주는 술 한 번 먹어 볼까?", "en": "Alright. Time to try a drink made by my cutie, shall we?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 29, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "주문은 어떤 걸로 하시겠습니까?", "en": "What would you like to order?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 30, "type": "say", "actor": "aili", "arg": "default", "text": {"ko": "음…\n나 같은 섹시한 레이디한테 어울리는 술로 부탁해.", "en": "Hmm...\nMake me something that suits a sexy lady like myself."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 31, "type": "choice", "actor": null, "arg": "ch_d2_aili_lady", "text": null, "when": null, "effects": null, "sync": "wait"}]}, {"id": "d2_aili_lady_q", "day": 2, "phase": "bar", "seq": 0, "trigger": "manual", "when": "", "title": "분기 — 섹시한 레이디란 무엇인가", "skippable": false, "group": "", "steps": [{"seq": 1, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "섹시한 레이디는 어떤 의미죠?", "en": "What does 'sexy lady' mean, exactly?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 2, "type": "say", "actor": "aili", "arg": "default", "text": {"ko": "남녀 불문하고 내 매력에 빠져 돈이나 임플란트까지 뜯어다 바치는\n매력을 가진 레이디라는 거지.", "en": "It means a lady so charming that men and women alike fall for her\nand hand over their money — even their implants."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 3, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "그런 적이 있나요?", "en": "Has that ever actually happened?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 4, "type": "say", "actor": "aili", "arg": "default", "text": {"ko": "옛날에 KCPD 새끼들이 내 업장에 들이닥쳐서\n영업정지 때리기 전까진 자주 있었지.", "en": "Happened all the time, back before those KCPD bastards\nstormed my establishment and shut it down."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 5, "type": "say", "actor": "aili", "arg": "default", "text": {"ko": "그 이후로 KCPD랑 나한테 돈 빌려준 놈들이 아주 그냥\n발정 난 개새끼마냥 날 찾으려고 염병을 하더라고.", "en": "Ever since, the KCPD and everyone I owe money to have been\nscrambling to find me like dogs in heat."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 6, "type": "say", "actor": "aili", "arg": "default", "text": {"ko": "별것도 아닌 일로 왜 그렇게 피곤하게 하는지.\n정말 할 짓 없는 자식들이라니까?", "en": "All that fuss over nothing.\nSeriously, don't they have anything better to do?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 7, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "그렇다면 섹시한 레이디란 건 많은 이들한테 쫓겨서 피곤한 사람이란 거네요.", "en": "So a 'sexy lady' is someone exhausted from being chased by many people."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 8, "type": "say", "actor": "aili", "arg": "default", "text": {"ko": "정확해. 내가 보기엔 루나 너도 재능이 충분히 있어 보여.\n어때? 나한테 배워볼 생각은?", "en": "Exactly. And you know, Luna, I'd say you've got real talent.\nHow about it? Want to learn from me?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 9, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "거절합니다. 아직 일 시작한 지 하루밖에 되지 않았습니다.", "en": "I decline. I have only been on this job for one day."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 10, "type": "say", "actor": "aili", "arg": "default", "text": {"ko": "쯧. 재미없게 하긴.온다고 하면 크리스가 \n나한테 잔소리할 걸 생각하니 귀찮긴 하겠다.", "en": "Tch. No fun at all. Then again, if you said yes,\nChris would nag me to death — what a hassle that'd be."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 11, "type": "say", "actor": "aili", "arg": "default", "text": {"ko": "뭐, 어쨌든 빨리 술 한 잔 만들어줘 봐.", "en": "Well, whatever. Hurry up and make me that drink."}, "when": null, "effects": null, "sync": "wait"}]}, {"id": "d2_aili_craft", "day": 2, "phase": "bar", "seq": 4, "trigger": "auto", "when": "", "title": "아일리 주문 — 그리고 부비의 한 잔", "skippable": false, "group": "", "steps": [{"seq": 1, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "네, 주문 받았습니다.", "en": "Yes, order received."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 2, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "(자칭 <name>섹시한 레이디</name>에게 술 한 잔……)", "en": "(One drink for the self-proclaimed <name>sexy lady</name>......)"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 3, "type": "order", "actor": "aili", "arg": "exact:cosmopolitan", "text": {"ko": "섹시한 레이디한테 어울리는 술 한 잔..", "en": "A drink fit for a sexy lady.."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 4, "type": "craft", "actor": null, "arg": "order", "text": null, "when": null, "effects": null, "sync": "wait"}, {"seq": 5, "type": "serve", "actor": "aili", "arg": null, "text": null, "when": null, "effects": null, "sync": "wait"}, {"seq": 6, "type": "say", "actor": "aili", "arg": "success", "text": {"ko": "……뭐지?", "en": "......What is this?"}, "when": "grade >= excellent", "effects": null, "sync": "wait"}, {"seq": 7, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "왜 그러시죠?", "en": "Is something wrong?"}, "when": "grade >= excellent", "effects": null, "sync": "wait"}, {"seq": 8, "type": "say", "actor": "aili", "arg": "success", "text": {"ko": "존나 맛있어.\n왜 맛있지?", "en": "It's damn delicious.\nWhy is it delicious?"}, "when": "grade >= excellent", "effects": null, "sync": "wait"}, {"seq": 9, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "포트도 그렇고, 왜 ault", "text": {"ko": "맞는 말이지만 넌 누군가가 정성을 들였다는 사실 하나만으로\n독약을 먹을 수 있을 것 같아?", "en": "Fair point — but could you drink poison\njust because someone made it with love?"}, "when": "grade >= excellent", "effects": null, "sync": "wait"}, {"seq": 18, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "…..", "en": "....."}, "when": "grade >= excellent", "effects": null, "sync": "wait"}, {"seq": 19, "type": "say", "actor": "aili", "arg": "default", "text": {"ko": "아무튼 크리스의 술을 마셨을 때는 그랬어.", "en": "Anyway, that's what drinking Chris's stuff was like."}, "when": "grade >= excellent", "effects": null, "sync": "wait"}, {"seq": 20, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "…그런 이야기는 듣지 못했습니다.", "en": "...I was never told any of this."}, "when": "grade >= excellent", "effects": null, "sync": "wait"}, {"seq": 21, "type": "say", "actor": "aili", "arg": "default", "text": {"ko": "크리스에 비하면 네가 만든 건 예술이지.\n처음 봤을 때 어느 정도 예상하긴 했지만, 기대 이상이네. 이쁜이.\n앞으로 자주 와야겠는걸?", "en": "Compared to Chris, yours is a work of art.\nI had a feeling when I first saw you, but this exceeds expectations, cutie.\nI'll have to come by often, won't I?"}, "when": "grade >= excellent", "effects": null, "sync": "wait"}, {"seq": 22, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "감사합니다.", "en": "Thank you."}, "when": "grade >= excellent", "effects": null, "sync": "wait"}, {"seq": 23, "type": "say", "actor": "aili", "arg": "success", "text": {"ko": "오. 괜찮은데?", "en": "Oh. Not bad at all."}, "when": "grade >= good && grade < excellent", "effects": null, "sync": "wait"}, {"seq": 24, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "주문 의도에 부합했습니까?", "en": "Did it meet the intent of your order?"}, "when": "grade >= good && grade < excellent", "effects": null, "sync": "wait"}, {"seq": 25, "type": "say", "actor": "aili", "arg": "success", "text": {"ko": "완전 내 취향까지는 아닌데.\n그래도 초보자가 즉석에서 만든 것치곤 꽤 좋아.", "en": "Not exactly my taste,\nbut for a beginner improvising t"}, {"seq": 30, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "술을 마셔 본 적이 없는데 이곳에 온 이유가 있나요?", "en": "You'd never had a drink before — any reason you came here?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 31, "type": "say", "actor": "samho", "arg": "default", "text": {"ko": "나이 먹은 변태 늙다리들이나 가는 곳인 줄 알았는데.\n너처럼 순하고 어린 애가 일하는 곳이면 한 번쯤 가 볼까 해서.", "en": "I figured bars were for old pervert geezers.\nBut if a soft, young kid like you works here, I thought it was worth a look."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 32, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "원래 바는 변태들이 가는 곳입니까?", "en": "Are bars normally places perverts go?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 33, "type": "say", "actor": "samho", "arg": "default", "text": {"ko": "이 동네에 있는 대부분 술집은 싹 다 매춘업소야.\n술을 즐기는 게 아니라 성욕을 해소하러 가는 곳이다 이거지!", "en": "Most 'bars' around here are all brothels.\nPeople don't go to enjoy a drink — they go to get off, that's what I'm saying!"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 34, "type": "say", "actor": "samho", "arg": "default", "text": {"ko": "그래도 뭐… 이 가게는 확실히 다른 거 같긴 하네.", "en": "But this place... yeah, this place is definitely different."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 35, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "다행이네요. 그런 곳에서 일하는 건\n저한텐 어려울 것 같습니다.", "en": "That's a relief. Working at a place like that\nwould be difficult for me."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 36, "type": "say", "actor": "samho", "arg": "default", "text": {"ko": "하핫! 당연하지. 이 동네가 쓰레기들만 모여 있는 곳이긴 하지만\n여긴 그래도 나름 괜찮은 곳이라고 들었어. 이곳 마스터도 말이지.", "en": "Haha! Obviously. This neighborhood's a dump full of trash,\nbut I heard this place is actually decent. The master here too."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 37, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "나쁜 사람은 아닌 것 같습니다.", "en": "He doesn't seem like a bad person."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 38, "type": "say", "actor": "samho", "arg": "default", "text": {"ko": "나중에 혹시라도 너한테 못되게 굴면 얼마든지 말해.\n내가 특별히 우리 애니멀 갱으로 영입해줄게!", "en": "If he ever treats you badly, just say the word.\nI'll make a special exception and recruit you into our Animal Gang!"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 39, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "그곳에 들어가면 행복해지나요?", "en": "Would joining make me happy?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 40, "type": "say", "actor": "samho", "arg": "default", "text": {"ko": "행복? …행복해지는 건 잘 모르겠지만.\n적어도 굶어죽을 일은 없어.", "en": "Happy? ...Can't promise happy.\nBut at least you'd never starve to death."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 41, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "갱에서는 무슨 일을 하는데요?", "en": "What kind of work does the gang do?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 42, "type": "say", "actor": "samho", "arg": "default", "text": {"ko": "음… 배달도 하고, 물건도 찾아오고, 가끔 사람을 지킬 때도 있고, \n처리할 때도 있어. 돈만 주면 다 하지~", "en": "Hm... deliveries, retrievals, sometimes we protect people,\nsometimes we take care of them. Anything, as long as it pays~"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 43, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "사람을 처리하는 건 죽인다는 걸 의미하는 건가요?", "en": "By 'take care of,' do you mean killing them?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 44, "type": "say", "actor": "samho", "arg": "default", "text": {"ko": "보통은 그래.", "en": "Usually, yeah."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 45, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "이쪽 지역은 살인이 합법인가요?", "en": "Is murder legal in this district?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 46, "type": "say", "actor": "samho", "arg": "default", "text": {"ko": "아 진짜. 너 어디 외딴 곳에서 살다가 넘어왔어?\n왜 이렇게 질문만 하는 거야. 너 정말 모르는 게 많구나!", "en": "Oh, come on. Did you crawl in from the middle of nowhere?\nWhy is everything a question with you? You really don't know anything!"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 47, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "불쾌했다면 죄송합니다.", "en": "I'm sorry if that was rude."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 48, "type": "say", "actor": "samho", "arg": "default", "text": {"ko": "아, 아냐. 죄송할 필요까진 없어.\n뭐, 이쪽 지역이 좀 그런 거야~", "en": "Ah, no, no. Nothing to apologize for.\nIt's just... that's how this district is~"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 49, "type": "say", "actor": "samho", "arg": "default", "text": {"ko": "밑바닥에 있는 사람들이 모여 있어서 다른 지역보다\n유독 살인도 많이 일어나고 돈이면 뭐든 할 수 있는 곳이랄까.", "en": "People from rock bottom all wash up here, so there's\nway more murder than anywhere else, and money buys anything."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 50, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "듣던 것보다 위험한 곳이었네요.", "en": "It's more dangerous than I'd heard."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 51, "type": "say", "actor": "samho", "arg": "default", "text": {"ko": "넌 어디서 왔길래 이런 걸 다 물어보는 거야?", "en": "Where are you even from, asking about all this?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 52, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "자세히 말씀드리긴 좀 힘들지만\n말씀하신 대로 정말 외딴 곳에 있다가 왔습니다.", "en": "It's hard to go into detail, but\nlike you said — I really did come from the middle of nowhere."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 53, "type": "say", "actor": "samho", "arg": "default", "text": {"ko": "그래… 여기 사는 사람 중에 사연 없는 사람은 없더라.\n너도 말 못할 사정이 있겠지.", "en": "Right... nobody living here comes without a story.\nGuess you've got things you can't talk about too."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 54, "type": "say", "actor": "samho", "arg": "default", "text": {"ko": "어디서 왔는지는 모르지만 조심해.\n이 동네에서는 너같이 순한 애는 살아남기 힘들 거야.", "en": "Don't know where you came from, but be careful.\nA soft kid like you won't survive long in this neighborhood."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 55, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "삼호는 괜찮은 건가요?", "en": "Are you okay, Samho?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 56, "type": "say", "actor": "samho", "arg": "default", "text": {"ko": "나도 뭐… 조심하면서 사는 거지. 에잇, 한 잔 더 줘봐.", "en": "Me? Well... I get by, careful-like. Ah, whatever — give me another."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 57, "type": "say", "actor": "samho", "arg": "default", "text": {"ko": "이제 슬슬 다른 것도 마셔 보고 싶은데.", "en": "I'm starting to want to try something different."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 58, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "이번엔 어떤 걸로 주문하시나요?", "en": "What will it be this time?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 59, "type": "say", "actor": "samho", "arg": "default", "text": {"ko": "이번엔 좀 탄산이 들어간 청량한 걸로 한 잔 부탁해.", "en": "This time, something fizzy and refreshing, please."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 60, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "(탄산이 들어간 청량한 술……)", "en": "(A fizzy, refreshing drink......)"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 61, "type": "order", "actor": "samho", "arg": "exact:gin_fizz", "text": {"ko": "탄산이 들어간 청량한 술 한 잔.", "en": "One fizzy, refreshing drink."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 62, "type": "craft", "actor": null, "arg": "order", "text": null, "when": null, "effects": null, "sync": "wait"}, {"seq": 63, "type": "serve", "actor": "samho", "arg": null, "text": null, "when": null, "effects": null, "sync": "wait"}, {"seq": 64, "type": "say", "actor": "samho", "arg": "success", "text": {"ko": "크, 시원하다. 이거 좋은데?", "en": "Whew, that's crisp. I like this one!"}, "when": "grade >= excellent", "effects": null, "sync": "wait"}, {"seq": 65, "type": "say", "actor": "samho", "arg": "success", "text": {"ko": "오, 탄산이 톡 쏘네. 마음에 들어.", "en": "Oh, the fizz really bites. I like it."}, "when": "grade >= good && grade < excellent", "effects": null, "sync": "wait"}, {"seq": 66, "type": "say", "actor": "samho", "arg": "default", "text": {"ko": "음.. 김빠진 느낌인데. 뭐, 그래도 마실 만은 해.", "en": "Hm... tastes a little flat. Well, it's still drinkable."}, "when": "grade < good", "effects": null, "sync": "wait"}, {"seq": 67, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "그런데 조심하는 것들이 다른 갱들이나 용병들입니까?", "en": "By the way — the things you're careful about, are they other gangs? Mercenaries?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 68, "type": "say", "actor": "samho", "arg": "default", "text": {"ko": "음… 맞아. 요즘 우리 구역 주변에 <world>마가로프</world> 갱 놈들이 우리 갱 사람들을\n자꾸 납치하거나 죽이는 일이 생기고 있거든.", "en": "Hm... yeah. Lately the <world>Magarov</world> gang has been circling our turf,\nkidnapping or killing our people, over and over."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 69, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "왜 그런 짓을 하는 거죠?", "en": "Why would they do that?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 70, "type": "say", "actor": "samho", "arg": "default", "text": {"ko": "나도 그게 잘 이해가 안 돼. 원래 시비가 붙어서 싸우는 경우는 있어도\n이렇게 노골적으로 우리 갱 사람들을 <world>사냥</world>하진 않거든.", "en": "That's what I don't get either. Sure, fights break out over grudges,\nbut nobody used to <world>hunt</world> our people this openly."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 71, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "<world>위험한 상황</world>인 것 같습니다.", "en": "That sounds like a <world>dangerous situation</world>."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 72, "type": "say", "actor": "samho", "arg": "default", "text": {"ko": "뭐 그래도 이런 일이 아예 없던 것도 아니고\n곧 있으면 우리 보스가 해결해준댔어!", "en": "Eh, it's not like this kind of thing never happened before.\nAnd Boss said he'll sort it out soon!"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 73, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "삼호의 보스도 사람을 잘 지켜 줄 수 있나 보네요.", "en": "Your boss must be good at protecting people, then."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 74, "type": "say", "actor": "samho", "arg": "default", "text": {"ko": "그래! 우리 보스는 짱짱 세고 카리스마도 넘쳐서 내 롤모델이랄까~\n아마 그 누가 덤벼도 보스가 다 이길걸~", "en": "Yeah! Our boss is crazy strong and oozing charisma — my role model, you could say~\nNo matter who comes at him, Boss would win~"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 75, "type": "say", "actor": "samho", "arg": "default", "text": {"ko": "한 잔 더 만들어 줄래? 보스를 위하여 한 잔 더!", "en": "Make me another? One more — for the Boss!"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 76, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "벌써요? 이런 속도로 계속 마시면 \n취하는 걸로 알고 있습니다.", "en": "Already? If you keep drinking at this pace,\nI understand you will get drunk."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 77, "type": "say", "actor": "samho", "arg": "default", "text": {"ko": "음… 취했다는 건 아닌데, 평소보다 좀\n시간이 느려진 것처럼 느껴진달까?", "en": "Hm... I'm not drunk or anything, it's just...\ntime feels a bit slower than usual, maybe?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 78, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "그게 취할 때 나타나는 증상이라고 알고 있습니다.", "en": "I understand that is a symptom of being drunk."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 79, "type": "say", "actor": "samho", "arg": "default", "text": {"ko": "아 몰라몰라, 빨리 한 잔 더 줘.", "en": "Ah, whatever, whatever — hurry up and pour me another."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 80, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "…알겠습니다. 주문은 어떤 걸로 하시나요?", "en": "...Very well. What would you like to order?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 81, "type": "say", "actor": "samho", "arg": "default", "text": {"ko": "이번엔 그 뭐냐, <name>마체테</name>?", "en": "This time, what's it called... a <name>Machete</name>?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 82, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "<name>마티니</name>를 말하시는 겁니까?", "en": "Do you mean a <name>Martini</name>?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 83, "type": "say", "actor": "samho", "arg": "default", "text": {"ko": "그래. 그거 우리 보스가 항상 마시는 거라던데\n나도 한 번 마셔 보고 싶어.", "en": "Yeah, that. I heard it's what our boss always drinks.\nI want to try it too."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 84, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "(<name>드라이 마티니</name> 한잔)", "en": "(One <name>Dry Martini</name>.)"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 85, "type": "order", "actor": "samho", "arg": "exact:dry_martini", "text": {"ko": "드라이 마티니 한 잔.", "en": "One Dry Martini."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 86, "type": "craft", "actor": null, "arg": "order", "text": null, "when": null, "effects": null, "sync": "wait"}, {"seq": 87, "type": "serve", "actor": "samho", "arg": null, "text": null, "when": null, "effects": null, "sync": "wait"}, {"seq": 88, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "드라이 마티니 한 잔 나왔습니다.", "en": "One Dry Martini, served."}, "when": "grade >= excellent", "effects": null, "sync": "wait"}, {"seq": 89, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "이야아…", "en": "Whoaaa..."}, "when": "grade >= excellent", "effects": null, "sync": "wait"}, {"seq": 90, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "어떤가요?", "en": "How is it?"}, "when": "grade >= excellent", "effects": null, "sync": "wait"}, {"seq": 91, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "흐흐… 살짝 쓰긴 한데 괜찮네.", "en": "Heh heh... a little bitter, but it's good."}, "when": "grade >= excellent", "effects": null, "sync": "wait"}, {"seq": 92, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "원래 올리브 같은 건 입에도 안 댔는데에\n꽤나 잘 어울리잖아~ 신기한데에.", "en": "I never touched olives before, y'knooow,\nbut it goes so well with this~ Weird, riiight?"}, "when": "grade >= excellent", "effects": null, "sync": "wait"}, {"seq": 93, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "드라이 마티니 한 잔 나왔습니다.", "en": "One Dry Martini, served."}, "when": "grade >= good && grade < excellent", "effects": null, "sync": "wait"}, {"seq": 94, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "흐흐… 쓰긴 한데, 보스가 마신다는 그 맛이 이런 건가.", "en": "Heh heh... bitter, but so this is the taste Boss drinks, huh."}, "when": "grade >= good && grade < excellent", "effects": null, "sync": "wait"}, {"seq": 95, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "으… 이건 좀 너무 쓴데. 그래도 보스가 마시는 거니까 마셔야지.", "en": "Ugh... this one's way too bitter. But it's what Boss drinks, so I'll drink it."}, "when": "grade < good", "effects": null, "sync": "wait"}, {"seq": 96, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "말이 더어 느려진 것 같은데요. 취한 걸로 보입니다아.", "en": "Your speech seems sloooower now. You appear to be druuunk."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 97, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "너 말투가 더 이상해에.", "en": "Your speech is even weirder~"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 98, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "이런 곳에 자주 오려며언…\n돈을 벌어야 할 이유가 늘어났네에.", "en": "If I wanna come here ofteeen...\nguess that's one more reason to make moneyyy."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 99, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "돈을 많이 벌어야 하는 이유가 있나요?\n단순히 돈을 좋아하는 사람처럼 보이진 않습니다.", "en": "Is there a reason you need to make a lot of money?\nYou don't strike me as someone who simply loves money."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 100, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "으음… 사실은 \n사실은 말이야아……", "en": "Mmm... actually,\nactually, y'seeee......"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 101, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "내가 돌봐 주고 있는 동생들이 있어서…", "en": "There are these little ones I look after..."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 102, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "동생들을 대신 키워주고 계시는 겁니까?", "en": "You're raising your younger siblings yourself?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 103, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "맞아.. 소중한 동생들이야. \n무려 일곱 명이나 있다구! 대가족이라고 할 수 있지.", "en": "Yeah... my precious little ones.\nSeven of them, no less! A whole big family, you could say."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 104, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "(동생들 이야기가 나오니 취해서 \n흐리멍덩해진 눈이 일순간 또렷해진 것 같다.)", "en": "(At the mention of his siblings, his drink-glazed eyes\nseem to sharpen for a moment.)"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 105, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "그렇게 형제자매가 많은 사람은 처음 봤습니다.", "en": "I've never met anyone with that many siblings."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 106, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "뭐어, 친동생들은 아니지만 말이지.", "en": "Weeell, they're not blood, mind you."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 107, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "음… 어쩌다 그렇게 형제가 생겨난 거죠? \n증식이라도 하는 건가요?", "en": "Hm... how did you end up with so many siblings?\nDo they multiply?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 108, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "하하, 증식이라니. 너 진짜 웃긴다아.", "en": "Haha, 'multiply'! You're actually hilaaarious."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 109, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "일종의 미토콘드리아에 해당하나요? 이해가 되지 않습니다.", "en": "Is this a mitochondria-type situation? I don't understand."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 110, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "대부분은 길거리에 버려진 애들이지.\n이 동네에서는 흔한 일이야아.", "en": "Most of them were kids left out on the street.\nHappens all the time around heeere."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 111, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "그러면 삼호는", "en": "Then were you also—"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 112, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "난 아니야.", "en": "Not me."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 113, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "…아니였지.", "en": "...Wasn't me. Back then."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 114, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "………", "en": "........."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 115, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "…", "en": "..."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 116, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "우리 부모님은 말이지, 참 바보같은 사람들이었어.", "en": "My parents, you know... they were such fools."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 117, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "그들은 길거리에 나앉은 부랑아들을 도와줄 수 있다고 믿었지.", "en": "They believed they could help the strays out on the streets."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 118, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "그렇게 거리에 돌아다니던 아이들을 하나 둘 집으로 들여온 거야.", "en": "So they started taking the street kids in, one by one."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 119, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "그렇게 한 명… 두 명….", "en": "One... then two...."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 120, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "일곱 명이 되던 해에", "en": "And the year it became seven,"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 121, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "집을 나갔어.", "en": "they walked out."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 122, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "…", "en": "..."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 123, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "감당이 안 되었나봐.\n뭐 있는 거 없는 거 다 털어서 나갔더라고.\n뭐 그렇게 된 거지~~", "en": "Guess it got to be too much.\nThey cleaned out everything we had and left.\nAnd, well, that's how it went~~"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 124, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "아무튼! 난 내 동생들이 너무 소중해에~~", "en": "Anyway! My little ones are sooo precious to me~~"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 125, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "있지 있지~ 우리 막내가 미술에 재능이 있는 것 같아.\n이거 볼래?", "en": "Hey, hey~ I think our youngest has a real talent for art.\nWanna see?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 126, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "(….기괴한 형체의 무언가가 잔뜩 그려져 있다. 도무지 알아볼 수 없다.)", "en": "(....It's covered in grotesque, unidentifiable shapes. I can't make out a thing.)"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 127, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "그건 아닌 것 같은데요.", "en": "I don't think that's the case."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 128, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "너가 보는 눈이 없어서 그래.\n예술 감각이 떨어지는구나~", "en": "That's 'cause you've got no eye for it.\nNo sense for art at all~"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 129, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "그런데 이 빨갛고 커다란 그림은 뭔가요?", "en": "By the way, what is this big red one a drawing of?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 130, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "아 맞다 맞다, 이걸 얘기 안 했구나.", "en": "Oh right, right — I never told you about this!"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 131, "type": "say", "actor": "samho", "arg": "default", "text": {"ko": "이 팔을 보시라. 이것으로 말할 것 같으면 물 흐르듯이 유연한 관절!\n스포츠카를 빼다박은 깔롱한 디자인! 그리고 \n아만타티움도 울고 갈 단단함을 자랑하는", "en": "Behold this arm! I present to you: joints smooth as flowing water!\nA slick design straight off a sports car! And hardness\nthat would make amantatium itself weep —"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 132, "type": "say", "actor": "samho", "arg": "default", "text": {"ko": "네오 닐 암스트롱 겔럭시 a6 with 애플 람보르기니 에디션 아머~!!!!!!", "en": "the Neo Neil Armstrong Galaxy a6 with Apple Lamborghini Edition Armor~!!!!!!"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 133, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "아…. 네… \"네오 닐 암스트롱 겔럭시 a6 with \n애플 람보르기니 에디션 아머~!!!!!\"는 정말 멋있네요.", "en": "Ah.... yes... the \"Neo Neil Armstrong Galaxy a6 with\nApple Lamborghini Edition Armor~!!!!!\" is truly impressive."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 134, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "아 반응 뭐야아~ 내가 이 아머를 사기 위해서 얼마나 고생했는지 알아?!!!!", "en": "What's with that reactionnn~ Do you know how hard I worked to buy this armor?!!!!"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 135, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "제가 잘 알진 못하지만 해당 모듈은 꽤나 비싸 보이는데, \n그런 걸 장만할 정도면 굉장히 유능하시겠는데요.", "en": "I'm no expert, but that module looks quite expensive.\nIf you could afford it, you must be very capable."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 136, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "우으…. 사실은 나 아직 말단이거든.", "en": "Ugh.... actually, I'm still bottom rung."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 137, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "그래도 이제 곧 큰 돈을 벌 거야!\n전 재산을 털어서 이 아머를 샀으니까!!\n실적을 쌓아서 갱에서 높은 지위를 얻는 것도 시간문제다~ 이거지.", "en": "But I'm gonna make big money soon!\nI blew my entire savings on this armor!!\nRack up results, climb the gang ladder — it's only a matter of time~ that's the plan."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 138, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "그렇게 돈을 벌어서 하고 싶은 것이 있습니까?", "en": "Is there something you want to do with the money you make?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 139, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "동생들이랑 패밀리 레스토랑에 갈 거야. 들어 본 적 있어?\n동생이 가져온 잡지에서 봤는데 몽글몽글한 함박 스테이크라는 게 있대.\n동생들이랑 배 터지게 먹을 거야!!", "en": "I'm taking my little ones to a family restaurant. Ever heard of those?\nSaw it in a magazine one of them brought home — there's this fluffy thing called a hamburg steak.\nWe're gonna eat till we burst!!"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 140, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "(패밀리 레스토랑이라.. 현재는 거의 사라진 식당이다.\n교육용 DB에서 확인한 적이 있다.)", "en": "(A family restaurant... a kind of establishment nearly extinct today.\nI've seen them in my educational database.)"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 141, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "언젠간 보스의 오른팔로 승진할지도 모르지.\n기분이다! 보스의 오른팔이 될 이 삼호님에게 \n술을 한 잔 더 내오너라아아아!!!!!이왕이면 공짜로~!", "en": "Someday I might even get promoted to Boss's right hand.\nI'm feeling it! Bring another drink for the great Samho,\nfuture right hand of the Boss!!!!! And make it free while you're at it~!"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 142, "type": "choice", "actor": null, "arg": "ch_d3_last_call", "text": null, "when": null, "effects": null, "sync": "wait"}]}, {"id": "d3_samho_warn", "day": 3, "phase": "bar", "seq": 0, "trigger": "manual", "when": "", "title": "분기 — 취기 경고 (ch_d3_last_call A)", "skippable": false, "group": "", "steps": [{"seq": 1, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "지금 더 마시면 취할 수도 있습니다.", "en": "If you drink any more now, you may get drunk."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 2, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "에이, 이거 가지고 뭘 취해. 아직 두 잔밖에 안 마셨어어어.", "en": "Pfft, drunk off this? I've only had two glasses sooo faaar."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 3, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "세 잔입니다.", "en": "That was three glasses."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 4, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "그거나 그거나~", "en": "Same difference~"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 5, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "아무튼 한 잔 정도야 괜찮아~", "en": "Anyway, one more glass is fiiine~"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 6, "type": "choice", "actor": null, "arg": "ch_d3_cutoff", "text": null, "when": null, "effects": null, "sync": "wait"}]}, {"id": "d3_samho_pour", "day": 3, "phase": "bar", "seq": 0, "trigger": "manual", "when": "", "title": "분기 — 마지막 마티니와 노란 꽃 (death_route)", "skippable": false, "group": "", "steps": [{"seq": 1, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "알겠습니다. 드리도록 하죠.", "en": "Understood. I'll pour you one."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 2, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "그래, 그거야, 루나.", "en": "Yeah, that's the spirit, Luna."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 3, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "주문은 어떤 걸로 하시나요?", "en": "What would you like to order?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 4, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "아까 줬던 걸로. <name>드라이 마티니</name>였나?", "en": "The one from before. Was it a <name>Dry Martini</name>?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 5, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "맞습니다. 드디어 기억하시네요.", "en": "Correct. You finally remembered."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 6, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "(마지막 드라이 마티니……)", "en": "(One last Dry Martini......)"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 7, "type": "order", "actor": "samho", "arg": "exact:dry_martini", "text": {"ko": "마지막 한 잔.", "en": "One last glass."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 8, "type": "craft", "actor": null, "arg": "order", "text": null, "when": null, "effects": null, "sync": "wait"}, {"seq": 9, "type": "serve", "actor": "samho", "arg": null, "text": null, "when": null, "effects": null, "sync": "wait"}, {"seq": 10, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "크… 이거지. 너무 맛있는데? 이제 쓴맛도\n별로 안 느껴져. 보스가 왜 이걸 마시는지 알겠네.", "en": "Ahh... that's the one. So good! I can barely taste\nthe bitterness now. I get why Boss drinks this."}, "when": "grade >= excellent", "effects": null, "sync": "wait"}, {"seq": 11, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "크… 이거지. 보스가 마시는 맛이야.", "en": "Ahh... that's the one. The taste of the Boss."}, "when": "grade >= good && grade < excellent", "effects": null, "sync": "wait"}, {"seq": 12, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "이건.. 내…", "en": "This is... my..."}, "when": "grade < good", "effects": null, "sync": "wait"}, {"seq": 13, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "손님은 만취 상태로 보입니다.", "en": "Customer status: heavily intoxicated."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 14, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "ㅁㅓ슨 소리야. 나 아주 멀!@쩡하다고.", "en": "Whaddya mean. I'm perf!@ctly fine."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 15, "type": "say", "actor": "samho", "arg": "default", "text": {"ko": "그나저나 루나, 꽃이라는 거 본 적 있어?", "en": "By the way, Luna — you ever seen a flower?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 16, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "갑자기 꽃이요? 사진으로 몇 번 본 적 있습니다.", "en": "A flower, out of nowhere? I've seen a few in photographs."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 17, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "내가 전에 우연히 뒷골목에서 노란색 꽃을 봤는데.\n사진으로 본 거랑 엄청 달라. 냄새도 신기하고.", "en": "I stumbled on a yellow flower in a back alley a while ago.\nTotally different from the photos. Even the smell is amazing."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 18, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "오호… 흥미롭네요.", "en": "Oh... how interesting."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 19, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "그치? 좋아. 오늘 네가 나한테 술도 많이 줬으니까\n이따가 내가 가져올게.", "en": "Right? Alright. You poured me plenty tonight,\nso I'll go grab it for you later."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 20, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "그걸 가져올 수 있나요?", "en": "Can it even be brought here?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 21, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "예전에 우리 보스가 꽃은 가운데 초록색 부분만 안 건드리면\n살아 있을 수 있다고 했어.", "en": "Boss once told me a flower stays alive\nas long as you don't touch the green part in the middle."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 22, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "그렇다면 저도 한 번 보고 싶습니다.", "en": "In that case, I'd like to see it too."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 23, "type": "enter", "actor": "aili", "arg": "L", "text": null, "when": null, "effects": null, "sync": "wait"}, {"seq": 24, "type": "say", "actor": "aili", "arg": "default", "text": {"ko": "안녕, 예쁜이! 오늘은…", "en": "Hey, gorgeous! Today I'll—"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 25, "type": "say", "actor": "samho", "arg": "drunk", "text": {"ko": "좋아! 마티니도 받았으니 꽃 가지고 다시 올게.\n조금만 기다려, 루나!", "en": "Alright! Got my martini, so I'll be back with the flower.\nJust wait a bit, Luna!"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 26, "type": "exit", "actor": "samho", "arg": null, "text": null, "when": null, "effects": null, "sync": "wait"}, {"seq": 27, "type": "effect", "actor": null, "arg": null, "text": null, "when": null, "effects": "flag.samho_death_route = true", "sync": "wait"}, {"seq": 28, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "…(괜찮은 거 맞겠지?)", "en": "...(He'll be okay, right?)"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 29, "type": "say", "actor": "aili", "arg": "default", "text": {"ko": "뭐야, 쟤는 완전히 취했잖아. 저 상태로 내보낸 거야?", "en": "What the— that kid is completely wasted. You let him leave like that?"}, "when": null, "effects": null, "sync": "wait"}, {"seq": 30, "type": "say", "actor": "luna", "arg": "default", "text": {"ko": "…제가 실수한 것 같네요.", "en": "...I believe I made a mistake."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 31, "type": "say", "actor": "aili", "arg": "default", "text": {"ko": "흠, 조금 걱정이네. 밖에 못 보던 갱 놈들이 있던데.", "en": "Hm, I'm a little worried. There were gang thugs outside I've never seen before."}, "when": null, "effects": null, "sync": "wait"}, {"seq": 32, "type": "say", "actor": "luna", "a <script>
// ===== L.U.N.A 웹 프로토타입 — core: 상태·DSL·유틸 =====
"use strict";
const DATA = window.LUNA;
const CFG = DATA.balance.config;

// ---------- 게임 상태 ----------
const S = {
  lang: "ko",
  day: 1,
  gold: CFG.gold_start,
  rep: CFG.reputation_start,
  affinity: {},
  alive: { samho: true, haru: true },
  flags: new Set(),
  quests: {},          // quest_id -> stage
  questRewarded: new Set(),
  inventory: {},       // 구매 재료 수량 (연출용)
  extraRecipes: [],
  lastGrade: null,     // 소문자 등급 ('excellent'..)
  lastPct: 0,
  met: new Set(),        // 만난 인물 (단골 수첩 해금 — 2부 등장·카메오 서빙 시)
  dialogLog: [],         // 대화 백로그 (세션 전용 — 저장 안 함)
  usedPoints: new Set(), // once 포인트 소진: "pointId"(영구) — v1.9.4 이전엔 "day:pointId"
  groupProgress: {},     // sequential 그룹 진행 인덱스: group명 -> 다음에 볼 씬 순번
  stats: { servedTotal: 0, angryTotal: 0 },
  today: { sales: 0, tips: 0, served: 0, angry: 0, repDelta: 0 },
};

// ---------- 유틸 ----------
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => Array.from(document.querySelectorAll(sel));
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
function T(t) { if (!t) return ""; if (typeof t === "string") return t; return t[S.lang] || t.ko || ""; }
function UI(key) { const u = DATA.master.ui_strings[key]; return u ? T(u) : key; }

// ---------- 데이터 조회 ----------
function charOf(id) { return DATA.master.characters.find(c => c.id === id); }
function cocktailOf(id) { return DATA.master.cocktails.find(c => c.id === id); }
// v1.9: 재료·잔·도구·가니시가 shelf_items 한 테이블 — kind가 어느 선반 화면에 놓일지를 결정
function shelfOf(id) { return DATA.master.shelf_items.find(x => x.id === id); }
const ingOf = shelfOf, itemOf = shelfOf;          // 하위호환 별칭 (같은 테이블을 본다)
function shelfKind(kind) { return DATA.master.shelf_items.filter(x => x.kind === kind); }
function dayMeta(d) { return DATA.schedule.days.find(x => x.day === d); }
function unlockedCocktails() {
  return DATA.master.cocktails.filter(c =>
    (c.unlock_day <= S.day || S.extraRecipes.includes(c.id)) &&
    (!c.unlock_when || evalWhen(c.unlock_when)));
}
// unlock_day(일차 해금) AND unlock_when(조건부 해금 — 퀘스트 전용은 day 99 + when)
function unlockedShelf(kind) {
  return DATA.master.shelf_items.filter(i =>
    (!kind || i.kind === kind) &&
    (i.unlock_day <= S.day || (i.unlock_when && evalWhen(i.unlock_when))) &&
    (!i.unlock_when || evalWhen(i.unlock_when)));
}
function unlockedIngredients() { return unlockedShelf("ingredient"); }
function scriptOf(day) { return DATA.scripts[String(day)]; }
function scenesFor(day, phase, trigger) {
  const sc = scriptOf(day); if (!sc) return [];
  return sc.scenes.filter(s => s.phase === phase && (!trigger || s.trigger === trigger) && evalWhen(s.when))
    .sort((a, b) => a.seq - b.seq);
}
function sceneById(id) {
  for (const d of Object.values(DATA.scripts)) { const s = d.scenes.find(x => x.id === id); if (s) return s; }
  return null;
}
function choicesOf(cid) {
  for (const d of Object.values(DATA.scripts)) { if (d.choices && d.choices[cid]) return d.choices[cid]; }
  return [];
}

// ---------- 등급 ----------
const GRADE_RANK = { excellent: 5, good: 4, decent: 3, poor: 2, sewage: 1 };
function gradeForPct(pct) {
  for (const g of DATA.balance.grade_cuts) if (pct >= g.min_pct) return g.grade;
  return "sewage";
}

// ---------- when DSL ----------
function resolveToken(tok, ctx) {
  tok = tok.trim();
  if (tok === "day") return S.day;
  if (tok === "money") return S.gold;
  if (tok === "reputation") return S.rep;
  if (tok === "grade") return GRADE_RANK[S.lastGrade] || 0;
  let m;
  if ((m = tok.match(/^flag\.(\w+)$/))) return S.flags.has(m[1]);
  if ((m = tok.match(/^affinity\.(\w+)$/))) return S.affinity[m[1]] || 0;
  if ((m = tok.match(/^alive\.(\w+)$/))) return S.alive[m[1]] !== false;
  if ((m = tok.match(/^quest\.(\w+)\.stage$/))) return S.quests[m[1]] || 0;
  if ((m = tok.match(/^cocktail\.tag\((.+)\)$/))) return !!(ctx.cocktail && ctx.cocktail.tags.includes(m[1].trim()));
  if (tok === "cocktail.abv") return ctx.cocktail ? ctx.cocktail.abv : 0;
  if (tok === "cocktail.id") return ctx.cocktail ? ctx.cocktail.id : "";
  if (tok === "phase") return ctx.phase || "";
  if (/^-?\d+(\.\d+)?$/.test(tok)) return parseFloat(tok);
  if (tok === "true") return true;
  if (tok === "false") return false;
  if (GRADE_RANK[tok]) return GRADE_RANK[tok];
  return tok; // 문자열 리터럴 취급
}
function evalWhen(expr, ctx) {
  if (!expr) return true;
  ctx = ctx || {};
  return expr.split("&&").every(raw => {
    let clause = raw.trim(), neg = false;
    while (clause.startsWith("!")) { neg = !neg; clause = clause.slice(1).trim(); }
    const m = clause.match(/^(.+?)(==|!=|>=|<=|>|<)(.+)$/);
    let val;
    if (m) {
      const a = resolveToken(m[1], ctx), b = resolveToken(m[3], ctx), op = m[2];
      val = op === "==" ? a == b : op === "!=" ? a != b : op === ">=" ? a >= b :
            op === "<=" ? a <= b : op === ">" ? a > b : a < b;
    } else {
      val = !!resolveToken(clause, ctx);
    }
    return neg ? !val : val;
  });
}

// ---------- effects DSL ----------
function applyEffects(str) {
  if (!str) return;
  str.split(";").forEach(raw => {
    const e = raw.trim(); if (!e) return;
    let m;
    if ((m = e.match(/^affinity\.(\w+)\s*([+-]=)\s*(\d+)$/))) {
      S.affinity[m[1]] = (S.affinity[m[1]] || 0) + (m[2] === "+=" ? 1 : -1) * +m[3];
      toast(`💛 ${T(charOf(m[1])?.name) || m[1]} ${m[2] === "+=" ? "+" : "-"}${m[3]}`);
    } else if ((m = e.match(/^flag\.(\w+)\s*=\s*(true|false)$/))) {
      m[2] === "true" ? S.flags.add(m[1]) : S.flags.delete(m[1]);
    } else if ((m = e.match(/^alive\.(\w+)\s*=\s*(true|false)$/))) {
      S.alive[m[1]] = m[2] === "true";   // 생사 변경 (v1.9.6 — 삼호 데모 분기)
    } else if ((m = e.match(/^money\s*([+-]=)\s*(\d+)$/))) {
      S.gold += (m[1] === "+=" ? 1 : -1) * +m[2];
      toast(`💰 ${m[1] === "+=" ? "+" : "-"}${m[2]}G`);
    } else if ((m = e.match(/^reputation\s*([+-]=)\s*(\d+)$/))) {
      const d = (m[1] === "+=" ? 1 : -1) * +m[2];
      S.rep += d; S.today.repDelta += d;
    } else if ((m = e.match(/^give\((\w+)\s*,\s*(\d+)\)$/))) {
      S.inventory[m[1]] = (S.inventory[m[1]] || 0) + +m[2];
      toast(`🎁 ${T(ingOf(m[1])?.name) || m[1]} ×${m[2]}`);
    } else if ((m = e.match(/^unlock_recipe\((\w+)\)$/))) {
      S.extraRecipes.push(m[1]);
    } else if ((m = e.match(/^quest\((\w+)\)\.advance$/))) {
      advanceQuest(m[1]);
    }
  });
  updateHUD();
}

// ---------- 퀘스트 진행 ----------
// 스테이지 +1 → 통과한 스테이지의 on_complete 발동 → 마지막 스테이지면 reward_effects 1회 발동
function advanceQuest(qid) {
  const stages = DATA.quests.stages.filter(s => s.quest_id === qid).sort((a, b) => a.stage - b.stage);
  const cur = (S.quests[qid] || 0) + 1;
  S.quests[qid] = cur;
  const st = stages.find(s => s.stage === cur);
  if (st && st.on_complete) applyEffects(st.on_complete);
  if (cur >= stages.length && !S.questRewarded.has(qid)) {
    S.questRewarded.add(qid);
    const q = DATA.quests.quests.find(x => x.id === qid);
    if (q) { toast(`✅ ${T(q.title)}`); if (q.reward_effects) applyEffects(q.reward_effects); }
  }
}

// ---------- 취향(Tastes) — 서빙 호감 판정 ----------
// first-match: 위에서부터 첫 일치 행의 tier, 없으면 ok. when에 flag 등을 쓰면 상황부 취향
function tasteTier(charId, cocktail) {
  const rows = (DATA.balance.tastes || []).filter(t => t.character_id === charId)
    .sort((a, b) => a.seq - b.seq);
  for (const t of rows) if (evalWhen(t.when, { cocktail })) return t.tier;
  return "ok";
}
// 호감 대상(affinity=true) 캐릭터에게 정상 서빙 시: AffinityMatrix[취향][등급] 만큼 호감 반영
function applyTasteAffinity(charId, cocktail, grade) {
  const ch = charOf(charId);
  if (!ch || !ch.affinity || !cocktail) return;
  const row = DATA.balance.affinity_matrix.find(r => r.taste_tier === tasteTier(charId, cocktail));
  const d = row ? (row[grade] || 0) : 0;
  if (d) applyEffects(`affinity.${charId} ${d >= 0 ? "+=" : "-="} ${Math.abs(d)}`);
}

// serve:<칵테일> 목표 자동 진행 — '정상 제공'만 인정(오제조·Sewage 제외). 1부 서빙·2부 스토리 서빙 공통 훅
function questOnServe(cocktailId, grade) {
  if (!cocktailId || grade === "sewage") return;
  DATA.quests.quests.forEach(q => {
    if (S.questRewarded.has(q.id)) return;
    const st = DATA.quests.stages.find(s =>
      s.quest_id === q.id && s.stage === (S.quests[q.id] || 0) + 1);
    if (!st || st.goal !== "serve:" + cocktailId) return;
    if (st.when && !evalWhen(st.when)) return;
    advanceQuest(q.id);
  });
}

// ---------- 리치텍스트 태그 렌더 (구엔진 text_styles 대응 — Unity에선 TMP 스타일) ----------
// <order>=주문 강조(앰버) / <name>=고유명사(시안) / <world>=세계관 용어(핑크)
function fmtRich(text) {
  const esc = String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return esc
    .replace(/&lt;(order|name|world)&gt;/g, '<span class="rt-$1">')
    .replace(/&lt;\/(order|name|world)&gt;/g, "</span>")
    .replace(/\n/g, "<br>");
}

// ---------- 대사 풀 (Barks) ----------
function bark(voice, situation) {
  const all = DATA.master.barks.filter(b => b.situation === situation);
  let pool = all.filter(b => b.voice_id === voice);
  if (!pool.length) pool = all.filter(b => !b.voice_id);
  if (!pool.length) return "";
  const total = pool.reduce((s, b) => s + (b.weight || 1), 0);
  let r = Math.random() * total;
  for (const b of pool) { r -= (b.weight || 1); if (r <= 0) return T(b.text); }
  return T(pool[0].text);
}

// ---------- 세이브 (집 저장 오브젝트 + 크래시 복구는 프로토에선 일일 자동만) ----------
const SAVE_KEY = "luna_proto_save_v1";
function saveGame() {
  const snap = { ...S, flags: [...S.flags], usedPoints: [...S.usedPoints], questRewarded: [...S.questRewarded], met: [...S.met] };
  localStorage.setItem(SAVE_KEY, JSON.stringify(snap));
}
function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY); if (!raw) return false;
    const snap = JSON.parse(raw);
    Object.assign(S, snap);
    S.flags = new Set(snap.flags); S.usedPoints = new Set(snap.usedPoints); S.questRewarded = new Set(snap.questRewarded); S.met = new Set(snap.met || []);
    return true;
  } catch (e) { return false; }
}
function hasSave() { return !!localStorage.getItem(SAVE_KEY); }
function clearSave() { localStorage.removeItem(SAVE_KEY); }

<script>
// ===== 대본 실행기 — 씬/스텝 단일 문법 (2부·출퇴근·집·꿈·카메오 전부 이걸로) =====
"use strict";
const Dlg = {
  cast: {},          // actorId -> element (바 좌석 스탠디)
  currentOrder: null, // { actor, cocktailId }
  running: false,

  // ---------- 씬 실행 ----------
  async runScene(sceneId, opts) {
    const sc = typeof sceneId === "string" ? sceneById(sceneId) : sceneId;
    if (!sc) return;
    this.running = true;
    for (const st of sc.steps) {
      if (st.when && !evalWhen(st.when)) continue;
      const jump = await this.runStep(st, sc, opts || {});
      if (st.effects) applyEffects(st.effects);
      if (jump) { this.running = false; return this.runScene(jump, opts); }
    }
    this.hideDialog();
    this.running = false;
  },

  async runPhaseScenes(day, phase, opts) {
    for (const sc of scenesFor(day, phase, "auto")) {
      await this.runScene(sc, opts);
    }
  },

  // ---------- 스텝 처리 ----------
  async runStep(st, sc, opts) {
    switch (st.type) {
      case "say": {
        const c = charOf(st.actor);
        await this.say(T(c ? c.name : { ko: st.actor }), c ? c.name_color : "#ccc", T(st.text), st.actor);
        return;
      }
      case "enter": {
        this.castAdd(st.actor, st.arg);
        await sleep(450);
        return;
      }
      case "exit": {
        this.castRemove(st.actor);
        await sleep(350);
        return;
      }
      case "order": {
        const id = (st.arg || "").split(":")[1];
        this.currentOrder = { actor: st.actor, cocktailId: id };
        const c = charOf(st.actor);
        await this.say(T(c.name), c.name_color, "🍸 " + T(st.text), st.actor);
        return;
      }
      case "craft": {
